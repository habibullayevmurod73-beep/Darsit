нецЦикла", "shart bajarilguncha takrorla"], ["Попытка … Исключение … КонецПопытки", "xatoni ushlash (try / except)"]], "id": "m5-dict1"}, {"t": "table", "title": "1C tili lug'ati: ma'lumotlar", "intro": null, "head": ["1C", "Ma'nosi"], "rows": [["Процедура / Функция / Возврат", "protsedura / funksiya / qiymat qaytarish"], ["Экспорт", "boshqa modullardan chaqirish mumkin"], ["Новый Структура / Массив / Соответствие", "yangi struktura / massiv / lug'at"], ["Истина / Ложь / Неопределено", "rost / yolg'on / qiymat yo'q"], ["Сообщить(\"…\")", "foydalanuvchiga xabar chiqarish"], ["ТекущаяДатаСеанса()", "hozirgi sana va vaqt"]], "id": "m5-dict2"}, {"t": "code", "title": "1C tili: shart, sikl va funksiya", "lang": "1C", "src": "Процедура ПроверитьВес(Вес)\n    Если Вес  60000 Тогда\n        Сообщить(\"Tarozi limitidan oshdi\");\n    КонецЕсли;\nКонецПроцедуры\n\n// Funksiya qiymat qaytaradi\nФункция Нетто(Брутто, Тара) Экспорт\n    Возврат Брутто - Тара;\nКонецФункции", "side": ["<b>Процедура<\/b> — ish bajaradi, qiymat qaytarmaydi.", "<b>Функция<\/b> — natija qaytaradi (Возврат).", "<b>Экспорт<\/b> — boshqa modullardan chaqirish mumkin.", "Har bir buyruq nuqta-vergul bilan tugaydi."], "caption": null, "id": "m5-lang"}, {"t": "code", "title": "So'rovlar tili: bugungi tortishlar yig'indisi", "lang": "1C", "src": "Запрос = Новый Запрос;\nЗапрос.Текст =\n\"ВЫБРАТЬ\n|    В.ГосНомер КАК Номер,\n|    СУММА(В.ВесНетто) КАК Итого\n|ИЗ\n|    Документ.Взвешивание КАК В\n|ГДЕ\n|    В.Дата МЕЖДУ &Начало И &Конец\n|СГРУППИРОВАТЬ ПО\n|    В.ГосНомер\";\nЗапрос.УстановитьПараметр(\"Начало\", НачалоДня(ТекущаяДатаСеанса()));\nЗапрос.УстановитьПараметр(\"Конец\", КонецДня(ТекущаяДатаСеанса()));", "side": null, "caption": "1C so'rovlari SQL ga juda o'xshaydi: ВЫБРАТЬ = SELECT, ИЗ = FROM, ГДЕ = WHERE, СГРУППИРОВАТЬ ПО = GROUP BY.", "id": "m5-query"}, {"t": "code", "title": "So'rov natijasini aylanib chiqish", "lang": "1C", "src": "Выборка = Запрос.Выполнить().Выбрать();\n\nПока Выборка.Следующий() Цикл\n    Сообщить(Выборка.Номер + \": \" + Выборка.Итого + \" kg\");\nКонецЦикла;\n\n// Yoki jadvalga yuklash\nТаблица = Запрос.Выполнить().Выгрузить();\nСообщить(\"Mashinalar soni: \" + Таблица.Количество());", "side": ["<b>Выполнить()<\/b> — so'rovni bajaradi.", "<b>Выбрать()<\/b> — qatorma-qator o'qish (katta natijalar uchun tejamkor).", "<b>Выгрузить()<\/b> — hammasini bir jadvalga (kichik natijalar uchun qulay)."], "caption": null, "id": "m5-select"}, {"t": "cards", "title": "So'rovni qo'lda yozish shart emas", "intro": null, "items": [["Wrench", "Konstruktor", "So'rov matni ichida o'ng tugma → «Конструктор запроса». Jadval va maydonlarni sichqoncha bilan tanlaysiz."], ["Search", "Konsol", "«Консоль запросов» obrabotkasida so'rovni bazaga tegmasdan sinab ko'rasiz."], ["Book", "Sintaksis-yordamchi", "Konfiguratorda Справка → Синтакс-помощник: har bir funksiya tavsifi va misoli."]], "id": "m5-constructor"}, {"t": "steps", "title": "Birinchi obyekt: «Взвешивание» hujjati", "intro": null, "items": [["Konfiguratsiyani oching", "Конфигурация → Открыть конфигурацию."], ["Hujjat qo'shing", "«Документы» ustida o'ng tugma → Добавить, nomi: Взвешивание."], ["Rekvizitlar", "ГосНомер (Строка 15), ВесБрутто, ВесТара, ВесНетто (Число 10,0)."], ["Qo'shimcha maydonlar", "Весы (Строка), ВнешнийИД (Строка 36), Фото (Строка 200)."], ["Forma yarating", "«Формы» bo'limida yangi forma — avtomatik yig'iladi."], ["Sinab ko'ring", "F5 bosing va foydalanuvchi rejimida hujjat yarating."]], "id": "m5-doc"}, {"t": "code", "title": "Hujjat moduli: nettoni avtomatik hisoblash", "lang": "1C", "src": "// Модуль объекта документа Взвешивание\nПроцедура ПередЗаписью(Отказ, РежимЗаписи, РежимПроведения)\n\n    ВесНетто = ВесБрутто - ВесТара;\n\n    Если ВесНетто < 0 Тогда\n        Сообщить(\"Netto manfiy bo'lishi mumkin emas\");\n        Отказ = Истина;\n    КонецЕсли;\n\nКонецПроцедуры", "side": ["<b>ПередЗаписью<\/b> — hujjat saqlanishidan oldin avtomatik chaqiriladigan hodisa.", "<b>Отказ = Истина<\/b> — saqlashni bekor qiladi.", "Shunday qilib noto'g'ri ma'lumot bazaga tushmaydi."], "caption": null, "id": "m5-module"}, {"t": "compare", "title": "Formada: klient va server", "left": ["&НаКлиенте", ["Foydalanuvchi kompyuterida bajariladi", "Tugma bosish, maydon o'zgarishi", "Bazaga to'g'ridan-to'g'ri murojaat yo'q", "Oyna ochish, savol berish"]], "right": ["&НаСервере", ["1C serverida bajariladi", "So'rovlar, yozish, hisob-kitob", "Tarmoq so'rovlari (HTTP) shu yerda", "Klientdan chaqiriladi"]], "id": "m5-cs", "notes": "Bu 1C formalaridagi eng muhim tushuncha. Qoida: foydalanuvchi bilan muloqot klientda, ma'lumot bilan ish serverda. Klient va server orasidagi har bir chaqiruv vaqt oladi, shuning uchun ularni kamaytiring."}, {"t": "quiz", "q": "Ombordagi mahsulot qoldig'ini saqlash uchun qaysi obyekt ishlatiladi?", "opts": ["Справочник", "Регистр накопления", "Перечисление"], "a": 1, "expl": "Регистр накопления kirim va chiqimlarni yig'ib, istalgan sanadagi qoldiqni tez beradi.", "id": "m5-q1"}, {"t": "quiz", "q": "Tortish voqeasi 1C da qanday obyekt bo'lishi kerak?", "opts": ["Документ", "Отчет", "Константа"], "a": 0, "expl": "Tortishning sanasi, raqami va bir martalik voqea ekanligi uni hujjatga aylantiradi.", "id": "m5-q2"}, {"t": "quiz", "q": "1C da try/except ning o'xshashi qaysi?", "opts": ["Если / КонецЕсли", "Попытка / Исключение / КонецПопытки", "Цикл / КонецЦикла"], "a": 1, "expl": "Попытка ichidagi kodda xato bo'lsa, bajarilish Исключение bo'limiga o'tadi.", "id": "m5-q3"}, {"t": "quiz", "id": "xq-m5-0", "q": "Ma'lumotnoma yozuvini «o'chirish belgisi» qaysi maydon?", "opts": ["ПометкаУдаления", "Отказ", "Проведен"], "a": 0, "expl": "Yozuv darhol o'chmaydi, faqat belgilanadi."}, {"t": "quiz", "id": "xq-m5-1", "q": "Klientdan serverdagi umumiy modul funksiyasini chaqirish uchun qaysi bayroq kerak?", "opts": ["Глобальный", "Вызов сервера", "Привилегированный"], "a": 1, "expl": "«Вызов сервера» bayrog'i klient kodidan chaqirishga ruxsat beradi."}]}, {"id": "m6", "num": 6, "title": "1C integratsiyasi", "goal": "Tashqi dasturlar 1C bilan qanday gaplashishini o'rganasiz: HTTP-servis, OData, COM va fayl almashuvi.", "stages": [2, 3], "vol": 1, "blocks": [{"t": "table", "title": "Integratsiya usullari", "intro": null, "head": ["Usul", "Yo'nalish", "Qachon tanlanadi"], "rows": [["HTTP-сервис", "Tashqaridan → 1C", "Eng yaxshi tanlov: o'z API ingiz, to'liq nazorat"], ["OData (standart REST)", "Ikki tomonlama", "Kod yozmasdan ma'lumotnoma va hujjatlarni o'qish"], ["1C dan HTTP so'rov", "1C → tashqariga", "1C o'zi serverdan ma'lumot oladi"], ["COM-ulanish", "Windows → 1C", "Eski usul: faqat Windows, sekin"], ["Fayl (JSON, XML, CSV)", "Ikki tomonlama", "Internet yo'q joy yoki bir martalik yuklash"], ["Web-сервис (SOAP)", "Ikki tomonlama", "Eski tizimlar talab qilganda"]], "id": "m6-methods"}, {"t": "statement", "title": "Yangi loyihada: HTTP-servis + JSON", "sub": "U tez, tushunarli, istalgan dasturlash tilidan chaqiriladi va nimani qabul qilishni siz o'zingiz belgilaysiz.", "accent": true, "id": "m6-rec"}, {"t": "steps", "title": "Bazani web-serverda e'lon qilish", "intro": null, "items": [["Web-server o'rnating", "Apache 2.4 yoki Windows'da IIS."], ["Administrator sifatida", "Konfiguratorni «Запуск от имени администратора» bilan oching."], ["Публикация", "Администрирование → Публикация на веб-сервере."], ["Belgilar qo'ying", "«Публиковать HTTP сервисы» va «Стандартный интерфейс OData»."], ["Manzil tayyor", "http://server/zavod/hs/… va http://server/zavod/odata/…"]], "id": "m6-publish", "notes": "Publikatsiyadan keyin brauzerda http://server/zavod/ manzilini ochib ko'ring: 1C web-klienti ochilsa, publikatsiya ishlayapti."}, {"t": "cards", "title": "Integratsiya uchun alohida foydalanuvchi", "intro": null, "items": [["Users", "api_user", "Faqat integratsiya uchun alohida 1C foydalanuvchisi. Odamlar undan foydalanmaydi."], ["Lock", "Minimal huquqlar", "Faqat kerakli obyektlarga o'qish yoki yozish ruxsati. Administrator huquqi berilmaydi."], ["Key", "Kuchli parol", "Parol kodda emas, serverning .env faylida saqlanadi."]], "id": "m6-user"}, {"t": "steps", "title": "HTTP-servisni yaratish", "intro": null, "items": [["Obyekt qo'shing", "Общие → HTTP-сервисы → Добавить. Nomi: Scales."], ["Asosiy URL", "Корневой URL: scales."], ["URL shablon", "Шаблон URL: /weighing."], ["Metod", "Shablon ichida POST metodini qo'shing va obrabotchik yarating."], ["Natija", "Manzil: http://server/zavod/hs/scales/weighing"]], "id": "m6-hs-setup"}, {"t": "code", "title": "HTTP-servis: JSON ni qabul qilish", "lang": "1C", "src": "Функция WeighingPOST(Запрос)\n    Чтение = Новый ЧтениеJSON;\n    Чтение.УстановитьСтроку(Запрос.ПолучитьТелоКакСтроку());\n    Данные = ПрочитатьJSON(Чтение);\n    Чтение.Закрыть();\n\n    Ссылка = Документы.Взвешивание.НайтиПоРеквизиту(\n        \"ВнешнийИД\", Данные.id);\n    Если НЕ Ссылка.Пустая() Тогда\n        Возврат ОтветJSON(200, \"exists\");\n    КонецЕсли;", "side": ["So'rov tanasi matn sifatida olinadi va <b>ПрочитатьJSON<\/b> bilan strukturaga aylantiriladi.", "<b>НайтиПоРеквизиту<\/b> — shu ID bilan hujjat bormi?", "Bor bo'lsa — qayta yaratmaymiz. Bu takrorlanishdan himoya."], "caption": null, "id": "m6-hs1"}, {"t": "code", "title": "HTTP-servis: hujjat yaratish va javob", "lang": "1C", "src": "Док = Документы.Взвешивание.СоздатьДокумент();\n    Док.Дата      = ТекущаяДатаСеанса();\n    Док.ВнешнийИД = Данные.id;\n    Док.ГосНомер  = Данные.plate;\n    Док.ВесБрутто = Данные.weight;\n    Док.Весы      = Данные.scale;\n    Док.Записать(РежимЗаписиДокумента.Запись);\n\n    Возврат ОтветJSON(201, \"ok\");\nКонецФункции", "side": ["<b>СоздатьДокумент()<\/b> — yangi bo'sh hujjat.", "Maydonlar JSON dan to'ldiriladi.", "<b>Записать<\/b> — bazaga saqlaydi (ПередЗаписью hodisasi ham ishlaydi).", "201 kodi: «yaratildi»."], "caption": null, "id": "m6-hs2"}, {"t": "code", "title": "Yordamchi funksiya: JSON javob", "lang": "1C", "src": "Функция ОтветJSON(Код, Статус)\n    Ответ = Новый HTTPСервисОтвет(Код);\n    Ответ.Заголовки.Вставить(\"Content-Type\",\n        \"application/json; charset=utf-8\");\n    Запись = Новый ЗаписьJSON;\n    Запись.УстановитьСтроку();\n    ЗаписатьJSON(Запись, Новый Структура(\"status\", Статус));\n    Ответ.УстановитьТелоИзСтроки(Запись.Закрыть());\n    Возврат Ответ;\nКонецФункции", "side": ["Javob ham JSON: tashqi dastur uni oson o'qiydi.", "<b>charset=utf-8<\/b> — kirill va o'zbek harflari buzilmasligi uchun.", "Real loyihada butun kodni Попытка/Исключение ichiga oling va 500 qaytaring."], "caption": null, "id": "m6-hs3"}, {"t": "code", "title": "Python dan HTTP-servisni chaqirish", "lang": "python", "src": "import requests, os\n\nr = requests.post(\n    \"http://server/zavod/hs/scales/weighing\",\n    json={\"id\": \"a1b2\", \"plate\": \"01A123BC\",\n          \"weight\": 12450, \"scale\": \"SCALE-1\"},\n    auth=(\"api_user\", os.getenv(\"ONEC_PASS\")),\n    timeout=10,\n)\nprint(r.status_code, r.json())", "side": ["<b>auth<\/b> — 1C foydalanuvchisi login va paroli (Basic Auth).", "<b>timeout<\/b> — 1C javob bermasa, dastur cheksiz kutmaydi.", "201 yoki 200 kelsa — yuborildi deb belgilaymiz."], "caption": null, "id": "m6-py"}, {"t": "table", "title": "Javob kodlari va ularga reaksiya", "intro": null, "head": ["Kod", "Ma'nosi", "Shlyuz nima qiladi"], "rows": [["200 / 201", "Qabul qilindi yoki allaqachon bor", "sent_to_1c = rost"], ["400", "Ma'lumotda xato", "Log yozadi, operatorga xabar beradi"], ["401", "Login yoki parol noto'g'ri", "Sozlamani tekshirish, qayta urinmaydi"], ["404", "Manzil topilmadi", "Publikatsiya va URL shablonni tekshirish"], ["500", "1C ichida xato", "Keyinroq qayta urinadi, log yozadi"], ["Javob yo'q", "1C yoki tarmoq ishlamayapti", "Navbatda saqlaydi, keyin yuboradi"]], "id": "m6-codes"}, {"t": "code", "title": "OData: qaysi obyektlar ochiq bo'lishini belgilash", "lang": "1C", "src": "// Bir marta bajariladi (masalan, tashqi obrabotka orqali)\nСостав = Новый Массив;\nСостав.Добавить(Метаданные.Справочники.Номенклатура);\nСостав.Добавить(Метаданные.Справочники.Контрагенты);\nСостав.Добавить(Метаданные.Документы.Взвешивание);\n\nУстановитьСоставСтандартногоИнтерфейсаOData(Состав);", "side": null, "caption": "Standart holatda OData hech narsani ko'rsatmaydi. Faqat shu ro'yxatdagi obyektlar tashqariga ochiladi — bu xavfsizlik uchun yaxshi.", "id": "m6-odata-on"}, {"t": "code", "title": "OData: Python dan ma'lumot o'qish", "lang": "python", "src": "import requests\nBASE = \"http://server/zavod/odata/standard.odata\"\nAUTH = (\"api_user\", \"parol\")\n\nr = requests.get(f\"{BASE}/Catalog_Контрагенты\",\n                 params={\"$format\": \"json\",\n                         \"$select\": \"Ref_Key,Description\"},\n                 auth=AUTH)\n\nfor k in r.json()[\"value\"]:\n    print(k[\"Ref_Key\"], k[\"Description\"])", "side": ["<b>Catalog_<\/b> — ma'lumotnoma, <b>Document_<\/b> — hujjat.", "<b>$select<\/b> — faqat kerakli maydonlar: tezroq.", "<b>Ref_Key<\/b> — yozuvning noyob kaliti (GUID)."], "caption": null, "id": "m6-odata-py"}, {"t": "table", "title": "OData so'rov parametrlari", "intro": null, "head": ["Parametr", "Vazifasi", "Misol"], "rows": [["$format", "Javob formati", "$format=json"], ["$select", "Qaysi maydonlar", "$select=Ref_Key,Description"], ["$filter", "Shart", "$filter=Posted eq true"], ["$top / $skip", "Sahifalash", "$top=100&$skip=200"], ["$orderby", "Saralash", "$orderby=Date desc"], ["$expand", "Bog'langan obyektni qo'shish", "$expand=Контрагент"]], "id": "m6-odata-q"}, {"t": "code", "title": "Teskari yo'nalish: 1C serverdan og'irlik so'raydi", "lang": "1C", "src": "&НаСервереБезКонтекста\nФункция ТекущийВес(Весы) Экспорт\n    Соединение = Новый HTTPСоединение(\"192.168.1.10\", 8000, , , , 10);\n    Запрос = Новый HTTPЗапрос(\"/api/scales/\" + Весы + \"/current\");\n    Ответ = Соединение.Получить(Запрос);\n    Если Ответ.КодСостояния <> 200 Тогда\n        ВызватьИсключение \"Server javob bermadi\";\n    КонецЕсли;\n    Чтение = Новый ЧтениеJSON;\n    Чтение.УстановитьСтроку(Ответ.ПолучитьТелоКакСтроку());\n    Возврат ПрочитатьJSON(Чтение).weight;\nКонецФункции", "side": null, "caption": "Bu funksiya 1C formasidagi «Tarozidan olish» tugmasi uchun: operator bosadi — joriy og'irlik maydonga tushadi.", "id": "m6-out"}, {"t": "code", "title": "Almashuv formati: aniq kelishuv", "lang": "json", "src": "{\n  \"id\": \"5f0c2a9e-7d1b-4c1e-9a55-2b8f6f1c3d10\",\n  \"scale\": \"SCALE-1\",\n  \"type\": \"in\",\n  \"plate\": \"01A123BC\",\n  \"weight\": 12450,\n  \"unit\": \"kg\",\n  \"ts\": \"2026-09-28T09:15:42+05:00\",\n  \"photo\": \"https://server/photos/5f0c2a9e.jpg\"\n}", "side": ["Maydon nomlari va turlarini hujjatlashtiring — bu ikki tomon o'rtasidagi «shartnoma».", "Vaqtni ISO formatda va vaqt zonasi bilan yuboring (+05:00 — Toshkent).", "Rasmni JSON ichida emas, havola sifatida yuboring."], "caption": null, "id": "m6-json"}, {"t": "statement", "title": "Ishonchli integratsiya: xato bo'lganda ham ma'lumot yo'qolmaydi va takrorlanmaydi", "sub": "Endi HTTP-servisni ishlab chiqarish darajasida quramiz: maydonlar xaritasi, tekshiruv, tranzaksiyalar, log, himoya va sinov.", "accent": true, "id": "i-intro"}, {"t": "cards", "title": "Integratsiya «shartnomasi»: ikki tomon nimada kelishadi", "intro": null, "items": [["Book", "Format", "JSON, UTF-8. Maydon nomlari, turlari, majburiylik."], ["Link", "Manzillar", "Qaysi URL, qaysi metod, qanday javob."], ["Warning", "Xatolar", "Qaysi holatda qaysi kod va qanday matn qaytadi."], ["Settings", "Versiya", "Format o'zgarsa — yangi versiya: /v2/weighing. Eski tizimlar buzilmaydi."]], "id": "i-contract", "notes": "Bu hujjatni Python dasturchisi va 1C dasturchisi birga yozadi va imzolaydi. Keyingi bahslarning 90 foizi shu hujjat bilan hal bo'ladi."}, {"t": "table", "title": "Maydonlar xaritasi: JSON → 1C", "intro": null, "head": ["JSON", "1C rekvizit", "Turi", "Qanday to'ldiriladi"], "rows": [["id", "ВнешнийИД", "Строка 36", "To'g'ridan-to'g'ri"], ["ts", "Дата", "Дата", "ISO matndan sanaga"], ["scale", "Весы", "СправочникСсылка", "Kod bo'yicha qidiriladi"], ["plate", "Автомобиль", "СправочникСсылка", "Raqam bo'yicha, bo'lmasa yaratiladi"], ["weight", "ВесБрутто", "Число 10,0", "To'g'ridan-to'g'ri"], ["photo", "Фото", "Строка", "Havola"]], "id": "i-map"}, {"t": "code", "title": "Raqam bo'yicha mashinani topish yoki yaratish", "lang": "1C", "src": "Функция НайтиАвтомобиль(ГосНомер)\n    Номер = ВРег(СокрЛП(ГосНомер));\n    Если ПустаяСтрока(Номер) Тогда\n        Возврат Справочники.Автомобили.ПустаяСсылка();\n    КонецЕсли;\n    Ссылка = Справочники.Автомобили.НайтиПоРеквизиту(\n        \"ГосНомер\", Номер);\n    Если Ссылка.Пустая() Тогда\n        Об = Справочники.Автомобили.СоздатьЭлемент();\n        Об.ГосНомер = Номер;\n        Об.Наименование = Номер;\n        Об.Записать();\n        Ссылка = Об.Ссылка;\n    КонецЕсли;\n    Возврат Ссылка;\nКонецФункции", "side": ["<b>СокрЛП<\/b> — bo'sh joylarni, <b>ВРег<\/b> — kichik harflarni tuzatadi.", "Raqam bo'sh bo'lsa — bo'sh havola.", "Yangi mashina avtomatik qo'shiladi; operator keyin egasini to'ldiradi."], "caption": null, "id": "i-lookup"}, {"t": "code", "title": "Kiruvchi ma'lumotni tekshirish", "lang": "1C", "src": "Функция ПроверитьДанные(Данные, Ошибки)\n    Если НЕ Данные.Свойство(\"id\")\n        ИЛИ ПустаяСтрока(Данные.id) Тогда\n        Ошибки.Добавить(\"id majburiy\");\n    КонецЕсли;\n    Если НЕ Данные.Свойство(\"weight\") Тогда\n        Ошибки.Добавить(\"weight majburiy\");\n    ИначеЕсли ТипЗнч(Данные.weight) <> Тип(\"Число\")\n        ИЛИ Данные.weight < 0 Тогда\n        Ошибки.Добавить(\"weight musbat son bo'lishi kerak\");\n    КонецЕсли;\n    Возврат Ошибки.Количество() = 0;\nКонецФункции", "side": ["<b>Свойство()<\/b> — strukturada shunday maydon bormi.", "<b>ТипЗнч<\/b> — qiymat turini tekshiradi.", "Barcha xatolar yig'iladi va 400 javobda birga qaytariladi."], "caption": null, "id": "i-validate"}, {"t": "code", "title": "Tranzaksiya: hammasi yoki hech narsa", "lang": "1C", "src": "НачатьТранзакцию();\nПопытка\n    Авто = НайтиАвтомобиль(Данные.plate);\n    Док = Документы.Взвешивание.СоздатьДокумент();\n    ЗаполнитьДокумент(Док, Данные, Авто);\n    Док.Записать(РежимЗаписиДокумента.Проведение);\n    ЗафиксироватьТранзакцию();\nИсключение\n    ОтменитьТранзакцию();\n    ЗаписьЖурналаРегистрации(\"Интеграция.Весы\",\n        УровеньЖурналаРегистрации.Ошибка, , , ОписаниеОшибки());\n    Возврат ОтветJSON(500, \"error\");\nКонецПопытки;", "side": ["Mashina yaratilib, hujjat yozilmasa — ikkalasi ham bekor bo'ladi.", "<b>Проведение<\/b> — hujjat darhol o'tkaziladi.", "Xato jurnalga yoziladi, tashqi tizim 500 oladi va qayta urinadi."], "caption": null, "id": "i-trans"}, {"t": "statement", "title": "Idempotentlik: bir so'rovni 10 marta yuborsangiz ham natija bitta hujjat", "sub": "Tarmoq uzilganda shlyuz javobni ololmay qolishi va qayta yuborishi mumkin. ВнешнийИД bo'yicha tekshiruv takror hujjatning oldini oladi.", "accent": false, "id": "i-idem"}, {"t": "cards", "title": "Integratsiya jurnali: nima bo'lganini qanday bilamiz", "intro": null, "items": [["Book", "Журнал регистрации", "1C ning o'z jurnali. Администрирование → Журнал регистрации, «Интеграция.Весы» bo'yicha filtr."], ["Database", "O'z registrimiz", "Регистр сведений «ЖурналОбмена»: vaqt, ID, holat, xato matni. Hisobot va qayta yuborish uchun qulay."], ["Warning", "Nimani yozish kerak", "Har bir kiruvchi so'rov ID si, natija, xato sababi. Parollarni hech qachon yozmang."]], "id": "i-log"}, {"t": "table", "title": "URL shablonlari: to'liq API", "intro": null, "head": ["Shablon", "Metod", "Vazifasi"], "rows": [["/weighing", "POST", "Yangi tortish qabul qilish"], ["/weighing/{id}", "GET", "Tortish holatini tekshirish"], ["/cars", "GET", "Mashinalar ro'yxati (shlyuz keshlaydi)"], ["/ping", "GET", "1C ishlayaptimi — monitoring uchun"]], "id": "i-tpl"}, {"t": "code", "title": "GET: ID bo'yicha hujjat holati", "lang": "1C", "src": "Функция WeighingGET(Запрос)\n    ИД = Запрос.ПараметрыURL[\"id\"];\n    Ссылка = Документы.Взвешивание.НайтиПоРеквизиту(\"ВнешнийИД\", ИД);\n    Если Ссылка.Пустая() Тогда\n        Возврат ОтветJSON(404, \"not found\");\n    КонецЕсли;\n    Результат = Новый Структура;\n    Результат.Вставить(\"number\", Ссылка.Номер);\n    Результат.Вставить(\"posted\", Ссылка.Проведен);\n    Результат.Вставить(\"netto\", Ссылка.ВесНетто);\n    Возврат ОтветСтруктура(200, Результат);\nКонецФункции", "side": ["<b>ПараметрыURL<\/b> — shablondagi {id} qiymati.", "Havola orqali hujjat maydonlarini o'qish.", "Shlyuz shu orqali «hujjat haqiqatan yaratildimi» ni tekshiradi."], "caption": null, "id": "i-get"}, {"t": "cards", "title": "1C HTTP-servislarini himoyalash", "intro": null, "items": [["Users", "1C foydalanuvchisi", "Basic Auth: alohida api_user, faqat kerakli rol bilan."], ["Lock", "HTTPS", "Web-serverda sertifikat. Parol ochiq matnda tarmoqdan o'tmaydi."], ["Globe", "Tarmoq cheklovi", "Web-serverda faqat server IP siga ruxsat."], ["Key", "Qo'shimcha kalit", "Sarlavhadagi maxfiy kalitni HTTP-servis ichida tekshirish."]], "id": "i-auth"}, {"t": "cards", "title": "Unumdorlik: 1C ni ortiqcha yuklamaslik", "intro": null, "items": [["Database", "Paketlab yuborish", "Bitta so'rovda 50 tagacha tortish — 50 ta alohida so'rovdan tez."], ["Clock", "Timeout", "Tashqi tomonda 10–30 soniya. 1C band bo'lsa, keyinroq urinish."], ["Chart", "Kesh", "Mashinalar ro'yxatini har safar emas, soatda bir so'rash."], ["Settings", "Og'ir ishni fonga", "Murakkab hisoblarni регламентное задание ga qoldiring."]], "id": "i-perf"}, {"t": "code", "title": "Регламентное задание: 1C o'zi ma'lumot oladi", "lang": "1C", "src": "// Общий модуль зав_ОбменСВесами (Сервер)\nПроцедура ЗагрузитьНовыеВзвешивания() Экспорт\n    Соединение = Новый HTTPСоединение(\"192.168.20.10\", 8000, , , , 30);\n    Запрос = Новый HTTPЗапрос(\"/api/weighings?sent=false&limit=50\");\n    Запрос.Заголовки.Вставить(\"X-API-Key\", Константы.зав_КлючAPI.Получить());\n    Ответ = Соединение.Получить(Запрос);\n    Если Ответ.КодСостояния <> 200 Тогда\n        Возврат;\n    КонецЕсли;\n    Данные = ПрочитатьJSONСтроку(Ответ.ПолучитьТелоКакСтроку());\n    Для Каждого Эл Из Данные Цикл\n        ОбработатьВзвешивание(Эл);\n    КонецЦикла;\nКонецПроцедуры", "side": null, "caption": null, "id": "i-sched", "notes": "Общие → Регламентные задания: ushbu protsedurani tanlang va jadval bering (masalan, har daqiqada). Bu «pull» usuli: 1C o'zi so'raydi."}, {"t": "steps", "title": "Postman bilan integratsiyani sinash", "intro": null, "items": [["So'rov", "New → HTTP Request. Metod: POST, manzil: http://server/zavod/hs/scales/weighing"], ["Kirish", "Authorization → Basic Auth → api_user va parol."], ["Tana", "Body → raw → JSON: namunaviy tortish."], ["Yuboring", "Send. Holat kodi va javob tanasini tekshiring."], ["1C da tekshiring", "Hujjat yaratildimi, maydonlar to'g'rimi?"], ["Takrorlang", "Xuddi shu so'rovni yana yuboring — ikkinchi hujjat yaratilmasligi kerak."]], "id": "i-postman"}, {"t": "table", "title": "Integratsiyadagi tipik xatolar", "intro": null, "head": ["Belgi", "Sabab", "Yechim"], "rows": [["401", "Login yoki parol xato", "api_user parolini va Basic Auth ni tekshiring"], ["403 / «Нарушение прав»", "Rolda huquq yo'q", "Hujjat va ma'lumotnomaga yozish huquqi"], ["404", "Publikatsiya yoki URL xato", "/hs/ dan keyingi korneviy URL va shablon"], ["500", "1C kodida xato", "Журнал регистрации dan matnini o'qing"], ["Kirill harflar buzilgan", "Kodlash ko'rsatilmagan", "charset=utf-8 sarlavhada"], ["Juda sekin", "Har so'rovda og'ir so'rov", "Kesh, indeks, paketlash"]], "id": "i-errs"}, {"t": "quiz", "q": "Mashina yaratildi, lekin hujjat yozishda xato chiqdi. Tranzaksiya ishlatilgan bo'lsa nima bo'ladi?", "opts": ["Mashina qoladi, hujjat yo'q", "Ikkalasi ham bekor qilinadi", "Ikkalasi ham saqlanadi"], "a": 1, "expl": "Tranzaksiya — «hammasi yoki hech narsa». Qisman yozilgan ma'lumot qolmaydi.", "id": "i-q1"}, {"t": "quiz", "q": "1C da integratsiya xatosining aniq sababini qayerdan topasiz?", "opts": ["Windows ish stolidan", "Журнал регистрации dan", "Brauzer tarixidan"], "a": 1, "expl": "ЗаписьЖурналаРегистрации bilan yozilgan xatolar vaqt va matni bilan shu yerda turadi.", "id": "i-q2"}, {"t": "quiz", "q": "Yangi loyihada tashqi dasturdan 1C ga hujjat yuborish uchun eng yaxshi usul?", "opts": ["COM-ulanish", "HTTP-servis + JSON", "Excel fayl"], "a": 1, "expl": "HTTP-servis istalgan platformadan chaqiriladi va nimani qabul qilishni to'liq nazorat qilasiz.", "id": "m6-q1"}, {"t": "quiz", "q": "HTTP-servis manzili qanday ko'rinishda bo'ladi?", "opts": ["http://server/zavod/hs/scales/weighing", "http://server/1cv8.exe", "ftp://server/zavod"], "a": 0, "expl": "/hs/ qismi — HTTP-servislar uchun, keyin korneviy URL va shablon keladi.", "id": "m6-q2"}, {"t": "quiz", "q": "1C formasida tarmoq so'rovi qayerda bajarilishi kerak?", "opts": ["&НаКлиенте", "&НаСервере", "Farqi yo'q"], "a": 1, "expl": "HTTPСоединение server kontekstida ishlatiladi; klient faqat natijani ko'rsatadi.", "id": "m6-q3"}, {"t": "quiz", "id": "xq-m6-0", "q": "1C dan kod yozmasdan ma'lumot o'qishning standart usuli?", "opts": ["OData", "COM", "FTP"], "a": 0, "expl": "Standart OData interfeysi ochilgan obyektlarni REST orqali beradi."}, {"t": "quiz", "id": "xq-m6-1", "q": "Bazani web-serverda e'lon qilmasdan HTTP-servis ishlaydimi?", "opts": ["Ha", "Yo'q — publikatsiya kerak", "Faqat Linux'da"], "a": 1, "expl": "HTTP-servislar web-server orqali /hs/ manzilida ochiladi."}]}, {"id": "m7", "num": 7, "title": "1C ga o'zgartirish kiritish", "goal": "Tipik konfiguratsiyani buzmasdan o'zgartirishni o'rganasiz: kengaytmalar, formaga tugma qo'shish, standart kodga ulanish.", "stages": [3], "vol": 1, "blocks": [{"t": "statement", "title": "Tipik konfiguratsiyani to'g'ridan-to'g'ri o'zgartirsangiz, har bir yangilanish og'riqqa aylanadi", "sub": "1C Бухгалтерия yoki УТ tez-tez yangilanadi. Qo'lda kiritilgan o'zgarishlarni har safar yangi versiya bilan birlashtirish kerak bo'ladi.", "accent": false, "id": "m7-problem"}, {"t": "table", "title": "O'zgartirish usullari", "intro": null, "head": ["Usul", "Yangilanishga ta'siri", "Qachon"], "rows": [["Kengaytma (расширение)", "Deyarli ta'sir qilmaydi", "Ko'pchilik holatlarda — asosiy tanlov"], ["Konfiguratsiyani o'zgartirish", "Qo'lda birlashtirish kerak", "Kengaytma imkoni bo'lmaganda"], ["Tashqi obrabotka", "Umuman ta'sir qilmaydi", "Bir martalik vazifalar, yuklashlar"], ["Tashqi hisobot", "Umuman ta'sir qilmaydi", "Maxsus hisobotlar"]], "id": "m7-ways"}, {"t": "flow", "title": "Kengaytma qanday ishlaydi", "items": [["Database", "Tipik konfiguratsiya", "O'zgarmaydi, «на поддержке» qoladi"], ["Settings", "Kengaytma", "Ustiga qo'yiladi: yangi obyektlar va o'zgarishlar"], ["CheckCircle", "Natija", "Foydalanuvchi ikkisini birga ko'radi"]], "caption": "Yangilanish kelganda tipik qism yangilanadi, kengaytma esa o'z joyida qoladi.", "id": "m7-layer"}, {"t": "steps", "title": "Kengaytma yaratish", "intro": null, "items": [["Menyuni oching", "Конфигурация → Расширения конфигурации → Добавить."], ["Nom va prefiks", "Nomi: Zavod_Avtomatika, prefiks: зав_"], ["Yangi obyektlar", "Kengaytmada hujjat, ma'lumotnoma, HTTP-servis yaratish mumkin."], ["Tipik obyektni olish", "Asosiy daraxtda obyekt → «Добавить в расширение»."], ["Saqlash", "Kengaytmani saqlab, bazani yangilang (F7)."]], "id": "m7-create", "notes": "Prefiks har bir obyekt va protsedura nomiga qo'shiladi. Shunda sizning obyektlaringiz tipik obyektlar bilan hech qachon nom jihatdan to'qnashmaydi."}, {"t": "table", "title": "Annotatsiyalar: tipik kodga ulanish", "intro": null, "head": ["Annotatsiya", "Nima qiladi"], "rows": [["&Перед(\"Имя\")", "Tipik koddan oldin bajariladi"], ["&После(\"Имя\")", "Tipik koddan keyin bajariladi"], ["&Вместо(\"Имя\")", "Tipik kod o'rniga; ПродолжитьВызов() bilan asl kod ham chaqiriladi"], ["&ИзменениеИКонтроль(\"Имя\")", "Tipik kod ichiga nuqtaviy o'zgartirish; asl kod o'zgarsa, ogohlantiradi"]], "id": "m7-ann"}, {"t": "code", "title": "&После: sotuv o'tkazilganda Telegram ga xabar", "lang": "1C", "src": "// Kengaytmada: РеализацияТоваровУслуг hujjati moduli\n&После(\"ОбработкаПроведения\")\nПроцедура зав_ОбработкаПроведения(Отказ, РежимПроведения)\n\n    Текст = СтрШаблон(\"Sotuv %1: %2 so'm\",\n        Номер, СуммаДокумента);\n\n    зав_Уведомления.ОтправитьВТелеграм(Текст);\n\nКонецПроцедуры", "side": ["Tipik o'tkazish algoritmi to'liq bajariladi, keyin bizning kod ishlaydi.", "<b>СтрШаблон<\/b> — matnga qiymatlarni joylaydi.", "Xabar yuborish alohida umumiy modulda (зав_Уведомления)."], "caption": null, "id": "m7-after"}, {"t": "code", "title": "&ИзменениеИКонтроль: tipik kod ichiga shart qo'shish", "lang": "1C", "src": "&ИзменениеИКонтроль(\"ПередЗаписью\")\nПроцедура зав_ПередЗаписью(Отказ, РежимЗаписи, РежимПроведения)\n    // ... tipik kod o'zgarmasdan shu yerda turadi ...\n#Вставка\n    Если СуммаДокумента > 100000000\n        И НЕ РольДоступна(\"зав_Директор\") Тогда\n        Сообщить(\"100 mln dan katta sotuvni faqat direktor tasdiqlaydi\");\n        Отказ = Истина;\n    КонецЕсли;\n#КонецВставки\nКонецПроцедуры", "side": null, "caption": "#Вставка … #КонецВставки — faqat shu qism sizniki. Tipik kod yangilanib o'zgarsa, platforma sizni ogohlantiradi.", "id": "m7-change"}, {"t": "steps", "title": "Tipik formaga tugma qo'shish", "intro": null, "items": [["Formani oling", "Hujjat formasini kengaytmaga qo'shing (Добавить в расширение)."], ["Buyruq yarating", "Forma muharriri → Команды → yangi buyruq: зав_ВзятьВес."], ["Panelga joylang", "Buyruqni formaning buyruqlar paneliga sudrab olib keling."], ["Obrabotchik", "Buyruq xususiyatlarida «Действие» → yangi protsedura."]], "id": "m7-form"}, {"t": "code", "title": "Tugma kodi: tarozidan og'irlik olish", "lang": "1C", "src": "&НаКлиенте\nПроцедура зав_ВзятьВес(Команда)\n    Вес = зав_ВзятьВесНаСервере();\n    Если Вес > 0 Тогда\n        Объект.зав_Вес = Вес;\n        Модифицированность = Истина;\n    Иначе\n        ПоказатьПредупреждение(, \"Og'irlik olinmadi\");\n    КонецЕсли;\nКонецПроцедуры\n\n&НаСервереБезКонтекста\nФункция зав_ВзятьВесНаСервере()\n    Возврат зав_ИнтеграцияВесы.ТекущийВес(\"SCALE-1\");\nКонецФункции", "side": ["Tugma klientda bosiladi, so'rov serverda bajariladi.", "<b>БезКонтекста<\/b> — formani serverga yubormaydi: tezroq.", "<b>Модифицированность<\/b> — forma «o'zgargan» deb belgilanadi."], "caption": null, "id": "m7-form-code"}, {"t": "cards", "title": "Xavfsiz ishlash qoidalari", "intro": null, "items": [["Database", "Avval nusxa", "Администрирование → Выгрузить информационную базу (.dt). Har bir o'zgarishdan oldin."], ["Search", "Test bazada", "Ishlab chiqish va sinov — nusxada. Ishchi bazaga faqat tayyor kengaytma."], ["Code", "Git da saqlang", "Kengaytmani fayllarga yuklab yoki 1C:EDT orqali versiyalarni boshqaring."], ["Lock", "Rollar", "Yangi funksiyalarga kirishni rollar orqali cheklang: зав_Оператор, зав_Директор."]], "id": "m7-safe"}, {"t": "statement", "title": "Kengaytma — tipik konfiguratsiyaga tegmasdan o'zgartirishning asosiy yo'li", "sub": "Endi kengaytma bilan nimalar qilish mumkinligini, uning sozlamalarini, tipik formalarni o'zgartirishni va o'rnatishni batafsil ko'ramiz.", "accent": true, "id": "e-intro"}, {"t": "table", "title": "Kengaytma bilan nima qilish mumkin", "intro": null, "head": ["Mumkin", "Izoh"], "rows": [["Yangi obyektlar qo'shish", "Ma'lumotnoma, hujjat, registr, hisobot, HTTP-servis"], ["Tipik obyektga rekvizit qo'shish", "Masalan, sotuv hujjatiga «Tarozi og'irligi»"], ["Tipik formani o'zgartirish", "Maydon, tugma, guruh qo'shish; elementni yashirish"], ["Tipik kodga ulanish", "&Перед, &После, &Вместо, &ИзменениеИКонтроль"], ["Yangi rollar va huquqlar", "O'z obyektlaringiz uchun"], ["Tipik rekvizitni o'chirish", "Mumkin emas — faqat formada yashirish"]], "id": "e-can"}, {"t": "term", "title": "O'zlashtirish (заимствование)", "def": "Tipik obyektni kengaytmaga «olib kirish». Obyekt asl joyida qoladi, kengaytmada esa uning nusxa-havolasi paydo bo'ladi va unga qo'shimcha kiritish mumkin.", "analogy": "Kutubxona kitobiga yopishqoq qog'oz (stiker) yopishtirish: kitob o'zgarmaydi, lekin sizning izohlaringiz uning ustida turadi.", "example": "Документ «РеализацияТоваровУслуг» ni o'zlashtiramiz va unga зав_ВесТарозы rekvizitini hamda formaga «Tarozidan olish» tugmasini qo'shamiz.", "id": "e-borrow"}, {"t": "table", "title": "Kengaytma xususiyatlari", "intro": null, "head": ["Xususiyat", "Ma'nosi"], "rows": [["Имя va Синоним", "Texnik nom va ko'rinadigan nom"], ["Префикс", "Barcha yangi obyekt va protseduralar nomi oldidagi qo'shimcha: зав_"], ["Назначение", "Исправление (xatoni tuzatish), Адаптация (moslashtirish), Дополнение (qo'shimcha funksiya)"], ["Версия", "Kengaytma versiyasi — o'zgarishlarni kuzatish uchun"], ["Безопасный режим", "Yoqilgan bo'lsa, kengaytma tashqi resurslar va xavfli amallarga kira olmaydi"], ["Защита от опасных действий", "Xavfli amallar oldidan ogohlantirish"]], "id": "e-props", "notes": "HTTP so'rov yuboradigan yoki fayl bilan ishlaydigan kengaytma uchun xavfsiz rejimni o'chirish kerak bo'ladi. Buni administrator ongli ravishda qiladi va kengaytma kodini ko'rib chiqadi."}, {"t": "steps", "title": "Tipik hujjatga rekvizit qo'shish", "intro": null, "items": [["O'zlashtiring", "Asosiy konfiguratsiyada hujjat → o'ng tugma → «Добавить в расширение»."], ["Rekvizit", "Kengaytmada hujjatni oching → Реквизиты → Добавить: зав_ВесТарозы, Число 10,0."], ["Formani o'zlashtiring", "Hujjat formasi ham «Добавить в расширение»."], ["Maydonni joylang", "Forma muharririda yangi rekvizitni kerakli guruhga sudrab olib keling."], ["Yangilang", "Kengaytmani saqlang va bazani yangilang (F7)."], ["Tekshiring", "Foydalanuvchi rejimida maydon ko'rinishini va saqlanishini sinang."]], "id": "e-attr"}, {"t": "code", "title": "&Перед: yozishdan oldin qo'shimcha tekshiruv", "lang": "1C", "src": "&Перед(\"ОбработкаПроверкиЗаполнения\")\nПроцедура зав_ОбработкаПроверкиЗаполнения(Отказ, ПроверяемыеРеквизиты)\n\n    Если зав_ТребуетсяВзвешивание И зав_ВесТарозы = 0 Тогда\n        ОбщегоНазначения.СообщитьПользователю(\n            \"Tarozi og'irligi kiritilmagan\", ЭтотОбъект,\n            \"зав_ВесТарозы\", , Отказ);\n    КонецЕсли;\n\nКонецПроцедуры", "side": ["Tipik tekshiruvdan oldin bizning shartimiz ishlaydi.", "<b>Отказ = Истина<\/b> — hujjat saqlanmaydi.", "Xabar aynan kerakli maydon yonida chiqadi.", "<b>ОбщегоНазначения<\/b> — tipik konfiguratsiyalardagi umumiy modul (БСП)."], "caption": null, "id": "e-before"}, {"t": "code", "title": "&Вместо: asl kodni shart bilan chaqirish", "lang": "1C", "src": "&Вместо(\"ЗаполнитьПоОснованию\")\nПроцедура зав_ЗаполнитьПоОснованию(Основание)\n\n    Если ТипЗнч(Основание) = Тип(\"ДокументСсылка.Взвешивание\") Тогда\n        Контрагент = Основание.Автомобиль.Владелец;\n        зав_ВесТарозы = Основание.ВесНетто;\n    Иначе\n        ПродолжитьВызов(Основание);    // tipik algoritm\n    КонецЕсли;\n\nКонецПроцедуры", "side": ["Tortish hujjati asosida yaratilsa — bizning to'ldirish.", "Boshqa holatda — <b>ПродолжитьВызов<\/b> tipik kodni bajaradi.", "&Вместо kuchli, lekin xavfli: tipik kod butunlay o'tkazib yuborilishi mumkin."], "caption": null, "id": "e-instead"}, {"t": "cards", "title": "Yangilanishdan keyin: kengaytma hali ishlaydimi", "intro": null, "items": [["Search", "Проверить применимость", "Kengaytmalar ro'yxatida tugma: tipik obyektlar o'zgargan bo'lsa, qaysi joy mos emasligini ko'rsatadi."], ["Warning", "&ИзменениеИКонтроль", "Tipik kod o'zgarsa, platforma aniq shu protsedurani ko'rsatadi — qo'lda moslashtiring."], ["CheckCircle", "Sinov ro'yxati", "Har yangilanishdan keyin kengaytmaning asosiy vazifalarini bir xil tartibda sinang."]], "id": "e-apply"}, {"t": "steps", "title": "Kengaytmani ishchi bazaga o'rnatish", "intro": null, "items": [["Faylga saqlang", "Konfigurator → kengaytma → Конфигурация → Сохранить в файл (.cfe)."], ["Nusxa oling", "Ishchi bazaning .dt nusxasi."], ["O'rnating", "1C:Предприятие → Все функции → Стандартные → Управление расширениями конфигурации → Добавить из файла."], ["Xavfsiz rejim", "Kerak bo'lsa, «Безопасный режим» ni o'chiring."], ["Qayta kiring", "Foydalanuvchilar dasturni qayta ochganda kengaytma ishlaydi."]], "id": "e-install"}, {"t": "compare", "title": "Kengaytma va tashqi obrabotka (.epf)", "left": ["Kengaytma (.cfe)", ["Bazaning bir qismi bo'ladi", "Tipik obyektlarni o'zgartiradi", "Doimiy funksiyalar uchun", "Barcha foydalanuvchilarda ishlaydi"]], "right": ["Tashqi obrabotka (.epf)", ["Alohida fayl, kerak bo'lganda ochiladi", "Tipik obyektlarni o'zgartirmaydi", "Bir martalik yuklash va tuzatishlar", "Sinov va vaqtinchalik vositalar uchun"]], "id": "e-epf"}, {"t": "cards", "title": "Kengaytmani tartibli boshqarish", "intro": null, "items": [["Settings", "Versiya raqami", "Har o'zgarishda: 1.0.0 → 1.0.1 (tuzatish), 1.1.0 (yangi funksiya)."], ["Book", "O'zgarishlar ro'yxati", "Qaysi versiyada nima o'zgargani — oddiy matn faylda."], ["Code", "Git", "Kengaytmani XML fayllarga yuklab (Конфигурация → Выгрузить в файлы) Git da saqlang."], ["Database", "Oldingi versiya", "Har doim oxirgi ishlagan .cfe faylini saqlab qo'ying."]], "id": "e-version"}, {"t": "quiz", "q": "Tipik hujjatning rekvizitini kengaytma orqali o'chirish mumkinmi?", "opts": ["Ha, oddiygina o'chiriladi", "Yo'q, faqat formada yashirish mumkin", "Faqat dushanba kunlari"], "a": 1, "expl": "Kengaytma tipik obyektlarni qo'shimcha qiladi, lekin ulardan narsa olib tashlamaydi.", "id": "e-q1"}, {"t": "quiz", "q": "Kengaytma tashqi serverga HTTP so'rov yubora olmayapti. Ehtimoliy sabab?", "opts": ["Kengaytma xavfsiz rejimda", "Prefiks noto'g'ri", "Versiya raqami yo'q"], "a": 0, "expl": "Xavfsiz rejimdagi kengaytma tashqi resurslarga murojaat qila olmaydi.", "id": "e-q2"}, {"t": "quiz", "q": "Tipik Бухгалтерия ni yangilanishlarni buzmasdan o'zgartirish uchun nima ishlatiladi?", "opts": ["Konfiguratsiyani «снять с поддержки» qilish", "Kengaytma (расширение)", "Bazani qayta yaratish"], "a": 1, "expl": "Kengaytma tipik konfiguratsiyani o'zgartirmaydi, shuning uchun yangilanishlar muammosiz o'tadi.", "id": "m7-q1"}, {"t": "quiz", "q": "Tipik kod bajarilgandan KEYIN o'z kodingizni ishlatish uchun qaysi annotatsiya?", "opts": ["&Перед", "&После", "&Вместо"], "a": 1, "expl": "&После tipik protsedura to'liq bajarilgandan keyin ishlaydi.", "id": "m7-q2"}, {"t": "quiz", "id": "xq-m7-0", "q": "&Вместо ichida asl tipik kodni chaqirish uchun?", "opts": ["ПродолжитьВызов()", "Возврат", "Сообщить()"], "a": 0, "expl": "ПродолжитьВызов asl protsedurani bajaradi."}, {"t": "quiz", "id": "xq-m7-1", "q": "Kengaytma obyektlari nomi oldidagi qo'shimcha nima deyiladi?", "opts": ["Prefiks", "Suffiks", "Versiya"], "a": 0, "expl": "Masalan зав_ — nomlar to'qnashuvining oldini oladi."}]}, {"id": "m8", "num": 8, "title": "Sun'iy intellekt ishlab chiqarishda", "goal": "Kompyuter ko'rish (YOLO), raqamlarni o'qish (OCR), anomaliyalarni aniqlash, bashorat va til modellarini korxonada qo'llashni o'rganasiz.", "stages": [4], "vol": 1, "blocks": [{"t": "table", "title": "Korxonada AI qayerda ishlatiladi", "intro": null, "head": ["Vazifa", "Texnologiya", "Natija"], "rows": [["Mashina raqamini tanish", "YOLO + OCR", "Qo'lda yozish yo'q"], ["Kaska va jilet nazorati", "Maxsus o'qitilgan YOLO", "Qoidabuzarlik haqida darhol xabar"], ["Konveyerda sanash", "YOLO + tracking", "Aniq ishlab chiqarish hisobi"], ["Brakni aniqlash", "Tasniflash modeli", "Avtomatik sifat nazorati"], ["Shubhali tortishlar", "Anomaliya aniqlash", "O'g'irlik belgilari topiladi"], ["Talab bashorati", "Vaqt qatorlari modellari", "Xomashyo xaridini rejalash"], ["Hisobot va savol-javob", "Til modellari (LLM)", "Oddiy tilda tahlil"]], "id": "m8-uses"}, {"t": "cards", "title": "AI ning uch turi — uch xil vazifa", "intro": null, "items": [["Search", "Kompyuter ko'rish", "Rasm va videoda narsalarni topadi, sanaydi, o'qiydi. Kamera + model."], ["Chart", "Jadval ma'lumotlari", "Raqamlardan qonuniyat va g'ayrioddiylikni topadi, kelajakni bashorat qiladi."], ["Chat", "Til modellari", "Matnni tushunadi va yozadi: hisobot, xulosa, savolga javob."]], "id": "m8-types"}, {"t": "flow", "title": "YOLO qanday ishlaydi", "items": [["Play", "Kadr", "Kameradan rasm olinadi"], ["Settings", "Neyron tarmoq", "Rasmni bir marta ko'rib chiqadi"], ["Search", "Ramkalar", "Har bir obyekt: sinf, joy, ishonch"], ["CheckCircle", "Qaror", "Masalan: yuk mashinasi 94%"]], "caption": "YOLO = «You Only Look Once»: rasm bir martada tahlil qilinadi, shuning uchun oddiy kompyuterda ham tez ishlaydi.", "id": "m8-yolo-how"}, {"t": "code", "title": "YOLO: rasmda yuk mashinasini topish", "lang": "python", "src": "from ultralytics import YOLO\nimport cv2\n\nmodel = YOLO(\"yolov8n.pt\")       # tayyor model, 80 sinf\nframe = cv2.imread(\"snapshots/t1.jpg\")\nres = model(frame, conf=0.5)[0]\n\nfor box in res.boxes:\n    name = model.names[int(box.cls)]\n    x1, y1, x2, y2 = map(int, box.xyxy[0])\n    if name in (\"truck\", \"car\"):\n        cv2.rectangle(frame, (x1, y1), (x2, y2),\n                      (0, 200, 255), 3)\ncv2.imwrite(\"detected.jpg\", frame)", "side": ["Tayyor model odam, mashina, yuk mashinasi kabi 80 turdagi obyektni biladi.", "<b>conf=0.5<\/b> — 50% dan kam ishonchli natijalar tashlanadi.", "Topilgan har bir obyekt ramkaga olinadi va saqlanadi."], "caption": null, "id": "m8-yolo"}, {"t": "steps", "title": "O'z modelingizni o'qitish (masalan, kaska)", "intro": null, "items": [["Rasm to'plang", "300–1000 ta rasm: kaskali va kaskasiz, turli yorug'likda."], ["Belgilang", "Roboflow yoki CVAT da har bir kaskani ramkaga oling."], ["Eksport", "YOLO formatida: rasmlar, belgilar va data.yaml."], ["O'qiting", "model.train(data=\"data.yaml\", epochs=100, imgsz=640)"], ["Tekshiring", "O'qitishda ishlatilmagan rasmlarda sinab ko'ring."], ["GPU yo'q bo'lsa", "Google Colab dan bepul foydalaning."]], "id": "m8-train"}, {"t": "flow", "title": "Raqamni tanish (ANPR) bosqichlari", "items": [["Play", "Kadr", "Tortish paytidagi rasm"], ["Search", "Raqamni topish", "Maxsus YOLO raqam maydonini kesadi"], ["Book", "OCR", "Belgilarni o'qiydi"], ["CheckCircle", "Tekshiruv", "O'zbekiston formati regex bilan"]], "caption": "Butun rasmga emas, faqat kesilgan raqam maydoniga OCR qo'llash aniqlikni keskin oshiradi.", "id": "m8-anpr"}, {"t": "code", "title": "EasyOCR: raqamni o'qish va formatni tekshirish", "lang": "python", "src": "import easyocr, re, cv2\n\nreader = easyocr.Reader([\"en\"], gpu=False)\nUZ = re.compile(r\"^\\d{2}[A-Z]\\d{3}[A-Z]{2}$|^\\d{5}[A-Z]{3}$\")\n\ndef read_plate(path):\n    gray = cv2.cvtColor(cv2.imread(path), cv2.COLOR_BGR2GRAY)\n    for _, text, conf in reader.readtext(gray):\n        t = re.sub(r\"[^A-Z0-9]\", \"\", text.upper())\n        t = t[:2].replace(\"O\", \"0\") + t[2:]\n        if UZ.match(t) and conf > 0.4:\n            return t, conf\n    return None, 0", "side": ["Raqamlar formati: <b>01A123BC<\/b> (jismoniy) yoki <b>01123ABC<\/b> (yuridik).", "Birinchi ikki belgi — hudud kodi: faqat raqam, shuning uchun O → 0.", "Format mos kelmasa — natija qabul qilinmaydi."], "caption": null, "id": "m8-ocr"}, {"t": "cards", "title": "Aniqlikni oshirish bo'yicha amaliy maslahatlar", "intro": null, "items": [["Lightbulb", "Yorug'lik", "IR yoritgich va WDR. Kechasi raqam oppoq bo'lib ketmasin."], ["Search", "Ruxsat", "Raqam kengligi kamida 150–200 piksel bo'lsin."], ["Check", "Bir nechta kadr", "3–5 kadrda o'qing va eng ko'p takrorlangan natijani oling."], ["Users", "Ma'lumotnoma bilan", "Tanilgan raqamni 1C dagi mashinalar ro'yxati bilan solishtiring."]], "id": "m8-acc"}, {"t": "cards", "title": "Anomaliya: nima «g'ayrioddiy» hisoblanadi", "intro": null, "items": [["Warning", "Tara sakrashi", "Bir mashinaning bo'sh og'irligi odatdagidan keskin farq qiladi — ichida nimadir qolgan."], ["Clock", "Tez qayta tortish", "Bir mashina qisqa vaqtda ikki marta tortilgan."], ["Activity", "Tungi faollik", "Ish vaqtidan tashqari tortishlar."], ["Search", "Raqam va rasm mos emas", "Raqam tanilmagan yoki boshqa mashina rasmi."]], "id": "m8-anom-idea"}, {"t": "code", "title": "Anomaliyalarni topish: qoida va ML", "lang": "python", "src": "import pandas as pd\nfrom sklearn.ensemble import IsolationForest\n\ndf = pd.read_sql(\"SELECT plate, weight, tare FROM weighings\", engine)\n\n# 1) Oddiy qoida: tara o'rtachadan 3 sigma farq qilsa\nst = df.groupby(\"plate\")[\"tare\"].agg([\"mean\", \"std\"]).reset_index()\ndf = df.merge(st, on=\"plate\")\ndf[\"bad_tare\"] = (df.tare - df[\"mean\"]).abs() > 3 * df[\"std\"]\n\n# 2) Mashinaviy o'rganish: Isolation Forest\nX = df[[\"weight\", \"tare\"]].fillna(0)\ndf[\"anomaly\"] = IsolationForest(contamination=0.02).fit_predict(X) == -1\n\nprint(df[df.bad_tare | df.anomaly])", "side": null, "caption": null, "id": "m8-anom", "notes": "Avval oddiy qoidalardan boshlang — ular tushunarli va tekshirish oson. ML ni qoidalar topa olmaydigan holatlar uchun qo'shing."}, {"t": "cards", "title": "Bashorat: kelajakni rejalash", "intro": null, "items": [["Chart", "Nimani bashorat qilamiz", "Kunlik xomashyo kirimi, mahsulot sotuvi, ombor qoldig'i."], ["Database", "Qanday ma'lumot kerak", "Kamida bir-ikki yillik tarix: sezonlik va bayramlar ko'rinishi uchun."], ["Tool", "Qaysi vosita", "Prophet, LightGBM yoki oddiy o'rtacha — natijani haqiqat bilan solishtirib tanlang."]], "id": "m8-forecast"}, {"t": "code", "title": "Til modeli: direktor uchun kunlik hisobot", "lang": "python", "src": "import anthropic, json, os\n\nclient = anthropic.Anthropic(api_key=os.getenv(\"ANTHROPIC_API_KEY\"))\ndata = df.groupby(\"plate\")[\"weight\"].sum().to_dict()\n\nmsg = client.messages.create(\n    model=\"claude-sonnet-5\",\n    max_tokens=800,\n    messages=[{\"role\": \"user\", \"content\":\n        \"Bugungi tortish ma'lumotlari asosida direktor uchun \"\n        \"o'zbek tilida qisqa hisobot yoz:\\n\"\n        + json.dumps(data, ensure_ascii=False)}],\n)\nprint(msg.content[0].text)", "side": null, "caption": null, "id": "m8-llm", "notes": "Model xom raqamlarni o'qib, tushunarli xulosa yozadi. Natijani Telegram bot orqali har kuni kechqurun yuborish mumkin."}, {"t": "statement", "title": "Tijorat sirlarini tashqi AI xizmatiga yuborishdan oldin korxona siyosatini tekshiring", "sub": "Kerak bo'lsa, faqat yig'ilgan raqamlarni yuboring: mijoz nomlari va narxlarsiz. Yoki modelni o'z serveringizda ishga tushiring.", "accent": false, "id": "m8-privacy"}, {"t": "statement", "title": "Sun'iy intellekt sehr emas: misollardan o'rganadigan dastur", "sub": "Endi model qanday o'rganishini, qanday ma'lumot kerakligini, natijani qanday baholashni va o'z modelingizni qanday o'qitishni qadam-baqadam ko'ramiz.", "accent": true, "id": "ai-intro"}, {"t": "term", "title": "Mashinaviy o'rganish", "def": "Dasturga qoidalarni yozish o'rniga, unga ko'p misol (kirish va to'g'ri javob) beriladi. Dastur o'zi qonuniyatni topadi va yangi holatlarda javob beradi.", "analogy": "Bolaga mushukni ta'riflamaysiz — yuzlab mushuk ko'rsatasiz. Keyin u hech ko'rmagan mushukni ham taniydi.", "example": "Minglab kadr, har birida yuk mashinasi ramkaga olingan. Model o'rganadi va yangi kameradagi mashinani ham topadi.", "id": "ai-ml"}, {"t": "table", "title": "O'rganish turlari", "intro": null, "head": ["Tur", "Qanday", "Korxonadagi misol"], "rows": [["Nazoratli (supervised)", "Misollar to'g'ri javoblar bilan", "Kaska bor/yo'q, raqamni o'qish"], ["Nazoratsiz (unsupervised)", "Javobsiz, guruhlarni o'zi topadi", "G'ayrioddiy tortishlarni topish"], ["Mustahkamlovchi (reinforcement)", "Sinab ko'rib, mukofotdan o'rganadi", "Robotlarni boshqarish (kam uchraydi)"], ["Chuqur o'rganish (deep learning)", "Ko'p qatlamli neyron tarmoqlar", "Rasm, video, matn, ovoz"]], "id": "ai-kinds"}, {"t": "steps", "title": "AI loyihasining hayot sikli", "intro": null, "items": [["Vazifani aniqlang", "Aniq savol: «kadrda kaskasiz odam bormi?»"], ["Ma'lumot to'plang", "Haqiqiy sharoitdagi rasmlar: kun, tun, yomg'ir, qish."], ["Belgilang", "Har bir rasmda to'g'ri javobni ko'rsating."], ["O'qiting", "Model misollardan o'rganadi."], ["Baholang", "Model ko'rmagan rasmlarda tekshiring."], ["Ishga tushiring va kuzating", "Xatolarni yig'ib, modelni qayta o'qiting."]], "id": "ai-pipeline"}, {"t": "cards", "title": "Yaxshi ma'lumot — yaxshi modelning 80 foizi", "intro": null, "items": [["Database", "Yetarli miqdor", "Har bir sinf uchun yuzlab, yaxshisi minglab misol."], ["Activity", "Xilma-xillik", "Turli vaqt, ob-havo, burchak, masofa. Faqat kunduzgi rasm — kechasi ishlamaydi."], ["Check", "Muvozanat", "«Kaskali» 5000, «kaskasiz» 50 bo'lsa, model ikkinchisini deyarli o'rganmaydi."], ["Verified", "To'g'ri belgilar", "Xato belgilangan misol modelni ham xatoga o'rgatadi."]], "id": "ai-data"}, {"t": "table", "title": "Ma'lumotni uchga bo'lish", "intro": null, "head": ["Qism", "Ulushi", "Vazifasi"], "rows": [["Train (o'qitish)", "~70%", "Model shu misollardan o'rganadi"], ["Validation (tekshiruv)", "~20%", "O'qitish davomida natijani kuzatish"], ["Test (yakuniy sinov)", "~10%", "Oxirida bir marta: model hech ko'rmagan ma'lumot"]], "id": "ai-split", "notes": "Bir kun yoki bir kameradan olingan o'xshash kadrlar turli qismlarga tushib qolmasligi kerak. Aks holda model «yodlab» oladi va test natijasi haqiqatdan yaxshiroq ko'rinadi."}, {"t": "term", "title": "Ortiqcha moslashish (overfitting)", "def": "Model o'qitish misollarini yodlab oladi, lekin yangi misollarda yomon ishlaydi.", "analogy": "Imtihon savollarini javoblari bilan yodlagan talaba: xuddi shu savollarda 100 ball, sal o'zgartirilgan savolda — yiqiladi.", "example": "Model faqat bitta tarozidagi rasmlarda o'qitilgan. Boshqa tarozida, boshqa fonda — ishlamaydi. Yechim: xilma-xil ma'lumot va validatsiya.", "id": "ai-overfit"}, {"t": "visual", "title": "Xatolar matritsasi: model qanday adashadi", "html": "<section id=\"ai-confusion\" style=\"width:1920px; height:1080px; position:relative; box-sizing:border-box; overflow:hidden; background:#F2F4F7; color:#14213D; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:64px; font-weight:600; line-height:1.15; color:#14213D\">Xatolar matritsasi: model qanday adashadi<\/h2><div style=\"display:flex; flex-direction:row; gap:48px; flex:1\"><div style=\"width:820px; display:grid; grid-template-columns:1fr 1fr; gap:16px\"><div style=\"background:#3566C9; border-radius:14px; padding:28px; display:flex; flex-direction:column; gap:10px\"><h3 style=\"font-size:30px; font-weight:700; color:#F2F4F7\">TP — to'g'ri topdi<\/h3><p style=\"font-size:24px; line-height:1.4; color:#F2F4F7\">Kaskasiz odam bor, model «bor» dedi.<\/p><\/div><div style=\"background:#E8A317; border-radius:14px; padding:28px; display:flex; flex-direction:column; gap:10px\"><h3 style=\"font-size:30px; font-weight:700; color:#14213D\">FP — yolg'on signal<\/h3><p style=\"font-size:24px; line-height:1.4; color:#14213D\">Kaskasiz odam yo'q, model «bor» dedi.<\/p><\/div><div style=\"background:#E8A317; border-radius:14px; padding:28px; display:flex; flex-direction:column; gap:10px\"><h3 style=\"font-size:30px; font-weight:700; color:#14213D\">FN — o'tkazib yubordi<\/h3><p style=\"font-size:24px; line-height:1.4; color:#14213D\">Kaskasiz odam bor, model «yo'q» dedi.<\/p><\/div><div style=\"background:#3566C9; border-radius:14px; padding:28px; display:flex; flex-direction:column; gap:10px\"><h3 style=\"font-size:30px; font-weight:700; color:#F2F4F7\">TN — to'g'ri rad etdi<\/h3><p style=\"font-size:24px; line-height:1.4; color:#F2F4F7\">Kaskasiz odam yo'q, model «yo'q» dedi.<\/p><\/div><\/div><div style=\"flex:1; display:flex; flex-direction:column; gap:28px\"><div style=\"border-left:6px solid #3566C9; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">Precision (aniqlik)<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">TP ÷ (TP + FP). Model «bor» deganda, qanchasi haqiqatan bor.<\/p><\/div><div style=\"border-left:6px solid #E8A317; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">Recall (to'liqlik)<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">TP ÷ (TP + FN). Haqiqiy holatlarning qanchasini topdi.<\/p><\/div><div style=\"border-left:6px solid #3566C9; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">F1<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Ikkalasining muvozanatli o'rtachasi.<\/p><\/div><\/div><\/div>\n<\/section>", "id": "ai-confusion"}, {"t": "compare", "title": "Qachon nima muhimroq", "left": ["Recall muhim", ["Xavfsizlik: kaskasiz odamni o'tkazib yubormaslik", "Yong'in, tutun aniqlash", "Ba'zan yolg'on signal — qabul qilinadi", "Chegara (conf) pastroq"]], "right": ["Precision muhim", ["Avtomatik jarima yoki bloklash", "1C da avtomatik hujjat yaratish", "Yolg'on signal qimmatga tushadi", "Chegara (conf) yuqoriroq"]], "id": "ai-pr"}, {"t": "term", "title": "Neyron tarmoq", "def": "Ko'p qatlamli matematik funksiya. Har bir qatlam oldingisidan kelgan sonlarni qayta ishlaydi; o'qitish paytida minglab ichki koeffitsientlar (vaznlar) asta-sekin to'g'rilanadi.", "analogy": "Zavoddagi konveyer: har bir ishchi detalga bir amal qo'shadi. Oxirida tayyor mahsulot — javob chiqadi.", "example": "Rasmni tanish tarmog'ida birinchi qatlamlar chiziq va qirralarni, o'rtadagilar g'ildirak va oynani, oxirgilari «yuk mashinasi»ni taniydi.", "id": "ai-nn"}, {"t": "flow", "title": "Rasmni tanuvchi tarmoq qanday «ko'radi»", "items": [["Play", "Piksellar", "Kadr — sonlar jadvali"], ["Search", "Qirralar", "Birinchi qatlamlar: chiziq va burchaklar"], ["Settings", "Shakllar", "O'rta qatlamlar: g'ildirak, oyna, kaska"], ["CheckCircle", "Obyekt", "Oxirgi qatlamlar: sinf va joy"]], "caption": null, "id": "ai-cnn"}, {"t": "table", "title": "YOLO nimani qaytaradi", "intro": null, "head": ["Maydon", "Ma'nosi", "Misol"], "rows": [["cls", "Sinf raqami", "7 (truck)"], ["conf", "Ishonch darajasi 0 dan 1 gacha", "0,91"], ["xyxy", "Ramkaning chap-yuqori va o'ng-pastki burchagi", "(412, 220, 1510, 890)"], ["xywh", "Markaz, kenglik, balandlik", "(961, 555, 1098, 670)"], ["id (tracking)", "Kadrdan kadrga bir xil obyekt raqami", "14"]], "id": "ai-yolo-out"}, {"t": "cards", "title": "IoU va takroriy ramkalarni olib tashlash", "intro": null, "items": [["Search", "IoU", "Ikki ramkaning ustma-ust tushish ulushi: 0 — umuman yo'q, 1 — to'liq bir xil."], ["Check", "NMS", "Bir obyektga bir nechta ramka chiqsa, eng ishonchlisi qoladi, qolganlari olib tashlanadi."], ["Chart", "mAP50", "Model sifati: IoU ≥ 0,5 bo'lganda to'g'ri hisoblangan topilmalar bo'yicha o'rtacha aniqlik."]], "id": "ai-iou"}, {"t": "steps", "title": "Rasmlarni to'g'ri belgilash qoidalari", "intro": null, "items": [["Qattiq ramka", "Ramka obyektni to'liq, lekin ortiqcha bo'sh joysiz o'rasin."], ["Hammasini belgilang", "Rasmdagi har bir kaskani — hatto qisman ko'ringanini ham."], ["Bir xil qoidalar", "Qaysi holat qaysi sinf — yozma qo'llanma tuzing."], ["Qiyin misollar", "Kaska o'rniga do'ppi, qalpoq — ularni ham to'plang."], ["Ikkinchi ko'z", "Belgilarni boshqa odam tanlab tekshirsin."], ["Vosita", "Roboflow, CVAT yoki Label Studio."]], "id": "ai-label"}, {"t": "code", "title": "Ma'lumotlar to'plami fayli: data.yaml", "lang": "yaml", "src": "path: /data/kaska          # asosiy papka\ntrain: images/train        # o'qitish rasmlari\nval: images/val            # tekshiruv rasmlari\ntest: images/test\n\nnames:\n  0: kaska\n  1: kaskasiz_bosh\n  2: jilet", "side": ["Har bir rasm yonida bir xil nomli .txt belgi fayli bo'ladi.", "Belgi faylida har bir obyekt uchun: sinf raqami va ramka koordinatalari.", "Sinflar tartibi o'qitishdan keyin o'zgartirilmaydi."], "caption": null, "id": "ai-yaml"}, {"t": "code", "title": "Modelni o'qitish", "lang": "python", "src": "from ultralytics import YOLO\n\nmodel = YOLO(\"yolov8n.pt\")      # tayyor modeldan boshlaymiz\n\nmodel.train(\n    data=\"data.yaml\",\n    epochs=100,\n    imgsz=640,\n    batch=16,\n    patience=20,               # yaxshilanmasa, erta to'xtatish\n)\n\nmetrics = model.val()          # tekshiruv to'plamida baholash\nprint(metrics.box.map50)", "side": ["Tayyor modeldan boshlash (transfer learning) — kam ma'lumot bilan ham yaxshi natija.", "<b>epochs<\/b> — butun to'plamni necha marta ko'rib chiqish.", "<b>batch<\/b> — bir qadamda nechta rasm (xotiraga bog'liq).", "Natijalar runs/detect/train papkasiga saqlanadi."], "caption": null, "id": "ai-train"}, {"t": "cards", "title": "O'qitishdan keyin nimaga qarash kerak", "intro": null, "items": [["Chart", "Loss grafiklari", "Train va val xatoligi kamayib borishi kerak. Val o'sa boshlasa — overfitting."], ["Star", "mAP50 va mAP50-95", "Asosiy sifat ko'rsatkichlari: qanchalik yuqori bo'lsa, shuncha yaxshi."], ["Search", "Xatolar matritsasi", "Qaysi sinflar bir-biri bilan chalkashyapti."], ["CheckCircle", "best.pt", "Eng yaxshi natijali model fayli — shuni ishlatasiz."]], "id": "ai-results"}, {"t": "table", "title": "Model o'lchamlari: tezlik va aniqlik", "intro": null, "head": ["Model", "Tezlik", "Aniqlik", "Qachon"], "rows": [["n (nano)", "Eng tez", "Pastroq", "Oddiy kompyuter, ko'p kamera"], ["s (small)", "Tez", "Yaxshi", "Ko'p holatlarda eng yaxshi muvozanat"], ["m (medium)", "O'rtacha", "Yuqori", "GPU bor bo'lsa"], ["l / x", "Sekin", "Eng yuqori", "Kuchli GPU, murakkab vazifalar"]], "id": "ai-sizes"}, {"t": "cards", "title": "Model qayerda ishlaydi", "intro": null, "items": [["Settings", "Oddiy protsessor (CPU)", "Kichik model, sekundiga bir necha kadr — tarozi uchun yetarli."], ["Lightning", "Videokarta (GPU)", "O'nlab kamera va katta modellar uchun."], ["Tool", "Edge qurilmalar", "Kamera yonidagi kichik AI kompyuterlar: tarmoqqa video yubormaydi."], ["Link", "ONNX eksport", "Modelni universal formatga o'tkazib, turli qurilmalarda tezroq ishlatish."]], "id": "ai-hw"}, {"t": "code", "title": "O'qitilgan modelni ishlatish: faqat qiziqish hududida", "lang": "python", "src": "from ultralytics import YOLO\n\nmodel = YOLO(\"runs/detect/train/weights/best.pt\")\nY1, Y2, X1, X2 = 200, 900, 300, 1600          # ROI sozlamadan\n\ndef kaskasizlar(kadr):\n    roi = kadr[Y1:Y2, X1:X2]\n    natija = model(roi, conf=0.4, verbose=False)[0]\n    topildi = []\n    for b in natija.boxes:\n        if model.names[int(b.cls)] == \"kaskasiz_bosh\":\n            topildi.append(float(b.conf))\n    return topildi", "side": null, "caption": "Topilsa — kadr saqlanadi va xavfsizlik xizmatiga Telegram orqali yuboriladi. Bitta kadr emas, ketma-ket 3 kadrda topilsa xabar bering — yolg'on signallar kamayadi.", "id": "ai-infer"}, {"t": "code", "title": "Kuzatish va sanash: chiziqni kesib o'tganlar", "lang": "python", "src": "CHIZIQ_Y = 600\noldingi, sanoq = {}, 0\n\nfor natija in model.track(source=URL, stream=True, persist=True):\n    if natija.boxes.id is None:\n        continue\n    for b, tid in zip(natija.boxes.xyxy, natija.boxes.id.int().tolist()):\n        y = int((b[1] + b[3]) / 2)            # ramka markazi\n        if tid in oldingi and oldingi[tid] < CHIZIQ_Y <= y:\n            sanoq += 1\n            print(\"Kirdi, jami:\", sanoq)\n        oldingi[tid] = y", "side": null, "caption": "Har bir obyekt o'z ID siga ega. Markaz chiziqni yuqoridan pastga kesib o'tsa — sanoq bittaga oshadi. Konveyerdagi qoplar yoki darvozadan o'tgan mashinalar uchun.", "id": "ai-track"}, {"t": "code", "title": "Raqamni bir necha kadr bo'yicha ovoz berib aniqlash", "lang": "python", "src": "from collections import Counter\n\ndef ishonchli_raqam(kadrlar, kamida=3):\n    natijalar = []\n    for k in kadrlar:\n        raqam, conf = read_plate_from_frame(k)\n        if raqam:\n            natijalar.append(raqam)\n    if not natijalar:\n        return None\n    eng_kop, soni = Counter(natijalar).most_common(1)[0]\n    return eng_kop if soni >= kamida else None", "side": ["Mashina tarozida turganda 5–10 kadr olinadi.", "Har birida raqam o'qiladi.", "Eng ko'p takrorlangan javob tanlanadi.", "Kamida 3 marta bir xil chiqmasa — operator tasdiqlaydi."], "caption": null, "id": "ai-vote"}, {"t": "term", "title": "Standart og'ish va z-ball", "def": "Qiymatning o'rtachadan necha «odatiy og'ish» uzoqligini ko'rsatadigan son. |z| > 3 — juda kam uchraydigan, shubhali holat.", "analogy": "Sinfdagi bo'ylar: ko'pchilik 160–180 sm. 210 sm bo'yli o'quvchi darhol ko'zga tashlanadi.", "example": "Mashinaning tarasi odatda 8 200 ± 50 kg. Bugun 8 900 kg — z ≈ 14. Ichida nimadir qolgan bo'lishi mumkin: tekshirish kerak.", "id": "ai-z"}, {"t": "table", "title": "Tortishlardagi shubhali belgilar (xususiyatlar)", "intro": null, "head": ["Belgi", "Qanday hisoblanadi"], "rows": [["Tara og'ishi", "Bugungi tara − shu mashinaning o'rtacha tarasi"], ["Qayta tortish oralig'i", "Oldingi tortishdan beri o'tgan daqiqalar"], ["Vaqt", "Tungi soatlar, dam olish kunlari"], ["Yuk og'irligi", "Shu mahsulot uchun odatiy netto bilan farq"], ["Raqam ishonchi", "OCR ishonchi past yoki qo'lda o'zgartirilgan"], ["Operator", "Qo'lda tuzatishlar soni"]], "id": "ai-features"}, {"t": "code", "title": "Oddiy bashorat: haftalik mavsumiylik", "lang": "python", "src": "import pandas as pd\n\ndf = pd.read_sql(\"SELECT ts, brutto - tara AS netto FROM weighings\", engine)\nkunlik = df.set_index(\"ts\").resample(\"D\")[\"netto\"].sum()\n\n# Bashorat: o'tgan 4 haftaning shu kunidagi o'rtachasi\nhafta_kuni = kunlik.groupby(kunlik.index.dayofweek)\nbashorat = hafta_kuni.apply(lambda s: s.tail(4).mean())\n\n# Sifat: o'rtacha mutlaq xato (MAE)\nhaqiqiy = kunlik.tail(7)\nxato = (haqiqiy - bashorat[haqiqiy.index.dayofweek].values).abs().mean()\nprint(\"MAE:\", round(xato), \"kg\")", "side": null, "caption": "Murakkab modellarni har doim shu kabi oddiy usul bilan solishtiring. Oddiy usul yutqazmasa, murakkabi kerak emas.", "id": "ai-forecast"}, {"t": "term", "title": "Til modeli (LLM)", "def": "Juda katta hajmdagi matnlarda o'qitilgan model: matnni tushunadi, xulosa qiladi, tarjima qiladi, savollarga javob beradi va tuzilgan ma'lumot chiqaradi.", "analogy": "Ko'p kitob o'qigan yordamchi: savolingizni tushunadi, lekin sizning korxonangiz haqida faqat siz bergan ma'lumotni biladi.", "example": "Yetkazib beruvchi yuborgan nakladnoy matnidan mahsulot, miqdor va narxni ajratib, 1C ga tayyor JSON qilish.", "id": "ai-llm"}, {"t": "cards", "title": "Yaxshi so'rov (prompt) yozish qoidalari", "intro": null, "items": [["Users", "Rol va maqsad", "«Sen ombor hisobchisisan. Vazifang — …»"], ["Book", "Kontekst", "Kerakli ma'lumotlarni to'liq bering: jadval, qoidalar, cheklovlar."], ["Settings", "Format", "Javob qanday ko'rinishda bo'lishi kerak: faqat JSON, jadval, 5 qator."], ["Check", "Misol", "Bitta to'g'ri javob namunasi — natija sifatini keskin oshiradi."]], "id": "ai-prompt"}, {"t": "code", "title": "Matndan tuzilgan ma'lumot ajratish", "lang": "python", "src": "import anthropic, json, os\n\nclient = anthropic.Anthropic(api_key=os.getenv(\"ANTHROPIC_API_KEY\"))\nSYSTEM = (\"Nakladnoy matnidan mahsulotlarni ajrat. Faqat JSON qaytar: \"\n          '[{\"nomi\": str, \"miqdor\": number, \"birlik\": str}]')\n\ndef ajrat(matn):\n    msg = client.messages.create(\n        model=\"claude-sonnet-5\", max_tokens=1000, system=SYSTEM,\n        messages=[{\"role\": \"user\", \"content\": matn}])\n    toza = msg.content[0].text.strip().strip(\"`\").removeprefix(\"json\")\n    return json.loads(toza)", "side": null, "caption": "Natijani avtomatik 1C ga yozishdan oldin tekshiring: miqdor son ekanini, mahsulot ma'lumotnomada borligini. Noaniq holatlar operatorga yuborilsin.", "id": "ai-extract"}, {"t": "cards", "title": "AI xavflari va nazorat", "intro": null, "items": [["Warning", "Xato javoblar", "Model ishonch bilan noto'g'ri javob berishi mumkin. Muhim qarorlarda inson tasdiqlaydi."], ["Lock", "Maxfiylik", "Tashqi xizmatlarga faqat ruxsat etilgan ma'lumot yuboriladi."], ["Chart", "Xarajat", "Har bir so'rovning narxi bor. Keraksiz chaqiruvlarni kamaytiring, natijalarni keshlang."], ["Activity", "Siljish (drift)", "Sharoit o'zgarsa (yangi kamera, fasl), aniqlik tushadi. Muntazam kuzating va qayta o'qiting."]], "id": "ai-risks"}, {"t": "steps", "title": "Amaliy mashqlar", "intro": null, "items": [["Tayyor model", "yolov8n.pt bilan o'z kamerangiz kadrlaridagi mashinalarni toping."], ["Kichik to'plam", "100 ta rasmni belgilang (masalan, kaska) va o'qiting."], ["Baholash", "Test to'plamida precision va recall ni hisoblang."], ["Ovoz berish", "Raqamni 5 kadr bo'yicha aniqlang."], ["Anomaliya", "Har bir mashina uchun tara z-balini hisoblang."], ["LLM", "Nakladnoy matnidan JSON ajratib, natijani tekshiring."]], "id": "ai-practice"}, {"t": "quiz", "q": "Model o'qitish rasmlarida 99%, yangi rasmlarda 60% natija ko'rsatdi. Bu nima?", "opts": ["Juda yaxshi model", "Ortiqcha moslashish (overfitting)", "Kamera nosozligi"], "a": 1, "expl": "Model misollarni yodlagan. Yechim: ko'proq va xilma-xil ma'lumot, validatsiya va erta to'xtatish.", "id": "ai-q1"}, {"t": "quiz", "q": "Kaskasiz ishchini o'tkazib yubormaslik eng muhim bo'lsa, qaysi ko'rsatkichga e'tibor berasiz?", "opts": ["Recall", "Precision", "Rasm hajmi"], "a": 0, "expl": "Recall haqiqiy holatlarning qanchasini topganini ko'rsatadi.", "id": "ai-q2"}, {"t": "quiz", "q": "LLM ajratib bergan ma'lumotni 1C ga yozishdan oldin nima qilish kerak?", "opts": ["Hech narsa — model har doim to'g'ri", "Tekshirish va noaniq holatlarni operatorga yuborish", "Faqat kechasi yozish"], "a": 1, "expl": "Til modellari xato qilishi mumkin; avtomatik tekshiruv va inson nazorati shart.", "id": "ai-q3"}, {"t": "quiz", "q": "Kamerada kaskasiz ishchini aniqlash uchun qaysi yondashuv to'g'ri?", "opts": ["O'z rasmlaringizda YOLO ni o'qitish", "Excel formulasi", "1C hisoboti"], "a": 0, "expl": "Tayyor model «kaska» sinfini bilmaydi. Belgilangan rasmlar bilan o'qitish kerak.", "id": "m8-q1"}, {"t": "quiz", "q": "Raqam o'qish aniqligini qanday oshirish mumkin?", "opts": ["Kamerani uzoqroqqa qo'yish", "Avval raqam maydonini kesib, keyin OCR qilish", "Rasmni kichraytirish"], "a": 1, "expl": "Kesilgan kichik maydonda OCR ga halaqit beradigan boshqa yozuvlar bo'lmaydi.", "id": "m8-q2"}, {"t": "quiz", "q": "Isolation Forest nima uchun ishlatiladi?", "opts": ["Rasmni tiniqlashtirish", "G'ayrioddiy (anomal) yozuvlarni topish", "1C ga ulanish"], "a": 1, "expl": "U boshqalardan keskin ajralib turadigan yozuvlarni tez «ajratib» oladi.", "id": "m8-q3"}, {"t": "quiz", "id": "xq-m8-0", "q": "Precision qanday hisoblanadi?", "opts": ["TP ÷ (TP + FP)", "TP ÷ (TP + FN)", "FP ÷ (FP + TN)"], "a": 0, "expl": "Model «bor» degan holatlarning qanchasi haqiqatan bor."}, {"t": "quiz", "id": "xq-m8-1", "q": "O'qitishda ishlatilmay, oxirida bir marta tekshiriladigan to'plam?", "opts": ["Train", "Validation", "Test"], "a": 2, "expl": "Test to'plami modelning haqiqiy sifatini ko'rsatadi."}, {"t": "quiz", "id": "xq-m8-2", "q": "Tayyor modeldan boshlab o'z ma'lumotlaringizda o'qitish nima deyiladi?", "opts": ["Transfer learning", "Overfitting", "NMS"], "a": 0, "expl": "Kam ma'lumot bilan ham yaxshi natija beradi."}]}, {"id": "m9", "num": 9, "title": "Amaliy loyiha: aqlli avtomobil tarozisi", "goal": "Barcha modullarni bitta ishlaydigan tizimga birlashtirasiz: tarozi, kamera, raqam tanish, server, 1C va Telegram.", "stages": [0, 1, 2, 3, 4, 5], "vol": 1, "blocks": [{"t": "visual", "title": "Loyiha: nima quramiz", "html": "<section id=\"m9-scene\" style=\"width:1920px; height:1080px; position:relative; box-sizing:border-box; overflow:hidden; background:#F2F4F7; color:#14213D; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:64px; font-weight:600; line-height:1.15; color:#14213D\">Loyiha: nima quramiz<\/h2><div style=\"display:flex; flex-direction:row; gap:56px; align-items:center; flex:1\"><div style=\"width:760px; height:500px; background:#14213D; border-radius:16px; display:flex; align-items:center; justify-content:center\"><svg aria-label=\"Avtomobil tarozisi: platformadagi yuk mashinasi, ustundagi kamera va operator budkasi\" height=\"474\" viewbox=\"0 0 760 500\" width=\"720\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#1E2D4D\" height=\"70\" width=\"760\" x=\"0\" y=\"430\"><\/rect>\n<rect fill=\"#56657A\" height=\"30\" rx=\"4\" width=\"520\" x=\"60\" y=\"400\"><\/rect>\n<rect fill=\"#3A4A66\" height=\"18\" width=\"30\" x=\"80\" y=\"430\"><\/rect><rect fill=\"#3A4A66\" height=\"18\" width=\"30\" x=\"530\" y=\"430\"><\/rect>\n<rect fill=\"#3A4A66\" height=\"18\" width=\"30\" x=\"300\" y=\"430\"><\/rect>\n<rect fill=\"#3566C9\" height=\"130\" rx=\"6\" width=\"300\" x=\"100\" y=\"250\"><\/rect>\n<rect fill=\"#E8A317\" height=\"90\" rx=\"10\" width=\"120\" x=\"400\" y=\"290\"><\/rect>\n<rect fill=\"#BFCBDB\" height=\"40\" rx=\"4\" width=\"70\" x=\"430\" y=\"302\"><\/rect>\n<circle cx=\"160\" cy=\"388\" fill=\"#0F1A2E\" r=\"24\"><\/circle><circle cx=\"160\" cy=\"388\" fill=\"#9FB0C8\" r=\"10\"><\/circle>\n<circle cx=\"230\" cy=\"388\" fill=\"#0F1A2E\" r=\"24\"><\/circle><circle cx=\"230\" cy=\"388\" fill=\"#9FB0C8\" r=\"10\"><\/circle>\n<circle cx=\"470\" cy=\"388\" fill=\"#0F1A2E\" r=\"24\"><\/circle><circle cx=\"470\" cy=\"388\" fill=\"#9FB0C8\" r=\"10\"><\/circle>\n<rect fill=\"#9FB0C8\" height=\"280\" width=\"10\" x=\"640\" y=\"150\"><\/rect>\n<rect fill=\"#F2F4F7\" height=\"30\" rx=\"6\" width=\"62\" x=\"598\" y=\"138\"><\/rect>\n<circle cx=\"604\" cy=\"153\" fill=\"#0F1A2E\" r=\"9\"><\/circle>\n<path d=\"M596 160 L520 300\" fill=\"none\" stroke=\"#E8A317\" stroke-dasharray=\"8 8\" stroke-width=\"3\"><\/path>\n<rect fill=\"#F2F4F7\" height=\"100\" rx=\"6\" width=\"130\" x=\"600\" y=\"330\"><\/rect>\n<rect fill=\"#3566C9\" height=\"40\" rx=\"4\" width=\"98\" x=\"616\" y=\"350\"><\/rect>\n<path d=\"M645 168 C 700 220, 700 290, 665 330\" fill=\"none\" stroke=\"#E8A317\" stroke-dasharray=\"6 6\" stroke-width=\"3\"><\/path>\n<path d=\"M330 430 C 400 470, 560 470, 610 425\" fill=\"none\" stroke=\"#E8A317\" stroke-dasharray=\"6 6\" stroke-width=\"3\"><\/path>\n<\/svg><\/div><ul style=\"flex:1; font-size:30px; line-height:1.45; color:#3A475C\"><li>Mashina taroziga kiradi<\/li><li>Og'irlik 3 soniya barqaror — tortish<\/li><li>Kamera rasmga oladi, AI raqamni o'qiydi<\/li><li>Server saqlaydi va dashboardga chiqaradi<\/li><li>1C da hujjat yaratiladi<\/li><li>Shubhali holat — Telegram ga xabar<\/li><\/ul><\/div>\n<\/section>", "id": "m9-scene"}, {"t": "flow", "title": "Tarozi holatlari (holat mashinasi)", "items": [["Home", "Bo'sh", "Og'irlik 1000 kg dan kam"], ["Activity", "Kirish", "Og'irlik o'zgarmoqda"], ["Clock", "Barqaror", "3 soniya o'zgarmas"], ["CheckCircle", "Yozildi", "Rasm, raqam, yuborish"]], "caption": "«Yozildi» holatidan faqat tarozi yana bo'shaganda chiqiladi. Shunday qilib bir mashina ikki marta yozilmaydi.", "id": "m9-states"}, {"t": "code", "title": "Loyiha papkalari", "lang": "text", "src": "smart-scale/\n├── gateway/                 # tarozi yonidagi kompyuter\n│   ├── scale.py             # 2-modul: og'irlik o'qish\n│   ├── camera.py            # 3-modul: kadr olish\n│   ├── plate.py             # 8-modul: raqam tanish\n│   └── main.py              # hammasini birlashtiradi\n├── server/\n│   ├── api.py               # 4-modul: FastAPI\n│   ├── db.py                # jadvallar\n│   ├── sync_1c.py           # 6-modul: 1C ga yuborish\n│   └── static/index.html    # dashboard\n├── 1c/Zavod_Avtomatika.cfe  # 7-modul: kengaytma\n└── docker-compose.yml", "side": null, "caption": "Har bir fayl kursning bitta moduliga mos keladi — loyiha aslida siz o'rgangan qismlardan yig'iladi.", "id": "m9-tree"}, {"t": "code", "title": "Shlyuzning asosiy sikli (1-qism)", "lang": "python", "src": "import time, uuid\nfrom scale import read_weight\nfrom camera import snapshot\nfrom plate import read_plate\nfrom sender import send\n\nSTABLE_SEC, MIN_W = 3, 1000\nstart, cur, done = None, None, False\n\nfor stable, w in read_weight():\n    if w < MIN_W:                        # tarozi bo'sh\n        start, cur, done = None, None, False\n        continue\n    if not stable or done:\n        continue", "side": ["<b>MIN_W<\/b> — shu og'irlikdan kam bo'lsa, tarozi bo'sh hisoblanadi.", "<b>done<\/b> — shu mashina allaqachon yozildimi.", "Tarozi bo'shasa, hamma holat tozalanadi."], "caption": null, "id": "m9-main1"}, {"t": "code", "title": "Shlyuzning asosiy sikli (2-qism)", "lang": "python", "src": "if cur is None or abs(w - cur) > 20:\n        cur, start = w, time.time()      # og'irlik o'zgardi\n        continue\n    if time.time() - start >= STABLE_SEC:\n        eid = str(uuid.uuid4())\n        photo = snapshot(eid)\n        plate, conf = read_plate(photo) if photo else (None, 0)\n        send({\"id\": eid, \"scale\": \"SCALE-1\", \"weight\": cur,\n              \"ts\": time.time(), \"plate\": plate})\n        done = True", "side": ["20 kg dan ko'p o'zgarsa — taymer qaytadan boshlanadi.", "3 soniya o'zgarmasa — tortish yoziladi.", "Rasm, raqam va og'irlik bitta ID ostida yuboriladi."], "caption": null, "id": "m9-main2"}, {"t": "flow", "title": "«Outbox» naqshi: hech narsa yo'qolmaydi", "items": [["PaperPlane", "Shlyuz", "Tortishni serverga yuboradi"], ["Database", "Server bazasi", "sent_to_1c = yolg'on"], ["Clock", "Sinxronizator", "Har 30 soniyada 1C ga yuboradi"], ["CheckCircle", "1C javob berdi", "sent_to_1c = rost"]], "caption": "1C bir kun ishlamasa ham, ertasi kuni barcha tortishlar tartib bilan yetib boradi.", "id": "m9-outbox"}, {"t": "code", "title": "Server: 1C bilan sinxronizatsiya", "lang": "python", "src": "URL = \"http://1c-server/zavod/hs/scales/weighing\"\nAUTH = (\"api_user\", os.getenv(\"ONEC_PASS\"))\n\nwhile True:\n    with Session(engine) as s:\n        for r in s.query(WeighingRow).filter_by(sent_to_1c=False).limit(50):\n            body = {\"id\": r.id, \"plate\": r.plate or \"\",\n                    \"weight\": r.weight, \"scale\": r.scale}\n            try:\n                resp = requests.post(URL, json=body, auth=AUTH, timeout=10)\n            except requests.RequestException:\n                break                      # 1C ishlamayapti, keyinroq\n            if resp.status_code in (200, 201):\n                r.sent_to_1c = True\n        s.commit()\n    time.sleep(30)", "side": null, "caption": null, "id": "m9-sync", "notes": "Har 30 soniyada yuborilmagan tortishlar olinadi. 1C javob bermasa, sikl to'xtaydi va keyingi safar qayta urinadi."}, {"t": "code", "title": "Docker Compose: hammasini bitta buyruq bilan", "lang": "yaml", "src": "services:\n  db:\n    image: postgres:16\n    environment: {POSTGRES_USER: zavod, POSTGRES_PASSWORD: \"${DB_PASS}\"}\n    volumes: [pgdata:/var/lib/postgresql/data]\n    restart: always\n  api:\n    build: ./server\n    command: uvicorn api:app --host 0.0.0.0 --port 8000\n    ports: [\"8000:8000\"]\n    restart: always\n  sync:\n    build: ./server\n    command: python sync_1c.py\n    restart: always\nvolumes: {pgdata: {}}", "side": null, "caption": null, "id": "m9-docker", "notes": "docker compose up -d — baza, API va sinxronizator ishga tushadi. restart: always — server qayta yuklansa, o'zi tiklanadi."}, {"t": "steps", "title": "Topshirishdan oldin sinov ro'yxati", "intro": null, "items": [["Oddiy tortish", "Mashina kiradi-chiqadi: bitta yozuv, rasm va 1C hujjati bor."], ["Kabel uzilishi", "Tarozi kabelini sug'uring: shlyuz qayta ulanadi."], ["1C o'chiq", "1C ni to'xtating: tortishlar navbatda turadi, keyin yetib boradi."], ["Internet yo'q", "Server tarmog'ini uzing: lokal navbat ishlaydi."], ["Kechasi", "Raqam IR yoritishda o'qiladimi?"], ["Takroriy yuborish", "Bir voqeani ikki marta yuboring: 1C da bitta hujjat."]], "id": "m9-test"}, {"t": "statement", "title": "Endi haqiqiy tizim: kirish va chiqish tortishi, operator, tahrir tarixi va hisobotlar bilan", "sub": "Oldingi qismlarda o'rganilgan har bir bo'lakni birlashtiramiz va real korxonada uchraydigan murakkab holatlarni hal qilamiz.", "accent": true, "id": "p-intro"}, {"t": "table", "title": "Qabul qilish mezonlari: tizim qachon «tayyor»", "intro": null, "head": ["Mezon", "Qanday tekshiriladi"], "rows": [["Har bir tortish rasm va vaqt bilan saqlanadi", "100 ta ketma-ket tortishda bittasi ham yo'qolmaydi"], ["Raqam avtomatik tanilishi", "Tanilmaganlari operatorga tasdiqqa chiqadi"], ["Kirish va chiqish avtomatik bog'lanadi", "Netto qo'lda hisoblanmaydi"], ["1C da hujjat yaratiladi", "1C o'chiq bo'lsa ham keyin yetib boradi"], ["Har bir qo'lda o'zgarish tarixga yoziladi", "Kim, qachon, nima, nega"], ["Kunlik hisobot va ogohlantirishlar", "Telegram va dashboardda"]], "id": "p-accept"}, {"t": "steps", "title": "Qurish tartibi: 8 bosqich", "intro": null, "items": [["Sozlama", "Barcha parametrlar bitta config faylda."], ["Tarozi moduli", "O'qish, parser, qayta ulanish."], ["Kamera moduli", "Kadr, overlay, qayta urinish."], ["Holat mashinasi", "Bo'sh → kirish → barqaror → yozildi."], ["Server va baza", "API, jadvallar, juftlash."], ["Operator ekrani", "Tasdiqlash va tuzatish."], ["1C sinxronizatsiya", "Outbox, qayta urinish."], ["Hisobot va ogohlantirish", "Dashboard, Telegram."]], "id": "p-plan"}, {"t": "code", "title": "Yagona sozlama fayli", "lang": "json", "src": "{\n  \"tarozi\":   {\"nomi\": \"KIRISH-1\", \"tur\": \"serial\", \"port\": \"COM3\",\n               \"baud\": 9600, \"format\": \"st_gs\"},\n  \"kameralar\": [{\"nomi\": \"old\",  \"url_env\": \"CAM_OLD\"},\n                {\"nomi\": \"orqa\", \"url_env\": \"CAM_BACK\"}],\n  \"qoidalar\": {\"min_vazn\": 1000, \"barqaror_soniya\": 3,\n               \"barqaror_farq\": 20, \"nol_chegara\": 40},\n  \"server\":   {\"url\": \"https://tarozi.korxona.uz\", \"key_env\": \"API_KEY\"},\n  \"navbat\":   \"data/queue.jsonl\",\n  \"rasmlar\":  \"data/photos\"\n}", "side": null, "caption": "Parollar va manzillar bu yerda emas: faqat .env dagi o'zgaruvchi nomlari. Fayl Git da saqlanadi, .env esa yo'q.", "id": "p-config"}, {"t": "code", "title": "Tarozi moduli: qayta ulanadigan o'quvchi", "lang": "python", "src": "class TaroziOquvchi:\n    def __init__(self, soz, parser):\n        self.soz, self.parser = soz, parser\n    def __iter__(self):\n        while True:\n            try:\n                with serial.Serial(self.soz[\"port\"], self.soz[\"baud\"],\n                                   timeout=1) as ser:\n                    while True:\n                        qator = ser.readline().decode(\"ascii\", \"ignore\")\n                        natija = self.parser(qator)\n                        if natija:\n                            yield natija\n            except serial.SerialException as e:\n                logging.error(\"Tarozi uzildi: %s\", e)\n                time.sleep(5)", "side": null, "caption": null, "id": "p-scale"}, {"t": "code", "title": "Holat mashinasi (1): holatlar va ma'lumot", "lang": "python", "src": "from enum import Enum\n\nclass Holat(Enum):\n    BOSH = 1        # tarozida hech narsa yo'q\n    KIRISH = 2      # og'irlik o'zgarmoqda\n    BARQAROR = 3    # kerakli vaqt o'zgarmadi\n    YOZILDI = 4     # tortish saqlandi, chiqishni kutyapmiz\n\nclass Mashina:\n    def __init__(self, q):\n        self.q = q\n        self.holat = Holat.BOSH\n        self.qiymat = None\n        self.boshlandi = None", "side": ["<b>Enum<\/b> — holatlarning aniq ro'yxati: xato yozish imkoni yo'q.", "Har bir holat faqat ma'lum holatlarga o'ta oladi.", "Bu yondashuv tarozi mantiqini tushunarli va sinovga qulay qiladi."], "caption": null, "id": "p-state"}, {"t": "code", "title": "Holat mashinasi (2): o'tishlar", "lang": "python", "src": "def yangi(self, barqaror, v):\n        q = self.q\n        if v  q[\"barqaror_farq\"]:\n            self.holat, self.qiymat = Holat.KIRISH, v\n            self.boshlandi = time.time()\n            return None\n        if barqaror and time.time() - self.boshlandi >= q[\"barqaror_soniya\"]:\n            self.holat = Holat.YOZILDI\n            return self.qiymat          # tashqariga: «tortish bo'ldi»\n        return None", "side": null, "caption": null, "i
