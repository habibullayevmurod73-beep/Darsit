Tarozi hisobi» konfiguratsiyasi"], ["8", "1C integratsiya", "HTTP-servis orqali hujjat yaratish"], ["9", "Kamera va OpenCV", "Tortishga rasm biriktirish"], ["10", "Linux va Docker", "Tizim serverda ishlaydi"], ["11", "Telegram bot", "Kunlik hisobot va ogohlantirishlar"], ["12", "Yakuniy loyiha", "To'liq tizim, hujjat va video"]], "id": "c2-plan", "notes": "Kuniga 1–2 soat bilan reja real. Har hafta oxirida ishlaydigan natija bo'lishi muhim — faqat o'qish emas, qurish."}, {"t": "cards", "title": "Qanday samarali o'rganish kerak", "intro": null, "items": [["Wrench", "Qurib o'rganing", "Har bir mavzudan keyin kichik ishlaydigan narsa yarating."], ["Book", "Rasmiy hujjatlar", "Maqola va videolardan tashqari — kutubxona va 1C ning o'z hujjatlari."], ["Search", "Xatolarni o'qing", "Xato xabari — eng yaxshi o'qituvchi. Uni diqqat bilan o'qish odatini qiling."], ["Users", "Hamjamiyat", "Forum va guruhlarda savol bering, boshqalarga javob bering."]], "id": "c2-learn"}, {"t": "steps", "title": "Portfolio loyihasini tayyorlash", "intro": null, "items": [["Loyiha", "Aqlli tarozi: simulyator, API, dashboard, 1C integratsiya, bot."], ["README", "Nima qiladi, arxitektura sxemasi, qanday ishga tushadi."], ["Video", "2–3 daqiqalik ekran yozuvi: tortish → 1C → Telegram."], ["Kod sifati", "Tushunarli nomlar, testlar, .env.example."], ["Hujjat", "Qisqa texnik tavsif va operator qo'llanmasi."]], "id": "c2-portfolio"}, {"t": "table", "title": "Suhbatda nimalar so'raladi", "intro": null, "head": ["Savol turi", "Misol", "Nimani tekshiradi"], "rows": [["Asoslar", "SQL da JOIN nima?", "Nazariy bilim"], ["Amaliyot", "COM-portdan ma'lumot kelmayapti — nima qilasiz?", "Muammoni hal qilish tartibi"], ["1C", "Записать va Провести farqi?", "Platformani tushunish"], ["Arxitektura", "1C o'chsa tortishlar yo'qolmasligi uchun?", "Tizimli fikrlash"], ["Loyiha", "Eng qiyin muammoingiz nima edi?", "Haqiqiy tajriba"]], "id": "c2-interview"}, {"t": "cards", "title": "Buyurtmachi bilan ishlash", "intro": null, "items": [["Book", "Texnik topshiriq", "Nima qilinadi, nima qilinmaydi, qabul qilish mezonlari — yozma."], ["Clock", "Muddat va bosqichlar", "Katta ishni bosqichlarga bo'ling, har birining natijasi ko'rinsin."], ["CheckCircle", "Qabul qilish", "Mezonlar bo'yicha birga sinov va imzolangan dalolatnoma."], ["Wrench", "Qo'llab-quvvatlash", "Ishga tushgandan keyingi xizmat shartlari oldindan kelishiladi."]], "id": "c2-client"}, {"t": "steps", "title": "Texnik topshiriq tuzilishi", "intro": null, "items": [["Maqsad", "Qaysi muammo hal qilinadi."], ["Hozirgi va kelajakdagi jarayon", "Qanday edi va qanday bo'ladi."], ["Funksiyalar", "Aniq ro'yxat, har biri tekshirib bo'ladigan."], ["Uskunalar va integratsiya", "Qurilmalar, 1C versiyasi, tarmoq."], ["Cheklovlar", "Loyihaga kirmaydigan narsalar."], ["Qabul qilish mezonlari", "Qachon ish tugagan hisoblanadi."]], "id": "c2-tz"}, {"t": "cards", "title": "Kasbiy odob", "intro": null, "items": [["Lock", "Ma'lumotga hurmat", "Korxona ma'lumotlari va parollarini hech qachon tashqariga olib chiqmang."], ["Verified", "Halollik", "Bilmagan narsani «bilaman» demang; muddat bo'lmasa, oldindan ayting."], ["Book", "Hujjat qoldiring", "Sizdan keyin keladigan odam tizimni tushuna olsin."]], "id": "c2-ethics"}, {"t": "quiz", "id": "xq-c2-0", "q": "Ish qachon tugagani nima bilan aniqlanadi?", "opts": ["Qabul qilish mezonlari bilan", "Kayfiyat bilan", "Sarflangan soatlar bilan"], "a": 0, "expl": "Mezonlar texnik topshiriqda oldindan yoziladi."}]}]</script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<script>
(function(){
"use strict";
const MODS = JSON.parse(document.getElementById("courseData").textContent);
const STAGES = ["Qurilmalar","Shlyuz","Server, API","1C","AI","Foydalanuvchi"];
const ICONS = {Tool:"wrench",Wrench:"wrench",Globe:"globe",Database:"database",Settings:"settings",Lightbulb:"lightbulb",
  Verified:"badge-check",Search:"search",Code:"code",Chart:"bar-chart-3",Users:"users",Book:"book-open",Cloud:"cloud",
  Key:"key",Lock:"lock",Star:"star",Check:"check",CheckCircle:"check-circle",Activity:"activity",Clock:"clock",
  Warning:"alert-triangle",Link:"link",Lightning:"zap",Home:"home",Play:"play",PaperPlane:"send",Trust:"shield-check",
  GraduationCap:"graduation-cap",Chat:"message-circle"};

/* ---------- state ---------- */
const KEY = "avt-platforma-v1";
let S = {done:{}, quiz:{}, prac:{}, exam:null, last:null, theme:"auto"};
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) S = Object.assign(S, s); } catch(e) {}
function save(){ let ok = true; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { ok = false; } const s = document.getElementById("savedState"); if (s) s.textContent = ok ? "Saqlangan" : "Saqlanmadi"; }

/* ---------- build lessons ---------- */
const ALLQ = [];
MODS.forEach(m => {
  const content = [], quizzes = [], practice = [];
  m.blocks.forEach(b => {
    if (b.t === "quiz") { quizzes.push(b); ALLQ.push({b, m}); }
    else if (b.t === "steps" && /practice|exercises/.test(b.id)) practice.push(b);
    else content.push(b);
  });
  const lessons = []; let cur = [];
  content.forEach(b => {
    if (cur.length && (b.t === "statement" || cur.length >= 6)) { lessons.push(cur); cur = []; }
    cur.push(b);
  });
  if (cur.length) lessons.push(cur);
  m.lessons = lessons.map((bl, i) => {
    const first = bl.find(x => x.t !== "statement") || bl[0];
    return {key: m.id + ":" + i, idx: i, blocks: bl, title: strip(first.title || "Dars")};
  });
  m.quizzes = quizzes; m.practice = practice;
});
const BYID = {}; MODS.forEach(m => BYID[m.id] = m);

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function strip(h){ const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent; }
function icon(name){ return `<i data-lucide="${ICONS[name] || "circle"}"></i>`; }
function modLabel(m){ return m.num == null ? "Kirish" : (m.id === "py" ? "Python" : m.num + "-modul"); }
function modNum(m){ return m.num == null ? "•" : (m.id === "py" ? "Py" : m.num); }
function modProgress(m){
  const n = m.lessons.length; if (!n) return 0;
  return Math.round(100 * m.lessons.filter(l => S.done[l.key]).length / n);
}
function totalProgress(){
  let a = 0, d = 0; MODS.forEach(m => m.lessons.forEach(l => { a++; if (S.done[l.key]) d++; }));
  return {a, d, p: a ? Math.round(100 * d / a) : 0};
}
function chainHtml(active){
  return `<div class="chain" aria-label="Tizim zanjiri">` + STAGES.map((s,i) =>
    (i ? `<em aria-hidden="true">›</em>` : "") + `<span class="${active.includes(i) ? "on" : ""}">${s}</span>`).join("") + `</div>`;
}
function highlight(src, lang){
  return src.split("\n").map(line => {
    const t = line.trim();
    const e = esc(line);
    if (t.startsWith("#") || t.startsWith("//") || t.startsWith("--")) return `<span class="cm">${e}</span>`;
    const ci = (lang === "python" || lang === "bash" || lang === "yaml" || lang === "text") ? line.indexOf("  #") : -1;
    if (ci > 0) return esc(line.slice(0, ci)) + `<span class="cm">${esc(line.slice(ci))}</span>`;
    const ci2 = line.indexOf(" // ");
    if (ci2 > 0 && (lang === "1C" || lang === "javascript")) return esc(line.slice(0, ci2)) + `<span class="cm">${esc(line.slice(ci2))}</span>`;
    return e;
  }).join("\n");
}

/* ---------- block renderers ---------- */
function notesHtml(b){ return b.notes ? `<details class="notes"><summary>Batafsil izoh</summary><p>${esc(b.notes)}</p></details>` : ""; }
function blockHtml(b){
  const id = `b-${esc(b.id)}`;
  const h = b.title ? `<h2>${esc(b.title)}</h2>` : "";
  const intro = b.intro ? `<p class="intro">${b.intro}</p>` : "";
  switch (b.t) {
    case "cards": return `<section class="block" id="${id}">${h}${intro}<div class="cards">` +
      b.items.map(([ic,t,p]) => `<div class="card"><div class="ic">${icon(ic)}</div><h3>${t}</h3><p>${p}</p></div>`).join("") + `</div>${notesHtml(b)}</section>`;
    case "table": return `<section class="block" id="${id}">${h}${intro}<div class="tablewrap"><table><tr>` +
      b.head.map(x => `<th>${esc(x)}</th>`).join("") + `</tr>` +
      b.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("") + `</table></div>${notesHtml(b)}</section>`;
    case "code": {
      const src = b.src.split("\n").map(l => l.replace(/\s+$/,"")).join("\n");
      const box = `<div class="codebox"><div class="codebar"><span>${esc(b.lang)}</span><button data-copy>Nusxalash</button></div><pre><code>${highlight(src, b.lang)}</code></pre></div>`;
      const side = b.side ? `<div class="side-notes">${b.side.map(s => `<div>${s}</div>`).join("")}</div>` : "";
      return `<section class="block" id="${id}">${h}` + (side ? `<div class="code-grid">${box}${side}</div>` : box) +
        (b.caption ? `<p class="caption">${b.caption}</p>` : "") + notesHtml(b) + `</section>`;
    }
    case "steps": return `<section class="block" id="${id}">${h}${intro}<ol class="steps">` +
      b.items.map(([t,p]) => `<li><div><b>${t}</b><span>${p}</span></div></li>`).join("") + `</ol>${notesHtml(b)}</section>`;
    case "flow": return `<section class="block" id="${id}">${h}<div class="flow">` +
      b.items.map(([ic,t,p], i) => (i ? `<div class="arr" aria-hidden="true">›</div>` : "") +
        `<div class="fstep"><div class="ic" style="color:var(--blue)">${icon(ic)}</div><h3>${t}</h3><p>${p}</p></div>`).join("") +
      `</div>${b.caption ? `<p class="caption">${b.caption}</p>` : ""}${notesHtml(b)}</section>`;
    case "stack": return `<section class="block" id="${id}">${h}${intro}<div class="stack">` +
      b.rows.map(([a,c]) => `<div><b>${a}</b><span>${c}</span></div>`).join("") + `</div>${notesHtml(b)}</section>`;
    case "compare": return `<section class="block" id="${id}">${h}<div class="compare">` +
      [b.left, b.right].map(([t, items]) => `<div><h3>${esc(t)}</h3><ul>${items.map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("") +
      `</div>${notesHtml(b)}</section>`;
    case "statement": return `<section class="block bare" id="${id}"><div class="statement ${b.accent ? "accent" : ""}"><h2>${esc(b.title)}</h2>${b.sub ? `<p>${b.sub}</p>` : ""}</div>${notesHtml(b)}</section>`;
    case "term": return `<section class="block bare" id="${id}"><div class="term"><h2>${esc(b.title)}</h2><p class="def">${esc(b.def)}</p><div class="term-grid">` +
      `<div><b>Hayotiy o'xshatish</b><p>${b.analogy}</p></div><div><b>Amalda, korxonada</b><p>${b.example}</p></div></div></div>${notesHtml(b)}</section>`;
    case "visual": return `<section class="block" id="${id}"><div class="visual" role="img" aria-label="${esc(b.title || "Chizma")}"><div class="vis-in">${b.html}</div></div>${notesHtml(b)}</section>`;
    case "quiz": return quizHtml(b);
  }
  return "";
}
function quizHtml(b, key){
  const k = key || b.id;
  const ans = S.quiz[k];
  return `<div class="quiz" data-q="${esc(k)}" data-a="${b.a}"><div class="q">${esc(b.q)}</div>` +
    b.opts.map((o,i) => {
      let c = "opt";
      if (ans != null) { if (i === b.a) c += " right"; else if (i === ans) c += " wrong"; }
      return `<button class="${c}" data-i="${i}" ${ans != null ? "disabled" : ""}>${"ABC"[i]}. ${esc(o)}</button>`;
    }).join("") +
    (ans != null ? `<div class="expl">${ans === b.a ? "To'g'ri. " : "Noto'g'ri. "}${esc(b.expl)}</div>` : "") + `</div>`;
}

/* ---------- navigation ---------- */
const NAV = [["#/","home","Bosh sahifa"],["#/gym","dumbbell","Mashqxona"],["#/projects","folder-kanban","Loyihalar"],["#/lab","flask-conical","Laboratoriya"],["#/exam","graduation-cap","Yakuniy imtihon"],["#/glossary","book-open","Lug'at"],["#/cheats","file-text","Shpargalkalar"],["#/me","user","Mening sahifam"],["#/cert","award","Sertifikat"]];
function ringHtml(p, size){ return `<span class="ring ${size || ""}" style="--p:${p}"><span>${p}%</span></span>`; }
function viewModule(m){
  const p = modProgress(m);

    <h2 class="sec-h">Darslar</h2><ol class="timeline">`;
  m.lessons.forEach(l => {
    const d = S.done[l.key], cur = !d && l.idx === fu;

  }
  return html + `</ol>`;
}
function firstUndone(m){ const l = m.lessons.find(x => !S.done[x.key]); return l ? l.idx : 0; }
function nextTarget(m, idx){
  if (idx + 1 < m.lessons.length) return [`#/l/${m.id}/${idx + 1}`, "Keyingi dars"];
  if (m.practice.length) return [`#/practice/${m.id}`, "Amaliy mashqlarga o'tish"];
  if (m.quizzes.length) return [`#/test/${m.id}`, "Modul testiga o'tish"];
  return nextModule(m);
}
function nextModule(m){
  const i = MODS.indexOf(m); const n = MODS[i + 1];
  return n ? [`#/m/${n.id}`, "Keyingi bo'lim: " + n.title] : ["#/exam", "Yakuniy imtihon"];
}

  return html;

function viewSearch(q){
  q = (q || "").trim();
  let html = `<h1>Qidiruv</h1>`;
  if (q.length < 2) return html + `<p class="lead">Kamida 2 ta belgi yozing. Masalan: «RS-485», «HTTP-servis», «overfitting».</p>`;
  const ql = q.toLowerCase(); const res = [];
  MODS.forEach(m => m.lessons.forEach(l => l.blocks.forEach(b => {
    const txt = blockText(b); const i = txt.toLowerCase().indexOf(ql);
    if (i >= 0) res.push({m, l, b, snip: txt.slice(Math.max(0, i - 60), i + 120), i});
  })));
  EXTRA.code.forEach((c, i) => { const t = c.title + " " + c.desc + " " + c.src; const k = t.toLowerCase().indexOf(ql);
    if (k >= 0) res.unshift({ext: true, href: "#/code", title: c.title, sub: "Kod kutubxonasi", snip: t.slice(Math.max(0, k - 60), k + 120)}); });
  EXTRA.cases.forEach(c => { const t = [c.t, c.belgi, c.sabab, c.yechim].join(" "); const k = t.toLowerCase().indexOf(ql);
    if (k >= 0) res.unshift({ext: true, href: "#/cases", title: c.t, sub: "Amaliy holatlar", snip: t.slice(Math.max(0, k - 60), k + 120)}); });
  EXTRA.faq.forEach(([q2, a2]) => { const t = q2 + " " + a2; const k = t.toLowerCase().indexOf(ql);
    if (k >= 0) res.unshift({ext: true, href: "#/faq", title: q2, sub: "Savol-javob", snip: t.slice(Math.max(0, k - 60), k + 120)}); });
  html += `<p class="lead">«${esc(q)}» bo'yicha ${res.length} ta natija.</p>`;
  res.slice(0, 80).forEach(r => {
    const s = esc(r.snip).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), x => `<mark>${x}</mark>`);
    html += r.ext ? `<a class="result" href="${r.href}"><b>${esc(r.title)}</b><small>${r.sub}</small><span>…${s}…</span></a>`
      : `<a class="result" href="#/l/${r.m.id}/${r.l.idx}/${r.b.id}"><b>${esc(strip(r.b.title || r.l.title))}</b><small>${esc(r.m.title)}, dars ${r.l.idx + 1}</small><span>…${s}…</span></a>`;
  });
  if (!res.length) html += `<p>Hech narsa topilmadi. Boshqa so'z bilan urinib ko'ring yoki lug'atga qarang.</p>`;
  return html;
}
function blockText(b){
  const parts = [b.title, b.intro, b.sub, b.def, b.analogy, b.example, b.caption, b.notes, b.src, b.lang];
  (b.items || []).forEach(it => parts.push(...it));
  (b.rows || []).forEach(r => parts.push(...r));
  (b.side || []).forEach(s => parts.push(s));
  if (b.left) parts.push(b.left[0], ...b.left[1], b.right[0], ...b.right[1]);
  if (b.t === "visual") parts.push(b.html);
  return strip(parts.filter(Boolean).join(" · ")).replace(/\s+/g, " ");
}

/* ---------- indicator / simulator engine ---------- */
function indicatorHtml(p){
  return `<div class="indicator" id="${p}-ind"><div class="ind-top"><span>TAROZI-1 indikatori</span><span>d = 20 kg</span></div>
    <div class="ind-screen"><span class="ind-digits" id="${p}-dig">0</span><span class="ind-unit">kg</span></div>
    <div class="ind-lamps"><span class="lamp st" id="${p}-st"><i></i>ST</span><span class="lamp" id="${p}-us"><i></i>US</span><span class="lamp" id="${p}-gs"><i></i>GS</span></div>
    <div class="ind-raw" id="${p}-raw" aria-label="Portga yuborilayotgan qatorlar"></div>
    <div class="ind-state" id="${p}-state">Shlyuz: <b>kutmoqda</b></div></div>`;
}
const rnd = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
const q20 = x => Math.max(0, Math.round(x / 20) * 20);
function* scaleGen(cfg){
  while (true) {
    for (let i = 0; i < 4; i++) yield ["ST", 0];
    for (let v = 0; v < 12000; v += 1500) yield ["US", v];
    const t = rnd(9000, 26000);
    for (let i = 0; i < 8; i++) yield ["US", q20(t + rnd(-200, 200))];
    for (let i = 0; i < 16; i++) { const n = cfg.noise; const w = q20(t + rnd(-n, n)); yield [Math.abs(w - t) <= 20 ? "ST" : "US", w]; }
    for (let v = t; v > 0; v -= 3000) yield ["US", q20(v)];
  }
}
const SIMS = {}; const SIMST = {};
function startSim(p, cfg){
  stopSim(p);
  const g = scaleGen(cfg); const raw = [];
  SIMST[p] = SIMST[p] || {holat: "BOSH", qiymat: null, start: 0, rec: []};
  const st = SIMST[p];
  const fmtN = n => String(n).padStart(7, "0");
  const tick = () => {
    const [s, w] = g.next().value;
    const dig = document.getElementById(p + "-dig"); if (!dig) return stopSim(p);
    dig.textContent = w.toLocaleString("ru-RU");
    document.getElementById(p + "-st").classList.toggle("on", s === "ST");
    document.getElementById(p + "-us").classList.toggle("on", s === "US");
    document.getElementById(p + "-gs").classList.add("on");
    raw.push(`${s},GS,+${fmtN(w)}kg`); if (raw.length > 4) raw.shift();
    document.getElementById(p + "-raw").textContent = raw.join("\n");
    // holat mashinasi
    const now = Date.now() / 1000;
    let msg;
    if (w < cfg.min) { st.holat = "BOSH"; st.qiymat = null; msg = "tarozi bo'sh"; }
    else if (st.holat === "YOZILDI") { msg = "yozildi, mashina chiqishini kutmoqda"; }
    else if (st.qiymat == null || Math.abs(w - st.qiymat) > 20) { st.holat = "KIRISH"; st.qiymat = w; st.start = now; msg = "og'irlik o'zgarmoqda"; }
    else if (s === "ST" && now - st.start >= cfg.stable) {
      st.holat = "YOZILDI";
      const t = new Date().toLocaleTimeString("uz-UZ");
      st.rec.unshift(`${t}  TORTILDI  ${w.toLocaleString("ru-RU")} kg`);
      msg = "tortish yozildi!";
      const log = document.getElementById("simLog"); if (log && p === "lab") log.textContent = st.rec.join("\n");
    } else { st.holat = "BARQAROR"; msg = `barqaror: ${Math.min(cfg.stable, now - st.start).toFixed(1)} / ${cfg.stable} s`; }
    document.getElementById(p + "-state").innerHTML = `Shlyuz: <b>${msg}</b>`;
    const badge = document.getElementById("simState");
    if (badge && p === "lab") {
      const names = {BOSH: "BO'SH", KIRISH: "KIRISH", BARQAROR: "BARQAROR", YOZILDI: "YOZILDI"};
      badge.textContent = names[st.holat]; badge.className = "badge " + (st.holat === "YOZILDI" ? "y" : st.holat === "BARQAROR" ? "k" : "");
    }
  };
  tick();
  SIMS[p] = {timer: setInterval(tick, 400), cfg};
}
function stopSim(p){ if (SIMS[p]) { clearInterval(SIMS[p].timer); delete SIMS[p]; } }

function initLab(){
  const cfg = {noise: 80, stable: 3, min: 1000};
  delete SIMST.lab;
  startSim("lab", cfg);
  const bind = (id, out, key) => { const el = document.getElementById(id); el.addEventListener("input", () => { cfg[key] = +el.value; document.getElementById(out).textContent = el.value; }); };
  bind("sNoise", "vNoise", "noise"); bind("sStable", "vStable", "stable"); bind("sMin", "vMin", "min");
  const pb = document.getElementById("simPause");
  pb.addEventListener("click", () => {
    if (SIMS.lab) { stopSim("lab"); pb.textContent = "Davom ettirish"; }
    else { startSim("lab", cfg); pb.textContent = "To'xtatish"; }
  });
  // regex
  const runRe = () => {
    const out = document.getElementById("reOut");
    let re;
    try { re = new RegExp(document.getElementById("reIn").value); }
    catch(e) { out.textContent = "Regex xato: " + e.message; return; }
    out.textContent = document.getElementById("reLines").value.split("\n").filter(Boolean).map(l => {
      const m = l.match(re);
      if (!m) return `✗ ${l}\n   mos kelmadi`;
      return `✓ ${l}\n   ` + m.slice(1).map((g,i) => `guruh ${i + 1}: ${g}`).join(", ");
    }).join("\n");
  };
  ["reIn","reLines"].forEach(id => document.getElementById(id).addEventListener("input", runRe)); runRe();
  // modbus
  const pr = v => { v = v.trim(); const n = /^0x/i.test(v) ? parseInt(v, 16) : parseInt(v, 10); return Number.isFinite(n) && n >= 0 && n <= 65535 ? n : null; };
  const runMb = () => {
    const hi = pr(document.getElementById("mbHi").value), lo = pr(document.getElementById("mbLo").value);
    const out = document.getElementById("mbOut");
    if (hi == null || lo == null) { out.textContent = "Har bir registr 0 dan 65535 gacha bo'lishi kerak (yoki 0x0000–0xFFFF)."; return; }
    const dv = new DataView(new ArrayBuffer(4));

function shuffled(arr, seed){
  const a = arr.map((x,i) => i); let s = seed;
  for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

}

function gymClick(e){
  const t = e.target;
  let id;
  if ((id = t.dataset.checkFill)) {
    const task = GYM.fill.find(x => x.id === id);
    const v = document.querySelector(`[data-fill="${id}"]`).value.trim().toLowerCase();
    const ok = task.ans.some(a => a.toLowerCase() === v);
    gymFeedback(id, ok, ok ? "To'g'ri!" : v ? `«${v}» emas. Yana urinib ko'ring yoki «Yordam» ni bosing.` : "Avval javobni yozing.");
    return true;
  }
  if ((id = t.dataset.hint)) {
    const task = GYM.fill.find(x => x.id === id);
    const fb = document.getElementById("fb-" + id); fb.hidden = false; fb.style.background = ""; fb.textContent = "Yordam: " + task.hint;
    return true;
  }
  const pl = t.closest(".pl");
  if (pl && pl.dataset.pick) { const k = pl.dataset.pick; S.pars[k] = (S.pars[k] || []).concat(+pl.dataset.i); save(); render(true); return true; }
  if (pl && pl.dataset.unpick) { const k = pl.dataset.unpick; S.pars[k] = (S.pars[k] || []).filter(x => x !== +pl.dataset.i); save(); render(true); return true; }
  if ((id = t.dataset.resetPars)) { S.pars[id] = []; save(); render(true); return true; }
  if ((id = t.dataset.checkPars)) {
    const task = GYM.parsons.find(x => x.id === id); const ch = S.pars[id] || [];
    if (ch.length < task.lines.length) { gymFeedback(id, false, `Hali ${task.lines.length - ch.length} ta qator joylanmagan.`); return true; }
    const firstBad = ch.findIndex((x,i) => task.lines[x] !== task.lines[i]);
    gymFeedback(id, firstBad < 0, firstBad < 0 ? "To'g'ri tartib!" : `${firstBad + 1}-qatordan boshlab tartib noto'g'ri. Shu qatordan pastini qaytarib, qayta urinib ko'ring.`);
    return true;
  }
  if ((id = t.dataset.checkRe)) {
    const task = GYM.regex.find(x => x.id === id);
    const src = document.querySelector(`[data-re="${id}"]`).value;
    S.reAns = S.reAns || {}; S.reAns[id] = src; save();
    let re; try { re = new RegExp(src); } catch(err) { gymFeedback(id, false, "Regex xato: " + err.message); return true; }
    if (!src) { gymFeedback(id, false, "Avval regex yozing."); return true; }
    const missed = task.yes.filter(s => !re.test(s)), wrong = task.no.filter(s => re.test(s));
    const show = s => s.replace(/\u0002/g, "␂").replace(/\u0003/g, "␃");
    const ok = !missed.length && !wrong.length;
    gymFeedback(id, ok, ok ? "Barcha namunalar to'g'ri!" :
      (missed.length ? `Mos kelmadi: ${missed.map(show).join(", ")}. ` : "") + (wrong.length ? `Rad etilmadi: ${wrong.map(show).join(", ")}.` : ""));
    return true;
  }
  if ((id = t.dataset.checkJson)) {
    const src = document.querySelector(`[data-json="${id}"]`).value; S.jsonAns = src; save();
    let d; try { d = JSON.parse(src); } catch(err) { gymFeedback(id, false, "400 Bad Request — JSON o'qilmadi: " + err.message); return true; }
    const errs = [];
    if (typeof d !== "object" || d === null || Array.isArray(d)) errs.push("tana obyekt bo'lishi kerak: { … }");
    else {
      if (typeof d.id !== "string" || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(d.id)) errs.push("id: UUID formatida bo'lishi kerak, masalan 5f0c2a9e-7d1b-4c1e-9a55-2b8f6f1c3d10");
      if (typeof d.scale !== "string" || d.scale.length < 1 || d.scale.length > 20) errs.push("scale: 1–20 belgili matn");
      if (!Number.isInteger(d.weight)) errs.push("weight: butun son (qo'shtirnoqsiz)");
      else if (d.weight < 0 || d.weight > 100000) errs.push("weight: 0 dan 100 000 gacha");

    }
    gymFeedback(id, !errs.length, errs.length ? "422 Unprocessable Entity:\n• " + errs.join("\n• ") : "201 Created — server qabul qildi.");
    return true;
  }
  return false;
}

function modMinutes(m){
  const lessons = m.lessons.reduce((s,l) => s + l.blocks.length * 6, 0);
  return lessons + (m.quizzes.length ? 15 : 0) + (m.practice.length ? 120 : 0);
}
const OY = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
function fmtDate(d){ return `${d.getDate()}-${OY[d.getMonth()]}, ${d.getFullYear()}`; }
function planRows(hours, start){
  const perDay = hours * 60 / 7; let t = new Date(start);
  return MODS.map(m => {
    const left = Math.round(modMinutes(m) * (1 - modProgress(m) / 100));
    const s = new Date(t); t = new Date(t.getTime() + Math.max(1, Math.ceil(left / perDay)) * 864e5);
    return {m, left, s, e: new Date(t.getTime() - 864e5)};
  });
}
function wrongQuizzes(){
  const out = [];
  MODS.forEach(m => m.quizzes.forEach(b => { const a = S.quiz[b.id]; if (a != null && a !== b.a) out.push({b, m}); }));
  return out;
}

      S = {done:{}, quiz:{}, prac:{}, exam:null, last:null, theme:S.theme}; save(); render();
    }
  });
  const h = document.getElementById("plHours"), st = document.getElementById("plStart");
  h.addEventListener("change", () => { S.plan.hours = +h.value; save(); render(true); });
  h.addEventListener("input", () => { document.getElementById("plHv").textContent = h.value; });
  st.addEventListener("change", () => { if (st.value) { S.plan.start = st.value; save(); render(true); } });
  document.getElementById("exCopy").addEventListener("click", e => {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const done = () => { e.target.textContent = "Nusxalandi"; setTimeout(() => e.target.textContent = "Progress kodini nusxalash", 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, () => { document.getElementById("imCode").value = code; });
    else document.getElementById("imCode").value = code;
  });
  document.getElementById("imLoad").addEventListener("click", () => {
    const msg = document.getElementById("imMsg"); msg.hidden = false;
    try {
      const data = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("imCode").value.trim()))));
      if (typeof data !== "object" || !data.done) throw new Error("format");
      if (!confirm("Shu qurilmadagi progress olib kelingan kod bilan almashtiriladi. Davom etasizmi?")) { msg.hidden = true; return; }
      S = Object.assign({done:{}, quiz:{}, prac:{}}, data); save(); applyTheme();
      msg.textContent = "Progress yuklandi."; msg.style.background = "var(--ok-soft)";
      setTimeout(() => render(), 700);
    } catch(err) {
      msg.textContent = "Kod o'qilmadi. Uni to'liq, bo'sh joylarsiz nusxalaganingizni tekshiring."; msg.style.background = "var(--bad-soft)";
    }
  });
}

/* ---------- activity ---------- */
function dayKey(d){ return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function markAct(){ S.act = S.act || {}; const k = dayKey(new Date()); S.act[k] = (S.act[k] || 0) + 1; save(); }
const HAFTA = ["yakshanba","dushanba","seshanba","chorshanba","payshanba","juma","shanba"];
const QISQA = ["Du","Se","Ch","Pa","Ju","Sh","Ya"];
let WEEK_OFF = 0;
function weekHtml(){
  S.act = S.act || {};
  const keys = Object.keys(S.act).filter(k => S.act[k] > 0).sort();
  const first = keys[0] || null;
  const today = new Date(); today.setHours(0,0,0,0);
  const mon = new Date(today); mon.setDate(today.getDate() - ((today.getDay() + 6) % 7) + WEEK_OFF * 7);
  let cells = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const k = dayKey(d); const n = S.act[k] || 0;
    let c = "";
    if (n) c = "done"; else if (first && k >= first && d < today) c = "skip";
    if (d.getTime() === today.getTime()) c += " now";
    cells += `<div class="day ${c}" title="${k}: ${n} ta ish"><span>${QISQA[i]}</span><i>${d.getDate()}</i></div>`;
  }
  const label = WEEK_OFF === 0 ? "Bu hafta" : WEEK_OFF === -1 ? "O'tgan hafta" : `${fmtDate(mon)}`;
  return {cells, label};
}

/* ---------- takrorlash (intervalli eslatma) ---------- */
const INTERVALS = [1, 3, 7, 14, 30];
let RV_OPEN = false;
function today(){ return Math.floor(Date.now() / 864e5); }
function reviewAll(){
  const items = [];
  flashTerms().forEach(t => items.push({k: "t:" + strip(t.title), kind: "term", b: t}));
  MODS.forEach(m => m.quizzes.forEach(b => {
    const a = S.quiz[b.id];
    if (a != null && a !== b.a) items.push({k: "q:" + b.id, kind: "quiz", b});
  }));
  return items;
}
function reviewDue(){
  S.rev = S.rev || {};
  const t = today();
  return reviewAll().filter(x => !S.rev[x.k] || S.rev[x.k].due <= t);
}
function grade(k, good){
  S.rev = S.rev || {};
  const rv = S.rev[k] || {box: 0, due: 0};
  const box = good ? Math.min(rv.box + 1, INTERVALS.length - 1) : 0;
  S.rev[k] = {box, due: today() + INTERVALS[box]};
  save();
}
function viewReview(){
  const all = reviewAll(), due = reviewDue();

  if (!all.length) return html + `<div class="panel cont"><h2>Takrorlash uchun hech narsa yo'q</h2><p>Lug'at atamalari bo'yicha va modul testlarida xato qilsangiz, shu yerda paydo bo'ladi.</p><a class="btn btn-primary" href="#/glossary">Lug'atga o'tish</a></div>`;
  if (!due.length) {

    return html + `<div class="panel cont"><h2>Bugungi takrorlash tugadi</h2><p>Jami ${all.length} ta element. Keyingi takrorlash ${Math.max(0, next)} kundan keyin.</p></div>`;
  }

                    : `<p class="facts">Avval o'zingiz ta'rifni eslang, keyin ko'rsating.</p>`;
  } else {

function streak(){
  S.act = S.act || {};
  const d = new Date(); let k = dayKey(d); let n = 0;
  if (!S.act[k]) { d.setDate(d.getDate() - 1); k = dayKey(d); }
  while (S.act[k]) { n++; d.setDate(d.getDate() - 1); k = dayKey(d); }
  return n;
}

let PY = null;
function loadPy(){
  if (PY) return Promise.resolve(PY);
  const fail = () => new Error("Python yuklanmadi. Internet aloqasini tekshiring yoki sahifani yangilang.");
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(fail()), 60000);
    const start = () => {
      if (typeof window.loadPyodide !== "function") { clearTimeout(timer); return reject(fail()); }
      window.loadPyodide({indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"})
        .then(p => { clearTimeout(timer); PY = p; resolve(p); }, err => { clearTimeout(timer); reject(err); });
    };
    if (typeof window.loadPyodide === "function") return start();
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
    s.onload = start;
    s.onerror = () => { clearTimeout(timer); reject(fail()); };
    document.head.appendChild(s);
  });
}
function runPy(){
  const out = document.getElementById("pyOut");
  const code = document.getElementById("pyCode").value;
  out.textContent = "Yuklanmoqda…";
  loadPy().then(py => {
    let buf = "";
    py.setStdout({batched: s => { buf += s + "\n"; }});
    py.setStderr({batched: s => { buf += s + "\n"; }});
    try { py.runPython(code); out.textContent = buf || "(natija yo'q)"; }
    catch(e) { out.textContent = buf + String(e.message || e); }
  }).catch(e => { out.textContent = String(e.message || e); });
}

let CSVD = null;
function viewData(){
  return `<p class="lead">Telefon yoki kompyuteringizdagi CSV faylni yuklang (masalan, tortishlar eksporti). Dastur mashina bo'yicha tortishlar soni va jami og'irlikni hisoblaydi.</p>

    <div class="row"><button class="btn btn-ghost" data-csvsample="1">Namuna fayl yuklab olish</button></div>
    <div id="csvCols"></div><div id="csvOut"></div></div>`;

function parseCsv(text){
  const lines = text.replace(/\r/g, "").split("\n").filter(l => l.trim());
  if (!lines.length) return null;
  const d = lines[0].includes(";") ? ";" : ",";
  const rows = lines.map(l => l.split(d).map(c => c.trim().replace(/^"|"$/g, "")));
  return {head: rows[0], rows: rows.slice(1)};
}
function csvColsHtml(){
  const opts = (sel) => CSVD.head.map((c, i) => `<option value="${i}" ${i === sel ? "selected" : ""}>${esc(c)}</option>`).join("");
  return `<div class="lab-grid" style="margin-top:14px"><div class="field"><label for="csvPlate">Mashina ustuni</label><select id="csvPlate">${opts(CSVD.p)}</select></div>
    <div class="field"><label for="csvWeight">Og'irlik ustuni</label><select id="csvWeight">${opts(CSVD.w)}</select></div></div>`;
}
function csvCalc(){
  const p = +document.getElementById("csvPlate").value, w = +document.getElementById("csvWeight").value;
  const g = {};
  CSVD.rows.forEach(r => {
    const k = r[p] || "—";
    const v = parseFloat(String(r[w] || "0").replace(/\s/g, "").replace(",", "."));
    g[k] = g[k] || {n: 0, s: 0};
    g[k].n++; if (Number.isFinite(v)) g[k].s += v;
  });
  const all = Object.entries(g).sort((a, b) => b[1].s - a[1].s);
  const total = all.reduce((s, [, x]) => s + x.s, 0);
  document.getElementById("csvOut").innerHTML = `<p class="score">Jami: ${total.toLocaleString("ru-RU")} kg, ${CSVD.rows.length} ta qator</p>
    <div class="tablewrap"><table><tr><th>Mashina</th><th>Tortishlar</th><th>Jami, kg</th></tr>` +
    all.map(([k, x]) => `<tr><td>${esc(k)}</td><td>${x.n}</td><td>${x.s.toLocaleString("ru-RU")}</td></tr>`).join("") + `</table></div>`;
}

  const pj = e.target.closest("[data-proj]");
  if (pj) { S.proj = S.proj || {}; S.proj[pj.dataset.proj] = pj.checked; save(); render(true); }
});
document.addEventListener("input", e => {
  const n = e.target.closest("[data-note]");
  if (n) { S.notes = S.notes || {}; S.notes[n.dataset.note] = n.value; save(); }
});
const THEMES = ["auto","light","dark"], TL = {auto: "avto", light: "yorug'", dark: "qorong'i"};
function applyTheme(){
  if (S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.theme);
  const tb = document.getElementById("themeBtn"); if (tb) tb.textContent = "Mavzu: " + TL[S.theme];
}
window.addEventListener("hashchange", () => { if (USE_HASH) render(); });
window.addEventListener("popstate", () => { if (USE_HASH) render(); });
document.getElementById("searchBtn").innerHTML = SVG.search;
applyTheme();
render();
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
</script>
