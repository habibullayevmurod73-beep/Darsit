d": "p-state2", "notes": "Funksiya faqat bitta holatda qiymat qaytaradi — tortish haqiqatan sodir bo'lganda. Qolgan barcha holatlarda None."}, {"t": "term", "title": "Kirish va chiqish tortishini juftlash", "def": "Yuk olib kelgan mashina kirishda to'la (brutto), chiqishda bo'sh (tara) tortiladi. Netto = brutto − tara. Tizim ikki tortishni bir «reys»ga bog'lashi kerak.", "analogy": "Mehmonxona: kirishda ro'yxatdan o'tasiz, chiqishda hisob yopiladi. Xona raqami — ikki voqeani bog'laydi.", "example": "Raqam 01A123BC 09:15 da 24 300 kg kirdi, 10:05 da 8 250 kg chiqdi. Tizim: reys ochildi → yopildi, netto 16 050 kg.", "id": "p-inout"}, {"t": "code", "title": "Serverda juftlash mantiqi", "lang": "python", "src": "def tortish_qabul(t):\n    ochiq = db.ochiq_reys(t.plate, soat=12)     # shu raqam, yopilmagan\n    if ochiq is None:\n        db.reys_och(plate=t.plate, kirish_id=t.id, brutto=t.weight)\n        return \"ochildi\"\n    brutto, tara = ochiq.brutto, t.weight\n    if tara > brutto:                            # teskari: chiqimga yuk\n        brutto, tara = tara, brutto\n    db.reys_yop(ochiq.id, chiqish_id=t.id,\n                brutto=brutto, tara=tara, netto=brutto - tara)\n    outbox_qosh(\"reys\", ochiq.id)                # 1C ga navbatga\n    return \"yopildi\"", "side": null, "caption": "Chiqimda (mahsulot jo'natishda) mashina avval bo'sh, keyin to'la tortiladi — shuning uchun kattasi brutto, kichigi tara deb olinadi.", "id": "p-pair"}, {"t": "table", "title": "Murakkab holatlar va ularning yechimi", "intro": null, "head": ["Holat", "Tizim nima qiladi"], "rows": [["Raqam tanilmadi", "Operator ekranida tasdiqlash so'raladi"], ["Bir raqam bilan ikkita ochiq reys", "Eng eskisi olinadi, ogohlantirish"], ["Chiqish bor, kirish yo'q", "«Yetim» tortish — operator bog'laydi yoki izoh yozadi"], ["12 soatdan ko'p yopilmagan reys", "Ogohlantirish, rahbarga hisobot"], ["Operator raqamni tuzatdi", "Eski va yangi qiymat tarixga yoziladi"], ["Reys 1C ga yuborilgach tuzatildi", "1C da tuzatish hujjati, asl hujjat o'zgarmaydi"]], "id": "p-edge"}, {"t": "cards", "title": "Operator ekrani nimalarni ko'rsatadi", "intro": null, "items": [["Activity", "Jonli og'irlik", "Katta raqam, barqarorlik belgisi bilan."], ["Search", "Oxirgi rasmlar", "Old va orqa kamera, tanilgan raqam."], ["Check", "Tasdiqlash", "Raqam noaniq bo'lsa — bir tugma bilan tasdiqlash yoki to'g'rilash."], ["Book", "Ochiq reyslar", "Hududda turgan mashinalar ro'yxati."], ["Warning", "Ogohlantirishlar", "Nol siljishi, kamera uzilishi, shubhali tara."], ["PaperPlane", "Chek", "Haydovchi uchun tortish chekini chop etish."]], "id": "p-operator"}, {"t": "code", "title": "Tahrir tarixi: har bir o'zgarish yoziladi", "lang": "python", "src": "@app.patch(\"/api/weighings/{wid}/plate\")\ndef raqam_tuzat(wid: str, t: RaqamTuzatish, user=Depends(joriy_user)):\n    eski = db.get(wid)\n    if not t.sabab.strip():\n        raise HTTPException(400, \"Sabab majburiy\")\n    db.update(wid, plate=t.yangi)\n    db.audit_yoz(\n        obyekt=\"weighing\", obyekt_id=wid, maydon=\"plate\",\n        eski=eski.plate, yangi=t.yangi,\n        kim=user.login, sabab=t.sabab,\n    )\n    return {\"status\": \"ok\"}", "side": null, "caption": "Og'irlik qiymatini API orqali o'zgartirib bo'lmaydi — faqat raqam va izoh. Har bir tuzatish kim, qachon, nega bilan saqlanadi.", "id": "p-audit"}, {"t": "statement", "title": "Tizimga ishonch qo'lda o'zgartirishning imkonsizligidan emas, balki har bir o'zgarish ko'rinib turishidan keladi", "sub": "Operator xato tuzata olishi kerak — lekin hech narsa izsiz o'zgarmasligi kerak. Rahbar tahrirlar tarixini istalgan payt ko'ra oladi.", "accent": false, "id": "p-trust"}, {"t": "table", "title": "Baza jadvallari", "intro": null, "head": ["Jadval", "Nima saqlanadi"], "rows": [["weighings", "Har bir tortish: vaqt, tarozi, og'irlik, raqam, rasmlar"], ["trips", "Reyslar: kirish va chiqish tortishlari, brutto, tara, netto"], ["trucks", "Mashinalar: raqam, egasi, odatiy tara"], ["audit_log", "Barcha qo'lda o'zgarishlar tarixi"], ["outbox", "1C ga yuborilishi kerak bo'lgan yozuvlar va holati"], ["devices", "Qurilmalar va oxirgi «tiriklik» signali vaqti"]], "id": "p-db"}, {"t": "table", "title": "Serverning to'liq API ro'yxati", "intro": null, "head": ["Manzil", "Metod", "Kim ishlatadi"], "rows": [["/api/weighings", "POST", "Shlyuz"], ["/api/weighings?date=", "GET", "Dashboard, hisobotlar"], ["/api/weighings/{id}/plate", "PATCH", "Operator"], ["/api/trips?open=true", "GET", "Operator ekrani"], ["/api/devices/heartbeat", "POST", "Shlyuz, har daqiqada"], ["/api/reports/daily", "GET", "Dashboard, Telegram bot"], ["/ws", "WebSocket", "Jonli ekranlar"]], "id": "p-api"}, {"t": "table", "title": "Ogohlantirish qoidalari", "intro": null, "head": ["Hodisa", "Kimga", "Kanal"], "rows": [["Shlyuz 5 daqiqa jim", "IT xodimi", "Telegram"], ["Tara odatdagidan keskin farq qildi", "Xavfsizlik, rahbar", "Telegram + rasm"], ["Raqam qo'lda tuzatildi", "Rahbar (kunlik jamlanma)", "Kunlik hisobot"], ["1C navbati 1 soatdan ko'p", "1C dasturchisi", "Telegram"], ["Reys 12 soatdan beri ochiq", "Ombor mudiri", "Telegram"]], "id": "p-alerts"}, {"t": "code", "title": "Haydovchi uchun tortish cheki", "lang": "python", "src": "CHEK = '''\nKORXONA — TORTISH CHEKI\nReys: {id}\nRaqam: {plate}\n\nKirish: {kirish:%d.%m.%Y %H:%M}\nChiqish: {chiqish:%H:%M}\nBrutto: {brutto:>8} kg\nTara:   {tara:>8} kg\n\nNetto:  {netto:>8} kg\nOperator: {operator}'''\n\nhtml = CHEK.format(**reys)\nwith open(f\"chek_{reys['id']}.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(html)", "side": null, "caption": "HTML chekni brauzer orqali chek printeriga chop etish mumkin. Keyinchalik chekka QR-kod qo'shib, haqiqiyligini tekshirish imkonini berish mumkin.", "id": "p-ticket"}, {"t": "steps", "title": "Korxonada o'rnatish kuni", "intro": null, "items": [["Tarmoq", "IP manzillar va VLAN rejaga muvofiq, hammasi ping qilinadi."], ["Tarozi", "Xom ma'lumot Termite da ko'rinadi, parser sinaladi."], ["Kameralar", "Kadrlar olinadi, raqam o'lchami tekshiriladi."], ["Xizmatlar", "Shlyuz va server xizmat sifatida, qayta yuklashda o'zi ishga tushadi."], ["1C", "Test hujjat yaratiladi va o'chiriladi."], ["Nazorat tortish", "Ma'lum og'irlikdagi mashina bilan to'liq sikl."]], "id": "p-install"}, {"t": "steps", "title": "Operatorlarni o'qitish", "intro": null, "items": [["Nega o'zgaryapti", "Tizim ularning ishini qanday osonlashtirishini tushuntiring."], ["Oddiy kun", "Odatiy tortish siklini birga bir necha marta bajaring."], ["Istisnolar", "Raqam tanilmasa, kamera o'chsa nima qilish."], ["Tuzatishlar", "Sabab yozish nega majburiy ekanini tushuntiring."], ["Bir varaqlik qo'llanma", "Stol ustida: asosiy holatlar va telefon raqamlari."]], "id": "p-train"}, {"t": "table", "title": "Pilot natijalarini solishtirish jadvali", "intro": null, "head": ["Ko'rsatkich", "Qo'lda", "Avtomatik", "Farq"], "rows": [["Tortishlar soni", "[__]", "[__]", "[__]"], ["Jami netto, kg", "[__]", "[__]", "[__]"], ["Raqam xatolari", "[__]", "[__]", "[__]"], ["Bir mashinaga ketgan vaqt", "[__]", "[__]", "[__]"], ["1C ga kiritish kechikishi", "[__]", "[__]", "[__]"]], "id": "p-pilot", "notes": "Pilot davomida har kuni shu jadvalni to'ldiring. Farqlarning har biri tushuntirilishi kerak: bu tizimdagi xato yoki qo'lda yozishdagi xato. Farqlar tushuntirilgach, qo'lda yozish to'xtatiladi."}, {"t": "cards", "title": "Loyihani topshirish hujjatlari", "intro": null, "items": [["Book", "Tizim sxemasi", "Qurilmalar, IP manzillar, kabellar, xizmatlar."], ["Key", "Kirish ma'lumotlari", "Maxfiy saqlanadigan ro'yxat, egasi aniq."], ["Wrench", "Qo'llanmalar", "Operator, administrator va 1C uchun alohida."], ["Code", "Kod va sozlamalar", "Git repozitoriy, versiya raqami, o'rnatish ko'rsatmasi."]], "id": "p-handover"}, {"t": "quiz", "q": "Mashina kirishda 8 200 kg, chiqishda 24 300 kg tortildi. Tizim nettoni qanday hisoblaydi?", "opts": ["8 200 − 24 300 = manfiy", "Kattasi brutto, kichigi tara: 16 100 kg", "Faqat chiqishdagi og'irlik"], "a": 1, "expl": "Bu jo'natish (chiqim) holati: mashina bo'sh kirib, to'la chiqdi.", "id": "p-q1"}, {"t": "quiz", "q": "Operator raqamni tuzatmoqchi. To'g'ri yondashuv qaysi?", "opts": ["Tuzatishni taqiqlash", "Tuzatishga ruxsat, lekin sabab bilan va tarixga yozib", "Bazada to'g'ridan-to'g'ri o'zgartirish"], "a": 1, "expl": "Xatolarni tuzatish kerak, lekin har bir o'zgarish izsiz qolmasligi shart.", "id": "p-q2"}, {"t": "quiz", "q": "Mashina tarozida turganda bir necha marta yozilmasligi uchun kodda nima ishlatildi?", "opts": ["done bayrog'i", "time.sleep(1000)", "1C da o'chirish"], "a": 0, "expl": "done faqat tarozi bo'shaganda (MIN_W dan kam) tozalanadi.", "id": "m9-q1"}, {"t": "quiz", "q": "«Outbox» naqshining asosiy foydasi nima?", "opts": ["Tezlik", "1C ishlamasa ham ma'lumot yo'qolmaydi", "Chiroyli dizayn"], "a": 1, "expl": "Ma'lumot avval o'z bazangizga yoziladi, keyin ishonchli tarzda 1C ga uzatiladi.", "id": "m9-q2"}, {"t": "quiz", "id": "xq-m9-0", "q": "Kirish va chiqish tortishlarini bog'lash kursda nima deb ataladi?", "opts": ["Juftlash (reys)", "Indekslash", "Keshlash"], "a": 0, "expl": "Ikki tortish bir reysga bog'lanadi: netto = brutto − tara."}, {"t": "quiz", "id": "xq-m9-1", "q": "Operator raqamni tuzatsa, bu qayerga yoziladi?", "opts": ["Audit — tahrir tarixi", "Hech qayerga", "Faqat Excelga"], "a": 0, "expl": "Kim, qachon, nima va nega o'zgartirgani saqlanadi."}]}, {"id": "m10", "num": 10, "title": "Xavfsizlik, ishga tushirish va o'sish", "goal": "Tizimni ishlab chiqarishda ishonchli va xavfsiz ushlab turish hamda bu sohada mutaxassis bo'lish yo'lini bilib olasiz.", "stages": [2, 5], "vol": 1, "blocks": [{"t": "cards", "title": "Xavfsizlik qoidalari", "intro": null, "items": [["Lock", "Alohida tarmoq", "Kameralar va tarozilar alohida VLAN da. Internetga to'g'ridan-to'g'ri chiqmaydi."], ["Key", "Parollar", "Standart parollarni almashtiring. Parol va tokenlar kodda emas, .env faylda."], ["Globe", "HTTPS va token", "API ga faqat login yoki token bilan kirish. Tashqaridan faqat HTTPS."], ["Trust", "VPN", "Masofaviy kirish faqat VPN (WireGuard) orqali. Portlarni internetga ochmang."], ["Users", "Minimal huquq", "Har bir foydalanuvchi va servisga faqat kerakli ruxsat."], ["Book", "Yangilanishlar", "Kamera proshivkasi, OS va kutubxonalarni muntazam yangilang."]], "id": "m10-sec"}, {"t": "stack", "title": "Tarmoqni bo'lish (VLAN)", "intro": null, "rows": [["VLAN 10: qurilmalar", "Kameralar, tarozilar, datchiklar — faqat shlyuz bilan gaplashadi"], ["VLAN 20: serverlar", "API, baza, 1C server — qurilmalarga faqat shlyuz orqali"], ["VLAN 30: ofis", "Xodimlar kompyuterlari — faqat dashboard va 1C ga"], ["Internet", "Faqat chiquvchi: Telegram, yangilanishlar. Kiruvchi — faqat VPN"]], "id": "m10-net", "notes": "Agar bitta kamera buzilsa ham, hujumchi alohida VLAN da qoladi va buxgalteriya serveriga yeta olmaydi."}, {"t": "cards", "title": "Monitoring: muammoni mijozdan oldin bilish", "intro": null, "items": [["Activity", "Heartbeat", "Shlyuz har daqiqada «tirikman» signali yuboradi. 5 daqiqa kelmasa — Telegram ga ogohlantirish."], ["Book", "Loglar", "Har bir servis xato va voqealarni vaqt bilan yozadi."], ["Chart", "Grafiklar", "Katta tizimlarda Grafana + Prometheus: yuklama, xatolar, navbat uzunligi."]], "id": "m10-mon"}, {"t": "code", "title": "Zaxira nusxa: har kecha avtomatik", "lang": "bash", "src": "# PostgreSQL: har kecha soat 2:00 da (Linux cron)\n0 2 * * * pg_dump -U zavod zavod | gzip > /backup/zavod_$(date +\\%F).sql.gz\n\n# 30 kundan eski nusxalarni o'chirish\n0 3 * * * find /backup -name \"*.sql.gz\" -mtime +30 -delete\n\n# 1C: Konfigurator → Администрирование → Выгрузить (.dt)\n# yoki SQL server darajasida muntazam backup", "side": null, "caption": "Zaxirani boshqa joyda ham saqlang va oyiga bir marta tiklashni sinab ko'ring. Tiklanmagan zaxira — zaxira emas.", "id": "m10-backup"}, {"t": "table", "title": "O'qish yo'l xaritasi", "intro": null, "head": ["Bosqich", "Muddat", "Nima qilasiz"], "rows": [["1. Asos", "1–2 oy", "Python, SQL, tarmoq asoslari (IP, port, VLAN)"], ["2. Qurilmalar", "1 oy", "Tarozi, kamera, Modbus bilan amaliyot"], ["3. Web", "1–2 oy", "FastAPI, PostgreSQL, HTML/JS, Docker"], ["4. 1C", "2–3 oy", "Konfigurator, so'rovlar, formalar, kengaytmalar"], ["5. AI", "2 oy", "OpenCV, YOLO, OCR, pandas, scikit-learn"], ["6. Loyiha", "1 oy", "Aqlli tarozi loyihasini to'liq qurish — portfolio"]], "id": "m10-road"}, {"t": "cards", "title": "Foydali manbalar", "intro": null, "items": [["Book", "1C", "its.1c.ru — rasmiy hujjatlar. infostart.ru — tayyor yechimlar va maqolalar."], ["Code", "Python va web", "docs.python.org, fastapi.tiangolo.com — rasmiy qo'llanmalar."], ["Lightbulb", "AI", "docs.ultralytics.com — YOLO. OpenCV rasmiy darsliklari."], ["GraduationCap", "Sertifikat", "«1С:Специалист» va «1С:Профессионал» imtihonlari ish topishda katta ustunlik."]], "id": "m10-res"}, {"t": "statement", "title": "Ishlab turgan tizim — bu boshlanish: uni himoyalash, kuzatish va tiklay olish kerak", "sub": "Bu bo'limda xavflar, parollar, tarmoq himoyasi, zaxira nusxa, monitoring va nosozlikka tayyorgarlikni ko'ramiz.", "accent": true, "id": "x-intro"}, {"t": "table", "title": "Asosiy xavflar va himoya", "intro": null, "head": ["Xavf", "Himoya"], "rows": [["Standart parollar (admin/12345)", "Birinchi kunning o'zida almashtirish"], ["Internetga ochiq portlar", "Faqat VPN orqali kirish, firewall"], ["Shifrlovchi viruslar", "Oflayn zaxira nusxa, yangilanishlar"], ["Fishing xatlar", "Xodimlarni o'qitish, havolalarni tekshirish"], ["Ishdan ketgan xodim akkaunti", "Ketgan kunning o'zida bloklash"], ["Yo'qolgan noutbuk", "Disk shifrlash, parollarni saqlamaslik"]], "id": "x-threats"}, {"t": "cards", "title": "Parollar bilan ishlash", "intro": null, "items": [["Key", "Uzun va noyob", "Kamida 12–16 belgi, har bir tizimga alohida parol."], ["Lock", "Parol menejeri", "Parollarni daftarda yoki Excelda emas, maxsus himoyalangan dasturda saqlang."], ["Verified", "Ikki bosqichli kirish", "Muhim tizimlar uchun parol + telefon kodi."], ["Users", "Umumiy akkauntlar yo'q", "Har bir odamning o'z login-paroli — kim nima qilgani ko'rinadi."]], "id": "x-pass"}, {"t": "code", "title": "Linux serverda firewall (ufw)", "lang": "bash", "src": "# Standart: kiruvchi hamma narsa taqiqlangan\nsudo ufw default deny incoming\nsudo ufw default allow outgoing\n\n# SSH — faqat administrator tarmog'idan\nsudo ufw allow from 192.168.30.0/24 to any port 22 proto tcp\n\n# HTTPS — ofis va shlyuzlar uchun\nsudo ufw allow from 192.168.0.0/16 to any port 443 proto tcp\n\nsudo ufw enable\nsudo ufw status numbered", "side": null, "caption": "Qoida: avval hammasi yopiq, keyin faqat kerakli manzildan kerakli portga ochiladi. Masofadan sozlayotganda SSH ni yopib qo'ymaslikka ehtiyot bo'ling.", "id": "x-ufw"}, {"t": "cards", "title": "Masofaviy kirish: VPN", "intro": null, "items": [["Lock", "Nega VPN", "Serverni internetga ochish o'rniga, faqat shifrlangan tunnel orqali kirish."], ["Settings", "WireGuard", "Zamonaviy, tez va sozlash oddiy VPN. Har bir foydalanuvchiga alohida kalit."], ["Users", "Kalitlarni boshqarish", "Xodim ketsa — faqat uning kaliti o'chiriladi."]], "id": "x-vpn"}, {"t": "table", "title": "Nimani va qanchalik tez-tez yangilash kerak", "intro": null, "head": ["Nima", "Qachon"], "rows": [["Operatsion tizim xavfsizlik yangilanishlari", "Har oy, jiddiylari darhol"], ["Kamera va switch proshivkasi", "Har chorakda tekshirish"], ["Python kutubxonalari", "Har chorakda, avval test muhitida"], ["1C platforma va konfiguratsiya", "Rasmiy chiqishlar bo'yicha, nusxa bilan"], ["Antivirus bazalari", "Avtomatik, har kuni"]], "id": "x-updates"}, {"t": "statement", "title": "Zaxira nusxaning 3-2-1 qoidasi", "sub": "3 ta nusxa, 2 xil turdagi saqlagichda, 1 tasi korxonadan tashqarida yoki oflayn. Shifrlovchi virus ulangan disklarning hammasini buzishi mumkin — oflayn nusxa yagona najot.", "accent": false, "id": "x-321"}, {"t": "steps", "title": "Tiklashni sinash: oyiga bir marta", "intro": null, "items": [["Toza muhit", "Alohida kompyuter yoki virtual mashina."], ["Bazani tiklang", "pg_restore yoki psql bilan oxirgi nusxadan."], ["1C ni tiklang", ".dt faylni yangi bazaga yuklang."], ["Tekshiring", "Oxirgi tortishlar va hujjatlar joyidami?"], ["Vaqtni yozing", "To'liq tiklash qancha vaqt oldi — bu sizning haqiqiy tiklash vaqtingiz."]], "id": "x-restore"}, {"t": "code", "title": "Monitoring: jim qolgan qurilmani aniqlash", "lang": "python", "src": "import time, datetime as dt\n\nCHEGARA = dt.timedelta(minutes=5)\nxabar_berilgan = set()\n\nwhile True:\n    hozir = dt.datetime.now(dt.timezone.utc)\n    for d in db.devices():\n        jim = hozir - d.last_seen > CHEGARA\n        if jim and d.name not in xabar_berilgan:\n            telegram(f\"{d.name} {CHEGARA} dan beri javob bermayapti\")\n            xabar_berilgan.add(d.name)\n        elif not jim and d.name in xabar_berilgan:\n            telegram(f\"{d.name} qayta ishlayapti\")\n            xabar_berilgan.discard(d.name)\n    time.sleep(60)", "side": null, "caption": null, "id": "x-heartbeat", "notes": "Har bir qurilma bir marta ogohlantiradi va tiklanganda xabar beradi — Telegram guruhi keraksiz xabarlarga to'lib ketmaydi."}, {"t": "table", "title": "Nimani kuzatish kerak", "intro": null, "head": ["Ko'rsatkich", "Ogohlantirish chegarasi (misol)"], "rows": [["Disk bo'sh joyi", "20% dan kam"], ["1C navbati (outbox)", "1 soatdan eski yozuv bor"], ["Kamera kadr olish xatolari", "Ketma-ket 5 ta"], ["API javob vaqti", "2 soniyadan ko'p"], ["Oxirgi zaxira nusxa", "26 soatdan eski"], ["Server xotirasi va protsessori", "Uzoq vaqt 90% dan yuqori"]], "id": "x-metrics"}, {"t": "cards", "title": "Loglarni boshqarish", "intro": null, "items": [["Clock", "Aylantirish (rotation)", "Log fayli cheksiz o'smasin: har kuni yangi fayl, eskilari siqiladi."], ["Database", "Saqlash muddati", "Masalan, 90 kun. Audit tarixi esa uzoqroq saqlanadi."], ["Search", "Bir joyga yig'ish", "Ko'p qurilma bo'lsa — markaziy log serveri, qidirish oson."]], "id": "x-logs"}, {"t": "steps", "title": "Nosozlik yuz berganda harakat rejasi", "intro": null, "items": [["Aniqlang", "Nima ishlamayapti va qachondan beri? Monitoring va loglar."], ["Xabar bering", "Operator va rahbarga: vaqtinchalik qo'lda yozishga o'tish."], ["Cheklang", "Virus shubhasi bo'lsa — kompyuterni tarmoqdan uzing."], ["Tiklang", "Zaxiradan yoki qo'llanma bo'yicha."], ["Ma'lumotni to'ldiring", "Qo'lda yozilganlarni tizimga kiritish."], ["Xulosa", "Nega bo'ldi va takrorlanmasligi uchun nima qilinadi."]], "id": "x-incident", "notes": "Bu rejani oldindan yozib, operator stoliga qo'ying. Nosozlik paytida odamlar shoshib qoladi — aniq qadamlar xatolarni kamaytiradi."}, {"t": "table", "title": "Administrator qo'llanmasi (runbook) tarkibi", "intro": null, "head": ["Bo'lim", "Ichida nima bor"], "rows": [["Tizim xaritasi", "Serverlar, xizmatlar, IP va portlar"], ["Ishga tushirish va to'xtatish", "Har bir xizmat uchun buyruqlar"], ["Tez-tez uchraydigan muammolar", "Belgi → sabab → yechim"], ["Zaxira va tiklash", "Qayerda, qanday, qancha vaqt"], ["Aloqa", "Kim nimaga javobgar, telefonlar"]], "id": "x-runbook"}, {"t": "cards", "title": "Portfolio: ish topish uchun nimani ko'rsatish kerak", "intro": null, "items": [["Star", "Ishlaydigan loyiha", "Tarozi simulyatori + server + dashboard, video bilan."], ["Code", "Toza kod", "Git repozitoriy, README, sozlamalar misoli."], ["Database", "1C kengaytmasi", "HTTP-servis va integratsiya namunasi."], ["Book", "Hujjatlar", "Arxitektura sxemasi va qo'llanma — tizimli fikrlashni ko'rsatadi."]], "id": "x-portfolio"}, {"t": "quiz", "q": "Shifrlovchi virus serverdagi barcha disklarni buzdi. Qaysi zaxira sizni qutqaradi?", "opts": ["Shu serverdagi ikkinchi diskdagi nusxa", "Oflayn yoki korxonadan tashqaridagi nusxa", "Hech qaysi"], "a": 1, "expl": "Ulangan disklar ham shifrlanishi mumkin. 3-2-1 qoidasidagi «1» aynan shu uchun.", "id": "x-q1"}, {"t": "quiz", "q": "Zaxira nusxa haqiqatan ishlashini qanday bilasiz?", "opts": ["Fayl mavjudligiga qarab", "Muntazam ravishda toza muhitga tiklab ko'rib", "Fayl hajmiga qarab"], "a": 1, "expl": "Tiklab ko'rilmagan zaxira — faqat umid.", "id": "x-q2"}, {"t": "statement", "title": "Kichik haqiqiy loyihadan boshlang", "sub": "Hatto bitta tarozini Telegram botga ulash ham o'nta nazariy kitobdan ko'proq o'rgatadi. Keyin kamerani qo'shing, keyin 1C ni — qadam-baqadam.", "accent": true, "id": "m10-advice"}, {"t": "quiz", "id": "xq-m10-0", "q": "3-2-1 qoidasidagi «1» nima?", "opts": ["Bitta disk", "Bitta nusxa korxonadan tashqarida yoki oflayn", "Bitta parol"], "a": 1, "expl": "Shifrlovchi virusdan himoya qiladigan nusxa."}, {"t": "quiz", "id": "xq-m10-1", "q": "Serverga masofadan kirishning xavfsiz usuli?", "opts": ["Portni internetga ochish", "VPN", "Hamma uchun bitta parol"], "a": 1, "expl": "VPN shifrlangan tunnel beradi, server internetga ochilmaydi."}]}, {"id": "intro2", "num": null, "title": "2-jild haqida", "goal": "Kurs tuzilmasi, kimlar uchun va qanday natija berishi.", "stages": [0, 1, 2, 3, 4, 5], "vol": 2, "blocks": [{"t": "table", "title": "2-jild tuzilmasi", "intro": null, "head": ["Modul", "Mavzu", "Nima o'rganasiz"], "rows": [["11", "Git", "Kodni saqlash, tarix, qaytish, jamoa bilan ishlash"], ["12", "Linux", "Serverni boshqarish: buyruqlar, huquqlar, xizmatlar"], ["13", "Docker", "Dasturlarni «qutiga» joylash va ishga tushirish"], ["14", "Telegram bot", "Buyruqlar, tugmalar, kunlik hisobot"], ["15", "1C hisobotlari va chop etish", "СКД chuqur, bosma shakllar"], ["16", "Excel va Power Query", "Hisobotlarni avtomatik yangilash"], ["17", "Qo'shimcha qurilmalar", "RFID, shtrix-kod, shlagbaum, svetofor"], ["18", "Kasbiy o'sish", "Darajalar, portfolio, keyingi qadamlar"]], "id": "v2-map"}, {"t": "statement", "title": "2-jild 1-jildga tayanadi", "sub": "Bu yerdagi misollar 1-jilddagi aqlli tarozi loyihasini davom ettiradi: uning kodini Git da saqlaymiz, Linux serverga o'rnatamiz, Docker bilan ishga tushiramiz va Telegram orqali boshqaramiz.", "accent": true, "id": "v2-link"}]}, {"id": "g", "num": 11, "title": "Git: kodni saqlash va boshqarish", "goal": "Har bir o'zgarishni saqlash, istalgan paytda oldingi ishlagan holatga qaytish va boshqa dasturchilar bilan birga ishlashni o'rganasiz.", "stages": [1, 2], "vol": 2, "blocks": [{"t": "term", "title": "Git", "def": "Fayllardagi har bir o'zgarishni tarix sifatida saqlaydigan dastur. Istalgan saqlangan holatga qaytish, kim nimani o'zgartirganini ko'rish mumkin.", "analogy": "Kompyuter o'yinidagi saqlash nuqtalari: xato qilsangiz, oxirgi saqlangan joydan davom etasiz.", "example": "Shlyuz kodiga yangi funksiya qo'shdingiz va tarozi ishlamay qoldi. Bir buyruq bilan kechagi ishlagan versiyaga qaytasiz.", "id": "g-what"}, {"t": "steps", "title": "Git'ni o'rnatish va sozlash", "intro": null, "items": [["Yuklab oling", "git-scm.com → Download. Linux'da: sudo apt install git."], ["Tekshiring", "git --version"], ["Ismingiz", "git config --global user.name \"Akmal Aliyev\""], ["Pochta", "git config --global user.email \"akmal@korxona.uz\""], ["VS Code", "Chap paneldagi Source Control belgisi — Git'ni tugmalar bilan boshqarish."]], "id": "g-install"}, {"t": "cards", "title": "Asosiy tushunchalar", "intro": null, "items": [["Database", "Repozitoriy", "Loyiha papkasi va uning butun tarixi (yashirin .git papkasida)."], ["Wrench", "Ishchi papka", "Siz hozir tahrirlayotgan fayllar."], ["Check", "Staging (tayyorlov)", "Keyingi saqlashga kiradigan o'zgarishlar ro'yxati."], ["Star", "Commit", "Izoh bilan saqlangan «surat»: nima va nega o'zgardi."], ["Link", "Branch (shox)", "Asosiy koddan alohida ishlash yo'li."], ["Cloud", "Remote", "Serverdagi nusxa: zaxira va jamoaviy ish uchun."]], "id": "g-concepts"}, {"t": "flow", "title": "Kundalik ish sikli", "items": [["Wrench", "O'zgartirish", "Kodni tahrirlaysiz"], ["Check", "git add", "Saqlanadiganlarni tanlaysiz"], ["Star", "git commit", "Izoh bilan saqlaysiz"], ["Cloud", "git push", "Serverga yuborasiz"]], "caption": null, "id": "g-flow"}, {"t": "code", "title": "Birinchi repozitoriy", "lang": "bash", "src": "cd C:\\kurs\\shlyuz\ngit init                        # repozitoriy yaratish\ngit status                      # nima o'zgargan?\n\ngit add main.py tarozi.py       # tanlangan fayllar\ngit add .                       # yoki hammasi\ngit commit -m \"Tarozi o'qish moduli qo'shildi\"\n\ngit log --oneline               # tarix\n# a1b2c3d Tarozi o'qish moduli qo'shildi", "side": null, "caption": "git status — eng ko'p ishlatiladigan buyruq. Nimani qilishni bilmasangiz, avval shuni yozing.", "id": "g-basic"}, {"t": "code", "title": ".gitignore: Git'ga qo'shilmaydigan fayllar", "lang": "text", "src": "# Virtual muhit va kesh\nvenv/\n__pycache__/\n\n# Parollar va sozlamalar\n.env\n\n# Ma'lumotlar, rasmlar, loglar\ndata/\n*.log\nsnapshots/\n\n# 1C baza fayllari\n*.1CD", "side": ["Bu fayl loyiha ildizida turadi.", "<b>.env<\/b> hech qachon Git'ga tushmasligi kerak — ichida parollar.", "Katta va tez o'zgaradigan fayllar (rasmlar, loglar) ham qo'shilmaydi.", "O'rniga <b>.env.example<\/b> — bo'sh qiymatli namuna."], "caption": null, "id": "g-ignore"}, {"t": "code", "title": "O'zgarishlarni ko'rish", "lang": "bash", "src": "git diff                  # saqlanmagan o'zgarishlar\ngit diff --staged         # add qilinganlar\ngit log --oneline -10     # oxirgi 10 ta commit\ngit show a1b2c3d          # bitta commitning to'liq o'zgarishi\ngit blame tarozi.py       # har bir qatorni kim, qachon yozgan", "side": null, "caption": "Qizil qatorlar — o'chirilgan, yashil — qo'shilgan. VS Code'da xuddi shuni rangli ko'rinishda ko'rasiz.", "id": "g-diff"}, {"t": "table", "title": "Xatoni qaytarish: qaysi holatda qaysi buyruq", "intro": null, "head": ["Holat", "Buyruq"], "rows": [["Faylni oxirgi commitdagi holatga qaytarish", "git restore tarozi.py"], ["add ni bekor qilish", "git restore --staged tarozi.py"], ["Oxirgi commit izohini tuzatish", "git commit --amend -m \"...\""], ["Eski commitni bekor qiluvchi yangi commit", "git revert a1b2c3d"], ["Faylni eski versiyadan olish", "git checkout a1b2c3d -- tarozi.py"]], "id": "g-undo", "notes": "revert tarixni o'chirmaydi — teskari o'zgarish qo'shadi. Bu serverga yuborilgan kod uchun eng xavfsiz yo'l. Tarixni qayta yozadigan buyruqlardan (reset --hard, push --force) boshlovchi bosqichda foydalanmang."}, {"t": "code", "title": "Shoxlar: xavfsiz sinov", "lang": "bash", "src": "git switch -c kamera-qoshish     # yangi shox yaratib, unga o'tish\n# ... kod yozish, commitlar ...\n\ngit switch main                  # asosiy shoxga qaytish\ngit merge kamera-qoshish         # o'zgarishlarni birlashtirish\ngit branch -d kamera-qoshish     # keraksiz shoxni o'chirish", "side": null, "caption": "main shoxidagi kod doim ishlaydigan holatda bo'lsin. Yangi funksiya alohida shoxda yoziladi va sinovdan o'tgach birlashtiriladi.", "id": "g-branch"}, {"t": "code", "title": "Ziddiyat (conflict): ikki kishi bir qatorni o'zgartirganda", "lang": "text", "src": ">>>>>> kamera-qoshish", "side": ["Git qaysi qiymat to'g'riligini bilmaydi — sizdan so'raydi.", "Yuqorida — joriy shox, pastda — birlashtirilayotgani.", "Belgilarni o'chirib, to'g'ri qiymatni qoldiring.", "Keyin: git add fayl va git commit."], "caption": null, "id": "g-conflict"}, {"t": "code", "title": "Serverdagi repozitoriy bilan ishlash", "lang": "bash", "src": "# Mavjud loyihani serverga ulash\ngit remote add origin https://git.korxona.uz/it/shlyuz.git\ngit push -u origin main\n\n# Boshqa kompyuterda loyihani olish\ngit clone https://git.korxona.uz/it/shlyuz.git\n\n# Oxirgi o'zgarishlarni olish\ngit pull", "side": null, "caption": "Tarozi yonidagi kompyuterda yangilash: git pull, keyin xizmatni qayta ishga tushirish. Shunda barcha tarozilarda bir xil versiya ishlaydi.", "id": "g-remote"}, {"t": "cards", "title": "Kodni qayerda saqlash mumkin", "intro": null, "items": [["Globe", "GitHub / GitLab", "Bulutdagi xizmatlar. Yopiq (private) repozitoriylar yarating."], ["Home", "O'z serveringizda", "Gitea yoki GitLab'ni korxona serveriga o'rnatish — kod korxonadan chiqmaydi."], ["Lock", "Kirish huquqlari", "Har bir dasturchiga faqat kerakli repozitoriylar."]], "id": "g-host"}, {"t": "table", "title": "Yaxshi va yomon commit izohlari", "intro": null, "head": ["Yomon", "Yaxshi"], "rows": [["o'zgarishlar", "Tara og'ishi 3 sigmadan oshsa ogohlantirish"], ["fix", "COM-port uzilganda qayta ulanish tuzatildi"], ["yangi", "Orqa kamera uchun ROI sozlamasi qo'shildi"], ["asdfgh", "1C HTTP-servisga paketli yuborish"]], "id": "g-msg", "notes": "Izoh nima va nega o'zgarganini aytsin. Olti oydan keyin tarixni o'qiyotgan odam (ko'pincha o'zingiz) sizga rahmat aytadi."}, {"t": "cards", "title": "1C konfiguratsiyasi va Git", "intro": null, "items": [["Database", "Fayllarga yuklash", "Konfigurator → Конфигурация → Выгрузить конфигурацию в файлы: XML fayllar Git'da saqlanadi."], ["Code", "1C:EDT", "Zamonaviy muhit: loyiha to'g'ridan-to'g'ri Git bilan ishlaydi."], ["Settings", "Kengaytmalar", "Kengaytmani ham alohida fayllarga yuklab, o'z repozitoriysida saqlang."]], "id": "g-1c"}, {"t": "steps", "title": "Amaliy mashqlar", "intro": null, "items": [["Repozitoriy", "Tarozi simulyatori papkasida git init va birinchi commit."], [".gitignore", "venv, .env va data papkalarini chiqarib tashlang."], ["Tarix", "3 ta o'zgarish qiling, har birini alohida commit bilan saqlang."], ["Qaytish", "Faylni ataylab buzing va git restore bilan tiklang."], ["Shox", "Yangi funksiyani alohida shoxda yozing va birlashtiring."], ["Remote", "Yopiq repozitoriy yaratib, push qiling."]], "id": "g-practice"}, {"t": "quiz", "q": ".env faylini Git'ga qo'shish kerakmi?", "opts": ["Ha, hamma fayl saqlanishi kerak", "Yo'q, uni .gitignore ga yozish kerak", "Faqat dushanba kuni"], "a": 1, "expl": ".env da parollar bor. Git tarixidan ularni butunlay o'chirish juda qiyin.", "id": "g-q1"}, {"t": "quiz", "q": "Serverga yuborilgan xato commitni xavfsiz bekor qilish uchun qaysi buyruq?", "opts": ["git revert", "git init", "git clone"], "a": 0, "expl": "revert teskari o'zgarishli yangi commit yaratadi, tarix buzilmaydi.", "id": "g-q2"}, {"t": "quiz", "id": "xq-g-0", "q": "git add nima qiladi?", "opts": ["Serverga yuboradi", "O'zgarishlarni keyingi commitga tayyorlaydi", "Faylni o'chiradi"], "a": 1, "expl": "Keyin git commit bilan saqlanadi."}]}, {"id": "l", "num": 12, "title": "Linux: serverni boshqarish", "goal": "Serverga masofadan ulanish, fayllar va huquqlar, dasturlarni o'rnatish, xizmatlar, loglar va tarozi portlari bilan ishlashni o'rganasiz.", "stages": [1, 2], "vol": 2, "blocks": [{"t": "cards", "title": "Nega serverlar ko'pincha Linux'da", "intro": null, "items": [["Star", "Bepul", "Litsenziya to'lovi yo'q, istalgancha server o'rnatish mumkin."], ["Verified", "Barqaror", "Oylab qayta yuklashsiz ishlaydi."], ["Lightning", "Yengil", "Grafik interfeyssiz — kam xotira va protsessor."], ["Cloud", "Docker va vositalar", "Ko'p server dasturlari birinchi navbatda Linux uchun yoziladi."]], "id": "l-why"}, {"t": "table", "title": "Qaysi Linux'ni tanlash", "intro": null, "head": ["Distributiv", "Qachon"], "rows": [["Ubuntu Server LTS", "Boshlovchilar uchun eng qulay: ko'p qo'llanma, 5 yil yangilanish"], ["Debian", "Juda barqaror, konservativ"], ["Raspberry Pi OS", "Kichik plata kompyuterlarda shlyuz sifatida"]], "id": "l-distro"}, {"t": "code", "title": "SSH: serverga masofadan ulanish", "lang": "bash", "src": "# Ulanish\nssh admin@192.168.20.10\n\n# Parol o'rniga kalit: bir marta yaratiladi\nssh-keygen -t ed25519\nssh-copy-id admin@192.168.20.10\n\n# Faylni serverga nusxalash\nscp config.json admin@192.168.20.10:/opt/shlyuz/", "side": null, "caption": "Kalit bilan kirish paroldan xavfsizroq va qulayroq. Windows 10/11 da ssh buyrug'i o'rnatilgan holda keladi.", "id": "l-ssh"}, {"t": "table", "title": "Linux fayl tizimi: asosiy papkalar", "intro": null, "head": ["Papka", "Nima saqlanadi"], "rows": [["/", "Ildiz — hamma narsa shu yerdan boshlanadi"], ["/home/admin", "Foydalanuvchining shaxsiy papkasi"], ["/etc", "Sozlama fayllari"], ["/var/log", "Tizim loglari"], ["/opt", "Qo'shimcha dasturlar — bizning shlyuz shu yerda"], ["/dev", "Qurilmalar: /dev/ttyUSB0 — tarozi porti"], ["/tmp", "Vaqtinchalik fayllar"]], "id": "l-fs"}, {"t": "code", "title": "Papkalar va fayllar bilan ishlash", "lang": "bash", "src": "pwd                      # hozir qayerdaman\nls -la                   # papka tarkibi, yashirinlari bilan\ncd /opt/shlyuz           # papkaga o'tish\nmkdir data               # yangi papka\ncp config.json config.bak     # nusxa\nmv eski.py arxiv/        # ko'chirish yoki qayta nomlash\nrm eski.log              # o'chirish (qaytarib bo'lmaydi!)", "side": null, "caption": "Linux'da savat yo'q: rm bilan o'chirilgan fayl qaytmaydi. rm -rf buyrug'ini ayniqsa ehtiyotkorlik bilan ishlating.", "id": "l-nav"}, {"t": "code", "title": "Fayl ichini ko'rish va qidirish", "lang": "bash", "src": "cat config.json                 # butun faylni chiqarish\nless shlyuz.log                 # sahifalab o'qish (q — chiqish)\ntail -n 50 shlyuz.log           # oxirgi 50 qator\ntail -f shlyuz.log              # jonli kuzatish (Ctrl+C — chiqish)\ngrep ERROR shlyuz.log           # faqat xato qatorlari\ngrep -c \"TORTILDI\" shlyuz.log   # nechta tortish bo'lgan\nnano config.json                # oddiy matn muharriri", "side": null, "caption": "tail -f — dasturning hozir nima qilayotganini jonli ko'rishning eng oson yo'li.", "id": "l-view"}, {"t": "term", "title": "Huquqlar (permissions)", "def": "Har bir fayl uchun uch guruh — egasi, guruhi, boshqalar — va uch huquq: o'qish (r), yozish (w), bajarish (x).", "analogy": "Xonadon kalitlari: egasida hamma kalit, oila a'zolarida ba'zilari, mehmonlarda — faqat eshik oldigacha.", "example": ".env faylini faqat shlyuz foydalanuvchisi o'qiy olsin: chmod 600 .env. Boshqa foydalanuvchilar ichini ko'ra olmaydi.", "id": "l-perm"}, {"t": "table", "title": "Tez-tez ishlatiladigan huquqlar", "intro": null, "head": ["Buyruq", "Ma'nosi", "Qachon"], "rows": [["chmod 600 .env", "Faqat egasi o'qiydi va yozadi", "Parollar, kalitlar"], ["chmod 644 config.json", "Egasi yozadi, hamma o'qiydi", "Oddiy sozlamalar"], ["chmod 755 run.sh", "Hamma bajaradi, faqat egasi o'zgartiradi", "Skriptlar"], ["chown shlyuz:shlyuz -R /opt/shlyuz", "Egasini o'zgartirish", "Dastur papkasi"]], "id": "l-chmod"}, {"t": "cards", "title": "Foydalanuvchilar va sudo", "intro": null, "items": [["Lock", "root", "Hamma narsaga ruxsatli foydalanuvchi. To'g'ridan-to'g'ri root bilan ishlamang."], ["Key", "sudo", "Bitta buyruqni administrator huquqi bilan bajarish: sudo apt update."], ["Users", "Dastur uchun alohida foydalanuvchi", "sudo adduser --system shlyuz — shlyuz faqat shu foydalanuvchi nomidan ishlaydi."]], "id": "l-users"}, {"t": "code", "title": "Dasturlarni o'rnatish va yangilash", "lang": "bash", "src": "sudo apt update                       # paketlar ro'yxatini yangilash\nsudo apt upgrade                      # o'rnatilganlarni yangilash\nsudo apt install python3-venv git htop\nsudo apt remove eski-paket\napt list --upgradable                 # nimalar yangilanishi mumkin", "side": null, "caption": "apt — Ubuntu va Debian'ning dastur do'koni. Hamma narsa bir buyruq bilan o'rnatiladi va yangilanadi.", "id": "l-apt"}, {"t": "code", "title": "Jarayonlar va xizmatlar", "lang": "bash", "src": "htop                                  # jonli yuklama (q — chiqish)\nps aux | grep python                  # python jarayonlari\nsudo systemctl status shlyuz          # xizmat holati\nsudo systemctl restart shlyuz         # qayta ishga tushirish\nsudo systemctl enable shlyuz          # yuklanishda avtomatik\njournalctl -u shlyuz -n 100           # xizmat loglari\njournalctl -u shlyuz -f               # jonli", "side": null, "caption": "Tarozi yoki server «ishlamayapti» deyilsa — birinchi ikki buyruq: systemctl status va journalctl.", "id": "l-proc"}, {"t": "code", "title": "Tarmoq va disk", "lang": "bash", "src": "ip a                                  # IP manzillar\nping 192.168.10.11                    # kamera javob beryaptimi\nss -tlnp                              # qaysi portlar ochiq, qaysi dastur\ncurl http://localhost:8000/api/ping   # API ishlayaptimi\ndf -h                                 # disklardagi bo'sh joy\ndu -sh /opt/shlyuz/data/*             # qaysi papka qancha joy olgan\nfree -h                               # xotira", "side": null, "caption": null, "id": "l-net"}, {"t": "code", "title": "cron: vazifalarni jadval bo'yicha bajarish", "lang": "text", "src": "# crontab -e  bilan ochiladi\n# daqiqa soat kun oy hafta_kuni  buyruq\n0  2  *  *  *   /opt/scripts/zaxira.sh\n*/5 *  *  *  *   /opt/scripts/tekshir.sh\n0  20 *  *  1-5 /opt/scripts/hisobot.sh\n0  3  1  *  *   find /opt/shlyuz/data/photos -mtime +90 -delete", "side": ["Har kuni soat 02:00 da zaxira.", "Har 5 daqiqada tekshiruv.", "Ish kunlari soat 20:00 da hisobot.", "Har oyning 1-kuni 90 kundan eski rasmlarni o'chirish."], "caption": null, "id": "l-cron"}, {"t": "cards", "title": "Linux'da tarozi portlari", "intro": null, "items": [["Link", "Port nomlari", "USB adapter — /dev/ttyUSB0, o'rnatilgan port — /dev/ttyS0."], ["Users", "Ruxsat", "Foydalanuvchini dialout guruhiga qo'shing: sudo usermod -aG dialout shlyuz."], ["Warning", "Nom almashishi", "Ikki adapter bo'lsa, qayta yuklashda ttyUSB0 va ttyUSB1 almashib qolishi mumkin."]], "id": "l-serial"}, {"t": "code", "title": "Doimiy port nomi: udev qoidasi", "lang": "text", "src": "# 1. Adapter ma'lumotlarini bilish\nudevadm info -a -n /dev/ttyUSB0 | grep -E \"idVendor|idProduct|serial\"\n\n# 2. /etc/udev/rules.d/99-tarozi.rules\nSUBSYSTEM==\"tty\", ATTRS{idVendor}==\"0403\", ATTRS{idProduct}==\"6001\", \\\n  ATTRS{serial}==\"A12345\", SYMLINK+=\"tarozi_kirish\"\n\n# 3. Qo'llash\nsudo udevadm control --reload && sudo udevadm trigger\n# Endi dasturda: /dev/tarozi_kirish", "side": null, "caption": "Adapterning seriya raqami bo'yicha doimiy nom beriladi. Qaysi USB uyaga ulansa ham, tarozi o'z nomi bilan topiladi.", "id": "l-udev"}, {"t": "quiz", "q": "Xizmat ishlamayapti. Sababini bilish uchun birinchi qaysi buyruq?", "opts": ["rm -rf /opt", "systemctl status va journalctl", "apt remove"], "a": 1, "expl": "Holat va loglar deyarli har doim xato sababini ko'rsatadi.", "id": "l-q1"}, {"t": "quiz", "q": "Python dasturi /dev/ttyUSB0 ni ocha olmayapti: «Permission denied». Yechim?", "opts": ["Kabelni almashtirish", "Foydalanuvchini dialout guruhiga qo'shish", "Kompyuterni formatlash"], "a": 1, "expl": "Linux'da ketma-ket portlarga kirish huquqi dialout guruhiga beriladi.", "id": "l-q2"}, {"t": "quiz", "id": "xq-l-0", "q": "tail -f fayl.log nima uchun?", "opts": ["Faylni o'chirish", "Logni jonli kuzatish", "Faylni nusxalash"], "a": 1, "expl": "Yangi qatorlar paydo bo'lishi bilan ekranda chiqadi."}]}, {"id": "d", "num": 13, "title": "Docker: dasturni qutiga joylash", "goal": "Dasturni barcha kerakli narsalari bilan bitta konteynerga joylash, uni istalgan serverda bir xil ishga tushirish va yangilashni o'rganasiz.", "stages": [2], "vol": 2, "blocks": [{"t": "term", "title": "Konteyner", "def": "Dastur va unga kerak bo'lgan hamma narsa (Python, kutubxonalar, sozlamalar) joylangan, boshqa dasturlardan ajratilgan muhit.", "analogy": "Yuk konteyneri: ichida nima bo'lishidan qat'i nazar, kemaga, poyezdga, mashinaga bir xil usulda yuklanadi.", "example": "Bizning API, baza va sinxronizator — uchta konteyner. Yangi serverga ko'chirish: fayllarni nusxalash va bitta buyruq.", "id": "d-what"}, {"t": "compare", "title": "Virtual mashina va konteyner", "left": ["Virtual mashina", ["Ichida to'liq operatsion tizim", "Gigabaytlab disk va xotira", "Daqiqalarda ishga tushadi", "To'liq ajratilgan"]], "right": ["Konteyner", ["Server tizimidan umumiy foydalanadi", "Megabaytlar", "Soniyalarda ishga tushadi", "Yetarlicha ajratilgan, ancha yengil"]], "id": "d-vm"}, {"t": "table", "title": "Docker atamalari", "intro": null, "head": ["Atama", "Ma'nosi"], "rows": [["Image (obraz)", "Tayyor andoza: dastur va muhitning «muzlatilgan» holati"], ["Container", "Obrazdan ishga tushirilgan jonli nusxa"], ["Dockerfile", "Obrazni qanday yig'ish retsepti"], ["Volume", "Konteyner o'chirilganda ham saqlanadigan ma'lumot joyi"], ["Network", "Konteynerlar bir-birini nom bo'yicha topadigan tarmoq"], ["Compose", "Bir nechta konteynerni bitta fayl bilan boshqarish"], ["Registry", "Obrazlar ombori (masalan, Docker Hub)"]], "id": "d-terms"}, {"t": "code", "title": "Docker'ni o'rnatish (Ubuntu)", "lang": "bash", "src": "curl -fsSL https://get.docker.com | sh        # rasmiy o'rnatish skripti\nsudo usermod -aG docker $USER                 # sudo siz ishlatish\n# tizimdan chiqib, qayta kiring\n\ndocker --version\ndocker run hello-world                        # sinov", "side": null, "caption": "«Hello from Docker!» xabari chiqsa — hammasi tayyor. Windows'da Docker Desktop o'rnatiladi.", "id": "d-install"}, {"t": "code", "title": "Birinchi foydali konteyner: PostgreSQL", "lang": "bash", "src": "docker run -d --name baza \\\n  -e POSTGRES_USER=zavod \\\n  -e POSTGRES_PASSWORD=MaxfiyParol \\\n  -p 5432:5432 \\\n  -v pgdata:/var/lib/postgresql/data \\\n  --restart always \\\n  postgres:16", "side": ["<b>-d<\/b> — fonda ishlaydi.", "<b>-e<\/b> — muhit o'zgaruvchilari.", "<b>-p<\/b> — server porti : konteyner porti.", "<b>-v<\/b> — ma'lumot volume'da: konteyner o'chsa ham qoladi.", "<b>--restart always<\/b> — server qayta yuklansa, o'zi ishga tushadi."], "caption": null, "id": "d-run"}, {"t": "table", "title": "Kundalik buyruqlar", "intro": null, "head": ["Buyruq", "Nima qiladi"], "rows": [["docker ps", "Ishlayotgan konteynerlar"], ["docker logs -f baza", "Jonli loglar"], ["docker exec -it baza psql -U zavod", "Konteyner ichida buyruq bajarish"], ["docker stop / start baza", "To'xtatish / ishga tushirish"], ["docker rm baza", "Konteynerni o'chirish (volume qoladi)"], ["docker images", "Yuklangan obrazlar"], ["docker system df", "Docker qancha disk egallagan"]], "id": "d-cmds"}, {"t": "code", "title": "Dockerfile: o'z dasturimiz uchun retsept", "lang": "dockerfile", "src": "FROM python:3.12-slim\n\nWORKDIR /app\n\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\nEXPOSE 8000\nCMD [\"uvicorn\", \"api:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]", "side": ["<b>FROM<\/b> — asos: Python o'rnatilgan tayyor obraz.", "<b>WORKDIR<\/b> — ichki ish papkasi.", "Avval faqat requirements — kod o'zgarsa, kutubxonalar qayta o'rnatilmaydi.", "<b>COPY . .<\/b> — butun kod.", "<b>CMD<\/b> — konteyner ishga tushganda bajariladigan buyruq."], "caption": null, "id": "d-dockerfile"}, {"t": "code", "title": "Obrazni yig'ish va ishga tushirish", "lang": "bash", "src": "docker build -t tarozi-api:1.0 .\ndocker run -d --name api -p 8000:8000 --env-file .env tarozi-api:1.0\ndocker logs -f api", "side": null, "caption": ".dockerignore fayli ham yarating (venv, data, .env) — ular obrazga kirmasin. Parollar obraz ichiga emas, ishga tushirishda --env-file orqali beriladi.", "id": "d-build"}, {"t": "cards", "title": "Ma'lumot qayerda saqlanadi", "intro": null, "items": [["Database", "Named volume", "Docker boshqaradigan joy: -v pgdata:/var/lib/... Baza uchun eng mos."], ["Home", "Bind mount", "Serverdagi aniq papka: -v /opt/data/photos:/app/photos. Rasmlar va loglar uchun qulay."], ["Warning", "Konteyner ichi", "Volume'siz konteyner ichidagi fayllar u o'chirilganda yo'qoladi."]], "id": "d-volumes"}, {"t": "code", "title": "Compose: to'liq tizim bitta faylda", "lang": "yaml", "src": "services:\n  db:\n    image: postgres:16\n    env_file: .env\n    volumes: [pgdata:/var/lib/postgresql/data]\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U zavod\"]\n      interval: 10s\n    restart: always\n  api:\n    build: ./server\n    env_file: .env\n    ports: [\"8000:8000\"]\n    depends_on: {db: {condition: service_healthy}}\n    restart: always\nvolumes: {pgdata: {}}", "side": null, "caption": null, "id": "d-compose"}, {"t": "code", "title": "Compose buyruqlari", "lang": "bash", "src": "docker compose up -d          # hammasini ishga tushirish\ndocker compose ps             # holat\ndocker compose logs -f api    # bitta xizmat loglari\ndocker compose restart api    # bitta xizmatni qayta ishga tushirish\ndocker compose pull           # yangi obrazlarni yuklash\ndocker compose down           # to'xtatish (volume'lar qoladi)", "side": null, "caption": "Konteynerlar bir-birini xizmat nomi bilan topadi: api ichidan bazaga ulanish manzili — db:5432.", "id": "d-compose-cmd"}, {"t": "cards", "title": "Qurilmalar va Docker", "intro": null, "items": [["Link", "Tarozi porti", "Konteynerga portni berish: --device=/dev/tarozi_kirish (compose'da devices bo'limi)."], ["Globe", "Kameralar", "Konteyner tarmoq orqali kameralarga oddiy ulanadi."], ["Settings", "Tavsiya", "Shlyuzni ko'pincha to'g'ridan-to'g'ri xizmat sifatida, serverni esa Docker'da ishga tushirish qulay."]], "id": "d-devices"}, {"t": "steps", "title": "Dasturni xavfsiz yangilash", "intro": null, "items": [["Nusxa", "Bazaning zaxirasi: pg_dump."], ["Yangi versiya", "git pull va docker compose build."], ["Qayta ishga tushirish", "docker compose up -d — faqat o'zgargan xizmatlar yangilanadi."], ["Tekshirish", "docker compose ps, loglar va API ping."], ["Orqaga qaytish", "Muammo bo'lsa: oldingi versiya tegiga qaytib, qayta build."]], "id": "d-update"}, {"t": "quiz", "q": "Konteyner o'chirildi. Baza ma'lumotlari saqlanib qolishi uchun nima kerak edi?", "opts": ["Kattaroq obraz", "Volume ulangan bo'lishi", "Ko'proq xotira"], "a": 1, "expl": "Volume konteynerdan mustaqil saqlanadi.", "id": "d-q1"}, {"t": "quiz", "q": "Parollarni Docker obrazi ichiga yozish to'g'rimi?", "opts": ["Ha, qulay", "Yo'q, ishga tushirishda env_file orqali berish kerak", "Faqat test uchun"], "a": 1, "expl": "Obraz tarqatilishi mumkin; parol uning ichida qolib ketadi.", "id": "d-q2"}, {"t": "quiz", "id": "xq-d-0", "q": "Compose ichidagi konteynerlar bir-birini qanday topadi?", "opts": ["IP ni qo'lda yozib", "Xizmat nomi bilan (masalan, db:5432)", "Topa olmaydi"], "a": 1, "expl": "Compose umumiy tarmoq va nom bo'yicha qidiruvni o'zi sozlaydi."}]}, {"id": "t", "num": 14, "title": "Telegram bot noldan", "goal": "Rahbar va xodimlar uchun bot yaratasiz: buyruqlar, tugmalar, rasmlar, ruxsatlar va har kungi avtomatik hisobot.", "stages": [5], "vol": 2, "blocks": [{"t": "term", "title": "Telegram bot", "def": "Telegram ichidagi dastur: foydalanuvchi xabar yoki buyruq yuboradi, bot sizning serveringizdagi kod orqali javob beradi.", "analogy": "Yordamchi xodim: «bugun nechta mashina keldi?» deb yozasiz, u bazaga qarab darhol javob beradi — kechasi ham, dam olish kunida ham.", "example": "/bugun — kunlik jamlanma, /mashina 01A123BC — shu mashinaning reyslari, har kuni 20:00 da avtomatik hisobot.", "id": "t-what"}, {"t": "steps", "title": "Bot yaratish: BotFather", "intro": null, "items": [["BotFather", "Telegram'da @BotFather ni toping va /newbot yuboring."], ["Nom", "Ko'rinadigan nom: «Tarozi hisoboti»."], ["Username", "_bot bilan tugaydigan noyob nom: korxona_tarozi_bot."], ["Token", "BotFather bergan tokenni .env faylga yozing — bu botning paroli."], ["Buyruqlar ro'yxati", "/setcommands — foydalanuvchilarga ko'rinadigan buyruqlar menyusi."]], "id": "t-create"}, {"t": "flow", "title": "Bot qanday ishlaydi", "items": [["Users", "Foydalanuvchi", "/bugun yozadi"], ["Cloud", "Telegram serveri", "Xabarni saqlab turadi"], ["Settings", "Bizning bot", "Yangi xabarlarni so'raydi (polling)"], ["Database", "API / baza", "Ma'lumot olib, javob yuboradi"]], "caption": "Polling usulida bot o'zi Telegram'dan so'raydi — server internetga ochiq bo'lishi shart emas. Korxona ichidagi server uchun eng qulay yo'l.", "id": "t-how"}, {"t": "code", "title": "Eng oddiy bot", "lang": "python", "src": "# pip install \"python-telegram-bot[job-queue]\"\nimport os\nfrom telegram import Update\nfrom telegram.ext import ApplicationBuilder, CommandHandler, ContextTypes\n\nasync def start(update: Update, context: ContextTypes.DEFAULT_TYPE):\n    ism = update.effective_user.first_name\n    await update.message.reply_text(f\"Salom, {ism}! /bugun — kunlik hisobot\")\n\napp = ApplicationBuilder().token(os.getenv(\"TG_TOKEN\")).build()\napp.add_handler(CommandHandler(\"start\", start))\napp.run_polling()", "side": null, "caption": "async va await — bot bir vaqtda ko'p foydalanuvchiga javob bera olishi uchun. Har bir buyruq — bitta async funksiya.", "id": "t-hello"}, {"t": "table", "title": "Bot buyruqlari rejasi", "intro": null, "head": ["Buyruq", "Nima qiladi", "Kim uchun"], "rows": [["/start", "Salomlashish va yordam", "Hamma"], ["/bugun", "Bugungi tortishlar soni va jami netto", "Rahbar, ombor"], ["/mashina 01A123BC", "Mashinaning oxirgi reyslari", "Rahbar, xavfsizlik"], ["/ochiq", "Hududda turgan mashinalar", "Ombor"], ["/holat", "Tarozi, kamera va 1C holati", "IT"]], "id": "t-cmds"}, {"t": "code", "title": "/bugun: API dan olib javob berish", "lang": "python", "src": "import httpx\n\nAPI = os.getenv(\"API_URL\")\nHDR = {\"X-API-Key\": os.getenv(\"API_KEY\")}\n\nasync def bugun(update: Update, context: ContextTypes.DEFAULT_TYPE):\n    async with httpx.AsyncClient(timeout=10) as c:\n        r = await c.get(f\"{API}/api/reports/daily?days=1\", headers=HDR)\n    d = r.json()[0]\n    matn = (f\"📊 Bugun\\n\"\n            f\"Reyslar: {d['reys']}\\n\"\n            f\"Jami netto: {d['jami']:,} kg\".replace(\",\", \" \"))\n    await update.message.reply_text(matn)\n\napp.add_handler(CommandHandler(\"bugun\", bugun))", "side": null, "caption": null, "id": "t-today"}, {"t": "code", "title": "Buyruq parametrlari: /mashina 01A123BC", "lang": "python", "src": "async def mashina(update: Update, context: ContextTypes.DEFAULT_TYPE):\n    if not context.args:\n        await update.message.reply_text(\"Raqamni yozing: /mashina 01A123BC\")\n        return\n    raqam = context.args[0].upper()\n    reyslar = await api_get(f\"/api/trips?plate={raqam}&limit=5\")\n    if not reyslar:\n        await update.message.reply_text(\"Reys topilmadi\")\n        return\n    qatorlar = [f\"{t['kun']}  {t['netto']} kg\" for t in reyslar]\n    await update.message.reply_text(raqam + \"\\n\" + \"\\n\".join(qatorlar))", "side": null, "caption": "context.args — buyruqdan keyingi so'zlar ro'yxati. Foydalanuvchi parametr bermasa, qanday yozishni ko'rsatamiz.", "id": "t-args"}, {"t": "code", "title": "Tugmalar (inline keyboard)", "lang": "python", "src": "from telegram import InlineKeyboardButton, InlineKeyboardMarkup\nfrom telegram.ext import CallbackQueryHandler\nasync def hisobot(update, context):\n    tugmalar = [[InlineKeyboardButton(\"Bugun\", callback_data=\"d1\"),\n                 InlineKeyboardButton(\"7 kun\", callback_data=\"d7\"),\n                 InlineKeyboardButton(\"30 kun\", callback_data=\"d30\")]]\n    await update.message.reply_text(\"Davrni tanlang:\",\n        reply_markup=InlineKeyboardMarkup(tugmalar))\nasync def tugma_bosildi(update, context):\n    q = update.callback_query\n    await q.answer()\n    kun = int(q.data[1:])\n    await q.edit_message_text(await hisobot_matni(kun))\n\napp.add_handler(CommandHandler(\"hisobot\", hisobot))\napp.add_handler(CallbackQueryHandler(tugma_bosildi))", "side": null, "caption": null, "id": "t-buttons"}, {"t": "code", "title": "Rasm yuborish: shubhali tortish", "lang": "python", "src": "async def shubhali_xabar(context, chat_id, t):\n    with open(t[\"photo\"], \"rb\") as f:\n        await context.bot.send_photo(\n            chat_id=chat_id,\n            photo=f,\n            caption=(f\"⚠️ Tara odatdagidan farq qildi\\n\"\n                     f\"{t['plate']}: {t['tara']} kg \"\n                     f\"(odatda {t['odatiy']} kg)\"),\n        )", "side": ["Rasm fayl sifatida yuboriladi, ostida izoh bilan.", "Rahbar telefonidan rasmga qarab qaror qiladi.", "Bu funksiya server tomonidagi ogohlantirish qoidasidan chaqiriladi."], "caption": null, "id": "t-photo"}, {"t": "code", "title": "Faqat ruxsat etilgan foydalanuvchilar", "lang": "python", "src": "from telegram.ext import filters\n\nRUXSAT = {int(x) for x in os.getenv(\"TG_ALLOWED\").split(\",\")}\nfaqat_bizniki = filters.Chat(chat_id=RUXSAT)\n\napp.add_handler(CommandHandler(\"bugun\", bugun, filters=faqat_bizniki))\napp.add_handler(CommandHandler(\"mashina\", mashina, filters=faqat_bizniki))\n\nasync def id_ber(update, context):\n    await update.message.reply_text(f\"Sizning ID: {update.effective_chat.id}\")\napp.add_handler(CommandHandler(\"id\", id_ber))", "side": null, "caption": "Bot ochiq: uni istalgan kishi topishi mumkin. Korxona ma'lumotlarini faqat ro'yxatdagi foydalanuvchi va guruh ID lariga bering. /id buyrug'i yangi xodimning ID sini bilish uchun.", "id": "t-auth"}, {"t": "code", "title": "Har kuni avtomatik hisobot", "lang": "python", "src": "import datetime as dt\nfrom zoneinfo import ZoneInfo\n\nGURUH = int(os.getenv(\"TG_GROUP\"))\n\nasync def kunlik(context):\n    matn = await hisobot_matni(1)\n    await context.bot.send_message(chat_id=GURUH, text=matn)\n\napp.job_queue.run_daily(\n    kunlik,\n    time=dt.time(hour=20, minute=0, tzinfo=ZoneInfo(\"Asia/Tashkent\")),\n    days=(1, 2, 3, 4, 5),          # dushanba–juma\n)", "side": ["<b>run_daily<\/b> — har kuni belgilangan vaqtda.", "Vaqt zonasini albatta bering, aks holda server vaqti ishlatiladi.", "Hafta kunlari raqamlari python-telegram-bot hujjatida ko'rsatilgan tartibda."], "caption": null, "id": "t-jobs"}, {"t": "cards", "title": "Botni ishga tushirish va qo'llab-quvvatlash", "intro": null, "items": [["Settings", "Xizmat yoki Docker", "Bot doim ishlashi kerak: systemd xizmati yoki compose ichida alohida xizmat."], ["Key", "Token maxfiy", "Token tarqalsa — BotFather'da /revoke bilan yangilang."], ["Book", "Loglar", "Kim qaysi buyruqni qachon ishlatgani yozilsin."], ["Warning", "Xatolarga chidamlilik", "API javob bermasa, bot yiqilmasin — «Ma'lumot vaqtincha mavjud emas» desin."]], "id": "t-deploy"}, {"t": "quiz", "q": "Bot korxona ichidagi serverda ishlaydi, server internetga ochiq emas. Qaysi usul mos?", "opts": ["Polling — bot o'zi Telegram'dan so'raydi", "Faqat webhook", "Bot ishlay olmaydi"], "a": 0, "expl": "Polling uchun faqat chiquvchi internet kerak.", "id": "t-q1"}, {"t": "quiz", "q": "Bot tokeni tasodifan Git'ga tushib qoldi. Nima qilish kerak?", "opts": ["Hech narsa", "BotFather'da tokenni yangilash va eski tokenni bekor qilish", "Botni o'chirib, yangi nom bilan yaratish"], "a": 1, "expl": "Token — parol. Oshkor bo'lsa, darhol almashtiriladi.", "id": "t-q2"}, {"t": "quiz", "id": "xq-t-0", "q": "python-telegram-bot'da context.args nima?", "opts": ["Buyruqdan keyingi so'zlar ro'yxati", "Bot tokeni", "Chat ID"], "a": 0, "expl": "/mashina 01A123BC → context.args = [\"01A123BC\"]"}]}, {"id": "r", "num": 15, "title": "1C hisobotlari va bosma shakllar", "goal": "Kod yozmasdan kuchli hisobotlar (СКД), foydalanuvchi o'zi o'zgartira oladigan sozlamalar va hujjatlarning chop etish shakllarini yaratishni o'rganasiz.", "stages": [3, 5], "vol": 2, "blocks": [{"t": "statement", "title": "Yaxshi hisobot — rahbar savoliga bir qarashda javob", "sub": "«Bugun kim qancha olib keldi?», «Qaysi mashina tez-tez keladi?», «O'tgan oyga nisbatan qancha ko'p?» — СКД bu savollarning hammasiga bitta hisobotda javob bera oladi.", "accent": true, "id": "r-why"}, {"t": "table", "title": "СКД muharriri yorliqlari", "intro": null, "head": ["Yorliq", "Nima qilinadi"], "rows": [["Наборы данных", "So'rov: qayerdan va qanday ma'lumot olinadi"], ["Связи наборов", "Bir nechta so'rovni bog'lash"], ["Вычисляемые поля", "Formula bilan yangi ustunlar"], ["Ресурсы", "Nimalar yig'iladi: summa, soni, o'rtacha"], ["Параметры", "Davr, ombor va boshqa kirish qiymatlari"], ["Настройки", "Guruhlash, filtr, saralash, ko'rinish"]], "id": "r-skd-tabs"}, {"t": "code", "title": "Ma'lumotlar to'plami: so'rov", "lang": "1C", "src": "ВЫБРАТЬ\n    В.Дата КАК Дата,\n    В.Автомобиль КАК Автомобиль,\n    В.Автомобиль.Владелец КАК Контрагент,\n    В.Номенклатура КАК Номенклатура,\n    В.ВесНетто КАК ВесНетто\nИЗ\n    Документ.Взвешивание КАК В\nГДЕ\n    В.Проведен\n    И В.Дата МЕЖДУ &НачалоПериода И &КонецПериода", "side": ["Faqat o'tkazilgan hujjatlar olinadi.", "<b>В.Автомобиль.Владелец<\/b> — havola orqali boshqa ma'lumotnomadan maydon.", "<b>&amp;НачалоПериода<\/b> — parametr: foydalanuvchi davrni o'zi tanlaydi.", "Guruhlash so'rovda emas — sozlamalarda qilinadi."], "caption": null, "id": "r-query"}, {"t": "cards", "title": "Hisoblanadigan maydonlar va resurslar", "intro": null, "items": [["Settings", "Hisoblanadigan maydon", "Masalan, «ВесТонн» = ВесНетто / 1000. So'rovni o'zgartirmasdan yangi ustun."], ["Chart", "Resurs: Сумма", "ВесНетто bo'yicha jami: har bir guruh va umumiy yakun."], ["Check", "Resurs: Количество", "Reyslar soni: Количество(Различные Регистратор)."], ["Activity", "Resurs: Среднее, Максимум", "O'rtacha yuk va eng katta yuk."]], "id": "r-calc"}, {"t": "steps", "title": "Sozlamalar: hisobot ko'rinishini yig'ish", "intro": null, "items": [["Guruhlash", "Настройки → Добавить группировку: Контрагент, ichida Автомобиль."], ["Batafsil yozuvlar", "Eng pastki darajada — alohida tortishlar (kerak bo'lsa)."], ["Tanlangan maydonlar", "Qaysi ustunlar ko'rinadi: Reyslar, Jami netto, Tonna."], ["Filtr (отбор)", "Masalan, faqat bitta mahsulot yoki ombor."], ["Saralash", "Jami netto bo'yicha kamayish tartibida."], ["Diagramma", "Guruhlash o'rniga diagramma qo'shish — ustunli yoki doiraviy."]], "id": "r-settings"}, {"t": "cards", "title": "Shartli bezash va foydalanuvchi sozlamalari", "intro": null, "items": [["Warning", "Shartli bezash", "Masalan, 40 tonnadan og'ir reyslar sariq fonda. Rahbar ko'zi darhol tushadi."], ["Users", "Foydalanuvchi sozlamalari", "Tez filtrlar (davr, kontragent) hisobot tepasida — foydalanuvchi Konfiguratorga kirmaydi."], ["Book", "Variantlar", "Bitta hisobotning bir nechta ko'rinishi: «Kontragentlar bo'yicha», «Kunlar bo'yicha»."]], "id": "r-cond"}, {"t": "code", "title": "Hisobotni kod orqali shakllantirish", "lang": "1C", "src": "Схема = ПолучитьМакет(\"ОсновнаяСхемаКомпоновкиДанных\");\nНастройки = Схема.НастройкиПоУмолчанию;\n\nКомпоновщик = Новый КомпоновщикМакетаКомпоновкиДанных;\nМакет = Компоновщик.Выполнить(Схема, Настройки);\n\nПроцессор = Новый ПроцессорКомпоновкиДанных;\nПроцессор.Инициализировать(Макет);\n\nТабДок = Новый ТабличныйДокумент;\nВывод = Новый ПроцессорВыводаРезультатаКомпоновкиДанныхВТабличныйДокумент;\nВывод.УстановитьДокумент(ТабДок);\nВывод.Вывести(Процессор);", "side": null, "caption": "Oddiy holatda buni yozish shart emas — hisobot formasi o'zi qiladi. Kod kerak bo'ladi, masalan, hisobotni har kuni avtomatik PDF qilib Telegram'ga yuborish uchun.", "id": "r-code"}, {"t": "term", "title": "Bosma shakl (макет)", "def": "Hujjatni qog'ozga chiqarish uchun tayyorlangan shablon: chiziqlar, logotip, matn va hujjatdan olinadigan qiymatlar uchun joylar.", "analogy": "Blank: bosmaxonada chop etilgan, faqat bo'sh joylarini to'ldirish qoladi.", "example": "«Tortish taloni»: korxona nomi, raqam, sana, mashina, brutto, tara, netto, operator imzosi uchun joy.", "id": "r-print"}, {"t": "cards", "title": "Табличный документ tuzilishi", "intro": null, "items": [["Home", "Hududlar (области)", "Nomlangan qator guruhlari: Шапка (sarlavha), Строка (jadval qatori), Подвал (yakun)."], ["Settings", "Parametrlar", "Katak ichidagi o'zgaruvchi joy: [Номер], [Дата]. Kod ularni to'ldiradi."], ["Chart", "Qayta ishlatish", "Строка hududi har bir mahsulot uchun qayta-qayta chiqariladi."]], "id": "r-mxl"}, {"t": "steps", "title": "Shablon yaratish", "intro": null, "items": [["Maket qo'shing", "Hujjat → Макеты → Добавить → Табличный документ, nomi: Талон."], ["Chizing", "Kataklarni birlashtiring, chegaralar va shriftlarni belgilang."], ["Hududlarni belgilang", "Qatorlarni tanlab → Таблица → Имена → Назначить имя: Шапка."], ["Parametrlar", "Katak xususiyatlarida Заполнение: Параметр, nomi: Нетто."], ["Chop etish buyrug'i", "Hujjat formasiga «Talon» tugmasini qo'shing."]], "id": "r-mxl-steps"}, {"t": "code", "title": "Shablonni to'ldirish", "lang": "1C", "src": "Функция ПечатьТалона(Ссылка) Экспорт\n    Макет = Документы.Взвешивание.ПолучитьМакет(\"Талон\");\n    ТабДок = Новый ТабличныйДокумент;\n\n    Шапка = Макет.ПолучитьОбласть(\"Шапка\");\n    Шапка.Параметры.Номер = Ссылка.Номер;\n    Шапка.Параметры.Дата = Формат(Ссылка.Дата, \"ДФ='dd.MM.yyyy HH:mm'\");\n    Шапка.Параметры.Автомобиль = Ссылка.Автомобиль;\n    Шапка.Параметры.Брутто = Ссылка.ВесБрутто;\n    Шапка.Параметры.Тара = Ссылка.ВесТара;\n    Шапка.Параметры.Нетто = Ссылка.ВесНетто;\n    ТабДок.Вывести(Шапка);\n\n    Возврат ТабДок;\nКонецФункции", "side": null, "caption": null, "id": "r-print-code", "notes": "Funksiya serverda ishlaydi va tayyor hujjatni qaytaradi. Klient tomonda ТабДок.Показать() — ekranda ko'rsatish va chop etish."}, {"t": "cards", "title": "Hisobot va talonni faylga saqlash", "intro": null, "items": [["Book", "PDF", "ТабДок.Записать(Путь, ТипФайлаТабличногоДокумента.PDF) — elektron pochta yoki Telegram uchun."], ["Chart", "Excel", "ТипФайлаТабличногоДокумента.XLSX — keyingi tahlil uchun."], ["PaperPlane", "Avtomatik yuborish", "Регламентное задание: har kuni hisobotni PDF qilib, rahbarga yuborish."]], "id": "r-export"}, {"t": "quiz", "q": "Hisobotda kontragent bo'yicha guruhlash qayerda qilinadi?", "opts": ["So'rov matnida GROUP BY bilan", "СКД Настройки yorlig'ida", "Formaning modulida"], "a": 1, "expl": "So'rov faqat ma'lumot beradi; guruhlash va ko'rinish sozlamalarda — foydalanuvchi uni o'zi o'zgartira oladi.", "id": "r-q1"}, {"t": "quiz", "q": "Talon shablonida [Нетто] kabi joylar nima deyiladi?", "opts": ["Parametrlar", "Registrlar", "Rollar"], "a": 0, "expl": "Kod Шапка.Параметры.Нетто orqali ularni to'ldiradi.", "id": "r-q2"}, {"t": "quiz", "id": "xq-r-0", "q": "Табличный документ dagi Шапка, Строка, Подвал nima?", "opts": ["Nomlangan hududlar", "Registrlar", "Rollar"], "a": 0, "expl": "Kod hududlarni olib, parametrlarini to'ldiradi va chiqaradi."}]}, {"id": "xl", "num": 16, "title": "Excel va Power Query", "goal": "Excel'dagi hisobotlarni qo'lda nusxalash o'rniga, ular bazadan, API dan yoki 1C dan bir tugma bilan yangilanadigan qilishni o'rganasiz.", "stages": [5], "vol": 2, "blocks": [{"t": "statement", "title": "Excel yo'qolmaydi — lekin undagi raqamlar qo'lda kiritilmasligi kerak", "sub": "Buxgalter va rahbarlar Excel'ni yaxshi ko'radi. Maqsad — Excel'ni bazaga ulash: har kuni ochganda eng yangi ma'lumot o'zi tushsin.", "accent": true, "id": "xl-why"}, {"t": "cards", "title": "Aqlli jadval (Ctrl+T)", "intro": null, "items": [["Database", "Nima", "Oddiy katak diapazoni emas, nomli jadval: yangi qatorlar avtomatik qo'shiladi."], ["Settings", "Formulalar", "Ustun nomi bilan: =[@Brutto]-[@Tara]. Butun ustunga o'zi tarqaladi."], ["Link", "Manba sifatida", "Pivot va Power Query uchun eng yaxshi manba."]], "id": "xl-table"}, {"t": "table", "title": "Hisobot uchun eng foydali formulalar", "intro": null, "head": ["Formula", "Nima qiladi"], "rows": [["SUMIFS", "Shartlar bo'yicha yig'indi: bitta mashinaning bugungi nettosi"], ["COUNTIFS", "Shartlar bo'yicha soni: reyslar soni"], ["XLOOKUP", "Boshqa jadvaldan qidirish: raqam bo'yicha egasi"], ["IF / IFS", "Shart: 40 000 dan katta bo'lsa «Og'ir»"], ["TEXT", "Sana va sonni chiroyli ko'rinishga"], ["UNIQUE, SORT, FILTER", "Dinamik ro'yxatlar"]], "id": "xl-formulas"}, {"t": "steps", "title": "Yig'ma jadval (Pivot table)", "intro": null, "items": [["Manba", "Aqlli jadval ichida turing → Вставка → Сводная таблица."], ["Qatorlar", "Kontragent, keyin Mashina."], ["Ustunlar", "Sana (oylar bo'yicha guruhlab)."], ["Qiymatlar", "Netto — Summa, Reyslar — Soni."], ["Srezlar", "Вставить срез — mahsulot va tarozi bo'yicha tugmali filtr."]], "id": "xl-pivot"}, {"t": "term", "title": "Power Query", "def": "Excel ichidagi vosita: turli manbalardan ma'lumotni oladi, tozalaydi, birlashtiradi va jadvalga yuklaydi. Barcha qadamlar eslab qolinadi va bir tugma bilan takrorlanadi.", "analogy": "Retsept daftari: bir marta «qaerdan olish, nimani tozalash, qanday tartiblash»ni yozasiz — keyin har kuni bir tugma.", "example": "Har kuni ertalab: API dan kechagi tortishlar olinadi, keraksiz ustunlar olib tashlanadi, mashinalar egasi qo'shiladi, hisobot yangilanadi.", "id": "xl-pq"}, {"t": "table", "title": "Power Query ulanadigan manbalar", "intro": null, "head": ["Manba", "Qanday", "Qachon"], "rows": [["CSV / Excel fayl", "Данные → Из текстового/CSV-файла", "Bir martalik yoki eksport"], ["Papka", "Данные → Из папки", "Har kuni yangi fayl tushadigan papka"], ["PostgreSQL", "Данные → Из базы данных", "Server bazasi (drayver kerak)"], ["Web / API", "Данные → Из Интернета", "Bizning FastAPI"], ["OData", "Данные → Из канала OData", "1C standart interfeysi"]], "id": "xl-sources"}, {"t": "table", "title": "Tez-tez ishlatiladigan o'zgartirishlar", "intro": null, "head": ["Amal", "Nima uchun"], "rows": [["Тип данных", "Matnni son yoki sanaga aylantirish"], ["Разделить столбец", "«ST,GS,12450» ni ustunlarga bo'lish"], ["Фильтр", "Keraksiz qatorlarni olib tashlash"], ["Группировать по", "Mashina yoki kun bo'yicha yig'indi"], ["Объединить запросы", "Tortishlarga mashina egasini qo'shish (JOIN)"], ["Отменить свёртывание", "Keng jadvalni uzun ko'rinishga (unpivot)"]], "id": "xl-steps"}, {"t": "code", "title": "Power Query: API dan ma'lumot olish (M tili)", "lang": "m", "src": "let\n    Manba = Json.Document(Web.Contents(\n        \"http://192.168.20.10:8000/api/weighings\",\n        [Query = [limit = \"5000\"],\n         Headers = [#\"X-API-Key\" = ApiKalit]])),\n    Jadval = Table.FromRecords(Manba),\n    Turlar = Table.TransformColumnTypes(Jadval, {\n        {\"ts\", type datetimezone}, {\"brutto\", Int64.Type},\n        {\"tara\", Int64.Type}}),\n    Netto = Table.AddColumn(Turlar, \"netto\",\n        each [brutto] - [tara], Int64.Type)\nin\n    Netto", "side": null, "caption": "ApiKalit — alohida parametr (Управление параметрами). Faylni boshqalarga yuborishdan oldin kalit ichida qolmaganini tekshiring.", "id": "xl-api"}, {"t": "code", "title": "Power Query: 1C dan OData orqali", "lang": "m", "src": "let\n    Manba = OData.Feed(\n        \"http://server/zavod/odata/standard.odata/Document_Взвешивание\"\n        & \"?$select=Number,Date,ВесНетто&$filter=Posted eq true\"),\n    Turlar = Table.TransformColumnTypes(Manba,\n        {{\"Date\", type datetime}, {\"ВесНетто\", type number}})\nin\n    Turlar", "side": null, "caption": "Birinchi ulanishda Excel login-parol so'raydi (Basic): 1C foydalanuvchisi. Faqat o'qish huquqi bor alohida foydalanuvchi bering.", "id": "xl-odata"}, {"t": "cards", "title": "Avtomatik yangilanish", "intro": null, "items": [["Play", "Hammasini yangilash", "Данные → Обновить все (Ctrl+Alt+F5)."], ["Clock", "Ochilganda", "Ulanish xususiyatlari → «Обновлять при открытии файла»."], ["Activity", "Har N daqiqada", "Ulanish xususiyatlari → «Обновлять каждые … мин» — ekranda ochiq turgan dashboard uchun."]], "id": "xl-refresh"}, {"t": "compare", "title": "Excel hisoboti yoki web dashboard", "left": ["Excel", ["Buxgalter va tahlilchilar uchun qulay", "O'z formulalarini qo'sha oladi", "Fayl nusxalari ko'payib ketadi", "Telefonda noqulay"]], "right": ["Web dashboard", ["Hamma bir xil, eng yangi raqamni ko'radi", "Telefonda ham ishlaydi", "Real vaqtda yangilanadi", "Yangi ko'rsatkich uchun dasturchi kerak"]], "id": "xl-vs"}, {"t": "steps", "title": "Amaliy mashqlar", "intro": null, "items": [["Aqlli jadval", "Tortishlar CSV sini yuklab, Ctrl+T va netto ustuni."], ["Pivot", "Kontragent va oy bo'yicha yig'ma jadval va srez."], ["Power Query", "Papkadagi barcha CSV larni bitta jadvalga birlashtiring."], ["Birlashtirish", "Mashinalar ro'yxatidan egasini qo'shing."], ["API", "O'z API ingizdan ma'lumot olib, yangilab ko'ring."]], "id": "xl-practice"}, {"t": "quiz", "q": "Power Query'ning asosiy afzalligi nima?", "opts": ["Chiroyli ranglar", "Barcha tozalash qadamlari eslab qolinadi va bir tugma bilan takrorlanadi", "Faylni kichraytiradi"], "a": 1, "expl": "Har kungi qo'l mehnati bir marta yozilgan «retsept»ga aylanadi.", "id": "xl-q1"}, {"t": "quiz", "q": "Excel faylida API kalit qoldi va fayl hamkorga yuborildi. Nima qilish kerak?", "opts": ["Hech narsa", "Kalitni serverda almashtirish", "Faylni qayta nomlash"], "a": 1, "expl": "Kalit oshkor bo'ldi — uni bekor qilib, yangisini berish kerak.", "id": "xl-q2"}, {"t": "quiz", "id": "xq-xl-0", "q": "Power Query'da ikki jadvalni bog'lash amali?", "opts": ["Объединить запросы", "Фильтр", "Тип данных"], "a": 0, "expl": "SQL dagi JOIN ning o'xshashi."}]}, {"id": "hw", "num": 17, "title": "Qo'shimcha qurilmalar: RFID, shtrix-kod, shlagbaum, svetofor", "goal": "Tizimni kengaytirasiz: mashinani karta bilan tanish, mahsulotni skaner bilan kiritish, shlagbaum va svetoforni dastur orqali boshqarish, chek chop etish.", "stages": [0, 1], "vol": 2, "blocks": [{"t": "table", "title": "Qurilmalar va ularning vazifasi", "intro": null, "head": ["Qurilma", "Vazifasi", "Ulanishi"], "rows": [["RFID o'quvchi", "Mashina yoki haydovchi kartasini tanish", "USB, RS-485, Ethernet"], ["Shtrix-kod skaneri", "Mahsulot, qop, hujjatni tez kiritish", "USB (klaviatura), COM"], ["Rele moduli", "Qurilmani yoqish/o'chirish buyrug'i", "USB, Modbus TCP"], ["Shlagbaum", "Kirish-chiqishni boshqarish", "Rele orqali"], ["Svetofor", "Haydovchiga signal: kutish yoki yurish", "Rele orqali"], ["IR datchiklar", "Mashina platformada to'liq turganini aniqlash", "Diskret kirish"], ["Chek printeri", "Haydovchiga talon", "USB, Ethernet"]], "id": "hw-list"}, {"t": "term", "title": "RFID", "def": "Radio orqali kontaktsiz tanish: kartada yoki stikerda chip va antenna bor, o'quvchi uni masofadan o'qiydi va noyob raqamini oladi.", "analogy": "Metro kartasi: turniketga tegizasiz — u sizni taniydi.", "example": "Doimiy keladigan yuk mashinalari old oynasiga stiker. Mashina darvozaga yaqinlashishi bilan kim ekani ma'lum — raqamni kamera o'qimasa ham.", "id": "hw-rfid"}, {"t": "table", "title": "RFID turlari", "intro": null, "head": ["Chastota", "Masofa", "Qo'llanish"], "rows": [["LF (125 kHz)", "bir necha sm", "Oddiy kirish kartalari"], ["HF (13,56 MHz)", "bir necha sm", "Mifare kartalar, xodimlar kartasi"], ["UHF (860–960 MHz)", "bir necha metrgacha", "Transport, ombordagi qoplar va palletlar"]], "id": "hw-rfid-types", "notes": "Transport uchun odatda UHF ishlatiladi: haydovchi mashinadan tushmasdan o'qiladi. Aniq masofa o'quvchi, antenna va stiker turiga bog'liq."}, {"t": "code", "title": "RFID o'quvchidan karta raqamini olish", "lang": "python", "src": "import serial\n\nwith serial.Serial(\"/dev/rfid_darvoza\", 9600, timeout=1) as ser:\n    oxirgi = None\n    while True:\n        q = ser.readline().decode(\"ascii\", \"ignore\").strip()\n        if not q or q == oxirgi:\n            continue\n        oxirgi = q\n        mashina = db.mashina_karta_boyicha(q)\n        if mashina:\n            print(\"Tanildi:\", mashina.plate)\n        else:\n            print(\"Noma'lum karta:\", q)", "side": ["Ko'p o'quvchilar karta raqamini oddiy matn qatori sifatida yuboradi.", "Bir karta ketma-ket bir necha marta o'qiladi — takrorlarini o'tkazib yuboramiz.", "Karta raqami bazadagi mashina bilan bog'lanadi."], "caption": null, "id": "hw-rfid-read"}, {"t": "table", "title": "Shtrix-kod turlari", "intro": null, "head": ["Tur", "Misol", "Qayerda"], "rows": [["EAN-13", "13 raqam", "Do'kondagi mahsulotlar"], ["Code 128", "Harf va raqamlar", "Ombor yorliqlari, qoplar"], ["QR", "Kvadrat, ko'p ma'lumot", "Talonlar, hujjatlar, havolalar"], ["DataMatrix", "Kichik kvadrat", "Markirovka, kichik detallar"]], "id": "hw-barcode"}, {"t": "cards", "title": "Skaner ish rejimlari", "intro": null, "items": [["Wrench", "Klaviatura rejimi (HID)", "Skaner klaviaturadek «yozadi»: kod kursor turgan joyga tushadi va Enter bosiladi. Sozlash shart emas."], ["Link", "COM-port rejimi", "Kod dasturga to'g'ridan-to'g'ri keladi, fokus qayerdaligidan qat'i nazar. Avtomatlashtirish uchun ishonchliroq."], ["Settings", "Sozlash", "Rejim skaner qo'llanmasidagi maxsus shtrix-kodlarni skanerlash bilan o'zgartiriladi."]], "id": "hw-scanner"}, {"t": "term", "title": "Rele", "def": "Kichik elektr signali bilan kattaroq elektr zanjirini yoqib-o'chiradigan kalit. Kompyuter rele orqali shlagbaum, chiroq yoki sirenani boshqaradi.", "analogy": "Uydagi chiroq tugmasi: bosasiz — zanjir ulanadi. Rele — xuddi shu tugma, faqat uni dastur bosadi.", "example": "Rele 1 yopilsa — shlagbaum ochilish signalini oladi. Rele 2 — svetofor yashil chirog'i.", "id": "hw-relay"}, {"t": "table", "title": "Rele modullari turlari", "intro": null, "head": ["Tur", "Afzalligi", "E'tibor bering"], "rows": [["USB rele", "Arzon, oddiy", "Kompyuter yonida bo'lishi kerak"], ["Ethernet rele (Modbus TCP)", "Tarmoq orqali, istalgan masofada", "IP manzil, qurilmalar VLAN"], ["Sanoat kontrolleri (PLC)", "Juda ishonchli, mustaqil ishlaydi", "Alohida dasturlash"]], "id": "hw-relay-types"}, {"t": "statement", "title": "Xavfsizlik qoidasi: shlagbaumni mashina ustiga tushirmaslik dastur emas, uskunaning vazifasi", "sub": "Shlagbaumda o'zining IR datchigi yoki induksion halqasi bo'lishi shart. Dastur faqat «ochil» buyrug'ini beradi; yopilishni uskunaning xavfsizlik tizimi nazorat qiladi. Elektr ulanishlarni faqat elektrik bajaradi.", "accent": true, "id": "hw-safety"}, {"t": "flow", "title": "Avtomatik darvoza mantiqi", "items": [["Search", "Tanish", "Kamera yoki RFID mashinani taniydi"], ["Lock", "Ruxsat", "Ro'yxatda bormi, ochiq reysi to'g'rimi"], ["Lightning", "Buyruq", "Rele: shlagbaum ochilsin"], ["Book", "Qayd", "Kim, qachon o'tgani yoziladi"]], "caption": "Ruxsat bo'lmasa — shlagbaum yopiq qoladi, operatorga xabar va rasm yuboriladi. Qo'lda ochish ham logga yoziladi.", "id": "hw-barrier"}, {"t": "code", "title": "Ethernet rele: Modbus orqali boshqarish", "lang": "python", "src": "from pymodbus.client import ModbusTcpClient\nimport time\n\nrele = ModbusTcpClient(\"192.168.10.40\", port=502)\nrele.connect()\n\ndef impuls(kanal, soniya=1.0):\n    rele.write_coil(kanal, True, slave=1)     # yoqish\n    time.sleep(soniya)\n    rele.write_coil(kanal, False, slave=1)    # o'chirish\n\nimpuls(0)            # 0-kanal: shlagbaumga «ochil» signali", "side": ["Ko'p shlagbaumlar qisqa impulsni «ochil» buyrug'i sifatida qabul qiladi.", "<b>write_coil<\/b> — Modbus orqali bitta chiqishni yoqish yoki o'chirish.", "Kanal raqamlari va impuls davomiyligi uskuna qo'llanmasida."], "caption": null, "id": "hw-modbus-relay"}, {"t": "code", "title": "Svetofor: tarozi holatiga qarab", "lang": "python", "src": "QIZIL, YASHIL = 1, 2        # rele kanallari\n\ndef svetofor(holat):\n    if holat in (Holat.KIRISH, Holat.BARQAROR):\n        rele.write_coil(YASHIL, False, slave=1)\n        rele.write_coil(QIZIL, True, slave=1)      # kuting\n    elif holat in (Holat.YOZILDI, Holat.BOSH):\n        rele.write_coil(QIZIL, False, slave=1)\n        rele.write_coil(YASHIL, True, slave=1)     # yuring", "side": ["Holat mashinasi (9-modul) har o'zgarganda svetofor yangilanadi.", "Tortish tugamaguncha — qizil: haydovchi tarozidan tushmaydi.", "Avval biri o'chiriladi, keyin boshqasi yoqiladi — ikkalasi bir vaqtda yonmaydi."], "caption": null, "id": "hw-light"}, {"t": "cards", "title": "Mashina platformada to'liq turibdimi", "intro": null, "items": [["Search", "IR to'siqlar", "Platformaning ikki chetida infraqizil nur: nur kesilgan bo'lsa — g'ildirak chetda."], ["Check", "Dasturiy tekshiruv", "Datchik «band» bo'lsa, tortish yozilmaydi va svetofor qizil qoladi."], ["Search", "Kamera nazorati", "Orqa kamera kadrida g'ildiraklar holatini tekshirish — qo'shimcha dalil."]], "id": "hw-position"}, {"t": "code", "title": "Datchiklarni o'qish: diskret kirishlar", "lang": "python", "src": "def platforma_toza():\n    rr = rele.read_discrete_inputs(address=0, count=2, slave=1)\n    if rr.isError():\n        return False                   # bilmasak — xavfsiz tomonda\n    old_chet, orqa_chet = rr.bits[0], rr.bits[1]\n    return not old_chet and not orqa_chet\n\nif barqaror and platforma_toza():\n    tortishni_yoz()\nelse:\n    logging.warning(\"Mashina platformada to'liq emas\")", "side": ["Ko'p Ethernet rele modullarida diskret kirishlar ham bor.", "Datchik javob bermasa — tortish yozilmaydi (xavfsiz standart).", "Kirishlar tartibi modul qo'llanmasida."], "caption": null, "id": "hw-inputs"}, {"t": "cards", "title": "Haydovchi uchun katta tablo", "intro": null, "items": [["Activity", "Nima uchun", "Haydovchi kabinadan og'irlikni ko'radi — nizolar kamayadi."], ["Link", "Ulanish", "Ko'p tablolar indikatorning ikkinchi portiga to'g'ridan-to'g'ri ulanadi."], ["Settings", "Qo'shimcha matn", "Ba'zi tablolar dastur orqali «Yuring», «Kuting» kabi matnni ham ko'rsatadi."]], "id": "hw-display"}, {"t": "code", "title": "Chek printeri: ESC/POS", "lang": "python", "src": "# pip install python-escpos\nfrom escpos.printer import Network\n\np = Network(\"192.168.10.30\")          # tarmoq chek printeri\np.set(align=\"center\", bold=True)\np.text(\"KORXONA - TORTISH TALONI\\n\")\np.set(align=\"left\", bold=False)\np.text(f\"Raqam:  {reys['plate']}\\n\")\np.text(f\"Brutto: {reys['brutto']:>8} kg\\n\")\np.text(f\"Tara:   {reys['tara']:>8} kg\\n\")\np.text(f\"Netto:  {reys['netto']:>8} kg\\n\")\np.qr(f\"https://tarozi.korxona.uz/t/{reys['id']}\", size=6)\np.cut()", "side": null, "caption": "ESC/POS — ko'pchilik chek printerlari tushunadigan buyruqlar tili. QR-kod talonning haqiqiyligini tekshirish sahifasiga olib boradi.", "id": "hw-escpos"}, {"t": "quiz", "q": "Shlagbaum mashina ustiga tushmasligini nima kafolatlashi kerak?", "opts": ["Faqat Python kodi", "Shlagbaumning o'z xavfsizlik datchigi (IR yoki induksion halqa)", "Operator"], "a": 1, "expl": "Hayot va mulk xavfsizligi dasturiy xatoga bog'liq bo'lmasligi kerak.", "id": "hw-q1"}, {"t": "quiz", "q": "Platforma chetidagi datchik javob bermayapti. Tortish y
