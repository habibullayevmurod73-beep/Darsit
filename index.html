<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avtomatlashtirish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#EEF3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111916" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Avtomatlashtirish">
<meta name="description" content="Korxonani avtomatlashtirishni noldan o'rganish: tarozi, kamera, server, 1C, sun'iy intellekt.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --raise:#FFFFFF; --ink:#1D2B27; --body:#3F4E49; --muted:#66756F;
  --line:#D6E0DB; --chip:#E4ECE8; --primary:#3A6E62; --primary-ink:#FFFFFF; --primary-soft:#DCEAE4;
  --skip:#F4DADA; --ok:#2F7A5B; --ok-soft:#DDEFE5; --bad:#B54848; --bad-soft:#F8E1E1; --warn-soft:#F7EED9;
  --code:#1C2723; --code-ink:#E3ECE8; --code-dim:#8FA69E; --code-str:#E9C77B;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --tabh:76px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111916; --surface:#19231F; --raise:#1E2A25; --ink:#E6EEEA; --body:#BCCAC4; --muted:#8FA39B;
    --line:#2A3833; --chip:#22302B; --primary:#74B8A4; --primary-ink:#0E1714; --primary-soft:#1F3A32;
    --skip:#4A2A2C; --ok:#6CC49C; --ok-soft:#173329; --bad:#EC8A8A; --bad-soft:#3A2023; --warn-soft:#332B17;
    --code:#0D1411; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111916; --surface:#19231F; --raise:#1E2A25; --ink:#E6EEEA; --body:#BCCAC4; --muted:#8FA39B;
  --line:#2A3833; --chip:#22302B; --primary:#74B8A4; --primary-ink:#0E1714; --primary-soft:#1F3A32;
  --skip:#4A2A2C; --ok:#6CC49C; --ok-soft:#173329; --bad:#EC8A8A; --bad-soft:#3A2023; --warn-soft:#332B17;
  --code:#0D1411; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.55;
  -webkit-tap-highlight-color:transparent}
a{color:var(--primary)}
button{font:inherit; cursor:pointer; color:inherit}
:focus-visible{outline:3px solid var(--primary); outline-offset:2px; border-radius:6px}
code,.mono{font-family:var(--mono)}

/* ---------- app shell ---------- */
.appbar{position:sticky; top:0; z-index:20; background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 10px; display:flex; align-items:center; gap:10px; max-width:820px; margin:0 auto}
.appbar-title{font-family:var(--serif); font-weight:700; font-size:22px; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em}
body[data-page="home"] .appbar-title{font-size:clamp(25px,7vw,32px)}
.back[hidden], .iconbtn[hidden]{display:none !important}
.back{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-size:22px; line-height:1; display:grid; place-items:center; flex:none}
.saved{color:var(--muted); font-size:15px; white-space:nowrap}
.pill{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:16px; padding:8px 16px; text-decoration:none; font-size:16px; white-space:nowrap}
.iconbtn{width:42px; height:42px; border-radius:14px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; color:var(--ink); text-decoration:none; flex:none}
.iconbtn svg{width:20px; height:20px}
main{padding:6px 20px calc(var(--tabh) + 36px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:780px; margin:0 auto}
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center}
.tabbar-in{display:grid; grid-template-columns:repeat(5,1fr); width:100%; max-width:640px}
.tab{display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--muted); font-size:13.5px; padding:4px 0}
.tab svg{width:26px; height:26px}
.tab.on{color:var(--primary); font-weight:700}

/* ---------- home ---------- */
.today{color:var(--muted); font-size:16px; margin:4px 0 0}
.bignum{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin:0 0 14px}
.bignum b{font-family:var(--serif); font-weight:700; font-size:clamp(64px,16vw,96px); line-height:1; color:var(--primary); letter-spacing:-.02em}
.bignum span{color:var(--muted); font-size:19px}
.legend-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px}
.legend{display:flex; gap:16px; color:var(--muted); font-size:15px; flex:1; min-width:220px}
.legend i{display:inline-block; width:16px; height:16px; border-radius:5px; vertical-align:-3px; margin-right:6px}
.weeknav{display:flex; align-items:center; gap:10px}
.weeknav button{width:46px; height:46px; border-radius:14px; border:1px solid var(--line); background:var(--surface); font-size:20px}
.weeknav span{min-width:96px; text-align:center; color:var(--muted)}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:22px; margin-bottom:16px}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:8px}
.day{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.day i{width:100%; max-width:46px; aspect-ratio:1; border-radius:12px; background:var(--chip); display:grid; place-items:center; font-style:normal; font-weight:700; color:var(--ink); font-size:15px}
.day.done i{background:var(--primary); color:var(--primary-ink)}
.day.skip i{background:var(--skip)}
.day.now i{box-shadow:0 0 0 2px var(--primary) inset}
.cont{text-align:center; padding:28px 22px}
.cont h2{font-family:var(--serif); font-size:26px; margin:0 0 8px}
.cont p{color:var(--muted); margin:0 auto 18px; max-width:44ch}
.quick{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.quick a{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px 12px; text-decoration:none; color:var(--ink); text-align:center; font-size:15px; font-weight:600}
.quick small{display:block; color:var(--muted); font-weight:400; font-size:13px; margin-top:2px}

/* ---------- headings & text ---------- */
.crumbs{font-size:14px; color:var(--muted); margin:4px 0 8px}
.crumbs a{color:var(--muted)}
h1{font-family:var(--serif); font-size:clamp(28px,6vw,38px); line-height:1.15; margin:6px 0 12px; letter-spacing:-.01em}
h2{font-family:var(--serif); font-size:23px; line-height:1.25; margin:0 0 12px}
h3{font-size:17px; line-height:1.3; margin:0 0 6px}
.lead{font-size:18px; color:var(--body); margin:0 0 22px}
p{margin:0 0 12px}
.facts{color:var(--muted); font-size:15px}
.sec-h{font-family:var(--serif); font-size:22px; margin:30px 0 12px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:16px; padding:13px 22px; font-weight:600; border:1px solid transparent; text-decoration:none; font-size:16.5px}
.btn-primary{background:var(--primary); color:var(--primary-ink)}
.btn-ghost{background:var(--surface); border-color:var(--line); color:var(--ink)}
.btn-ok{background:var(--ok); color:#fff}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:13px; font-weight:600; background:var(--chip); color:var(--body)}
.badge.k{background:var(--warn-soft); color:var(--ink)}
.badge.y{background:var(--primary); color:var(--primary-ink)}
.bar{height:6px; background:var(--chip); border-radius:3px; overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; background:var(--primary); border-radius:3px}

/* ---------- lists (modules, lessons, hubs) ---------- */
.rm-vol{font-weight:600; color:var(--muted); margin:22px 0 8px; font-size:15px}
.rm{display:grid; grid-template-columns:44px minmax(0,1fr); gap:14px; align-items:center; background:var(--surface);
  border:1px solid var(--line); border-radius:18px; padding:16px; text-decoration:none; color:var(--ink); margin-bottom:10px}
.rm-n{width:44px; height:44px; border-radius:14px; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; font-weight:700; font-family:var(--mono); font-size:15px}
.rm h3{margin:0 0 2px}
.rm p{margin:0; color:var(--muted); font-size:14.5px; line-height:1.45}
.rm-prog{grid-column:2; font-size:13px; color:var(--muted)}
.chain{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:4px 0 22px}
.chain span{font-size:13px; padding:5px 11px; border-radius:10px; border:1px solid var(--line); color:var(--muted); background:var(--surface)}
.chain span.on{background:var(--primary); border-color:var(--primary); color:var(--primary-ink); font-weight:600}
.chain em{color:var(--muted); font-style:normal}
.lessons{display:flex; flex-direction:column; gap:10px; margin:14px 0 26px}
.ls{display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:12px; align-items:center; padding:14px 16px;
  background:var(--surface); border:1px solid var(--line); border-radius:18px; text-decoration:none; color:var(--ink)}
.ls-n{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--chip); font-weight:700; font-size:15px}
.ls.done .ls-n{background:var(--primary); color:var(--primary-ink)}
.ls small{color:var(--muted)}
.ls-kind{font-size:13px; color:var(--muted)}
.hub{display:flex; flex-direction:column; gap:10px}
.hub a{display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line);
  border-radius:18px; padding:16px; text-decoration:none; color:var(--ink)}
.hub .hi{width:48px; height:48px; border-radius:14px; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center}
.hub .hi svg{width:24px; height:24px}
.hub b{display:block}
.hub small{color:var(--muted); font-size:14px}
.hub .go{color:var(--muted); font-size:22px}

/* ---------- lesson blocks ---------- */
.block{margin:0 0 30px; scroll-margin-top:90px}
.intro{color:var(--body)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px}
.card .ic{width:42px; height:42px; border-radius:12px; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; margin-bottom:10px}
.card .ic svg{width:22px; height:22px}
.card p{color:var(--body); margin:0; font-size:15.5px; line-height:1.5}
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{padding:10px 14px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line)}
th{background:var(--chip); font-weight:600}
tr:last-child td{border-bottom:none}
.codebox{background:var(--code); border-radius:16px; overflow:hidden}
.codebar{display:flex; justify-content:space-between; align-items:center; padding:8px 14px; background:rgba(255,255,255,.05)}
.codebar span{font-family:var(--mono); font-size:13px; color:#9FD3C2}
.codebar button{background:transparent; border:1px solid #3B4D46; color:#CFE0D9; border-radius:8px; padding:3px 12px; font-size:13px}
pre{margin:0; padding:16px 18px; overflow-x:auto; color:var(--code-ink); font-family:var(--mono); font-size:13.5px; line-height:1.6; tab-size:4}
pre .cm{color:var(--code-dim)}
.code-grid{display:flex; flex-direction:column; gap:14px}
.side-notes{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px}
.side-notes div{border-left:4px solid var(--primary); padding:2px 0 2px 12px; font-size:15px; color:var(--body); line-height:1.5}
.caption{color:var(--body); font-size:15.5px; margin-top:12px}
.steps{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px 22px; counter-reset:s}
.steps li{display:grid; grid-template-columns:38px 1fr; gap:12px; counter-increment:s}
.steps li::before{content:counter(s); width:34px; height:34px; border-radius:50%; background:var(--primary); color:var(--primary-ink); font-weight:700; display:grid; place-items:center; font-size:15px}
.steps b{display:block}
.steps span{color:var(--body); font-size:15.5px}
.flow{display:flex; flex-wrap:wrap; gap:8px; align-items:stretch}
.flow .fstep{flex:1 1 160px; background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--primary); border-radius:16px; padding:14px}
.flow .fstep p{margin:0; color:var(--body); font-size:15px; line-height:1.45}
.flow .fstep .ic{color:var(--primary)}
.flow .arr{display:grid; place-items:center; color:var(--muted); font-size:22px; flex:0 0 16px}
.stack{display:flex; flex-direction:column; gap:8px}
.stack div{display:grid; grid-template-columns:200px 1fr; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surface)}
.stack b{background:var(--primary); color:var(--primary-ink); padding:12px 16px}
.stack span{padding:12px 16px; color:var(--body)}
.compare{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.compare > div{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px}
.compare > div:first-child{border-top:5px solid var(--bad)}
.compare > div:last-child{border-top:5px solid var(--primary)}
.compare ul{margin:6px 0 0; padding-left:20px; color:var(--body)}
.compare li{margin:4px 0}
.statement{background:var(--primary); color:var(--primary-ink); border-radius:22px; padding:24px 24px}
.statement h2{color:inherit; font-size:23px}
.statement p{margin:0; opacity:.9}
.statement.accent{background:var(--primary-soft); color:var(--ink)}
.term{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:22px}
.term .def{font-size:18.5px; color:var(--ink); margin-bottom:16px}
.term-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.term-grid div{border-radius:14px; padding:14px 16px}
.term-grid div:first-child{background:var(--warn-soft)}
.term-grid div:last-child{background:var(--primary-soft)}
.term-grid b{display:block; font-size:14px; margin-bottom:4px}
.term-grid p{margin:0; color:var(--body); font-size:15.5px}
.visual{border:1px solid var(--line); border-radius:16px; overflow:hidden; aspect-ratio:16/9; position:relative; background:#F2F4F7}
.visual .vis-in{position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0}
details.notes{margin-top:12px; background:var(--chip); border-radius:14px; padding:10px 14px}
details.notes summary{cursor:pointer; font-weight:600; font-size:15px}
details.notes p{margin:8px 0 0; color:var(--body); font-size:15.5px}
.notes-field{margin-top:26px}
.notes-field textarea{font-family:var(--sans); font-size:15px; min-height:90px}

/* ---------- quiz, practice ---------- */
.quiz{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:14px}
.quiz .q{font-weight:600; font-size:17px; margin-bottom:10px}
.opt{display:block; width:100%; text-align:left; padding:12px 14px; margin:6px 0; border-radius:14px; border:1.5px solid var(--line); background:var(--raise); font-size:15.5px}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt:disabled{cursor:default}
.expl,.out{white-space:pre-line}
.expl{margin-top:10px; padding:10px 14px; border-radius:12px; background:var(--chip); font-size:15px; color:var(--body)}
.score{font-size:17px; font-weight:600; margin:8px 0 18px}
.check{display:grid; grid-template-columns:28px 1fr; gap:12px; align-items:start; padding:13px 14px; border:1px solid var(--line); border-radius:14px; background:var(--surface); margin-bottom:8px; cursor:pointer}
.check input{width:20px; height:20px; margin-top:3px; accent-color:var(--primary)}
.check span{color:var(--body)}
.pager{display:flex; justify-content:space-between; gap:10px; margin-top:26px; flex-wrap:wrap}
.pager .btn{flex:1 1 220px}

/* ---------- labs ---------- */
.lab{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:20px; margin-bottom:22px}
.lab-grid{display:grid; grid-template-columns:1fr; gap:16px}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px; font-size:14.5px}
.field input,.field textarea,.field select,.find input{font:inherit; font-size:16px; padding:11px 13px; border-radius:14px; border:1px solid var(--line); background:var(--raise); color:var(--ink)}
.field textarea{font-family:var(--mono); font-size:13.5px; min-height:120px}
.field input[type=range]{padding:0; accent-color:var(--primary)}
.task{background:var(--warn-soft); border-radius:14px; padding:12px 14px; font-size:15px; margin-top:12px}
.log{font-family:var(--mono); font-size:13px; max-height:220px; overflow:auto; background:var(--code); color:var(--code-ink); border-radius:12px; padding:10px; white-space:pre}
.out{font-family:var(--mono); font-size:14px; background:var(--chip); border-radius:12px; padding:10px 12px}
.indicator{background:#1C2723; border-radius:20px; padding:20px; color:#E3ECE8}
.ind-top{display:flex; justify-content:space-between; font-size:13px; color:#9DB3AA; margin-bottom:6px}
.ind-screen{background:#07110C; border-radius:12px; padding:14px 18px; display:flex; align-items:baseline; justify-content:flex-end; gap:10px}
.ind-digits{font-family:var(--mono); font-weight:700; font-size:clamp(40px,10vw,60px); color:#7CFFB2; letter-spacing:2px; text-shadow:0 0 12px rgba(124,255,178,.35); font-variant-numeric:tabular-nums}
.ind-unit{font-family:var(--mono); color:#7CFFB2; font-size:20px}
.ind-lamps{display:flex; gap:14px; margin-top:12px; font-family:var(--mono); font-size:13px}
.lamp{display:flex; align-items:center; gap:6px; color:#9DB3AA}
.lamp i{width:10px; height:10px; border-radius:50%; background:#2D3D37}
.lamp.on i{background:#F2B233; box-shadow:0 0 8px #F2B233}
.lamp.on.st i{background:#7CFFB2; box-shadow:0 0 8px #7CFFB2}
.ind-raw{margin-top:12px; font-family:var(--mono); font-size:13px; color:#9DB3AA; background:#121C18; border-radius:10px; padding:8px 10px; height:104px; overflow:hidden; white-space:pre}
.ind-state{margin-top:10px; font-size:14px}
.ind-state b{color:#F2B233}

/* ---------- search, glossary ---------- */
.find{display:flex; gap:8px; margin-bottom:18px}
.find input{flex:1; min-width:0}
.gloss{display:grid; gap:10px}
.result{display:block; padding:14px 16px; border:1px solid var(--line); border-radius:16px; background:var(--surface); margin-bottom:8px; text-decoration:none; color:var(--ink)}
.result small{color:var(--muted); display:block}
.result span{color:var(--body); font-size:15px}
mark{background:var(--warn-soft); color:inherit; padding:0 2px; border-radius:3px}

/* ---------- gym ---------- */
.gym-head{display:flex; gap:8px; margin-bottom:8px}
input.gap{font-family:var(--mono); font-size:14px; background:#2A3A34; color:var(--code-str); border:1px dashed var(--code-str); border-radius:6px; padding:1px 6px}
.pars-ans{min-height:56px; border:2px dashed var(--line); border-radius:14px; padding:8px; display:flex; flex-direction:column; gap:6px; margin-bottom:10px; background:var(--raise)}
.pars-pool{display:flex; flex-direction:column; gap:6px}
.pl{text-align:left; font-family:var(--mono); font-size:13.5px; white-space:pre; background:var(--code); color:var(--code-ink); border:1px solid #33443E; border-radius:10px; padding:8px 10px; overflow-x:auto}
.pl:disabled{cursor:default; opacity:.9}
.pars-empty{color:var(--muted); font-size:14px; padding:8px}
.re-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; font-size:14px}
.re-s{font-family:var(--mono); background:var(--chip); border-radius:8px; padding:4px 8px; margin-top:6px; overflow-x:auto}
.flash{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:22px}
.flash .def{font-size:18px}

/* ---------- projects, cert, cheats ---------- */
.proj{background:var(--surface); border:1px solid var(--line); border-radius:18px; margin-bottom:10px}
.proj summary{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:14px; align-items:center; padding:16px; cursor:pointer; list-style:none}
.proj summary::-webkit-details-marker{display:none}
.proj summary h3{margin:0 0 2px}
.proj summary p{margin:0 0 4px; color:var(--muted); font-size:14.5px; line-height:1.45}
.proj-body{padding:0 16px 16px}
.brand-mark{width:40px; height:40px; border-radius:12px; background:var(--primary); display:grid; place-items:center}
.brand-mark span{font-family:var(--mono); font-weight:700; color:#fff; font-size:15px}
.cert{background:#FFFFFF; color:#1D2B27; border:2px solid #3A6E62; border-radius:8px; padding:10px}
.cert-in{border:1px solid #D6E0DB; padding:40px 28px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px}
.cert .brand-mark{background:#3A6E62}
.cert-k{font-size:16px; color:#66756F; margin:6px 0 0}
.cert-name{font-family:var(--serif); font-size:clamp(28px,6vw,42px); margin:4px 0; color:#1D2B27}
.cert-t{max-width:60ch; color:#3F4E49; font-size:16px}
.cert-row{display:flex; flex-wrap:wrap; gap:24px; justify-content:center; margin:8px 0}
.cert-row b{display:block; font-size:22px; color:#1D2B27}
.cert-row span{font-size:13px; color:#66756F}
.cert-d{color:#66756F; font-size:14px; margin:0}
.cheats{display:grid; grid-template-columns:1fr; gap:22px}
.cheat h2{font-size:20px}
.cheat code{font-size:13px}


/* ---------- ichki sahifalar: yangi ko'rinish ---------- */
.block{background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:20px 20px 22px; margin:0 0 16px}
.block.bare{background:transparent; border:0; padding:0}
.block > h2{font-size:21px; margin-bottom:14px}
.block .card, .block .flow .fstep, .block .compare > div, .block .stack div{background:var(--bg); border-color:transparent}
.block .tablewrap{background:var(--surface)}
.block .side-notes div{background:var(--bg); border-radius:0 12px 12px 0; padding:10px 12px}
.block details.notes{background:var(--bg)}
.block .card{border-radius:16px}
.statement{border-radius:24px; padding:26px 24px; position:relative; overflow:hidden}
.statement::after{content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.08)}
.statement.accent::after{background:rgba(58,110,98,.08)}
.term{border-radius:24px}
.term h2{font-size:26px}
.ring{--p:0; width:48px; height:48px; flex:none; border-radius:50%; display:grid; place-items:center;
  background:conic-gradient(var(--primary) calc(var(--p) * 1%), var(--chip) 0)}
.ring > span{width:38px; height:38px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-size:11.5px; font-weight:700; color:var(--primary)}
.ring.lg{width:86px; height:86px}
.ring.lg > span{width:68px; height:68px; font-size:18px; font-family:var(--serif)}
.rm{grid-template-columns:48px minmax(0,1fr); border-radius:22px; padding:16px 18px}
.rm-k{display:block; color:var(--primary); font-weight:600; font-size:13px; margin-bottom:2px}
.mod-hero{background:var(--surface); border:1px solid var(--line); border-radius:28px; padding:22px; margin:4px 0 8px}
.mod-hero-top{display:flex; gap:18px; align-items:center; margin-bottom:12px}
.mod-hero h1{margin:6px 0 0; font-size:clamp(26px,6vw,34px)}
.mod-hero .lead{font-size:16.5px; margin-bottom:14px}
.btn-block{display:flex; width:100%}
.timeline{list-style:none; margin:0 0 20px; padding:0; position:relative}
.timeline::before{content:""; position:absolute; left:19px; top:24px; bottom:24px; width:2px; background:var(--line)}
.timeline li{display:grid; grid-template-columns:40px minmax(0,1fr); gap:12px; align-items:center; margin-bottom:10px; position:relative}
.tl-dot{width:40px; height:40px; border-radius:50%; background:var(--surface); border:2px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:14px; color:var(--muted); z-index:1}
.timeline li.done .tl-dot{background:var(--primary); border-color:var(--primary); color:var(--primary-ink)}
.timeline li.cur .tl-dot{border-color:var(--primary); color:var(--primary); box-shadow:0 0 0 5px var(--primary-soft)}
.timeline li.extra .tl-dot{background:var(--primary-soft); border-color:var(--primary-soft); color:var(--primary)}
.tl-card{display:block; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:13px 16px; text-decoration:none; color:var(--ink)}
.tl-card b{display:block; line-height:1.35}
.tl-card small{color:var(--muted)}
.timeline li.cur .tl-card{border-color:var(--primary)}
.lesson-head{margin:4px 0 18px}
.lesson-head .badge{text-decoration:none; background:var(--primary-soft); color:var(--primary)}
.lesson-head h1{margin:12px 0 12px}
.ldots{display:flex; flex-wrap:wrap; gap:6px}
.ldots i{width:22px; height:6px; border-radius:3px; background:var(--chip)}
.ldots i.d{background:var(--primary)}
.ldots i.c{background:var(--primary); opacity:.45; width:34px}
.ldots i.d.c{opacity:1}
.readbar{position:fixed; left:0; right:0; top:0; height:3px; z-index:30; background:transparent}
.readbar i{display:block; height:100%; width:0; background:var(--primary); transition:width .1s linear}
.quiz{border-radius:22px}
.opt{display:flex; align-items:center; gap:10px; border-radius:16px}
.pager{flex-wrap:nowrap; position:sticky; bottom:calc(var(--tabh) + 8px + env(safe-area-inset-bottom,0px)); background:linear-gradient(transparent, var(--bg) 30%); padding-top:18px; z-index:5}
.hub a, .quick a{border-radius:22px}
.pager .btn{flex:0 0 auto}
.pager [data-done]{flex:1 1 auto}
.field.notes-field textarea{font-family:var(--sans); font-size:15px}
@media (prefers-reduced-motion:reduce){ .readbar i{transition:none} }

details.faq{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 18px; margin-bottom:10px}
details.faq summary{cursor:pointer; font-weight:600; list-style:none}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+"; float:right; color:var(--primary); font-size:20px; line-height:1}
details.faq[open] summary::after{content:"–"}
details.faq p{margin:10px 0 0; color:var(--body)}
.case-steps{margin:6px 0 12px; padding-left:22px; color:var(--body)}
.case-steps li{margin:4px 0}
.codebar .row button{white-space:nowrap}
.rv-card{min-height:200px}
.rv-card .def{font-size:18px}
.py-code{width:100%; min-height:260px; font-family:var(--mono); font-size:14px; line-height:1.5; background:var(--code); color:var(--code-ink); border:1px solid #33443E; border-radius:14px; padding:12px; tab-size:4}
.py-out{background:var(--code); color:var(--code-ink); border-radius:14px; padding:12px; min-height:90px; white-space:pre-wrap; font-family:var(--mono); font-size:13.5px; margin:6px 0 0}
@media (min-width:900px){
  .lab-grid{grid-template-columns:1fr 1fr}
  .cheats{grid-template-columns:1fr 1fr}
  .cheat td:first-child{white-space:nowrap}
}
@media (max-width:640px){
  .flow{flex-direction:column}
  .flow .arr{transform:rotate(90deg); flex:0 0 auto; height:20px}
  .flow .fstep{flex:0 0 auto}
  .compare,.term-grid,.re-grid{grid-template-columns:1fr}
  .stack div{grid-template-columns:1fr}
  .quick{grid-template-columns:repeat(2,1fr)}
  .saved{display:none}
  .appbar{padding-left:16px; padding-right:16px}
  main{padding-left:16px; padding-right:16px}
}
@media print{
  .appbar,.tabbar{display:none !important}
  main{padding:0}
  body{background:#fff}
  body[data-page="cert"] #view > *:not(.cert){display:none !important}
  .cert{margin-top:40px}
  body[data-page="cheats"] #view > .lead, body[data-page="cheats"] #view > .row, body[data-page="cheats"] .cheat .facts{display:none !important}
  body[data-page="cheats"] .cheats{grid-template-columns:1fr 1fr; gap:14px}
  body[data-page="cheats"] .cheat{break-inside:avoid}
  body[data-page="cheats"] table, body[data-page="cheats"] .cheat code{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

<script type="application/json" id="extraData">{"code": [{"file": "simulyator.py", "lang": "python", "title": "1. Tarozi indikatori simulyatori", "desc": "Haqiqiy indikator o'rniga ishlaydi: TCP 4001-portda har 0,3 soniyada «ST,GS,+0012450kg» kabi qatorlar yuboradi. Tarozi bo'lmasa ham butun tizimni sinashingiz mumkin.", "src": "\"\"\"Tarozi indikatori simulyatori.\n\nHaqiqiy indikator kabi TCP 4001-portda har 0,3 soniyada qator yuboradi:\nST,GS,+0012450kg  (ST — barqaror, US — beqaror).\nIshga tushirish:  python simulyator.py\n\"\"\"\nimport random\nimport socket\nimport threading\nimport time\n\nHOST, PORT = \"127.0.0.1\", 4001\n\n\ndef qatorlar():\n    \"\"\"Bitta mashina sikli: bo'sh -> kirish -> tebranish -> barqaror -> chiqish.\"\"\"\n    while True:\n        for _ in range(10):\n            yield \"ST\", 0\n        maqsad = random.randint(9000, 26000) // 20 * 20\n        for v in range(0, maqsad, 1500):\n            yield \"US\", v\n        for _ in range(8):\n            yield \"US\", maqsad + random.randint(-10, 10) * 20\n        for _ in range(15):\n            yield \"ST\", maqsad\n        for v in range(maqsad, 0, -3000):\n            yield \"US\", v\n\n\ndef mijozga_xizmat(conn, addr):\n    print(\"Ulandi:\", addr)\n    with conn:\n        for holat, vazn in qatorlar():\n            qator = f\"{holat},GS,{vazn:+08d}kg\\r\\n\"\n            try:\n                conn.sendall(qator.encode(\"ascii\"))\n            except OSError:\n                print(\"Uzildi:\", addr)\n                return\n            time.sleep(0.3)\n\n\nif __name__ == \"__main__\":\n    with socket.create_server((HOST, PORT)) as srv:\n        print(f\"Simulyator {HOST}:{PORT} da ishlayapti. To'xtatish: Ctrl+C\")\n        while True:\n            conn, addr = srv.accept()\n            threading.Thread(target=mijozga_xizmat, args=(conn, addr), daemon=True).start()"}, {"file": "shlyuz.py", "lang": "python", "title": "2. Shlyuz", "desc": "Indikatordan o'qiydi, holat mashinasi bilan barqaror og'irlikni aniqlaydi, noyob ID beradi va serverga yuboradi. Server ishlamasa — navbatga yozadi va keyin yuboradi. Haqiqiy indikatorda INDIKATOR manzilini o'zgartirasiz.", "src": "\"\"\"Shlyuz: indikatordan og'irlikni o'qiydi, barqarorlikni aniqlaydi va serverga yuboradi.\n\nServer ishlamasa, tortishlar navbat.jsonl fayliga yoziladi va keyin yuboriladi.\nIshga tushirish:  python shlyuz.py\n\"\"\"\nimport json\nimport logging\nimport os\nimport re\nimport socket\nimport time\nimport uuid\nfrom pathlib import Path\n\nimport requests\n\nINDIKATOR = (\"127.0.0.1\", 4001)          # haqiqiy indikatorning IP manzili va porti\nSERVER = os.getenv(\"SERVER_URL\", \"http://127.0.0.1:8000\")\nAPI_KEY = os.getenv(\"API_KEY\", \"maxfiy-kalit\")\nTAROZI = \"SCALE-1\"\nMIN_VAZN = 1000          # kg: bundan kam — tarozi bo'sh\nBARQAROR_SONIYA = 3      # og'irlik shuncha vaqt o'zgarmasa — tortish\nFARQ = 20                # kg: bundan katta o'zgarish — og'irlik hali o'zgarmoqda\nNAVBAT = Path(\"navbat.jsonl\")\nQATOR = re.compile(r\"(ST|US),(GS|NT),([+-]?\\d+)\")\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s %(levelname)s %(message)s\")\n\n\ndef oqish():\n    \"\"\"(barqaror, vazn) juftliklarini beradi. Aloqa uzilsa, o'zi qayta ulanadi.\"\"\"\n    while True:\n        try:\n            with socket.create_connection(INDIKATOR, timeout=5) as s:\n                logging.info(\"Indikatorga ulandi: %s:%s\", *INDIKATOR)\n                buf = b\"\"\n                while True:\n                    data = s.recv(1024)\n                    if not data:\n                        raise ConnectionError(\"indikator aloqani uzdi\")\n                    buf += data\n                    while b\"\\n\" in buf:\n                        line, buf = buf.split(b\"\\n\", 1)\n                        m = QATOR.search(line.decode(\"ascii\", \"ignore\"))\n                        if m:\n                            yield m.group(1) == \"ST\", int(m.group(3))\n        except OSError as e:\n            logging.warning(\"Indikator bilan aloqa yo'q: %s. 5 soniyadan keyin qayta urinish.\", e)\n            time.sleep(5)\n\n\ndef yubor(t):\n    try:\n        r = requests.post(f\"{SERVER}/api/weighings\", json=t,\n                          headers={\"X-API-Key\": API_KEY}, timeout=5)\n        r.raise_for_status()\n        return True\n    except requests.RequestException as e:\n        logging.warning(\"Serverga yuborilmadi: %s\", e)\n        return False\n\n\ndef navbatga(t):\n    with NAVBAT.open(\"a\", encoding=\"utf-8\") as f:\n        f.write(json.dumps(t, ensure_ascii=False) + \"\\n\")\n\n\ndef navbatni_yubor():\n    if not NAVBAT.exists():\n        return\n    qatorlar = [q for q in NAVBAT.read_text(encoding=\"utf-8\").splitlines() if q.strip()]\n    for i, q in enumerate(qatorlar):\n        if not yubor(json.loads(q)):\n            NAVBAT.write_text(\"\\n\".join(qatorlar[i:]) + \"\\n\", encoding=\"utf-8\")\n            return\n    NAVBAT.unlink()\n    logging.info(\"Navbatdagi %s ta tortish yuborildi\", len(qatorlar))\n\n\ndef main():\n    holat, qiymat, boshlandi = \"BOSH\", None, 0.0\n    for barqaror, vazn in oqish():\n        if vazn < MIN_VAZN:\n            if holat != \"BOSH\":\n                logging.info(\"Tarozi bo'shadi\")\n            holat, qiymat = \"BOSH\", None\n            continue\n        if holat == \"YOZILDI\":\n            continue                       # mashina chiqib ketishini kutamiz\n        if qiymat is None or abs(vazn - qiymat) > FARQ:\n            holat, qiymat, boshlandi = \"KIRISH\", vazn, time.time()\n            continue\n        if barqaror and time.time() - boshlandi >= BARQAROR_SONIYA:\n            holat = \"YOZILDI\"\n            t = {\"id\": str(uuid.uuid4()), \"scale\": TAROZI, \"weight\": qiymat, \"ts\": time.time()}\n            logging.info(\"TORTILDI: %s kg\", qiymat)\n            navbatni_yubor()\n            if not yubor(t):\n                navbatga(t)\n\n\nif __name__ == \"__main__\":\n    main()"}, {"file": "server.py", "lang": "python", "title": "3. Server (FastAPI + SQLite)", "desc": "Tortishlarni qabul qiladi (API kalit va ma'lumot tekshiruvi bilan), takrorlarni o'tkazib yuboradi, bugungi hisobotni beradi va dashboardni ko'rsatadi. SQLite — alohida o'rnatish talab qilmaydigan baza.", "src": "\"\"\"Server: tortishlarni qabul qiladi, SQLite bazaga saqlaydi, hisobot va dashboard beradi.\n\nIshga tushirish:  uvicorn server:app --reload\nBrauzerda:        http://127.0.0.1:8000  (dashboard)   va   /docs  (API hujjati)\n\"\"\"\nimport os\nimport sqlite3\nfrom datetime import datetime\n\nfrom fastapi import FastAPI, Header, HTTPException\nfrom fastapi.staticfiles import StaticFiles\nfrom pydantic import BaseModel, Field\n\nAPI_KEY = os.getenv(\"API_KEY\", \"maxfiy-kalit\")\nDB = \"tarozi.db\"\n\n\ndef db():\n    con = sqlite3.connect(DB)\n    con.row_factory = sqlite3.Row\n    return con\n\n\nwith db() as con:\n    con.execute(\"\"\"CREATE TABLE IF NOT EXISTS weighings (\n        id          TEXT PRIMARY KEY,\n        scale       TEXT NOT NULL,\n        weight      INTEGER NOT NULL CHECK (weight >= 0),\n        ts          REAL NOT NULL,\n        plate       TEXT,\n        sent_to_1c  INTEGER NOT NULL DEFAULT 0)\"\"\")\n\n\nclass Tortish(BaseModel):\n    id: str = Field(min_length=8, max_length=64)\n    scale: str = Field(min_length=1, max_length=20)\n    weight: int = Field(ge=0, le=100_000)\n    ts: float\n    plate: str | None = Field(default=None, pattern=r\"^[0-9A-Z]{6,9}$\")\n\n\napp = FastAPI(title=\"Tarozi API\")\n\n\ndef kalit_tekshir(x_api_key):\n    if x_api_key != API_KEY:\n        raise HTTPException(status_code=401, detail=\"API kalit noto'g'ri\")\n\n\n@app.post(\"/api/weighings\", status_code=201)\ndef qoshish(t: Tortish, x_api_key: str | None = Header(default=None)):\n    kalit_tekshir(x_api_key)\n    with db() as con:\n        cur = con.execute(\n            \"INSERT OR IGNORE INTO weighings (id, scale, weight, ts, plate) VALUES (?, ?, ?, ?, ?)\",\n            (t.id, t.scale, t.weight, t.ts, t.plate))\n    return {\"status\": \"ok\" if cur.rowcount else \"exists\"}\n\n\n@app.get(\"/api/weighings\")\ndef royxat(limit: int = 50):\n    with db() as con:\n        rows = con.execute(\"SELECT * FROM weighings ORDER BY ts DESC LIMIT ?\", (limit,)).fetchall()\n    return [dict(r) for r in rows]\n\n\n@app.get(\"/api/reports/today\")\ndef bugungi_hisobot():\n    boshi = datetime.now().replace(hour=0, minute=0, second=0, microsecond=0).timestamp()\n    with db() as con:\n        r = con.execute(\"SELECT COUNT(*) AS soni, COALESCE(SUM(weight), 0) AS jami \"\n                        \"FROM weighings WHERE ts >= ?\", (boshi,)).fetchone()\n    return dict(r)\n\n\napp.mount(\"/\", StaticFiles(directory=\"static\", html=True), name=\"static\")"}, {"file": "static/index.html", "lang": "html", "title": "4. Dashboard sahifasi", "desc": "server.py yonidagi static papkasiga qo'yiladi. Har 5 soniyada bugungi jami va oxirgi tortishlarni yangilaydi.", "src": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Tarozi paneli<\/title>\n<style>\n  body { font-family: system-ui, sans-serif; margin: 24px; background: #EEF3F0; color: #1D2B27; }\n  .big { font-size: 48px; font-weight: 700; color: #3A6E62; }\n  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 12px; overflow: hidden; }\n  th, td { padding: 10px 14px; border-bottom: 1px solid #D6E0DB; text-align: left; }\n<\/style>\n<\/head>\n<body>\n<h1>Tarozi paneli<\/h1>\n<p>Bugun: <span class=\"big\" id=\"jami\">0<\/span> kg, <b id=\"soni\">0<\/b> ta tortish<\/p>\n<table>\n  <thead><tr><th>Vaqt<\/th><th>Tarozi<\/th><th>Og'irlik, kg<\/th><\/tr><\/thead>\n  <tbody id=\"qatorlar\"><\/tbody>\n<\/table>\n<script>\nasync function yangila() {\n  try {\n    const [r1, r2] = await Promise.all([fetch(\"/api/reports/today\"), fetch(\"/api/weighings?limit=20\")]);\n    const h = await r1.json();\n    const t = await r2.json();\n    document.getElementById(\"jami\").textContent = h.jami.toLocaleString(\"ru-RU\");\n    document.getElementById(\"soni\").textContent = h.soni;\n    document.getElementById(\"qatorlar\").innerHTML = t.map(x =>\n      `<tr><td>${new Date(x.ts * 1000).toLocaleTimeString()}<\/td><td>${x.scale}<\/td><td>${x.weight.toLocaleString(\"ru-RU\")}<\/td><\/tr>`\n    ).join(\"\");\n  } catch (e) {\n    console.warn(\"Server javob bermadi\", e);\n  }\n}\nyangila();\nsetInterval(yangila, 5000);\n<\/script>\n<\/body>\n<\/html>"}, {"file": "sync_1c.py", "lang": "python", "title": "5. 1C sinxronizatori", "desc": "Hali 1C ga yuborilmagan tortishlarni 1C HTTP-servisiga yuboradi va «yuborildi» deb belgilaydi. 1C o'chiq bo'lsa, keyingi safar qayta urinadi (outbox naqshi).", "src": "\"\"\"1C sinxronizatori (\"outbox\" naqshi).\n\nHar 30 soniyada bazadan 1C ga hali yuborilmagan tortishlarni olib, 1C HTTP-servisiga yuboradi.\n1C javob bermasa — kutadi va keyingi safar qayta urinadi. Hech narsa yo'qolmaydi.\nIshga tushirish:  python sync_1c.py\n\"\"\"\nimport logging\nimport os\nimport sqlite3\nimport time\n\nimport requests\n\nONEC_URL = os.getenv(\"ONEC_URL\", \"http://localhost/zavod/hs/scales/weighing\")\nONEC_AUTH = (os.getenv(\"ONEC_USER\", \"api_user\"), os.getenv(\"ONEC_PASS\", \"\"))\nDB = \"tarozi.db\"\nORALIQ = int(os.getenv(\"SYNC_INTERVAL\", \"30\"))\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s %(levelname)s %(message)s\")\n\n\ndef bir_marta():\n    con = sqlite3.connect(DB)\n    con.row_factory = sqlite3.Row\n    try:\n        rows = con.execute(\"SELECT * FROM weighings WHERE sent_to_1c = 0 ORDER BY ts LIMIT 50\").fetchall()\n        for r in rows:\n            body = {\"id\": r[\"id\"], \"scale\": r[\"scale\"], \"weight\": r[\"weight\"], \"plate\": r[\"plate\"]}\n            try:\n                resp = requests.post(ONEC_URL, json=body, auth=ONEC_AUTH, timeout=15)\n            except requests.RequestException as e:\n                logging.warning(\"1C javob bermadi: %s\", e)\n                return\n            if resp.status_code in (200, 201):\n                con.execute(\"UPDATE weighings SET sent_to_1c = 1 WHERE id = ?\", (r[\"id\"],))\n                con.commit()\n                logging.info(\"1C ga yuborildi: %s (%s kg)\", r[\"id\"], r[\"weight\"])\n            else:\n                logging.error(\"1C xato qaytardi %s: %s\", resp.status_code, resp.text[:200])\n                return\n    finally:\n        con.close()\n\n\nif __name__ == \"__main__\":\n    while True:\n        bir_marta()\n        time.sleep(ORALIQ)"}, {"file": "HttpServis.1c", "lang": "1C", "title": "6. 1C HTTP-servis moduli", "desc": "1C tomoni: JSON ni qabul qiladi, tekshiradi, takrordan himoya qiladi va tranzaksiya ichida «Взвешивание» hujjatini yaratib o'tkazadi.", "src": "// HTTP-сервис «Scales», shablon /weighing, metod POST.\n// «Взвешивание» hujjati rekvizitlari: ВнешнийИД (Строка 36), Весы (Строка 20),\n// ВесБрутто (Число 10,0), ГосНомер (Строка 15).\n\nФункция WeighingPOST(Запрос)\n\tПопытка\n\t\tДанные = ПрочитатьJSONСтроку(Запрос.ПолучитьТелоКакСтроку());\n\tИсключение\n\t\tВозврат ОтветJSON(400, \"error\", \"JSON o'qilmadi\");\n\tКонецПопытки;\n\n\tОшибки = Новый Массив;\n\tЕсли НЕ ПроверитьДанные(Данные, Ошибки) Тогда\n\t\tВозврат ОтветJSON(400, \"error\", СтрСоединить(Ошибки, \"; \"));\n\tКонецЕсли;\n\n\t// Takrordan himoya: shu ID bilan hujjat bormi?\n\tСсылка = Документы.Взвешивание.НайтиПоРеквизиту(\"ВнешнийИД\", Данные.id);\n\tЕсли НЕ Ссылка.Пустая() Тогда\n\t\tВозврат ОтветJSON(200, \"exists\", Строка(Ссылка.Номер));\n\tКонецЕсли;\n\n\tНачатьТранзакцию();\n\tПопытка\n\t\tДок = Документы.Взвешивание.СоздатьДокумент();\n\t\tДок.Дата      = ТекущаяДатаСеанса();\n\t\tДок.ВнешнийИД = Данные.id;\n\t\tДок.Весы      = Данные.scale;\n\t\tДок.ВесБрутто = Данные.weight;\n\t\tЕсли Данные.Свойство(\"plate\") И Данные.plate <> Неопределено Тогда\n\t\t\tДок.ГосНомер = Данные.plate;\n\t\tКонецЕсли;\n\t\tДок.Записать(РежимЗаписиДокумента.Проведение);\n\t\tЗафиксироватьТранзакцию();\n\tИсключение\n\t\tОтменитьТранзакцию();\n\t\tЗаписьЖурналаРегистрации(\"Интеграция.Весы\", УровеньЖурналаРегистрации.Ошибка, , ,\n\t\t\tОписаниеОшибки());\n\t\tВозврат ОтветJSON(500, \"error\", \"Hujjat yozilmadi\");\n\tКонецПопытки;\n\n\tВозврат ОтветJSON(201, \"ok\", Строка(Док.Номер));\nКонецФункции\n\nФункция ПрочитатьJSONСтроку(Текст)\n\tЧтение = Новый ЧтениеJSON;\n\tЧтение.УстановитьСтроку(Текст);\n\tРезультат = ПрочитатьJSON(Чтение);\n\tЧтение.Закрыть();\n\tВозврат Результат;\nКонецФункции\n\nФункция ПроверитьДанные(Данные, Ошибки)\n\tЕсли ТипЗнч(Данные) <> Тип(\"Структура\") Тогда\n\t\tОшибки.Добавить(\"tana JSON obyekt bo'lishi kerak\");\n\t\tВозврат Ложь;\n\tКонецЕсли;\n\tЕсли НЕ Данные.Свойство(\"id\") ИЛИ ПустаяСтрока(Данные.id) Тогда\n\t\tОшибки.Добавить(\"id majburiy\");\n\tКонецЕсли;\n\tЕсли НЕ Данные.Свойство(\"scale\") ИЛИ ПустаяСтрока(Данные.scale) Тогда\n\t\tОшибки.Добавить(\"scale majburiy\");\n\tКонецЕсли;\n\tЕсли НЕ Данные.Свойство(\"weight\") ИЛИ ТипЗнч(Данные.weight) <> Тип(\"Число\")\n\t\tИЛИ Данные.weight < 0 Тогда\n\t\tОшибки.Добавить(\"weight musbat son bo'lishi kerak\");\n\tКонецЕсли;\n\tВозврат Ошибки.Количество() = 0;\nКонецФункции\n\nФункция ОтветJSON(Код, Статус, Сообщение)\n\tОтвет = Новый HTTPСервисОтвет(Код);\n\tОтвет.Заголовки.Вставить(\"Content-Type\", \"application/json; charset=utf-8\");\n\tЗапись = Новый ЗаписьJSON;\n\tЗапись.УстановитьСтроку();\n\tЗаписатьJSON(Запись, Новый Структура(\"status, message\", Статус, Сообщение));\n\tОтвет.УстановитьТелоИзСтроки(Запись.Закрыть());\n\tВозврат Ответ;\nКонецФункции"}, {"file": "bot.py", "lang": "python", "title": "7. Telegram bot", "desc": "/bugun buyrug'iga serverdan olingan hisobot bilan javob beradi. TG_ALLOWED da chat ID lar ko'rsatilsa, faqat ularga javob beradi.", "src": "\"\"\"Telegram bot: /bugun — bugungi tortishlar soni va jami og'irlik.\n\nO'rnatish:  pip install \"python-telegram-bot>=21\" httpx\nIshga tushirish:  TG_TOKEN=... python bot.py\n\"\"\"\nimport os\n\nimport httpx\nfrom telegram import Update\nfrom telegram.ext import ApplicationBuilder, CommandHandler, ContextTypes, filters\n\nTOKEN = os.environ[\"TG_TOKEN\"]                       # @BotFather bergan token\nSERVER = os.getenv(\"SERVER_URL\", \"http://127.0.0.1:8000\")\nRUXSAT = {int(x) for x in os.getenv(\"TG_ALLOWED\", \"\").split(\",\") if x.strip()}\nFILTR = filters.Chat(chat_id=RUXSAT) if RUXSAT else None\n\n\nasync def start(update: Update, context: ContextTypes.DEFAULT_TYPE):\n    await update.message.reply_text(\n        f\"Salom! Sizning chat ID: {update.effective_chat.id}\\n/bugun — bugungi hisobot\")\n\n\nasync def bugun(update: Update, context: ContextTypes.DEFAULT_TYPE):\n    try:\n        async with httpx.AsyncClient(timeout=10) as c:\n            d = (await c.get(f\"{SERVER}/api/reports/today\")).json()\n    except httpx.HTTPError:\n        await update.message.reply_text(\"Server bilan aloqa yo'q. Keyinroq urinib ko'ring.\")\n        return\n    jami = f\"{d['jami']:,}\".replace(\",\", \" \")\n    await update.message.reply_text(f\"Bugun: {d['soni']} ta tortish\\nJami: {jami} kg\")\n\n\nif __name__ == \"__main__\":\n    app = ApplicationBuilder().token(TOKEN).build()\n    app.add_handler(CommandHandler(\"start\", start))\n    app.add_handler(CommandHandler(\"bugun\", bugun, filters=FILTR))\n    app.run_polling()"}, {"file": "requirements.txt", "lang": "text", "title": "8. requirements.txt", "desc": "Barcha kerakli kutubxonalar: pip install -r requirements.txt", "src": "fastapi\nuvicorn[standard]\nrequests\npyserial\npython-telegram-bot>=21\nhttpx"}, {"file": ".env.example", "lang": "text", "title": "9. .env.example", "desc": "Sozlamalar namunasi. Nusxasini .env nomi bilan saqlang; .env ni Git'ga qo'shmang.", "src": "# Nusxa oling:  .env  nomi bilan saqlang va qiymatlarni o'zgartiring\nAPI_KEY=maxfiy-kalit\nSERVER_URL=http://127.0.0.1:8000\nTG_TOKEN=\nTG_ALLOWED="}], "run": [["Papka tayyorlang", "Yangi papka oching (masalan, C:\\tarozi). Kod kutubxonasidagi fayllarni shu papkaga saqlang. Dashboard faylini (static/index.html) papka ichidagi static nomli papkaga joylang."], ["Virtual muhit va kutubxonalar", "Terminalda: python -m venv venv, keyin venv\\Scripts\\activate (Linux/Mac: source venv/bin/activate), keyin pip install -r requirements.txt"], ["1-terminal: simulyator", "python simulyator.py — «Simulyator 127.0.0.1:4001 da ishlayapti» chiqadi."], ["2-terminal: server", "uvicorn server:app --reload — so'ng brauzerda http://127.0.0.1:8000 ni oching: dashboard ko'rinadi."], ["3-terminal: shlyuz", "python shlyuz.py — har 15–20 soniyada «TORTILDI: … kg» chiqadi va dashboardda yangi qator paydo bo'ladi."], ["Sinab ko'ring", "Serverni to'xtating (Ctrl+C) — shlyuz tortishlarni navbatga yozadi. Serverni qayta yoqing — navbat o'zi yuboriladi. http://127.0.0.1:8000/docs da API ni ko'ring."], ["Keyingi qadamlar", "Telegram bot (bot.py) va 1C integratsiyasini (sync_1c.py + HTTP-servis) ulang. Haqiqiy indikatorda shlyuz.py dagi INDIKATOR manzilini o'zgartiring yoki pyserial bilan COM-portdan o'qing."]], "cases": [{"t": "Kun oxirida jami og'irlik qo'lda yozilgandan farq qiladi", "mod": "m2", "belgi": "Avtomatik tizim bir xil mashina uchun qo'lda yozilganidan 40–80 kg farqli og'irlik yozyapti, ba'zan bitta mashina ikki marta tortilgan.", "tahlil": ["Shlyuz logini oching: tortishlar qaysi holatda (ST yoki US) yozilgan?", "Indikator qatorlarini Termite'da kuzating: mashina kirgach qancha vaqt tebranadi?", "Bir mashina ikki marta yozilgan vaqtlarni solishtiring."], "sabab": "Dastur beqaror (US) qiymatlarni ham qabul qilgan va tarozi bo'shamasdan qayta yozgan.", "yechim": "Faqat ST belgili va 3 soniya o'zgarmagan og'irlikni yozing; «YOZILDI» holatidan faqat tarozi bo'shaganda chiqing (holat mashinasi)."}, {"t": "1C da bitta tortish uchun ikkita hujjat paydo bo'ldi", "mod": "m6", "belgi": "Ba'zi kunlari bir xil og'irlik va vaqtli ikki hujjat bor, ombor qoldig'i oshib ketgan.", "tahlil": ["Sinxronizator logida shu vaqtdagi xatolarni toping.", "Tarmoq yoki 1C sekin javob bergan paytlarni tekshiring."], "sabab": "1C hujjatni yaratdi, lekin javob timeout tufayli yetib bormadi; sinxronizator qayta yubordi.", "yechim": "Har bir tortishga shlyuzda noyob ID bering va 1C da ВнешнийИД bo'yicha tekshiring: bor bo'lsa, yangi hujjat yaratmasdan «exists» qaytaring (idempotentlik)."}, {"t": "Kechasi raqamlar o'qilmaydi", "mod": "m3", "belgi": "Kunduzi raqam aniqligi yaxshi, kechqurun esa raqam o'rnida oq dog' yoki qorong'i rasm.", "tahlil": ["Tungi kadrlarni saqlab, raqam maydonini kattalashtirib ko'ring.", "Kamera kun/tun rejimi, IR va WDR sozlamalarini tekshiring."], "sabab": "Faralar yorug'i raqamni «yoqib» yuboradi, ekspozitsiya uzun.", "yechim": "WDR yoki HLC ni yoqing, ekspozitsiyani qisqartiring, IR yoritgichni raqamga qarating; mashina tarozida to'xtaganda kadr oling."}, {"t": "Shlyuz har dushanba ertalab ishlamay qoladi", "mod": "m2", "belgi": "Dam olish kunlaridan keyin tortishlar yozilmayapti, operator kompyuterni qayta yoqqanda tuzaladi.", "tahlil": ["Windows yangilanishlari tarixini va qayta yuklanish vaqtini tekshiring.", "Shlyuz qanday ishga tushirilganini aniqlang: qo'lda yoki xizmat sifatida?"], "sabab": "Kompyuter yangilanishdan keyin qayta yuklangan, shlyuz esa qo'lda ishga tushiriladigan oddiy dastur edi.", "yechim": "Shlyuzni Windows xizmati (NSSM) yoki systemd xizmati qiling, «qayta ishga tushish» ni yoqing; heartbeat monitoringi bilan jim qolganini bilib oling."}, {"t": "Server diski to'lib, hamma narsa to'xtadi", "mod": "m10", "belgi": "API 500 xato qaytaryapti, baza yozmayapti, loglarda «No space left on device».", "tahlil": ["df -h bilan diskni, du -sh bilan qaysi papka katta ekanini tekshiring."], "sabab": "Tortish rasmlari va loglar oylar davomida o'chirilmagan.", "yechim": "Eski rasmlarni cron bilan avtomatik tozalang (masalan, 90 kundan eski), log rotation yoqing va disk 80% dan oshsa ogohlantiradigan monitoring qo'ying."}, {"t": "Linux'da qayta yuklagandan keyin tarozilar «almashib» qoldi", "mod": "l", "belgi": "Kirish tarozisining og'irligi chiqish tarozisi nomi bilan yozilyapti.", "tahlil": ["ls /dev/ttyUSB* bilan portlarni ko'ring va adapterlarni birma-bir sug'urib tekshiring."], "sabab": "Ikki USB adapter qayta yuklashda boshqa tartibda aniqlangan: ttyUSB0 va ttyUSB1 almashgan.", "yechim": "udev qoidasi bilan har bir adapterga seriya raqami bo'yicha doimiy nom bering: /dev/tarozi_kirish, /dev/tarozi_chiqish."}, {"t": "Modbus'dan kelgan og'irlik 815 923 200 ko'rsatyapti", "mod": "m2", "belgi": "Tarozida 12 450 kg, dasturda esa ulkan son.", "tahlil": ["Ikki registrni alohida chiqaring: 0 va 12450.", "Laboratoriyadagi Modbus dekoderida ikkala tartibni solishtiring."], "sabab": "Registrlar teskari so'z tartibida (little-endian) qo'shilgan.", "yechim": "Yuqori va pastki registrni almashtiring yoki qurilma qo'llanmasidagi so'z tartibini sozlamada ko'rsating."}, {"t": "Bir mashinaning tarasi to'satdan 700 kg oshdi", "mod": "m8", "belgi": "Odatda 8 200 kg bo'lgan mashina bugun chiqishda 8 900 kg tortildi, netto shunga kamaydi.", "tahlil": ["Shu mashinaning oxirgi 30 tarasini va z-ballni hisoblang.", "Orqa kamera rasmiga qarang: yuk qismi bo'shmi?"], "sabab": "Kuzovda yuk qisman qolgan yoki tortishda odam tushmagan.", "yechim": "|z| > 3 bo'lsa, tortishni «shubhali» deb belgilab, rasm bilan xavfsizlik xizmatiga yuboring; qayta tortish talab qilinadi."}, {"t": "1C yangilangandan keyin kengaytma xato beryapti", "mod": "m7", "belgi": "Sotuv hujjatini o'tkazishda «Метод не найден» kabi xato chiqadi.", "tahlil": ["Kengaytmalar ro'yxatida «Проверить применимость» ni bosing.", "Qaysi tipik protsedura o'zgarganini ko'ring."], "sabab": "Kengaytma ulangan tipik protsedura yangi versiyada qayta nomlangan yoki o'zgargan.", "yechim": "Kengaytmani yangi tipik kodga moslashtiring; muhim joylarda &ИзменениеИКонтроль ishlating — o'zgarishni platforma o'zi ko'rsatadi. Har yangilanishdan oldin test bazada sinang."}, {"t": "Telegram bot tokeni GitHub'ga tushib qoldi", "mod": "t", "belgi": "Bot noma'lum odamlarga javob beryapti yoki o'zi xabar yubormoqda.", "tahlil": ["Repozitoriy tarixida token qatorini qidiring."], "sabab": "Token kod ichida yozilgan va ochiq repozitoriyga yuklangan.", "yechim": "BotFather'da /revoke bilan tokenni darhol almashtiring, yangi tokenni .env ga yozing, .env ni .gitignore ga qo'shing va ruxsat etilgan chat ID lar filtrini yoqing."}], "faq": [["Dasturlashni umuman bilmayman. Qayerdan boshlayman?", "«Noldan: asosiy tushunchalar» bo'limidan, keyin «Python noldan». Ular hech qanday oldingi bilim talab qilmaydi. Har kuni 30–60 daqiqa yetarli."], ["Kursni o'tishga qancha vaqt kerak?", "O'qish uchun taxminan 70 soat, amaliyot bilan 2–4 oy. «Reja» bo'limida haftasiga necha soat ajratishingizni kiritsangiz, aniq sanalarni ko'rasiz."], ["Qanday kompyuter kerak?", "Oddiy noutbuk yetarli: Windows, Linux yoki Mac. Sun'iy intellekt modellarini o'qitish uchun kuchliroq kompyuter yoki bepul Google Colab kerak bo'ladi."], ["Haqiqiy tarozi yo'q. Qanday mashq qilaman?", "Laboratoriyadagi simulyatorda va Kod kutubxonasidagi simulyator.py bilan. U haqiqiy indikator kabi ishlaydi, butun tizimni uskunasiz qurasiz."], ["1C ni qayerdan olaman?", "Rasmiy saytdan bepul «Учебная версия» (o'quv versiyasi). O'rganish va kichik loyihalarni sinash uchun yetarli."], ["Python yoki 1C — qaysi birini avval o'rganay?", "Avval Python asoslarini: dasturlash tushunchalari (o'zgaruvchi, shart, sikl, funksiya) 1C da ham bir xil. Keyin 1C o'zlashtirish ancha oson bo'ladi."], ["Har qanday tarozini ulash mumkinmi?", "Indikatorida RS-232, RS-485, Ethernet yoki Modbus porti bo'lsa — ha. Eng muhimi indikator qo'llanmasi: unda port sozlamalari va protokol yozilgan."], ["Internet yoki 1C o'chib qolsa, tortishlar yo'qoladimi?", "To'g'ri qurilgan tizimda yo'q: shlyuz navbatga yozadi, server «outbox» orqali 1C ga keyin yuboradi. Kod kutubxonasida ikkalasi ham bor."], ["Sun'iy intellekt shartmi?", "Yo'q. Avval tarozi, server va 1C integratsiyasini ishonchli qiling. AI (raqam tanish, anomaliyalar) — keyingi bosqich."], ["Ishlab turgan 1C bazasida sinab ko'rsam bo'ladimi?", "Yo'q. Har doim nusxada (test bazada) ishlang. Ishchi bazaga faqat sinovdan o'tgan kengaytmani, avval .dt zaxira olib o'rnating."], ["Taroziga kalibrovkani o'zim qilsam bo'ladimi?", "Yo'q. Kalibrovka va rasmiy metrologik tekshiruvni vakolatli mutaxassis bajaradi. Dasturchi faqat indikator bergan qiymatni to'g'ri o'qiydi."], ["Serverni bulutga qo'yaymi yoki korxonaga?", "Ko'pincha aralash yechim yaxshi: shlyuz va asosiy server korxonada (internetga bog'liq emas), rahbar uchun bot yoki hisobot bulutda."], ["Xavfsizlik uchun eng muhim narsalar qaysilar?", "Standart parollarni almashtirish, qurilmalarni alohida tarmoqqa (VLAN) ajratish, masofaviy kirish faqat VPN orqali va tiklashni sinab ko'rilgan zaxira nusxa."], ["Loyiha qancha turadi?", "Uskunalar (kamera, kompyuter, UPS, kabellar), litsenziyalar va ish hajmiga bog'liq. «Arxitektura» bo'limidagi uskunalar ro'yxati bo'yicha mahalliy narxlarni so'rang."], ["Sertifikat rasmiy hujjatmi?", "Yo'q. U o'z bilimingizni qayd etish uchun. Ish beruvchilar uchun eng kuchli dalil — ishlaydigan loyiha va portfolio."], ["Bu bilim bilan ishga qanday kiraman?", "Kod kutubxonasidagi tizimni o'zingiz qurib, GitHub'ga joylang, qisqa video yozing va «Kasbiy o'sish» bo'limidagi maslahatlarga amal qiling."]]}</script>

— 502."], ["Globe", "Lokal tarmoq", "Korxona ichidagi tarmoq: 192.168.x.x manzillar tashqaridan ko'rinmaydi."], ["Link", "Router va switch", "Switch qurilmalarni bir-biriga ulaydi. Router lokal tarmoqni internetga chiqaradi."]], "id": "m0-net", "notes": "Manzilni tekshirishning eng oddiy usuli: Windows buyruq satrida ping 192.168.1.64 deb yozing. Javob kelsa, qurilma tarmoqda bor."}, {"t": "flow", "title": "Korxona tarmog'i qanday tuzilgan", "items": [["Search", "Kamera va tarozi", "Har biri o'z IP manzilida"], ["Link", "Switch", "Kabellar shu yerga yig'iladi"], ["Database", "Server", "Ma'lumotni qabul qiladi va saqlaydi"], ["Globe", "Router", "Internet: Telegram, masofaviy kirish"]], "caption": null, "id": "m0-lan"}, {"t": "term", "title": "Server va klient", "def": "Server — doim yoqilgan, xizmat ko'rsatadigan kompyuter yoki dastur. Klient — shu xizmatdan foydalanuvchi dastur.", "analogy": "Oshxona (server) va mijoz (klient): mijoz buyurtma beradi, oshxona tayyorlab qaytaradi. Bitta oshxona yuzlab mijozga xizmat qiladi.", "example": "Tarozi yonidagi kompyuter — klient: tortishni yuboradi. Serverdagi dastur qabul qiladi. Rahbarning brauzeri ham klient: ma'lumotni so'raydi.", "id": "m0-server"}, {"t": "term", "title": "API", "def": "Bir dastur boshqa dasturga «nima so'rash mumkin va qanday javob keladi» degan kelishilgan qoidalar to'plami.", "analogy": "Restorandagi ofitsiant: siz oshxonaga kirmaysiz, menyudan tanlab ofitsiantga aytasiz, u taomni olib keladi. Menyu — API, ofitsiant — so'rov.", "example": "1C da HTTP-servis yaratamiz. Tarozi dasturi 1C ichiga kirmaydi — faqat «mana bu tortishni saqlab qo'y» deb so'rov yuboradi, 1C «bajarildi» deb javob beradi.", "id": "m0-api"}, {"t": "table", "title": "Protokol: qurilmalar gaplashadigan «til»", "intro": null, "head": ["Protokol", "Nima uchun", "Qayerda uchraydi"], "rows": [["HTTP / HTTPS", "Web sahifa va API so'rovlari", "Server, 1C HTTP-servis, Telegram"], ["WebSocket", "Doimiy ochiq aloqa", "Jonli dashboard"], ["RTSP", "Video oqimi", "IP-kameralar"], ["RS-232 / RS-485", "Simli ketma-ket aloqa", "Tarozi indikatorlari"], ["Modbus", "Sanoat qurilmalari registrlari", "Tarozi, datchik, kontroller"], ["ONVIF", "Kameralarni boshqarish standarti", "Kamerani topish va sozlash"]], "id": "m0-proto"}, {"t": "compare", "title": "Oddiy dastur va sun'iy intellekt", "left": ["Oddiy dastur", ["Qoidalarni odam yozadi", "«Og'irlik 60 t dan oshsa — ogohlantir»", "Qoida aniq bo'lsa ideal", "Rasmdagi raqamni o'qiy olmaydi"]], "right": ["Sun'iy intellekt", ["Qoidani misollardan o'zi o'rganadi", "Minglab raqam rasmini ko'rib, o'qishni o'rganadi", "Qoidasi yozib bo'lmaydigan vazifalar uchun", "Ba'zan xato qiladi — tekshiruv kerak"]], "id": "m0-ai", "notes": "Sun'iy intellekt sehr emas. U ko'p misollar asosida o'rgatilgan matematik model. Qayerda qoidani oddiy so'z bilan yozish mumkin bo'lsa, oddiy dastur yaxshiroq; qayerda qoidani yozib bo'lmasa (rasm, ovoz, matn), AI kerak."}, {"t": "table", "title": "Lug'at: 1-qism", "intro": null, "head": ["Atama", "Oddiy tilda"], "rows": [["Kutubxona (library)", "Boshqalar yozgan tayyor kod: o'rnatib, foydalanasiz"], ["Terminal", "Buyruqlarni matn bilan yoziladigan qora oyna"], ["Log", "Dastur nima qilganini yozib boradigan kundalik"], ["Bug (xato)", "Dastur kutilgandan boshqacha ishlashi"], ["Debug", "Xatoni qidirib topish va tuzatish jarayoni"], ["Deploy", "Tayyor dasturni ishchi serverga o'rnatish"]], "id": "m0-gloss1"}, {"t": "table", "title": "Lug'at: 2-qism", "intro": null, "head": ["Atama", "Oddiy tilda"], "rows": [["Integratsiya", "Ikki dasturni bir-biriga ulash, ma'lumot almashtirish"], ["Shlyuz (gateway)", "Qurilma va server o'rtasidagi tarjimon-dastur"], ["Real vaqt", "Voqea bo'lishi bilan darhol ko'rinishi"], ["Zaxira (backup)", "Ma'lumotning ehtiyot nusxasi"], ["Docker", "Dasturni hamma narsasi bilan «qutiga» joylab ishga tushirish"], ["Model (AI)", "Misollardan o'rgatilgan, qaror chiqaradigan fayl"]], "id": "m0-gloss2"}, {"t": "quiz", "q": "192.168.1.64:554 yozuvida 554 nima?", "opts": ["Qurilmaning IP manzili", "Port — qurilma ichidagi xizmat «eshigi» raqami", "Kameraning seriya raqami"], "a": 1, "expl": "IP manzil qurilmani, port esa shu qurilmadagi aniq xizmatni (554 — RTSP video) ko'rsatadi.", "id": "m0-q1"}, {"t": "quiz", "q": "API ni eng yaxshi tasvirlaydigan o'xshatish qaysi?", "opts": ["Kutubxona javoni", "Restorandagi ofitsiant va menyu", "Uy manzili"], "a": 1, "expl": "API — dasturlar orasidagi kelishilgan «menyu»: nima so'rash mumkin va qanday javob qaytadi.", "id": "m0-q2"}, {"t": "quiz", "id": "xq-m0-0", "q": "JSON da qo'shtirnoqsiz yozilgan 12450 qanday tur?", "opts": ["Matn", "Son", "Ro'yxat"], "a": 1, "expl": "Qo'shtirnoqsiz raqam — son; \"12450\" esa matn bo'lardi."}, {"t": "quiz", "id": "xq-m0-1", "q": "Ma'lumotlar bazasining Exceldan asosiy afzalligi?", "opts": ["Rangli ko'rinishi", "Ko'p dastur bir vaqtda ishlaydi va millionlab qatorda ham tez qidiradi", "Fayl hajmi kichik"], "a": 1, "expl": "Baza ko'p foydalanuvchi, tezlik, qat'iy turlar va huquqlar uchun mo'ljallangan."}, {"t": "quiz", "id": "xq-m0-2", "q": "Rahbar brauzerda dashboardni ochdi. Bu holda brauzer nima?", "opts": ["Server", "Klient", "Router"], "a": 1, "expl": "Brauzer ma'lumot so'raydi — demak, u klient."}]}, {"id": "py", "num": 0, "title": "Python noldan", "goal": "Birinchi qatordan to ishlaydigan tarozi simulyatorigacha: o'rnatish, har bir asosiy tushuncha, xatolarni o'qish va amaliy mashqlar.", "stages": [1, 2, 4], "vol": 1, "blocks": [{"t": "cards", "title": "Nega aynan Python", "intro": null, "items": [["Book", "O'qish oson", "Kod deyarli ingliz tilidagi gapga o'xshaydi. Boshlovchilar uchun eng mos tillardan biri."], ["Tool", "Tayyor kutubxonalar", "Tarozi (pyserial), kamera (OpenCV), web (FastAPI), AI (YOLO) — hammasi tayyor."], ["Globe", "Hamma joyda ishlaydi", "Windows, Linux, Raspberry Pi, server — bir xil kod."], ["Star", "Bepul va mashhur", "Millionlab dasturchi: har qanday savolning javobi internetda bor."]], "id": "py-why"}, {"t": "steps", "title": "Python'ni o'rnatish (Windows)", "intro": null, "items": [["Yuklab oling", "python.org → Downloads → eng so'nggi Python 3 versiyasi."], ["Muhim belgi!", "O'rnatish oynasining pastidagi «Add python.exe to PATH» belgisini albatta qo'ying."], ["O'rnating", "«Install Now» tugmasini bosing va tugashini kuting."], ["Tekshiring", "Win+R → cmd → python --version yozing. Versiya raqami chiqishi kerak."]], "id": "py-install", "notes": "«Add to PATH» belgisi qo'yilmasa, buyruq satrida python buyrug'i topilmaydi degan xato chiqadi. Bunday holda Python'ni o'chirib, belgini qo'yib qayta o'rnatish eng oson yo'l."}, {"t": "code", "title": "O'rnatilganini tekshirish", "lang": "bash", "src": "# Python versiyasi\npython --version\nPython 3.12.6\n\n# Kutubxona o'rnatuvchi (pip) versiyasi\npip --version\npip 24.2 from C:\\...\\site-packages\\pip (python 3.12)\n\n# \"python topilmadi\" desa: PATH belgisi qo'yilmagan", "side": null, "caption": "Versiya raqamlari sizda boshqacha bo'lishi mumkin — asosiysi, ikkala buyruq ham javob qaytarsin.", "id": "py-check"}, {"t": "steps", "title": "VS Code'ni sozlash", "intro": null, "items": [["O'rnating", "code.visualstudio.com saytidan VS Code'ni yuklab o'rnating."], ["Python kengaytmasi", "Chap paneldagi Extensions (Ctrl+Shift+X) → «Python» (Microsoft) → Install."], ["Papka oching", "File → Open Folder → masalan C:\\kurs papkasi."], ["Fayl yarating", "Yangi fayl: salom.py. Nomi .py bilan tugashi shart."], ["Ishga tushiring", "Yuqori o'ng burchakdagi ▶ tugmasi. Natija pastdagi Terminal oynasida."], ["Saqlashni yoqing", "File → Auto Save — har o'zgarish avtomatik saqlanadi."]], "id": "py-vscode"}, {"t": "compare", "title": "Python'da ishlashning ikki usuli", "left": ["Interaktiv rejim (>>>)", ["Terminalda python yozib Enter", "Har bir qator darhol bajariladi", "Tez sinab ko'rish uchun qulay", "Yopilganda hammasi yo'qoladi"]], "right": ["Fayl (.py)", ["Kod faylga yoziladi va saqlanadi", "python fayl.py bilan butunlay ishga tushadi", "Haqiqiy dasturlar shunday yoziladi", "Istalgan payt qayta ishlatiladi"]], "id": "py-run"}, {"t": "code", "title": "Birinchi dastur: ekranga chiqarish", "lang": "python", "src": "# Bu izoh — kompyuter uni o'qimaydi\nprint(\"Salom, dunyo!\")\nprint(\"Tarozi dasturi ishga tushdi\")\n\nprint(12450)               # son\nprint(12450 + 8200)        # hisob: 20650\nprint(\"Og'irlik:\", 12450, \"kg\")", "side": ["<b>print()<\/b> — qavs ichidagi narsani ekranga chiqaradi.", "Matn qo'shtirnoqda, son esa qo'shtirnoqsiz yoziladi.", "Vergul bilan bir nechta qiymatni birga chiqarish mumkin: orasiga bo'sh joy qo'yiladi.", "<b>#<\/b> dan keyin — izoh."], "caption": null, "id": "py-print"}, {"t": "code", "title": "O'zgaruvchi: nomli quti", "lang": "python", "src": "brutto = 12450\ntara = 8200\nnetto = brutto - tara\nprint(netto)             # 4250\n\ntara = 8300              # qiymatni almashtirish\nprint(brutto - tara)     # 4150\n\nraqam = \"01A123BC\"\nbarqaror = True", "side": ["<b>=<\/b> belgisi «teng» emas, «qutiga qo'y» degani.", "O'zgaruvchi keyin boshqa qiymat olishi mumkin.", "Python turni o'zi aniqlaydi: son, matn yoki True/False.", "Nomlarni ma'noli qo'ying: <b>x<\/b> emas, <b>brutto<\/b>."], "caption": null, "id": "py-vars"}, {"t": "table", "title": "O'zgaruvchi nomlash qoidalari", "intro": null, "head": ["Nom", "To'g'rimi", "Sabab"], "rows": [["brutto_ogirlik", "Ha", "Kichik harf va pastki chiziq — tavsiya etilgan uslub"], ["tarozi2", "Ha", "Raqam o'rtada yoki oxirida bo'lishi mumkin"], ["2tarozi", "Yo'q", "Raqam bilan boshlanmaydi"], ["brutto ogirlik", "Yo'q", "Bo'sh joy bo'lmaydi"], ["og'irlik", "Yo'q", "Apostrof belgisi ishlatilmaydi"], ["Brutto va brutto", "Ikkalasi ham", "Lekin bu ikki xil o'zgaruvchi: katta-kichik harf farq qiladi"], ["print, if, for", "Yo'q", "Python'ning band so'zlari"]], "id": "py-naming"}, {"t": "code", "title": "Arifmetika", "lang": "python", "src": "print(10 + 3)     # 13   qo'shish\nprint(10 - 3)     # 7    ayirish\nprint(10 * 3)     # 30   ko'paytirish\nprint(10 / 3)     # 3.333...  bo'lish (doim kasr)\nprint(10 // 3)    # 3    butun qism\nprint(10 % 3)     # 1    qoldiq\nprint(2 ** 3)     # 8    daraja\n\ntonna = 12450 / 1000\nprint(round(tonna, 2))   # 12.45", "side": ["<b>/<\/b> natijasi doim kasr son.", "<b>//<\/b> — butun qismi, <b>%<\/b> — qoldiq. Masalan, qancha to'liq qop va qancha qoldi.", "<b>round(x, 2)<\/b> — 2 kasr xonasigacha yaxlitlash."], "caption": null, "id": "py-math"}, {"t": "code", "title": "Matn bilan ishlash", "lang": "python", "src": "raqam = \" 01a123bc \"\ntoza = raqam.strip().upper()     # \"01A123BC\"\nprint(len(toza))                 # 8 ta belgi\nprint(toza[:2])                  # \"01\" — hudud kodi\n\nism = \"Akmal\"\nvazn = 4250\nxabar = f\"{ism} {vazn} kg yuk olib keldi\"\nprint(xabar)\n\nprint(\"ST,GS,+0012450kg\".split(\",\"))\n# ['ST', 'GS', '+0012450kg']", "side": ["<b>strip()<\/b> — boshi va oxiridagi bo'sh joylarni olib tashlaydi.", "<b>upper()<\/b> — katta harfga o'tkazadi.", "<b>[:2]<\/b> — birinchi 2 belgi (kesish).", "<b>f\"…{x}…\"<\/b> — matn ichiga qiymat joylash.", "<b>split(\",\")<\/b> — vergul bo'yicha bo'laklarga ajratish."], "caption": null, "id": "py-str"}, {"t": "table", "title": "Eng kerakli matn funksiyalari", "intro": null, "head": ["Funksiya", "Nima qiladi", "Misol natijasi"], "rows": [["s.strip()", "Chetdagi bo'sh joylarni olib tashlaydi", "\" 12 \" → \"12\""], ["s.upper() / s.lower()", "Katta / kichik harfga", "\"ab\" → \"AB\""], ["s.replace(a, b)", "a ni b ga almashtiradi", "\"O1\" → \"01\""], ["s.split(\",\")", "Bo'laklarga ajratadi", "\"a,b\" → [\"a\", \"b\"]"], ["s.startswith(\"ST\")", "Shu bilan boshlanadimi", "True / False"], ["\"kg\" in s", "Ichida bormi", "True / False"], ["len(s)", "Uzunligi", "8"]], "id": "py-str-methods"}, {"t": "code", "title": "Turlarni o'zgartirish va foydalanuvchidan so'rash", "lang": "python", "src": "matn = \"+0012450\"\nson = int(matn)              # 12450\nkasr = float(\"12.45\")        # 12.45\nqayta = str(son)             # \"12450\"\n\ntara = input(\"Tarani kiriting: \")   # doim matn qaytaradi!\ntara = int(tara)\nprint(\"Netto:\", 12450 - tara)\n\n# int(\"abc\")  → ValueError: son emas", "side": ["<b>int()<\/b> — butun songa, <b>float()<\/b> — kasrga, <b>str()<\/b> — matnga.", "Portdan kelgan ma'lumot doim matn — hisoblashdan oldin songa o'giriladi.", "<b>input()<\/b> klaviaturadan o'qiydi, natija har doim matn."], "caption": null, "id": "py-convert"}, {"t": "table", "title": "Solishtirish va mantiq", "intro": null, "head": ["Yozuv", "Ma'nosi", "Misol"], "rows": [["==", "teng", "holat == \"ST\""], ["!=", "teng emas", "raqam != None"], ["> <", "katta, kichik", "vazn > 1000"], [">= <=", "katta yoki teng, kichik yoki teng", "vazn <= 60000"], ["and", "ikkalasi ham rost", "barqaror and vazn > 1000"], ["or", "kamida bittasi rost", "xato or vazn < 0"], ["not", "teskarisi", "not barqaror"]], "id": "py-compare", "notes": "Eng ko'p uchraydigan xato: tenglikni tekshirishda bitta = yozish. Bitta = — qiymat berish, ikkita == — solishtirish."}, {"t": "code", "title": "Shart: if, elif, else", "lang": "python", "src": "vazn = 12450\n\nif vazn < 100:\n    print(\"Tarozi bo'sh\")\nelif vazn < 1000:\n    print(\"Yengil yuk yoki odam\")\nelif vazn <= 60000:\n    print(\"Mashina tortilmoqda\")\nelse:\n    print(\"Xato: tarozi limitidan oshdi!\")\n\nprint(\"Tekshiruv tugadi\")    # har doim bajariladi", "side": ["Python shartlarni yuqoridan pastga tekshiradi va <b>birinchi<\/b> rost shartni bajaradi.", "<b>elif<\/b> — «aks holda, agar».", "<b>else<\/b> — hech biri to'g'ri kelmasa.", "Ikki nuqta (:) va keyingi qatordagi surilish majburiy."], "caption": null, "id": "py-if"}, {"t": "statement", "title": "Python'da surilish (4 ta bo'sh joy) — bu qoida, bezak emas", "sub": "if, for, def dan keyingi qatorlar 4 ta bo'sh joy ichkariga suriladi. Surilgan qatorlar bir «blok». Surilish noto'g'ri bo'lsa — IndentationError xatosi.", "accent": true, "id": "py-indent"}, {"t": "code", "title": "Ro'yxat (list)", "lang": "python", "src": "vaznlar = [12450, 9800, 15020]\n\nprint(vaznlar[0])        # 12450 — sanash 0 dan boshlanadi\nprint(vaznlar[-1])       # 15020 — oxirgisi\nprint(len(vaznlar))      # 3\n\nvaznlar.append(11000)    # oxiriga qo'shish\nprint(sum(vaznlar))      # 48270\nprint(max(vaznlar))      # 15020\nprint(vaznlar[1:3])      # [9800, 15020]", "side": ["Kvadrat qavs ichida, vergul bilan.", "<b>Indeks 0 dan boshlanadi<\/b>: birinchi element — [0].", "<b>[-1]<\/b> — oxirgi element.", "<b>sum, max, min, len<\/b> — tayyor funksiyalar."], "caption": null, "id": "py-list"}, {"t": "table", "title": "Ro'yxat bilan ishlash", "intro": null, "head": ["Buyruq", "Nima qiladi"], "rows": [["r.append(x)", "Oxiriga qo'shadi"], ["r.insert(0, x)", "Boshiga qo'shadi"], ["r.remove(x)", "Birinchi x ni o'chiradi"], ["r.pop()", "Oxirgisini olib tashlab, qaytaradi"], ["r.sort()", "Tartiblaydi (kichikdan kattaga)"], ["x in r", "x ro'yxatda bormi"], ["r.count(x)", "x necha marta uchraydi"]], "id": "py-list-methods"}, {"t": "code", "title": "Sikl: for", "lang": "python", "src": "vaznlar = [12450, 9800, 15020]\n\nfor v in vaznlar:\n    tonna = v / 1000\n    print(v, \"kg =\", tonna, \"t\")\n\n# 1 dan 5 gacha sonlar\nfor i in range(1, 6):\n    print(\"Tortish\", i)\n\njami = 0\nfor v in vaznlar:\n    jami = jami + v\nprint(\"Jami:\", jami)", "side": ["<b>for v in ro'yxat<\/b> — har bir element uchun blokni bir marta bajaradi.", "<b>range(1, 6)<\/b> — 1, 2, 3, 4, 5 (oxirgisi kirmaydi).", "Yig'indini qo'lda hisoblash: jami 0 dan boshlanib, har safar qo'shiladi."], "caption": null, "id": "py-for"}, {"t": "code", "title": "Sikl: while, break, continue", "lang": "python", "src": "urinish = 0\nwhile urinish  60000:\n        break               # sikldan chiqish\n    print(vazn)", "side": ["<b>while shart<\/b> — shart rost ekan, takrorlaydi.", "<b>while True<\/b> — to'xtovsiz: shlyuz dasturlari shunday ishlaydi.", "<b>continue<\/b> — qolgan qismni tashlab, keyingi aylanishga.", "<b>break<\/b> — sikldan butunlay chiqish."], "caption": null, "id": "py-while"}, {"t": "code", "title": "Lug'at (dict): nomli maydonlar", "lang": "python", "src": "tortish = {\n    \"raqam\": \"01A123BC\",\n    \"brutto\": 12450,\n    \"tara\": 8200,\n}\nprint(tortish[\"raqam\"])                    # 01A123BC\ntortish[\"netto\"] = tortish[\"brutto\"] - tortish[\"tara\"]\n\nprint(tortish.get(\"rasm\", \"yo'q\"))         # kalit bo'lmasa\nfor kalit, qiymat in tortish.items():\n    print(kalit, \"=\", qiymat)", "side": ["Lug'at — <b>kalit: qiymat<\/b> juftliklari. JSON ning Python'dagi aynan o'zi.", "Qiymatni kalit orqali olamiz: <b>tortish[\"raqam\"]<\/b>.", "<b>.get()<\/b> — kalit yo'q bo'lsa, xato o'rniga standart qiymat.", "<b>.items()<\/b> — barcha juftliklarni aylanib chiqish."], "caption": null, "id": "py-dict"}, {"t": "code", "title": "Lug'atlar ro'yxati: haqiqiy ma'lumot shunday ko'rinadi", "lang": "python", "src": "tortishlar = [\n    {\"raqam\": \"01A123BC\", \"netto\": 4250},\n    {\"raqam\": \"10B555AA\", \"netto\": 7100},\n    {\"raqam\": \"01A123BC\", \"netto\": 3900},\n]\n\njami = sum(t[\"netto\"] for t in tortishlar)\nprint(\"Bugun jami:\", jami, \"kg\")\n\nkatta = [t for t in tortishlar if t[\"netto\"] > 4000]\nprint(len(katta), \"ta tortish 4 tonnadan og'ir\")", "side": ["Har bir tortish — lug'at, hammasi — ro'yxat.", "Bazadan yoki API dan kelgan ma'lumot ham xuddi shunday tuzilishga ega.", "<b>[t for t in … if …]<\/b> — shart bo'yicha filtrlangan yangi ro'yxat."], "caption": null, "id": "py-listdict"}, {"t": "code", "title": "Funksiya: bir marta yozing, ko'p marta chaqiring", "lang": "python", "src": "def netto_hisobla(brutto, tara):\n    netto = brutto - tara\n    if netto < 0:\n        return 0\n    return netto\n\nprint(netto_hisobla(12450, 8200))    # 4250\nprint(netto_hisobla(9800, 10100))    # 0\n\ndef tonnaga(kg, xona=2):\n    return round(kg / 1000, xona)\n\nprint(tonnaga(12450))       # 12.45\nprint(tonnaga(12450, 1))    # 12.4", "side": ["<b>def<\/b> — funksiya yaratish, qavs ichida parametrlar.", "<b>return<\/b> — natijani qaytaradi va funksiyadan chiqadi.", "<b>xona=2<\/b> — standart qiymat: berilmasa 2 ishlatiladi.", "Funksiya chaqirilmaguncha hech narsa bajarmaydi."], "caption": null, "id": "py-func"}, {"t": "cards", "title": "Nega hamma narsani funksiyalarga bo'lish kerak", "intro": null, "items": [["Check", "Takrorlanmaydi", "Netto hisobini 10 joyda yozish o'rniga bitta funksiya. Xato bo'lsa — bir joyda tuzatiladi."], ["Book", "O'qish oson", "oqish(), rasmga_ol(), yubor() — kod hikoya kabi o'qiladi."], ["Search", "Sinash oson", "Har bir funksiyani alohida tekshirish mumkin."]], "id": "py-func-why"}, {"t": "table", "title": "Tez-tez uchraydigan xatolar", "intro": null, "head": ["Xato", "Ma'nosi", "Odatiy sabab"], "rows": [["SyntaxError", "Yozilishda xato", "Qavs yoki qo'shtirnoq yopilmagan, : unutilgan"], ["IndentationError", "Surilish noto'g'ri", "Bo'sh joylar soni aralash"], ["NameError", "Bunday nom yo'q", "O'zgaruvchi nomi xato yozilgan"], ["TypeError", "Tur mos emas", "Matn va sonni qo'shish: \"12\" + 5"], ["ValueError", "Qiymat noto'g'ri", "int(\"abc\")"], ["KeyError", "Lug'atda bunday kalit yo'q", "t[\"rasm\"] — kalit mavjud emas"], ["IndexError", "Ro'yxatda bunday o'rin yo'q", "3 elementli ro'yxatda [5]"], ["FileNotFoundError", "Fayl topilmadi", "Yo'l yoki nom xato"]], "id": "py-errors"}, {"t": "code", "title": "Xato xabarini o'qishni o'rganing", "lang": "text", "src": "Traceback (most recent call last):\n  File \"C:\\kurs\\tarozi.py\", line 12, in\n    netto = brutto - tara\n            ~~~~~~~^~~~~~\nTypeError: unsupported operand type(s) for -: 'int' and 'str'", "side": ["Xato xabarini <b>pastdan yuqoriga<\/b> o'qing.", "Oxirgi qator — xato turi va sababi: son (int) dan matn (str) ayirilyapti.", "Yuqorida — fayl nomi va <b>qator raqami<\/b> (12).", "Yechim: tara = int(tara) — matnni songa o'girish."], "caption": null, "id": "py-traceback"}, {"t": "code", "title": "Xatolarni ushlash: try / except", "lang": "python", "src": "def xavfsiz_son(matn):\n    try:\n        return float(matn)\n    except ValueError:\n        print(\"Son emas:\", matn)\n        return None\n\nprint(xavfsiz_son(\"12450\"))    # 12450.0\nprint(xavfsiz_son(\"ST,US\"))    # Son emas… None\n\ntry:\n    f = open(\"sozlama.txt\")\nexcept FileNotFoundError:\n    print(\"Sozlama fayli yo'q, standart qiymatlar\")\nfinally:\n    print(\"Tekshiruv tugadi\")", "side": ["<b>try<\/b> ichidagi kodda xato bo'lsa, dastur to'xtamaydi — <b>except<\/b> ga o'tadi.", "Qurilmalar bilan ishlaganda bu majburiy: kabel uziladi, ma'lumot buziladi.", "<b>finally<\/b> — xato bo'lsa ham, bo'lmasa ham bajariladi."], "caption": null, "id": "py-try"}, {"t": "code", "title": "Fayllarga yozish va o'qish", "lang": "python", "src": "# Yozish: \"a\" — oxiriga qo'shish, \"w\" — qaytadan yozish\nwith open(\"tortishlar.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"01A123BC;12450\\n\")\n\n# O'qish\nwith open(\"tortishlar.txt\", encoding=\"utf-8\") as f:\n    for qator in f:\n        raqam, vazn = qator.strip().split(\";\")\n        print(raqam, int(vazn))", "side": null, "caption": "with … as f — fayl ish tugagach avtomatik yopiladi. encoding=\"utf-8\" — o'zbek va rus harflari buzilmasligi uchun.", "id": "py-files"}, {"t": "code", "title": "CSV: Excelda ochiladigan jadval", "lang": "python", "src": "import csv\nfrom datetime import datetime\n\nwith open(\"tortishlar.csv\", \"a\", newline=\"\", encoding=\"utf-8-sig\") as f:\n    w = csv.writer(f, delimiter=\";\")\n    w.writerow([datetime.now().strftime(\"%d.%m.%Y %H:%M\"), \"01A123BC\", 12450])\n\nwith open(\"tortishlar.csv\", encoding=\"utf-8-sig\") as f:\n    for qator in csv.reader(f, delimiter=\";\"):\n        print(qator)", "side": null, "caption": "utf-8-sig va nuqta-vergul (;) — fayl Excelda ikki marta bosilganda harflar buzilmasdan, ustunlarga to'g'ri bo'linib ochiladi.", "id": "py-csv"}, {"t": "code", "title": "JSON: saqlash va o'q
