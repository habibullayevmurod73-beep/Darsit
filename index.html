ish", "lang": "python", "src": "import json\n\nsozlama = {\"port\": \"COM3\", \"baud\": 9600, \"min_vazn\": 1000}\n\nwith open(\"sozlama.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(sozlama, f, ensure_ascii=False, indent=2)\n\nwith open(\"sozlama.json\", encoding=\"utf-8\") as f:\n    s = json.load(f)\nprint(s[\"port\"], s[\"baud\"])\n\nmatn = json.dumps(sozlama)       # lug'at → JSON matn\nqayta = json.loads(matn)         # JSON matn → lug'at", "side": ["<b>dump / load<\/b> — fayl bilan.", "<b>dumps / loads<\/b> (s — string) — matn bilan: serverga yuborish va qabul qilish.", "Sozlamalarni kodga emas, JSON faylga yozing: port o'zgarsa, kod o'zgarmaydi."], "caption": null, "id": "py-json"}, {"t": "code", "title": "Modullar: boshqa fayldagi kodni ulash", "lang": "python", "src": "# Standart kutubxonadan\nimport math\nfrom datetime import datetime, timedelta\n\n# O'zingizning faylingizdan: hisob.py\n# (ichida def netto_hisobla(...) bor)\nfrom hisob import netto_hisobla\n\n# O'rnatilgan kutubxonadan\nimport requests\n\nprint(math.sqrt(16))\nprint(netto_hisobla(12450, 8200))", "side": ["<b>import x<\/b> — butun modulni ulash: x.funksiya().", "<b>from x import y<\/b> — faqat kerakli qismini.", "Loyihangizdagi har bir .py fayl ham modul bo'la oladi.", "Tashqi kutubxonalar avval pip bilan o'rnatiladi."], "caption": null, "id": "py-import"}, {"t": "code", "title": "pip, virtual muhit va requirements.txt", "lang": "bash", "src": "# 1. Loyiha papkasida virtual muhit\npython -m venv venv\nvenv\\Scripts\\activate            # satr boshida (venv) chiqadi\n\n# 2. Kutubxonalarni o'rnatish\npip install pyserial requests\n\n# 3. Ro'yxatni saqlash\npip freeze > requirements.txt\n\n# 4. Boshqa kompyuterda hammasini birdan o'rnatish\npip install -r requirements.txt", "side": null, "caption": "requirements.txt — loyiha qaysi kutubxonalarga muhtojligining ro'yxati. Serverga ko'chirishda juda qo'l keladi.", "id": "py-venv"}, {"t": "code", "title": "Sana va vaqt", "lang": "python", "src": "import time\nfrom datetime import datetime, timedelta\n\nhozir = datetime.now()\nprint(hozir.strftime(\"%d.%m.%Y %H:%M\"))   # 28.09.2026 09:15\nkecha = hozir - timedelta(days=1)\n\nboshlanish = time.time()     # soniyalar (hisoblash uchun)\ntime.sleep(3)                # 3 soniya kutish\notdi = time.time() - boshlanish\nprint(f\"{otdi:.1f} soniya o'tdi\")", "side": ["<b>datetime<\/b> — kalendar sana va vaqti: hujjatlar va hisobotlar uchun.", "<b>strftime<\/b> — chiroyli ko'rinishda chiqarish.", "<b>time.time()<\/b> — «og'irlik 3 soniya o'zgarmadimi» kabi hisoblar uchun.", "<b>sleep<\/b> — dasturni to'xtatib turish."], "caption": null, "id": "py-time"}, {"t": "term", "title": "Klass va obyekt", "def": "Klass — obyekt uchun andoza: qanday ma'lumot va qanday amallari borligi. Obyekt — shu andozadan yaratilgan aniq narsa.", "analogy": "Mashina chizmasi (klass) va zavoddan chiqqan har bir aniq mashina (obyekt). Chizma bitta — mashinalar ko'p, har birining o'z raqami bor.", "example": "Tarozi klassi: porti, tezligi va «og'irlikni o'qi» amali. TAROZI_1 va TAROZI_2 — ikki obyekt, har biri o'z portida.", "id": "py-class-idea"}, {"t": "code", "title": "Klass: Tarozi", "lang": "python", "src": "class Tarozi:\n    def __init__(self, nomi, port):\n        self.nomi = nomi\n        self.port = port\n        self.oxirgi = None\n\n    def yangila(self, vazn):\n        self.oxirgi = vazn\n        print(f\"{self.nomi}: {vazn} kg\")\n\nt1 = Tarozi(\"SCALE-1\", \"COM3\")\nt2 = Tarozi(\"SCALE-2\", \"COM4\")\nt1.yangila(12450)\nt2.yangila(9800)", "side": ["<b>__init__<\/b> — obyekt yaratilganda ishlaydi: boshlang'ich qiymatlar.", "<b>self<\/b> — «shu obyektning o'zi».", "Har bir obyekt o'z ma'lumotini saqlaydi: t1.oxirgi va t2.oxirgi — har xil.", "OpenCV Camera, FastAPI app — bular ham klasslar."], "caption": null, "id": "py-class"}, {"t": "code", "title": "Internet va API bilan ishlash: requests", "lang": "python", "src": "import requests\n\n# Ma'lumot olish (GET)\nr = requests.get(\"http://server:8000/api/weighings\", timeout=5)\nprint(r.status_code)          # 200 — muvaffaqiyatli\ndata = r.json()               # JSON → Python ro'yxat/lug'at\n\n# Ma'lumot yuborish (POST)\nr = requests.post(\"http://server:8000/api/weighings\",\n                  json={\"id\": \"t1\", \"weight\": 12450}, timeout=5)\nif r.ok:\n    print(\"Yuborildi\")\nelse:\n    print(\"Xato:\", r.status_code, r.text)", "side": null, "caption": null, "id": "py-requests", "notes": "timeout har doim bering: server javob bermasa, dastur abadiy kutib qolmasin."}, {"t": "code", "title": "Log: dastur kundaligi", "lang": "python", "src": "import logging\n\nlogging.basicConfig(\n    filename=\"shlyuz.log\",\n    level=logging.INFO,\n    format=\"%(asctime)s %(levelname)s %(message)s\",\n    encoding=\"utf-8\",\n)\n\nlogging.info(\"Dastur ishga tushdi\")\nlogging.warning(\"Tarozi javob bermayapti, qayta ulanish\")\nlogging.error(\"Serverga yuborilmadi: %s\", \"timeout\")", "side": ["print ekranga chiqaradi va yo'qoladi; log faylda qoladi.", "Darajalar: DEBUG, INFO, WARNING, ERROR.", "Kechasi nima bo'lganini ertalab log faylidan o'qiysiz."], "caption": null, "id": "py-logging"}, {"t": "code", "title": "Parol va sozlamalarni koddan ajratish", "lang": "python", "src": "# .env fayli (Git ga qo'shilmaydi!)\n# CAM1_URL=rtsp://admin:Parol@192.168.1.64:554/...\n# TG_TOKEN=123456:ABC...\n\n# pip install python-dotenv\nfrom dotenv import load_dotenv\nimport os\n\nload_dotenv()\nurl = os.getenv(\"CAM1_URL\")\ntoken = os.getenv(\"TG_TOKEN\")", "side": ["Parolni kod ichiga yozsangiz, kod bilan birga tarqalib ketadi.", "<b>.env<\/b> faylida saqlang, kod faqat nomini biladi.", "Har bir kompyuterda o'z .env fayli."], "caption": null, "id": "py-env"}, {"t": "table", "title": "Kichik loyihaning to'g'ri tuzilishi", "intro": null, "head": ["Fayl yoki papka", "Vazifasi"], "rows": [["main.py", "Dastur shu yerdan boshlanadi"], ["tarozi.py, kamera.py", "Har bir qurilma — alohida modul"], ["sozlama.json yoki .env", "Port, manzil, parollar"], ["requirements.txt", "Kerakli kutubxonalar ro'yxati"], ["logs/", "Log fayllar"], ["data/", "CSV, rasmlar, navbat fayllari"], ["README.md", "Loyiha nima qiladi va qanday ishga tushadi"]], "id": "py-structure"}, {"t": "steps", "title": "VS Code'da xatoni qidirish (otladka)", "intro": null, "items": [["To'xtash nuqtasi", "Qator raqamining chap tomonini bosing — qizil nuqta paydo bo'ladi."], ["Otladkani boshlang", "F5 → «Python File»."], ["Qiymatlarni ko'ring", "Dastur nuqtada to'xtaydi: chapdagi VARIABLES oynasida barcha o'zgaruvchilar."], ["Qadam-baqadam", "F10 — keyingi qator, F11 — funksiya ichiga kirish, F5 — davom etish."]], "id": "py-debug"}, {"t": "cards", "title": "Yaxshi dasturchi odatlari", "intro": null, "items": [["Book", "Ma'noli nomlar", "a, b, x emas — brutto, tara, raqam. Olti oydan keyin o'zingiz tushunasiz."], ["Wrench", "Kichik funksiyalar", "Har bir funksiya bitta ish qilsin: o'qish, tekshirish, yuborish."], ["Search", "Tez-tez ishga tushiring", "5–10 qator yozing — sinang. 200 qatorni birdan yozmang."], ["Database", "Nusxa va Git", "O'zgarishlarni saqlang: ishlagan versiyaga qaytish imkoni bo'lsin."]], "id": "py-habits"}, {"t": "statement", "title": "Amaliyot: tarozisiz tarozi dasturi", "sub": "Haqiqiy tarozi yo'q bo'lsa ham o'rganish to'xtamaydi. Tarozi xatti-harakatini taqlid qiladigan simulyator yozamiz va unga butun mantiqni quramiz.", "accent": false, "id": "py-sim-intro"}, {"t": "code", "title": "1-qadam: tarozi simulyatori", "lang": "python", "src": "import random, time\n\ndef tarozi_simulyatori():\n    while True:\n        yield \"ST\", 0                       # bo'sh\n        for v in range(0, 12000, 1500):     # kirmoqda\n            yield \"US\", v\n        maqsad = random.randint(9000, 16000)\n        for _ in range(8):                  # tebranish\n            yield \"US\", maqsad + random.randint(-80, 80)\n        for _ in range(6):                  # barqaror\n            yield \"ST\", maqsad\n        for v in range(maqsad, 0, -3000):   # chiqmoqda\n            yield \"US\", v", "side": ["<b>yield<\/b> — har chaqirilganda keyingi qiymatni beradi (generator).", "Haqiqiy tarozi kabi: bo'sh → kirish → tebranish → barqaror → chiqish.", "<b>random.randint<\/b> — har mashina uchun tasodifiy og'irlik."], "caption": null, "id": "py-sim1"}, {"t": "code", "title": "2-qadam: barqaror og'irlikni aniqlash", "lang": "python", "src": "yozildi = False\nfor holat, vazn in tarozi_simulyatori():\n    time.sleep(0.3)\n    print(holat, vazn)\n    if vazn >> TORTILDI:\", vazn, \"kg\")\n        saqla(vazn)\n        yozildi = True", "side": ["Faqat barqaror (ST) va hali yozilmagan og'irlik saqlanadi.", "Tarozi bo'shaganda bayroq tozalanadi — keyingi mashina uchun tayyor.", "Bu 9-moduldagi haqiqiy shlyuz mantiqining soddalashtirilgan varianti."], "caption": null, "id": "py-sim2"}, {"t": "code", "title": "3-qadam: CSV ga saqlash va kunlik hisobot", "lang": "python", "src": "import csv\nfrom datetime import datetime\n\ndef saqla(vazn):\n    with open(\"tortishlar.csv\", \"a\", newline=\"\", encoding=\"utf-8-sig\") as f:\n        csv.writer(f, delimiter=\";\").writerow(\n            [datetime.now().strftime(\"%d.%m.%Y %H:%M:%S\"), vazn])\n\ndef hisobot():\n    with open(\"tortishlar.csv\", encoding=\"utf-8-sig\") as f:\n        vaznlar = [int(q[1]) for q in csv.reader(f, delimiter=\";\")]\n    print(\"Tortishlar soni:\", len(vaznlar))\n    print(\"Jami:\", sum(vaznlar), \"kg\")\n    print(\"O'rtacha:\", round(sum(vaznlar) / len(vaznlar)), \"kg\")", "side": null, "caption": null, "id": "py-sim3", "notes": "Dasturni bir necha daqiqa ishlatib, keyin hisobot() ni chaqiring. CSV faylni Excelda ham ochib ko'ring."}, {"t": "steps", "title": "Mustaqil mashqlar", "intro": null, "items": [["Konvertor", "Kilogrammni tonnaga va aksincha o'giradigan funksiya yozing."], ["Filtr", "Tortishlar ro'yxatidan 10 tonnadan og'irlarini ajrating."], ["Raqam tekshiruvi", "Matn O'zbekiston avtomobil raqami formatidami — tekshiruvchi funksiya."], ["Simulyatorga tara", "Har bir mashinaga tara qo'shing va nettoni hisoblang."], ["Ogohlantirish", "Og'irlik 40 tonnadan oshsa, logga WARNING yozing."], ["Sozlamalar", "Minimal vazn va kutish vaqtini sozlama.json dan o'qing."]], "id": "py-exercises"}, {"t": "quiz", "q": "vaznlar = [12450, 9800, 15020] bo'lsa, vaznlar[1] nimaga teng?", "opts": ["12450", "9800", "15020"], "a": 1, "expl": "Python'da sanash 0 dan boshlanadi: [0] — 12450, [1] — 9800.", "id": "py-q1"}, {"t": "quiz", "q": "Portdan kelgan \"12450\" matnini hisoblash uchun nima qilish kerak?", "opts": ["Hech narsa, u allaqachon son", "int(\"12450\") bilan songa o'girish", "print() qilish"], "a": 1, "expl": "Qo'shtirnoq ichidagi qiymat — matn. Matematik amaldan oldin int() yoki float() bilan songa o'giriladi.", "id": "py-q2"}, {"t": "quiz", "q": "TypeError: unsupported operand type(s) for -: 'int' and 'str' xatosi nimani bildiradi?", "opts": ["Fayl topilmadi", "Son va matn o'rtasida ayirish qilinmoqda", "Surilish noto'g'ri"], "a": 1, "expl": "Ikki qiymatdan biri matn. Uni songa o'giring.", "id": "py-q3"}, {"t": "quiz", "q": "Kamera paroli qayerda saqlanishi to'g'ri?", "opts": ["Kod ichida", ".env faylda, koddan alohida", "Fayl nomida"], "a": 1, "expl": "Kod tarqalishi yoki Git ga tushishi mumkin. Parollar .env faylda turadi.", "id": "py-q4"}, {"t": "quiz", "id": "xq-py-0", "q": "range(1, 4) qaysi sonlarni beradi?", "opts": ["1, 2, 3, 4", "1, 2, 3", "0, 1, 2, 3"], "a": 1, "expl": "Oxirgi son kirmaydi."}, {"t": "quiz", "id": "xq-py-1", "q": "Lug'atda kalit yo'q bo'lsa, xato bermasdan qiymat olish?", "opts": ["t[\"rasm\"]", "t.get(\"rasm\")", "t.rasm"], "a": 1, "expl": ".get() kalit bo'lmasa None (yoki berilgan standart qiymat) qaytaradi."}, {"t": "quiz", "id": "xq-py-2", "q": "with open(...) as f ning afzalligi?", "opts": ["Fayl tezroq o'qiladi", "Ish tugagach fayl avtomatik yopiladi", "Faqat katta fayllar uchun"], "a": 1, "expl": "Xato bo'lsa ham fayl to'g'ri yopiladi."}]}, {"id": "m1", "num": 1, "title": "Avtomatlashtirish arxitekturasi", "goal": "Butun tizim qanday qismlardan tuzilganini tushunasiz: ma'lumot tarozidan chiqib, 1C hujjatiga aylangunicha qaysi yo'lni bosib o'tadi.", "stages": [0, 1, 2, 3, 4, 5], "vol": 1, "blocks": [{"t": "statement", "title": "Avtomatlashtirish — takroriy qo'l ishini qurilma va dastur zimmasiga o'tkazish", "sub": "Og'irlikni daftarga yozish, raqamni 1C ga qo'lda kiritish, kunlik hisobotni Excelda yig'ish — bularning hammasi avtomatlashtiriladi.", "accent": true, "id": "m1-def"}, {"t": "cards", "title": "Avtomatlashtirish nima beradi", "intro": null, "items": [["Check", "Xatolar kamayadi", "Raqamni qayta yozishda adashish yo'qoladi: qurilma qiymatni to'g'ridan-to'g'ri uzatadi."], ["Lock", "Manipulyatsiya qiyinlashadi", "Har bir tortishda rasm, vaqt va noyob ID saqlanadi — ma'lumotni sezdirmay o'zgartirib bo'lmaydi."], ["Clock", "Vaqt tejaladi", "Operator qo'lda yozish o'rniga faqat nazorat qiladi, navbatlar qisqaradi."], ["Chart", "Real vaqtda nazorat", "Rahbar kabinetdan yoki telefondan ayni paytdagi holatni ko'radi."]], "id": "m1-benefits"}, {"t": "flow", "title": "Misol: avtomobil tarozisida bir tortish", "items": [["Search", "Kamera", "Mashina raqamini taniydi va rasmga oladi"], ["Activity", "Tarozi", "Barqaror og'irlikni portga uzatadi"], ["Database", "Server", "Voqeani saqlaydi, dashboardga chiqaradi"], ["CheckCircle", "1C", "«Tortish» hujjati avtomatik yaratiladi"]], "caption": "Operator hech narsa yozmaydi. Sun'iy intellekt esa shu paytda g'ayrioddiy holatlarni tekshiradi.", "id": "m1-flow"}, {"t": "stack", "title": "Tizimning 6 qatlami", "intro": null, "rows": [["Qurilmalar", "Tarozi, IP-kamera, RFID, datchiklar, shtrix-skaner"], ["Shlyuz", "Python skript: RS-232/485, Modbus, TCP, RTSP orqali o'qish"], ["Server va API", "FastAPI, PostgreSQL, WebSocket, Docker"], ["1C", "Buxgalteriya va hisob: HTTP-servislar, OData, kengaytmalar"], ["Sun'iy intellekt", "YOLO, OCR, anomaliya aniqlash, LLM API"], ["Foydalanuvchi", "Web dashboard, Telegram bot, mobil qurilma"]], "id": "m1-layers", "notes": "Qatlamlarni pastdan yuqoriga o'qing: ma'lumot qurilmada tug'iladi, shlyuz uni o'qiydi, server saqlaydi, 1C hisobga oladi, AI tahlil qiladi, foydalanuvchi ko'radi."}, {"t": "compare", "title": "Asosiy qoida: qatlamlar faqat qo'shnisi bilan gaplashadi", "left": ["Noto'g'ri: to'g'ridan-to'g'ri", ["Tarozi kodi 1C ichida yozilgan", "1C yangilansa, tarozi ishlamay qoladi", "1C o'chsa, tortishlar yo'qoladi", "Kamera, bot, hisobot uchun har safar 1C ni o'zgartirish kerak"]], "right": ["To'g'ri: server orqali", ["Tarozi faqat serverga yuboradi", "Server 1C ga alohida uzatadi", "1C o'chsa, server kutib turadi va keyin yuboradi", "Yangi qurilma qo'shish 1C ga ta'sir qilmaydi"]], "id": "m1-rule"}, {"t": "cards", "title": "Ish muhiti: nimalarni o'rnatish kerak", "intro": null, "items": [["Code", "Python 3.11+", "Shlyuz, server va sun'iy intellekt uchun asosiy til."], ["Wrench", "VS Code", "Bepul kod muharriri, Python va 1C kengaytmalari bilan."], ["Database", "1C:Предприятие 8.3", "O'quv versiyasi bepul, Konfigurator bilan birga."], ["Database", "PostgreSQL", "Tortishlar va voqealarni saqlash uchun baza."], ["Cloud", "Docker", "Servislarni bitta buyruq bilan ishga tushirish."], ["Search", "Postman va VLC", "API ni sinash va kamera oqimini tekshirish."]], "id": "m1-env"}, {"t": "code", "title": "Python kutubxonalarini o'rnatish", "lang": "bash", "src": "# 1. Loyiha uchun alohida muhit yaratamiz\npython -m venv venv\n\n# 2. Muhitni yoqamiz\nvenv\\Scripts\\activate          # Windows\nsource venv/bin/activate       # Linux\n\n# 3. Kerakli kutubxonalar\npip install pyserial pymodbus requests\npip install fastapi \"uvicorn[standard]\" sqlalchemy psycopg2-binary\npip install opencv-python ultralytics easyocr pandas scikit-learn", "side": null, "caption": "Virtual muhit (venv) har bir loyiha kutubxonalarini alohida saqlaydi — loyihalar bir-biriga xalaqit bermaydi.", "id": "m1-install"}, {"t": "statement", "title": "Qoida: ishlab chiqarish bazasida hech qachon tajriba qilmang", "sub": "Har doim 1C bazasining nusxasida, sinov kompyuterida va sinov tarozisida ishlang. Tayyor bo'lgach, keyin ko'chiring.", "accent": false, "id": "m1-safe"}, {"t": "statement", "title": "Avval jarayonni tushunamiz, keyin kod yozamiz", "sub": "Eng ko'p muvaffaqiyatsiz loyihalar kod yomonligidan emas, balki noto'g'ri jarayon avtomatlashtirilgani yoki kerakli odamlar bilan gaplashilmagani uchun muvaffaqiyatsiz bo'ladi.", "accent": true, "id": "a-intro"}, {"t": "steps", "title": "Qaysi jarayonni avtomatlashtirishni qanday tanlash kerak", "intro": null, "items": [["Kuzating", "Bir-ikki kun jarayon yonida turing: kim, nima, qachon, qanday qiladi."], ["Qo'l ishlarini yozing", "Qayerda odam raqamni ko'rib, boshqa joyga qayta yozyapti?"], ["Xatolarni sanang", "Qayerda eng ko'p xato, kechikish yoki nizo bo'ladi?"], ["Foydani baholang", "Avtomatlashtirilsa, qancha vaqt va yo'qotish tejaladi?"], ["Kichikdan boshlang", "Eng oddiy va eng foydali bitta jarayonni tanlang."], ["Odamlarni qo'shing", "Operator va rahbar fikrini oling: ular foydalanuvchilar."]], "id": "a-process"}, {"t": "table", "title": "Hozirgi holat: qo'lda tortish (misol)", "intro": null, "head": ["Qadam", "Kim bajaradi", "Muammo"], "rows": [["Mashina raqamini daftarga yozish", "Operator", "Xato yozish, o'qib bo'lmaydigan yozuv"], ["Indikatordan og'irlikni ko'chirish", "Operator", "Raqam adashadi, o'zgartirish mumkin"], ["Chiqishda tarani yozish", "Operator", "Kirish yozuvini qidirish qiyin"], ["Kun oxirida Excelga kiritish", "Operator", "Qo'shimcha 1–2 soat ish"], ["1C ga qo'lda hujjat kiritish", "Buxgalter", "Kechikish, ikki marta kiritish"], ["Rahbarga hisobot", "Buxgalter", "Faqat ertasi kuni ma'lum bo'ladi"]], "id": "a-asis"}, {"t": "table", "title": "Kelajakdagi holat: avtomatik tortish", "intro": null, "head": ["Qadam", "Kim / nima bajaradi", "Natija"], "rows": [["Raqamni tanish", "Kamera + AI", "Rasm bilan, xatosiz"], ["Og'irlikni olish", "Shlyuz dasturi", "Faqat barqaror qiymat"], ["Kirish va chiqishni bog'lash", "Server", "Netto avtomatik"], ["Hujjat yaratish", "1C HTTP-servis", "Bir necha soniyada"], ["Hisobot", "Dashboard va Telegram", "Real vaqtda"], ["Operator", "Nazorat qiladi", "Faqat istisno holatlarda aralashadi"]], "id": "a-tobe"}, {"t": "cards", "title": "Nimadan boshlash kerak: ustuvorlik matritsasi", "intro": null, "items": [["Star", "Oson va foydali", "Birinchi navbatda qiling. Masalan: tarozidan og'irlikni avtomatik olish."], ["Chart", "Qiyin, lekin foydali", "Rejalashtiring, bosqichma-bosqich. Masalan: raqamni AI bilan tanish."], ["Clock", "Oson, lekin foydasi kam", "Vaqt bo'lganda. Masalan: chiroyli dizayn."], ["Warning", "Qiyin va foydasi kam", "Hozircha qilmang."]], "id": "a-priority"}, {"t": "cards", "title": "Talablarni yozib olish: 4 guruh", "intro": null, "items": [["CheckCircle", "Funksional", "Tizim nima qilishi kerak: tortish, rasm, hujjat, hisobot, xabarnoma."], ["Verified", "Ishonchlilik", "Internet yoki 1C o'chsa nima bo'ladi? Ma'lumot yo'qolmasligi shart."], ["Lock", "Xavfsizlik", "Kim nimani ko'radi va o'zgartira oladi? Ma'lumotni kim o'chira oladi?"], ["Link", "Integratsiya", "1C ning qaysi versiyasi, qaysi hujjat, qaysi maydonlar."]], "id": "a-req", "notes": "Talablarni qog'ozga yozing va rahbar bilan kelishib oling. Loyiha oxirida «biz buni kutmagan edik» degan gapning oldini oladi."}, {"t": "table", "title": "Kerakli uskunalar ro'yxati (bitta avtomobil tarozisi)", "intro": null, "head": ["Uskuna", "Vazifasi", "E'tibor bering"], "rows": [["Shlyuz kompyuteri", "Tarozi va kamerani o'qiydi", "Sanoat mini-PC, changdan himoyalangan"], ["UPS (uzluksiz quvvat)", "Elektr uzilishida ishlashni davom ettiradi", "Kamida 15–30 daqiqa"], ["Tarmoq switchi (PoE)", "Kameralarga tok va internet", "PoE quvvati yetarliligi"], ["IP-kameralar (2 ta)", "Old va orqa raqam", "IR yoritgich, ko'cha uchun himoya"], ["Kabellar", "RS-232/485, tarmoq", "Ekranli, himoya quvurida"], ["Server", "API, baza, sinxronizatsiya", "Alohida xonada, zaxira disk bilan"]], "id": "a-hw"}, {"t": "statement", "title": "UPS — ixtiyoriy emas", "sub": "Elektr bir soniya uzilsa, kompyuter o'chadi, fayl buziladi, tortish yo'qoladi. Tarozi, shlyuz kompyuteri, switch va server — hammasi UPS orqali ulansin.", "accent": false, "id": "a-ups"}, {"t": "compare", "title": "Server qayerda turadi: korxonada yoki bulutda", "left": ["Korxona ichida (lokal)", ["Internet uzilsa ham ishlaydi", "Ma'lumot korxonadan chiqmaydi", "Uskuna va xizmat sizning zimmangizda", "Tarozi va 1C bilan tez aloqa"]], "right": ["Bulutda", ["Hamma joydan kirish oson", "Uskunaga g'amxo'rlik shart emas", "Internetga bog'liq", "Oylik to'lov"]], "id": "a-edge", "notes": "Ko'p korxonalar uchun eng yaxshi yechim — aralash: tarozi yonidagi shlyuz va asosiy server korxonada, faqat rahbar uchun hisobot yoki bot bulutda."}, {"t": "stack", "title": "Ma'lumotning to'liq yo'li", "intro": null, "rows": [["1. Tug'iladi", "Tenzodatchik signali → indikator raqami"], ["2. O'qiladi", "Shlyuz: portdan matn → son → barqarorlik tekshiruvi"], ["3. Boyitiladi", "ID, vaqt, rasm, tanilgan raqam qo'shiladi"], ["4. Saqlanadi", "Avval lokal navbatga, keyin server bazasiga"], ["5. Uzatiladi", "1C ga hujjat, dashboardga, Telegramga"], ["6. Tahlil qilinadi", "Hisobotlar, anomaliyalar, bashorat"]], "id": "a-flow"}, {"t": "cards", "title": "Ikki asosiy qoida: noyob ID va to'g'ri vaqt", "intro": null, "items": [["Key", "Noyob ID tug'ilgan joyida", "ID ni shlyuz beradi — server yoki 1C emas. Shunda qayta yuborish takror yaratmaydi."], ["Clock", "Hamma qurilmada bir xil vaqt", "Kamera, shlyuz, server, 1C — NTP orqali sinxron. Aks holda rasm va og'irlik vaqti mos kelmaydi."], ["Globe", "Vaqt zonasini saqlang", "Vaqtni zonasi bilan yozing: +05:00 (Toshkent)."]], "id": "a-ids"}, {"t": "table", "title": "Nima buzilishi mumkin va tizim qanday javob beradi", "intro": null, "head": ["Nosozlik", "Tizim reaksiyasi"], "rows": [["Tarozi kabeli uzildi", "Shlyuz qayta ulanishga urinadi, operatorga ogohlantirish"], ["Elektr o'chdi", "UPS ishlaydi; uzoq bo'lsa kompyuter to'g'ri o'chadi"], ["Kamera javob bermayapti", "Tortish rasmsiz saqlanadi, belgi qo'yiladi"], ["Server ishlamayapti", "Shlyuz lokal navbatda saqlaydi"], ["1C o'chiq", "Server kutadi va keyin yuboradi"], ["Disk to'ldi", "Monitoring oldindan ogohlantiradi, eski rasmlar arxivlanadi"]], "id": "a-fail"}, {"t": "table", "title": "Loyihada kim nima qiladi", "intro": null, "head": ["Rol", "Vazifasi"], "rows": [["Rahbar", "Maqsad va ustuvorliklarni belgilaydi, natijani qabul qiladi"], ["Operator", "Jarayonni biladi, tizimni sinaydi va ishlatadi"], ["Elektrik / KIP mutaxassisi", "Kabel, tarozi va quvvat ulanishi"], ["Tarmoq administratori", "IP manzillar, VLAN, kirish huquqlari"], ["Python dasturchi", "Shlyuz, server, AI"], ["1C dasturchi", "Obyektlar, HTTP-servis, kengaytma"]], "id": "a-team", "notes": "Kichik korxonada bir kishi bir nechta rolni bajaradi. Muhimi — har bir vazifaning egasi aniq bo'lsin."}, {"t": "steps", "title": "Loyiha bosqichlari", "intro": null, "items": [["So'rov va tahlil", "Jarayonni kuzatish, talablarni yozish."], ["Prototip", "Stolda: tarozi simulyatori + test 1C bazasi."], ["Pilot", "Bitta tarozida, parallel ravishda qo'lda ham yozib boriladi."], ["Taqqoslash", "1–2 hafta qo'lda va avtomatik natijalarni solishtirish."], ["Ishga tushirish", "Qo'lda yozish to'xtatiladi, operatorlar o'qitiladi."], ["Kengaytirish", "Keyingi tarozilar, kameralar, AI."]], "id": "a-phases"}, {"t": "cards", "title": "Nimalarni yozib qo'yish kerak", "intro": null, "items": [["Book", "Sxema", "Qaysi qurilma qayerda, qaysi IP manzilda, qaysi kabel bilan ulangan."], ["Key", "Parollar ro'yxati", "Xavfsiz joyda: kamera, server, 1C api_user."], ["Settings", "Sozlamalar", "Indikator parametrlari, port sozlamalari, JSON almashuv formati."], ["Wrench", "Qo'llanma", "Operator uchun: nosozlikda nima qilish kerak — bir varaq."]], "id": "a-docs"}, {"t": "quiz", "q": "Avtomatlashtirish loyihasini nimadan boshlash to'g'ri?", "opts": ["Darhol kod yozishdan", "Jarayonni kuzatib, eng foydali va oddiy qismni tanlashdan", "Eng qimmat uskunani sotib olishdan"], "a": 1, "expl": "Jarayonni tushunmasdan yozilgan dastur noto'g'ri muammoni hal qiladi.", "id": "a-q1"}, {"t": "quiz", "q": "Pilot bosqichida nega qo'lda yozish ham davom ettiriladi?", "opts": ["Operatorlar zerikmasligi uchun", "Avtomatik natijani qo'lda yozilgani bilan solishtirib tekshirish uchun", "Qonun talab qiladi"], "a": 1, "expl": "Parallel ishlash tizim xatolarini xavfsiz topishga imkon beradi.", "id": "a-q2"}, {"t": "quiz", "q": "Nega tarozini to'g'ridan-to'g'ri 1C ga ulash o'rniga o'rtaga server qo'yiladi?", "opts": ["Server arzonroq bo'lgani uchun", "Qatlamlar mustaqil bo'ladi: bittasi o'zgarsa, boshqasi buzilmaydi", "1C tarozini umuman ko'rmaydi"], "a": 1, "expl": "Server bufer va tarjimon vazifasini bajaradi: 1C ishlamay qolsa ham tortishlar yo'qolmaydi.", "id": "m1-q1"}, {"t": "quiz", "q": "Shlyuz qatlamining vazifasi nima?", "opts": ["Hisobot chiqarish", "Qurilmadan ma'lumotni o'qib, serverga uzatish", "Foydalanuvchi parolini saqlash"], "a": 1, "expl": "Shlyuz — qurilma tilini (COM-port, Modbus, RTSP) tushunadigan va uni oddiy JSON ga aylantiradigan dastur.", "id": "m1-q2"}, {"t": "quiz", "id": "xq-m1-0", "q": "Pilotda qo'lda va avtomatik natijalar farq qildi. To'g'ri yo'l?", "opts": ["Farqqa e'tibor bermaslik", "Har bir farqning sababini topib tushuntirish", "Avtomatik tizimni o'chirish"], "a": 1, "expl": "Farqlar tizimdagi yoki qo'lda yozishdagi xatoni ko'rsatadi — ikkalasini ham bilish kerak."}, {"t": "quiz", "id": "xq-m1-1", "q": "Tortishning noyob ID sini qayerda berish kerak?", "opts": ["1C da", "Tug'ilgan joyida — shlyuzda", "Operator qo'lda"], "a": 1, "expl": "Shunda qayta yuborilganda ham server va 1C takrorni taniydi."}]}, {"id": "m2", "num": 2, "title": "Tarozilarni ulash", "goal": "Tarozi indikatoridan og'irlikni COM-port, RS-485 yoki tarmoq orqali o'qib, toza raqamga aylantirishni o'rganasiz.", "stages": [0, 1], "vol": 1, "blocks": [{"t": "flow", "title": "Elektron tarozi qanday tuzilgan", "items": [["Activity", "Tenzodatchik", "Yuk ostida metall egiladi, qarshilik o'zgaradi"], ["Lightning", "Birlashtiruvchi quti", "Bir necha datchik signalini yig'adi"], ["Settings", "Indikator", "Signalni kilogrammga aylantirib, ekranda ko'rsatadi"], ["Link", "Port", "Og'irlikni kompyuterga matn yoki registr sifatida beradi"]], "caption": "Biz aynan indikator portiga ulanamiz. Indikator qo'llanmasi (manual) — eng muhim hujjat: unda protokol yozilgan.", "id": "m2-parts"}, {"t": "table", "title": "Ulanish interfeyslari", "intro": null, "head": ["Interfeys", "Masofa", "Qachon ishlatiladi"], "rows": [["RS-232 (COM-port)", "15 m gacha", "Kompyuter tarozi yonida turganda"], ["RS-485", "1200 m gacha", "Uzoq kabel yoki bir liniyada bir nechta tarozi"], ["USB (virtual COM)", "5 m gacha", "Kichik stol tarozilari"], ["Ethernet (TCP/IP)", "Tarmoq bo'ylab", "Zamonaviy indikatorlar, tarmoqqa ulangan"], ["Modbus RTU / TCP", "RS-485 yoki tarmoq", "Sanoat standarti: og'irlik registrlarda"], ["Wi-Fi / radio", "Qurilmaga bog'liq", "Kabel tortib bo'lmaydigan joylar"]], "id": "m2-if"}, {"t": "visual", "title": "RS-232 kabeli: TX va RX kesishadi", "html": "<section id=\"m2-wiring\" style=\"width:1920px; height:1080px; position:relative; box-sizing:border-box; overflow:hidden; background:#F2F4F7; color:#14213D; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:64px; font-weight:600; line-height:1.15; color:#14213D\">RS-232 kabeli: TX va RX kesishadi<\/h2><div style=\"position:absolute; left:128px; top:320px; width:440px; background:#FBFCFD; border:2px solid #3566C9; border-radius:14px; padding:32px; display:flex; flex-direction:column; gap:24px\"><h3 style=\"font-size:40px; font-weight:600; color:#14213D\">Indikator DB9<\/h3><p style=\"font-size:30px; color:#3A475C\">2-pin — RX (qabul)<\/p><p style=\"font-size:30px; color:#3A475C\">3-pin — TX (uzatish)<\/p><p style=\"font-size:30px; color:#3A475C\">5-pin — GND (yer)<\/p><\/div><div style=\"position:absolute; left:1352px; top:320px; width:440px; background:#FBFCFD; border:2px solid #3566C9; border-radius:14px; padding:32px; display:flex; flex-direction:column; gap:24px\"><h3 style=\"font-size:40px; font-weight:600; color:#14213D\">Kompyuter DB9<\/h3><p style=\"font-size:30px; color:#3A475C\">2-pin — RX (qabul)<\/p><p style=\"font-size:30px; color:#3A475C\">3-pin — TX (uzatish)<\/p><p style=\"font-size:30px; color:#3A475C\">5-pin — GND (yer)<\/p><\/div><p style=\"position:absolute; left:128px; top:760px; width:1664px; font-size:30px; line-height:1.4; color:#3A475C\">Bir qurilmaning TX (uzatish) simi ikkinchisining RX (qabul) kirishiga boradi. Bu «null-modem» ulanish. Ba'zi indikatorlarda simlar allaqachon kesishgan — manualni tekshiring.<\/p>\n<svg style=\"position:absolute; left:0; top:0; width:1920px; height:1080px\" viewBox=\"0 0 1920 1080\" aria-hidden=\"true\"><defs><marker id=\"ah3566C9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#3566C9\"/><\/marker><marker id=\"ah56657A\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#56657A\"/><\/marker><marker id=\"ahE8A317\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#E8A317\"/><\/marker><\/defs><line x1=\"568\" y1=\"547\" x2=\"1352\" y2=\"481\" stroke=\"#E8A317\" stroke-width=\"5\" marker-end=\"url(#ahE8A317)\"/><line x1=\"1352\" y1=\"547\" x2=\"568\" y2=\"481\" stroke=\"#3566C9\" stroke-width=\"5\" marker-end=\"url(#ah3566C9)\"/><line x1=\"568\" y1=\"613\" x2=\"1352\" y2=\"613\" stroke=\"#56657A\" stroke-width=\"5\"/><\/svg><\/section>", "id": "m2-wiring", "notes": "Agar port ochilsa-yu, hech qanday ma'lumot kelmasa, eng ko'p uchraydigan sabab: TX va RX kesishmagan yoki aksincha ikki marta kesishgan. Multimetr bilan simlarni tekshiring."}, {"t": "cards", "title": "Port sozlamalari tarozi bilan bir xil bo'lishi shart", "intro": null, "items": [["Clock", "Baud rate", "Tezlik: ko'pincha 9600, ba'zan 4800 yoki 19200. Mos kelmasa — «bo'tqa» belgilar keladi."], ["Settings", "Data bits", "Odatda 8. Ayrim eski indikatorlarda 7."], ["Check", "Parity", "Juftlik tekshiruvi: odatda None (N). Ba'zan Even (E)."], ["Key", "Stop bits", "Odatda 1. Qisqa yozuv: 9600 8N1."]], "id": "m2-params", "notes": "Qisqa yozuv 9600 8N1 degani: tezlik 9600, 8 bit ma'lumot, juftlik tekshiruvi yo'q, 1 stop bit. Bu sozlamalar indikator menyusida ham, Python kodida ham bir xil bo'lishi kerak."}, {"t": "visual", "title": "Indikator qanday matn yuboradi", "html": "<section id=\"m2-proto\" style=\"width:1920px; height:1080px; position:relative; box-sizing:border-box; overflow:hidden; background:#F2F4F7; color:#14213D; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:64px; font-weight:600; line-height:1.15; color:#14213D\">Indikator qanday matn yuboradi<\/h2><p style=\"font-size:30px; line-height:1.4; color:#3A475C; \">Ko'p indikatorlar har soniyada bir necha marta shunday qator yuboradi. Aniq format har bir modelning qo'llanmasida yozilgan:<\/p><div style=\"background:#0F1A2E; border-radius:16px; padding:40px; display:flex; justify-content:center\"><p style=\"font-size:72px; font-family:'JetBrains Mono', 'Courier New', monospace; color:#DDE6F2; letter-spacing:4px\">ST,GS,+0012450kg<\/p><\/div><div style=\"display:grid; grid-template-columns:repeat(4, 1fr); gap:24px\"><div style=\"border-top:6px solid #E8A317; padding-top:16px; display:flex; flex-direction:column; gap:8px\"><h3 style=\"font-size:30px; font-weight:600; font-family:'JetBrains Mono', 'Courier New', monospace; color:#14213D\">ST<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Stable — og'irlik barqaror. US — beqaror, hali tebranmoqda.<\/p><\/div><div style=\"border-top:6px solid #3566C9; padding-top:16px; display:flex; flex-direction:column; gap:8px\"><h3 style=\"font-size:30px; font-weight:600; font-family:'JetBrains Mono', 'Courier New', monospace; color:#14213D\">GS<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Gross — brutto. NT — netto (tara ayirilgan).<\/p><\/div><div style=\"border-top:6px solid #E8A317; padding-top:16px; display:flex; flex-direction:column; gap:8px\"><h3 style=\"font-size:30px; font-weight:600; font-family:'JetBrains Mono', 'Courier New', monospace; color:#14213D\">+0012450<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Qiymat: 12 450. Oldidagi nollar tashlanadi.<\/p><\/div><div style=\"border-top:6px solid #3566C9; padding-top:16px; display:flex; flex-direction:column; gap:8px\"><h3 style=\"font-size:30px; font-weight:600; font-family:'JetBrains Mono', 'Courier New', monospace; color:#14213D\">kg<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">O'lchov birligi. Ba'zan t yoki lb.<\/p><\/div><\/div>\n<\/section>", "id": "m2-proto"}, {"t": "statement", "title": "Faqat barqaror (ST) og'irlikni yozing", "sub": "Mashina hali tebranayotganda olingan qiymat bir necha o'n kilogrammga farq qilishi mumkin. Dastur ST belgisini va bir necha soniya o'zgarmaslikni kutadi.", "accent": true, "id": "m2-stable"}, {"t": "code", "title": "Python: portni ochish va qatorni o'qish", "lang": "python", "src": "import serial, re\n\nPORT = \"COM3\"     # Linux: /dev/ttyUSB0\nBAUD = 9600       # indikator bilan bir xil\n\npattern = re.compile(r\"(ST|US),(GS|NT),([+-]?\\d+(?:\\.\\d+)?)\\s*kg\")\n\ndef read_weight():\n    with serial.Serial(PORT, BAUD, bytesize=8, parity=\"N\",\n                       stopbits=1, timeout=1) as ser:\n        while True:\n            raw = ser.readline()\n            line = raw.decode(\"ascii\", errors=\"ignore\").strip()\n            m = pattern.search(line)\n            if m:\n                yield m.group(1) == \"ST\", float(m.group(3))", "side": ["<b>serial.Serial<\/b> — portni ochadi. Parametrlar 9600 8N1 ga mos.", "<b>readline()<\/b> — qator oxirigacha o'qiydi. timeout=1 dastur qotib qolmasligi uchun.", "<b>Regex<\/b> qatordan holat (ST/US) va raqamni ajratib oladi.", "<b>yield<\/b> — har bir o'qilgan qiymatni navbat bilan qaytaradi (generator)."], "caption": null, "id": "m2-py1"}, {"t": "code", "title": "Python: faqat yangi barqaror og'irlikni olish", "lang": "python", "src": "last = None\n\nfor stable, w in read_weight():\n    if not stable:\n        continue          # tebranmoqda — kutamiz\n    if w < 100:\n        last = None       # tarozi bo'sh\n        continue\n    if w != last:\n        print(\"Barqaror og'irlik:\", w, \"kg\")\n        last = w", "side": ["<b>w &lt; 100<\/b> — bo'sh tarozidagi kichik shovqinni e'tiborsiz qoldiramiz.", "<b>last<\/b> — bir xil og'irlikni har soniyada qayta yozmaslik uchun.", "Tarozi bo'shaganda <b>last<\/b> tozalanadi: keyingi mashina yana yoziladi."], "caption": null, "id": "m2-py2"}, {"t": "cards", "title": "Diagnostika: avval dasturlarsiz tekshiring", "intro": null, "items": [["Search", "Qurilmalar dispetcheri", "Windows'da port raqamini (COM3, COM5…) aniqlang. USB-adapter drayveri o'rnatilganmi?"], ["Code", "Termite yoki PuTTY", "Portni ochib, indikator yuborayotgan xom matnni ko'ring. Formatni shu yerda o'rganing."], ["Wrench", "Multimetr", "Kabel uzilmaganini, TX/RX to'g'ri ulanganini tekshiring."]], "id": "m2-tools"}, {"t": "table", "title": "Tez-tez uchraydigan muammolar", "intro": null, "head": ["Belgi", "Ehtimoliy sabab", "Yechim"], "rows": [["Port ochilmaydi", "Boshqa dastur portni band qilgan", "Termite, eski skriptni yoping"], ["Hech narsa kelmaydi", "TX/RX kesishmagan yoki uzilgan", "Kabel sxemasini tekshiring"], ["G'alati belgilar keladi", "Baud rate yoki parity mos emas", "Indikator menyusini ko'ring"], ["Qiymat sakraydi", "Beqaror (US) qiymatlar ham olinmoqda", "Faqat ST ni qabul qiling"], ["Vaqti-vaqti bilan uziladi", "Uzun RS-232 kabel, shovqin", "RS-485 ga o'ting, ekranli kabel"]], "id": "m2-errors"}, {"t": "code", "title": "Modbus TCP: og'irlikni registrdan o'qish", "lang": "python", "src": "from pymodbus.client import ModbusTcpClient\n\nclient = ModbusTcpClient(\"192.168.1.50\", port=502)\nclient.connect()\n\nrr = client.read_holding_registers(address=0, count=2, slave=1)\nif not rr.isError():\n    hi, lo = rr.registers\n    raw = (hi << 16) | lo       # 32-bit qiymat\n    print(\"Og'irlik:\", raw / 10, \"kg\")\n\nclient.close()", "side": ["Modbus da og'irlik matn emas, <b>registrda<\/b> son bo'lib turadi.", "Qaysi manzil (address) va nechta registr — manualda yozilgan.", "32-bit qiymat ikki 16-bit registrdan yig'iladi.", "<b>/ 10<\/b> — indikatorda bir kasr xonasi bo'lsa."], "caption": null, "id": "m2-modbus"}, {"t": "code", "title": "Ethernet indikator: oddiy socket orqali", "lang": "python", "src": "import socket\n\ns = socket.create_connection((\"192.168.1.60\", 4001), timeout=5)\nbuf = b\"\"\nwhile True:\n    buf += s.recv(1024)\n    while b\"\\r\\n\" in buf:\n        line, buf = buf.split(b\"\\r\\n\", 1)\n        print(line.decode(\"ascii\", errors=\"ignore\"))", "side": ["TCP indikatorlar COM-port bilan bir xil matn yuboradi — faqat kabel o'rniga tarmoq.", "Ma'lumot bo'laklab kelishi mumkin: shuning uchun <b>buf<\/b> da yig'ib, qatorlarga bo'lamiz.", "IP va port indikator menyusida sozlanadi."], "caption": null, "id": "m2-tcp"}, {"t": "cards", "title": "Ishonchli shlyuz 4 ta shartga javob beradi", "intro": null, "items": [["Link", "Qayta ulanadi", "Kabel uzilsa yoki indikator o'chsa, 5 soniyadan keyin o'zi qayta urinadi."], ["Database", "Navbatda saqlaydi", "Server javob bermasa, tortish lokal faylga yoziladi va keyin yuboriladi."], ["Key", "Noyob ID beradi", "Har bir tortishga uuid: ikki marta yuborilsa ham serverda takrorlanmaydi."], ["Book", "Log yozadi", "Har bir xato va voqea vaqti bilan faylga yoziladi — muammoni topish oson."]], "id": "m2-robust"}, {"t": "code", "title": "Serverga yuborish va lokal navbat", "lang": "python", "src": "import requests, uuid, json, time, logging\nlogging.basicConfig(filename=\"gateway.log\", level=logging.INFO)\n\ndef send(event):\n    try:\n        r = requests.post(\"http://server:8000/api/weighings\",\n                          json=event, timeout=5)\n        r.raise_for_status()\n    except Exception as e:\n        logging.warning(\"Yuborilmadi: %s\", e)\n        with open(\"queue.jsonl\", \"a\") as f:\n            f.write(json.dumps(event) + \"\\n\")\n\nsend({\"id\": str(uuid.uuid4()), \"scale\": \"SCALE-1\",\n      \"weight\": 12450, \"ts\": time.time()})", "side": null, "caption": null, "id": "m2-queue", "notes": "Alohida kichik sikl har daqiqada queue.jsonl dagi yozuvlarni qayta yuborib turadi. Shunday qilib internet uzilishi hech narsani yo'qotmaydi."}, {"t": "statement", "title": "Tarozini ichidan tushunamiz: tenzodatchikdan Python kodigacha", "sub": "Qurilma qanday ishlashini bilsangiz, har qanday indikatorni ulay olasiz va nosozlikni tez topasiz.", "accent": true, "id": "s-intro"}, {"t": "table", "title": "Korxonadagi tarozi turlari", "intro": null, "head": ["Tur", "Qayerda", "Odatiy chegara"], "rows": [["Stol tarozisi", "Laboratoriya, qadoqlash", "bir necha kg gacha"], ["Platforma tarozisi", "Ombor, sex", "yuzlab kg — bir necha tonna"], ["Avtomobil tarozisi", "Kirish darvozasi", "o'nlab tonna"], ["Vagon tarozisi", "Temir yo'l tarmog'i", "vagon og'irligi"], ["Bunker tarozisi", "Don, sement, xomashyo", "bunker hajmiga qarab"], ["Konveyer (lentali)", "Uzluksiz oqim", "soatiga tonna"], ["Kran tarozisi", "Ilgakda yuk", "bir necha tonna"]], "id": "s-types", "notes": "Turi har xil bo'lsa ham, ichki tuzilishi deyarli bir xil: tenzodatchiklar, birlashtiruvchi quti va indikator. Shuning uchun ularni ulash usuli ham o'xshash."}, {"t": "term", "title": "Tenzodatchik (yuk datchigi)", "def": "Metall element: yuk ostida juda oz egiladi, unga yopishtirilgan simli qarshiliklar (tenzorezistorlar) cho'ziladi va qarshiligi o'zgaradi. Bu o'zgarish kuchlanish signaliga aylanadi.", "analogy": "Rezina tasma: qancha qattiq tortsangiz, shuncha uzunlashadi va ingichkalashadi. Tenzorezistor ham cho'zilganda qarshiligini o'zgartiradi.", "example": "Avtomobil tarozisi platformasi ostida odatda 4–8 ta datchik bo'ladi. Har biri yukning bir qismini sezadi, indikator ularni qo'shadi.", "id": "s-loadcell"}, {"t": "cards", "title": "Tenzodatchik shakllari", "intro": null, "items": [["Settings", "S-shaklli", "Tortish va siqish uchun. Kran, bunker osmalari."], ["Wrench", "Balka (beam)", "Platforma va stol tarozilari. Bir uchi mahkamlangan."], ["Database", "Kolonna (column)", "Katta yuklar: avtomobil va vagon tarozilari."], ["Home", "Shayba (disk)", "Past balandlikdagi katta yuklar, bunkerlar."]], "id": "s-lc-types"}, {"t": "table", "title": "Tenzodatchik simlari", "intro": null, "head": ["Sim", "Vazifasi"], "rows": [["EXC+ / EXC−", "Ta'minot (excitation): indikator datchikka kuchlanish beradi"], ["SIG+ / SIG−", "Signal: yukga mutanosib juda kichik kuchlanish (millivoltlar)"], ["SEN+ / SEN−", "Sezgich (faqat 6 simli): uzun kabeldagi kuchlanish yo'qotishini hisobga olish"], ["Ekran (shield)", "Shovqindan himoya, bir tomondan yerga ulanadi"]], "id": "s-lc-wires", "notes": "Simlarning ranglari ishlab chiqaruvchiga qarab farq qiladi. Hech qachon rangga qarab taxmin qilmang — datchik pasportidagi sxemaga qarang. Tarozi ichidagi ulanishlarni faqat malakali mutaxassis o'zgartirishi kerak."}, {"t": "cards", "title": "Birlashtiruvchi quti (junction box)", "intro": null, "items": [["Link", "Signallarni yig'adi", "4–8 ta datchikdan kelgan simlar shu yerda bitta kabelga birlashtiriladi."], ["Settings", "Burchak tuzatish", "Yuk platformaning qaysi burchagida tursa ham bir xil ko'rsatishi uchun sozlanadi."], ["Warning", "Nosozliklar manbai", "Namlik va korroziya — eng ko'p muammo shu yerda. Germetik bo'lishi shart."]], "id": "s-jbox"}, {"t": "cards", "title": "Indikator (terminal) nima qiladi", "intro": null, "items": [["Activity", "O'lchaydi", "Millivoltli signalni raqamga aylantiradi (ADC)."], ["Chart", "Ko'rsatadi", "Og'irlikni ekranda, barqarorlik belgisi bilan."], ["Check", "Nol va tara", "Bo'sh platformani nolga keltiradi, idish og'irligini ayiradi."], ["Settings", "Kalibrovka", "Etalon yuk bo'yicha aniq sozlanadi."], ["Link", "Uzatadi", "RS-232, RS-485, Ethernet orqali kompyuterga."], ["Lightning", "Boshqaradi", "Rele chiqishlari: svetofor, shlagbaum, sirena."]], "id": "s-indicator"}, {"t": "table", "title": "Indikatordagi odatiy tugmalar", "intro": null, "head": ["Tugma", "Vazifasi"], "rows": [["ZERO", "Bo'sh platformani nolga keltirish"], ["TARE", "Joriy og'irlikni tara sifatida eslab qolish"], ["GROSS / NET", "Brutto va netto o'rtasida almashish"], ["PRINT", "Printerga yoki portga yuborish"], ["SET / MENU / FUNC", "Sozlamalar menyusiga kirish"]], "id": "s-buttons", "notes": "Tugmalar nomi modelga qarab farq qiladi. Menyuga kirish odatda maxsus tugmalar kombinatsiyasi yoki parol bilan himoyalangan — bu kalibrovkani tasodifan buzishdan saqlaydi."}, {"t": "table", "title": "Taroziga oid asosiy ko'rsatkichlar", "intro": null, "head": ["Ko'rsatkich", "Ma'nosi", "Misol"], "rows": [["Max", "Eng katta o'lchanadigan yuk", "60 000 kg"], ["Min", "Eng kichik ishonchli yuk", "400 kg"], ["d (diskretlik)", "Ko'rsatish qadami", "20 kg"], ["e (tekshiruv qadami)", "Metrologik tekshiruv qadami", "20 kg"], ["Aniqlik klassi", "Qaysi aniqlik guruhiga kiradi", "Avtomobil tarozilarida odatda III"]], "id": "s-params"}, {"t": "statement", "title": "Diskretlik: tarozi 20 kg qadam bilan ko'rsatsa, 12 453 kg bo'lmaydi", "sub": "Faqat 12 440, 12 460 kabi qiymatlar chiqadi. Dasturingiz shu qadamdan kichik farqlarni «o'zgarish» deb hisoblamasligi kerak.", "accent": false, "id": "s-division"}, {"t": "steps", "title": "Kalibrovka va metrologik tekshiruv", "intro": null, "items": [["Nol kalibrovka", "Bo'sh platformada indikator nolga sozlanadi."], ["Etalon yuk", "Aniq og'irligi ma'lum yuk qo'yiladi va indikatorga kiritiladi."], ["Chiziqlilikni tekshirish", "Bir necha xil yukda aniqlik tekshiriladi."], ["Burchak sinovi", "Yuk har bir burchakka qo'yilib, bir xil natija tekshiriladi."], ["Rasmiy tekshiruv", "Tijorat hisobidagi tarozi vakolatli metrologiya xizmatida tekshirilishi va plombalanishi kerak."]], "id": "s-calib", "notes": "Kalibrovkani dasturchi emas, malakali mutaxassis bajaradi. Dasturchining vazifasi — indikator bergan qiymatni to'g'ri o'qish. Plombali tarozining sozlamalarini o'zgartirish qonuniy muammolarga olib keladi."}, {"t": "term", "title": "Ketma-ket port (serial)", "def": "Ma'lumotni bitta sim orqali bitlar ketma-ketligi sifatida, birin-ketin uzatish usuli.", "analogy": "Morze alifbosi: bitta chiroq yonib-o'chib, harflarni navbat bilan uzatadi. Ikkala tomon tezlikni oldindan kelishib olgan.", "example": "Indikator \"ST,GS,+0012450kg\" qatorini har bir belgi bo'yicha, har bir belgini 8 bit qilib, birin-ketin yuboradi.", "id": "s-serial"}, {"t": "visual", "title": "Bitta belgi qanday uzatiladi (8N1)", "html": "<section id=\"s-frame\" style=\"width:1920px; height:1080px; position:relative; box-sizing:border-box; overflow:hidden; background:#F2F4F7; color:#14213D; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:64px; font-weight:600; line-height:1.15; color:#14213D\">Bitta belgi qanday uzatiladi (8N1)<\/h2><div style=\"display:flex; flex-direction:row; gap:8px\"><div style=\"flex:1; background:#E8A317; border-radius:10px; padding:28px 0px; display:flex; flex-direction:column; align-items:center; gap:8px\"><p style=\"font-size:30px; font-weight:700; color:#14213D; font-family:'JetBrains Mono', 'Courier New', monospace\">0<\/p><p style=\"font-size:24px; color:#14213D\">start<\/p><\/div><div style=\"flex:1; background:#3566C9; border-radius:10px; padding:28px 0px; display:flex; flex-direction:column; align-items:center; gap:8px\"><p style=\"font-size:30px; font-weight:700; color:#F2F4F7; font-family:'JetBrains Mono', 'Courier New', monospace\">1<\/p><p style=\"font-size:24px; color:#F2F4F7\">bit 0<\/p><\/div><div style=\"flex:1; background:#3566C9; border-radius:10px; padding:28px 0px; display:flex; flex-direction:column; align-items:center; gap:8px\"><p style=\"font-size:30px; font-weight:700; color:#F2F4F7; font-family:'JetBrains Mono', 'Courier New', monospace\">0<\/p><p style=\"font-size:24px; color:#F2F4F7\">bit 1<\/p><\/div><div style=\"flex:1; background:#3566C9; border-radius:10px; padding:28px 0px; display:flex; flex-direction:column; align-items:center; gap:8px\"><p style=\"font-size:30px; font-weight:700; color:#F2F4F7; font-family:'JetBrains Mono', 'Courier New', monospace\">0<\/p><p style=\"font-size:24px; color:#F2F4F7\">bit 2<\/p><\/div><div style=\"flex:1; background:#3566C9; border-radius:10px; padding:28px 0px; display:flex; flex-direction:column; align-items:center; gap:8px\"><p style=\"font-size:30px; font-weight:700; color:#F2F4F7; font-family:'JetBrains Mono', 'Courier New', monospace\">0<\/p><p style=\"font-size:24px; color:#F2F4F7\">bit 3<\/p><\/div><div style=\"flex:1; background:#3566C9; border-radius:10px; padding:28px 0px; display:flex; flex-direction:column; align-items:center; gap:8px\"><p style=\"font-size:30px; font-weight:700; color:#F2F4F7; font-family:'JetBrains Mono', 'Courier New', monospace\">0<\/p><p style=\"font-size:24px; color:#F2F4F7\">bit 4<\/p><\/div><div style=\"flex:1; background:#3566C9; border-radius:10px; padding:28px 0px; display:flex; flex-direction:column; align-items:center; gap:8px\"><p style=\"font-size:30px; font-weight:700; color:#F2F4F7; font-family:'JetBrains Mono', 'Courier New', monospace\">0<\/p><p style=\"font-size:24px; color:#F2F4F7\">bit 5<\/p><\/div><div style=\"flex:1; background:#3566C9; border-radius:10px; padding:28px 0px; display:flex; flex-direction:column; align-items:center; gap:8px\"><p style=\"font-size:30px; font-weight:700; color:#F2F4F7; font-family:'JetBrains Mono', 'Courier New', monospace\">1<\/p><p style=\"font-size:24px; color:#F2F4F7\">bit 6<\/p><\/div><div style=\"flex:1; background:#3566C9; border-radius:10px; padding:28px 0px; display:flex; flex-direction:column; align-items:center; gap:8px\"><p style=\"font-size:30px; font-weight:700; color:#F2F4F7; font-family:'JetBrains Mono', 'Courier New', monospace\">0<\/p><p style=\"font-size:24px; color:#F2F4F7\">bit 7<\/p><\/div><div style=\"flex:1; background:#E8A317; border-radius:10px; padding:28px 0px; display:flex; flex-direction:column; align-items:center; gap:8px\"><p style=\"font-size:30px; font-weight:700; color:#14213D; font-family:'JetBrains Mono', 'Courier New', monospace\">1<\/p><p style=\"font-size:24px; color:#14213D\">stop<\/p><\/div><\/div><div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:32px\"><div style=\"border-left:6px solid #E8A317; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">Start bit<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">«Diqqat, belgi boshlanyapti» signali.<\/p><\/div><div style=\"border-left:6px solid #3566C9; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">8 ta ma'lumot biti<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Belgining o'zi. Bu yerda «A» harfi (65), kichik bitdan boshlab.<\/p><\/div><div style=\"border-left:6px solid #E8A317; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">Stop bit<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Belgi tugadi. Parity bo'lsa, stop'dan oldin yana bitta tekshiruv biti.<\/p><\/div><\/div>\n<\/section>", "id": "s-frame", "notes": "9600 baud tezlikda bitta belgi 10 bit (start + 8 + stop) oladi, ya'ni soniyasiga taxminan 960 belgi uzatiladi. Tarozi uchun bu yetarlidan ortiq."}, {"t": "table", "title": "DB9 ulagichi: to'liq pin jadvali", "intro": null, "head": ["Pin", "Nomi", "Vazifasi"], "rows": [["1", "DCD", "Signal borligini aniqlash (kam ishlatiladi)"], ["2", "RXD", "Ma'lumot qabul qilish"], ["3", "TXD", "Ma'lumot uzatish"], ["4", "DTR", "Terminal tayyor"], ["5", "GND", "Umumiy sim (yer)"], ["6", "DSR", "Qurilma tayyor"], ["7 / 8", "RTS / CTS", "Uzatishni boshqarish (handshake)"], ["9", "RI", "Qo'ng'iroq belgisi (deyarli ishlatilmaydi)"]], "id": "s-db9", "notes": "Tarozilar uchun ko'pincha faqat 3 ta sim kerak: 2 (RXD), 3 (TXD), 5 (GND). Ba'zi indikatorlar faqat uzatadi — unda 2 ta sim kifoya."}, {"t": "cards", "title": "USB–RS232 adapterlari", "intro": null, "items": [["Tool", "Nega kerak", "Zamonaviy kompyuterlarda COM-port yo'q. Adapter USB ni virtual COM-portga aylantiradi."], ["Settings", "Drayver", "Adapter ichidagi mikrosxemaga mos drayverni o'rnating. Dispetcherda «Ports (COM & LPT)» bo'limida paydo bo'ladi."], ["Warning", "Port raqami o'zgaradi", "Boshqa USB uyasiga ulansa, COM raqami o'zgarishi mumkin. Adapterni doim bir uyada qoldiring."]], "id": "s-usb"}, {"t": "term", "title": "RS-485", "def": "Ikki sim (A va B) orasidagi kuchlanish farqi orqali uzatish. Shovqinga chidamli, 1200 metrgacha ishlaydi va bitta liniyaga ko'p qurilma ulanadi.", "analogy": "Ikki kishi bir arqonni tortayotgandek: tashqi shovqin ikkalasiga baravar ta'sir qiladi, lekin ular orasidagi farq o'zgarmaydi.", "example": "Uch tarozi bitta RS-485 kabelida: har birining o'z manzili (1, 2, 3). Dastur navbat bilan so'raydi: «1-tarozi, og'irlikni ber».", "id": "s-rs485"}, {"t": "table", "title": "RS-485 ni to'g'ri ulash qoidalari", "intro": null, "head": ["Qoida", "Nega"], "rows": [["O'ralgan juft, ekranli kabel", "Shovqinni kamaytiradi"], ["Zanjir (daisy-chain), yulduz emas", "Tarmoqlanish signal aks-sadosini beradi"], ["Ikki uchida 120 Ω rezistor", "Liniya oxirida signal qaytishini oldini oladi"], ["A ni A ga, B ni B ga", "Almashtirilsa — ma'lumot kelmaydi"], ["Har bir qurilmaning manzili noyob", "Bir xil manzil — javoblar to'qnashadi"], ["Umumiy yer simi (GND)", "Kuchlanish farqi chegaradan chiqmasligi uchun"]], "id": "s-rs485-rules"}, {"t": "cards", "title": "Konvertorlar: RS-485 ni kompyuterga ulash", "intro": null, "items": [["Link", "RS-485 → USB", "Eng oddiy: kompyuterda virtual COM-port paydo bo'ladi."], ["Globe", "RS-485 → Ethernet", "Serial device server: tarozini tarmoqqa chiqaradi, kompyuter istalgan joyda bo'lishi mumkin."], ["Lightning", "Galvanik izolyatsiya", "Uzun kabel va sanoat muhitida izolyatsiyali konvertor tanlang — kompyuterni kuchlanish sakrashidan himoya qiladi."]], "id": "s-conv"}, {"t": "table", "title": "Indikatorning uzatish rejimlari", "intro": null, "head": ["Rejim", "Qanday ishlaydi", "Dastur nima qiladi"], "rows": [["Uzluksiz", "Soniyasiga bir necha marta yuboradi", "Faqat tinglaydi"], ["So'rov bo'yicha", "Buyruq kelganda javob beradi", "Buyruq yuboradi, javobni o'qiydi"], ["Barqarorlikda", "Og'irlik barqarorlashganda bir marta", "Tinglaydi"], ["PRINT tugmasi", "Operator tugmani bosganda", "Tinglaydi; avtomatlashtirish uchun kam mos"]], "id": "s-modes", "notes": "Rejim indikator menyusida tanlanadi. Avtomatlashtirish uchun eng qulayi — uzluksiz yoki so'rov bo'yicha rejim."}, {"t": "code", "title": "So'rov bo'yicha rejim: buyruq yuborish", "lang": "python", "src": "import serial\n\nwith serial.Serial(\"COM3\", 9600, timeout=1) as ser:\n    ser.reset_input_buffer()         # eski ma'lumotni tozalash\n    ser.write(b\"R\\r\\n\")              # buyruq — manualdan olinadi!\n    javob = ser.readline()\n    print(repr(javob))\n    # b'ST,GS,+0012450kg\\r\\n'", "side": ["<b>write()<\/b> — portga baytlar yuboradi. Qatorning oldidagi <b>b<\/b> — bu matn emas, baytlar.", "Buyruq har bir modelda boshqacha. Bu yerdagi «R» — faqat namuna.", "<b>repr()<\/b> — ko'rinmaydigan belgilarni (\\r, \\n) ham ko'rsatadi."], "caption": null, "id": "s-request"}, {"t": "table", "title": "Turli indikatorlar formatlari (namunalar)", "intro": null, "head": ["Namuna", "Xususiyati"], "rows": [["ST,GS,+0012450kg", "Holat, tur, qiymat va birlik vergul bilan"], ["=0012450", "Faqat qiymat, oldida belgi"], ["=05421000", "Ba'zi modellarda raqamlar teskari tartibda keladi"], ["\\x02 +012450 kg\\x03", "Boshi STX, oxiri ETX boshqaruv belgilari bilan"], ["WT:12450.0", "Kalit va qiymat"]], "id": "s-formats", "notes": "Birinchi ish har doim bir xil: xom ma'lumotni ko'ring (Termite yoki repr bilan), bir necha qatorini yozib oling va manual bilan solishtiring. Shundan keyin parser yozing."}, {"t": "code", "title": "Xom baytlarni ko'rish", "lang": "python", "src": "import serial\n\nwith serial.Serial(\"COM3\", 9600, timeout=1) as ser:\n    for _ in range(5):\n        b = ser.read(32)\n        print(repr(b))\n        print(b.hex(\" \"))\n\n# b'\\x02 +012450 kg\\x03'\n# 02 20 2b 30 31 32 34 35 30 20 6b 67 03", "side": ["<b>read(32)<\/b> — 32 baytgacha o'qiydi, qator oxirini kutmaydi.", "<b>hex()<\/b> — har bir baytni 16-lik sonda ko'rsatadi. Ko'rinmaydigan belgilar ham ko'rinadi.", "02 — STX (boshlanish), 03 — ETX (tugash)."], "caption": null, "id": "s-raw"}, {"t": "table", "title": "Tez-tez uchraydigan boshqaruv belgilari", "intro": null, "head": ["Belgi", "Kod (hex)", "Ma'nosi"], "rows": [["STX", "02", "Matn boshlanishi"], ["ETX", "03", "Matn tugashi"], ["CR (\\r)", "0D", "Qator boshiga qaytish"], ["LF (\\n)", "0A", "Yangi qator"], ["Bo'sh joy", "20", "Probel"], ["+ / −", "2B / 2D", "Ishora"]], "id": "s-ascii"}, {"t": "code", "title": "STX…ETX orasidagi kadrni ajratish", "lang": "python", "src": "import re, serial\n\nKADR = re.compile(rb\"\\x02(.*?)\\x03\")\nbuf = b\"\"\n\nwith serial.Serial(\"COM3\", 9600, timeout=1) as ser:\n    while True:\n        buf += ser.read(64)\n        for m in KADR.finditer(buf):\n            matn = m.group(1).decode(\"ascii\", \"ignore\")\n            son = re.search(r\"[+-]?\\d+(\\.\\d+)?\", matn)\n            if son:\n                print(float(son.group()))\n        buf = buf[buf.rfind(b\"\\x03\") + 1:]    # ishlatilganini tashlash", "side": null, "caption": null, "id": "s-stx", "notes": "Ma'lumot bo'laklab keladi, shuning uchun bufer to'planadi va faqat to'liq kadrlar ishlanadi."}, {"t": "code", "title": "Teskari tartibdagi raqamni o'qish", "lang": "python", "src": "def teskari_oqish(matn):\n    # \"=05421000\" → \"00012450\" → 12450\n    raqamlar = matn.strip().lstrip(\"=\")\n    togri = raqamlar[::-1]\n    return float(togri)\n\nprint(teskari_oqish(\"=05421000\"))", "side": ["<b>[::-1]<\/b> — matnni teskari aylantiradi.", "Bunday format ba'zi arzon indikatorlarda uchraydi.", "Qaysi format ekanini aniqlash uchun taroziga ma'lum yuk qo'yib, xom ma'lumotni solishtiring."], "caption": null, "id": "s-reversed"}, {"t": "code", "title": "Universal parser: format sozlamada", "lang": "python", "src": "import re, json\n\nsozlama = json.load(open(\"tarozi.json\"))\n# {\"regex\": \"(ST|US),(GS|NT),([+-]?\\\\d+)\", \"holat\": 1,\n#  \"qiymat\": 3, \"barqaror\": \"ST\", \"koef\": 1}\n\nRX = re.compile(sozlama[\"regex\"])\n\ndef tahlil(qator):\n    m = RX.search(qator)\n    if not m:\n        return None\n    holat = m.group(sozlama[\"holat\"])\n    qiymat = float(m.group(sozlama[\"qiymat\"])) * sozlama[\"koef\"]\n    return holat == sozlama[\"barqaror\"], qiymat", "side": null, "caption": null, "id": "s-parser", "notes": "Yangi indikator modeli kelsa, kodni emas, faqat tarozi.json faylini o'zgartirasiz."}, {"t": "term", "title": "Modbus", "def": "Sanoat qurilmalari uchun oddiy «savol-javob» protokoli. Asosiy qurilma (master) so'raydi, bo'ysunuvchi (slave) javob beradi. Ma'lumot raqamlangan registrlarda saqlanadi.", "analogy": "Pochta qutilari qatori: har birining raqami bor. «15-qutida nima bor?» deb so'raysiz, qurilma ichidagi sonni aytadi.", "example": "Indikator og'irlikni 0 va 1-registrlarda saqlaydi. Shlyuz har soniyada «1-qurilma, 0-registrdan 2 ta registr o'qi» deb so'raydi.", "id": "s-modbus"}, {"t": "table", "title": "Modbus ma'lumot turlari va funksiyalari", "intro": null, "head": ["Tur", "Nima", "O'qish / yozish"], "rows": [["Coils (0x)", "Yoqish/o'chirish bitlari", "01 o'qish, 05 yozish"], ["Discrete inputs (1x)", "Faqat o'qiladigan bitlar", "02 o'qish"], ["Input registers (3x)", "Faqat o'qiladigan 16-bit sonlar", "04 o'qish"], ["Holding registers (4x)", "O'qiladigan va yoziladigan sonlar", "03 o'qish, 06/16 yozish"]], "id": "s-mb-regs", "notes": "Manualda registr manzili 40001 deb yozilgan bo'lsa, bu odatda holding registr, dasturdagi manzili esa 0. Bu «birdan boshlanadigan» va «noldan boshlanadigan» raqamlash farqi — eng ko'p adashtiradigan joy."}, {"t": "code", "title": "Modbus RTU: RS-485 orqali", "lang": "python", "src": "from pymodbus.client import ModbusSerialClient\n\nclient = ModbusSerialClient(port=\"COM4\", baudrate=9600,\n                            parity=\"N\", stopbits=1, bytesize=8,\n                            timeout=1)\nclient.connect()\n\nfor manzil in (1, 2, 3):              # uch tarozi bitta liniyada\n    rr = client.read_holding_registers(address=0, count=2, slave=manzil)\n    if rr.isError():\n        print(manzil, \"javob bermadi\")\n        continue\n    hi, lo = rr.registers\n    print(manzil, \"-tarozi:\", (hi << 16) | lo, \"kg\")\nclient.close()", "side": null, "caption": null, "id": "s-mb-rtu", "notes": "Qurilmalar navbat bilan so'raladi. Birortasi javob bermasa, qolganlari ishlashda davom etadi."}, {"t": "compare", "title": "Ikki registrdan son yig'ish: tartib muhim", "left": ["Katta so'z oldin (big-endian)", ["1-registr: yuqori qism", "2-registr: pastki qism", "(hi << 16) | lo", "Ko'p qurilmalarda standart"]], "right": ["Kichik so'z oldin (little-endian)", ["1-registr: pastki qism", "2-registr: yuqori qism", "(lo << 16) | hi", "Natija g'alati katta son bo'lsa — shuni sinab ko'ring"]], "id": "s-endian"}, {"t": "code", "title": "Kasr son (float32) ni registrlardan olish", "lang": "python", "src": "import struct\n\ndef float32(hi, lo, soz_tartib=\"big\"):\n    if soz_tartib == \"little\":\n        hi, lo = lo, hi\n    baytlar = struct.pack(\">HH\", hi, lo)\n    return struct.unpack(\">f\", baytlar)[0]\n\nprint(float32(0x4642, 0x8800))     # 12450.0", "side": ["Ba'zi indikatorlar og'irlikni kasr son (IEEE 754) sifatida beradi.", "<b>struct<\/b> — baytlarni songa aylantiruvchi standart modul.", "Natija noto'g'ri chiqsa, so'z tartibini almashtirib ko'ring."], "caption": null, "id": "s-float"}, {"t": "table", "title": "Serial device server sozlamalari", "intro": null, "head": ["Sozlama", "Qiymat (misol)", "Izoh"], "rows": [["IP manzil", "192.168.10.21", "Statik, qurilmalar VLAN idan"], ["Port", "4001", "Dastur shu portga ulanadi"], ["Rejim", "TCP Server", "Kompyuter mijoz bo'lib ulanadi"], ["Serial parametrlar", "9600 8N1", "Indikator bilan bir xil"], ["Interfeys", "RS-232 yoki RS-485", "Qurilmadagi tanlov"]], "id": "s-devserver"}, {"t": "code", "title": "Bir nechta tarozi: sozlama fayli", "lang": "json", "src": "{\n  \"tarozilar\": [\n    {\"nomi\": \"KIRISH\", \"tur\": \"serial\", \"port\": \"COM3\",\n     \"baud\": 9600, \"format\": \"st_gs\"},\n    {\"nomi\": \"CHIQISH\", \"tur\": \"tcp\", \"host\": \"192.168.10.21\",\n     \"port\": 4001, \"format\": \"stx_etx\"},\n    {\"nomi\": \"OMBOR\", \"tur\": \"modbus\", \"port\": \"COM4\",\n     \"manzil\": 2, \"registr\": 0}\n  ],\n  \"min_vazn\": 1000,\n  \"barqaror_soniya\": 3\n}", "side": null, "caption": "Har bir tarozi — ro'yxatdagi bitta yozuv. Dastur turiga qarab kerakli o'quvchi funksiyani tanlaydi.", "id": "s-config"}, {"t": "code", "title": "Har bir tarozi — alohida oqimda", "lang": "python", "src": "import json, threading\n\nsoz = json.load(open(\"tarozilar.json\"))\n\ndef ishlovchi(t):\n    oqigich = OQUVCHILAR[t[\"tur\"]](t)   # serial/tcp/modbus\n    for barqaror, vazn in oqigich:\n        qayta_ishlash(t[\"nomi\"], barqaror, vazn)\n\nfor t in soz[\"tarozilar\"]:\n    th = threading.Thread(target=ishlovchi, args=[t])\n    th.daemon = True\n    th.start()\n\nthreading.Event().wait()     # dastur yopilmasin", "side": ["Bitta tarozi qotib qolsa, boshqalari ishlashda davom etadi.", "<b>OQUVCHILAR<\/b> — tur nomi bo'yicha funksiyalar lug'ati.", "Oxirgi qator asosiy dasturni abadiy kutishda ushlab turadi."], "caption": null, "id": "s-threads"}, {"t": "steps", "title": "Shlyuzni xizmat (service) sifatida ishga tushirish", "intro": null, "items": [["Nega kerak", "Kompyuter qayta yoqilsa ham dastur o'zi ishga tushsin, hech kim tizimga kirmasa ham."], ["Windows", "NSSM kabi vosita bilan python main.py ni Windows xizmatiga aylantirish."], ["Linux", "systemd xizmat fayli (keyingi slayd)."], ["Qayta ishga tushish", "Dastur xato bilan to'xtasa, bir necha soniyadan keyin avtomatik qayta boshlansin."]], "id": "s-service"}, {"t": "code", "title": "Linux: systemd xizmat fayli", "lang": "text", "src": "# /etc/systemd/system/shlyuz.service\n[Unit]\nDescription=Tarozi shlyuzi\nAfter=network-online.target\n\n[Service]\nWorkingDirectory=/opt/shlyuz\nExecStart=/opt/shlyuz/venv/bin/python main.py\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target", "side": null, "caption": "Yoqish: sudo systemctl enable --now shlyuz. Holatni ko'rish: systemctl status shlyuz. Loglar: journalctl -u shlyuz -f.", "id": "s-systemd"}, {"t": "steps", "title": "Nosozlikni qidirish tartibi: pastdan yuqoriga", "intro": null, "items": [["Quvvat", "Indikator yoniqmi, ekranda og'irlik bormi?"], ["Kabel", "Ulangan, uzilmagan, TX/RX to'g'ri?"], ["Port", "Dispetcherda ko'rinadimi, boshqa dastur band qilmaganmi?"], ["Sozlama", "Tezlik, parity, rejim indikator bilan bir xilmi?"], ["Xom ma'lumot", "Termite da nimadir kelyaptimi?"], ["Dastur", "Faqat shundan keyin koddan xato qidiring."]], "id": "s-diag"}, {"t": "cards", "title": "Tarozidagi suiiste'mol turlari va dasturiy himoya", "intro": null, "items": [["Warning", "Mashina to'liq chiqmagan", "G'ildirak platformadan tashqarida. Himoya: kamera va platforma chetidagi datchiklar."], ["Users", "Tortishda odam tushadi", "Haydovchi kabina ichida yoki tashqarida. Himoya: har doim bir xil qoida va rasm."], ["Activity", "Beqaror paytda yozish", "Himoya: faqat barqaror va bir necha soniya o'zgarmagan og'irlik."], ["Lock", "Qo'lda tahrirlash", "Himoya: og'irlik maydoni faqat dastur tomonidan to'ldiriladi, o'zgartirish logga yoziladi."], ["Search", "Tara almashtirish", "Himoya: tarixiy tara bilan solishtirish, keskin farqda ogohlantirish."], ["Clock", "Nol siljishi", "Himoya: har bir mashinadan oldin bo'sh tarozi nolga yaqinligini tekshirish."]], "id": "s-fraud"}, {"t": "code", "title": "Mashinadan oldin nolni tekshirish", "lang": "python", "src": "NOL_CHEGARA = 40        # kg: 2 diskretlik\n\ndef nol_tekshiruvi(oxirgi_bosh_vazn):\n    if abs(oxirgi_bosh_vazn) > NOL_CHEGARA:\n        logging.warning(\"Nol siljigan: %s kg\", oxirgi_bosh_vazn)\n        xabar(\"Tarozi nolga qaytmadi — ZERO bosing\")\n        return False\n    return True", "side": ["Tarozi bo'shaganda oxirgi qiymat eslab qolinadi.", "U nolga yaqin bo'lmasa — keyingi tortish ishonchsiz.", "Operatorga xabar beriladi, tortish belgilanadi."], "caption": null, "id": "s-zero"}, {"t": "table", "title": "Texnik xizmat jadvali", "intro": null, "head": ["Qachon", "Nima qilinadi"], "rows": [["Har kuni", "Platforma ostini tozalash, nolni tekshirish"], ["Har hafta", "Kabellar va birlashtiruvchi quti holatini ko'zdan kechirish"], ["Har oy", "Ma'lum yuk bilan nazorat tortish, loglarni ko'rib chiqish"], ["Har yili", "Rasmiy metrologik tekshiruv"], ["Har qanday ta'mirdan keyin", "Kalibrovka va nazorat tortish"]], "id": "s-maint"}, {"t": "steps", "title": "Amaliy mashqlar", "intro": null, "items": [["Xom ma'lumot", "Termite da indikator ma'lumotini yozib oling va formatini tahlil qiling."], ["Parser", "O'z formatingiz uchun regex yozing va 10 ta qatorda sinang."], ["Barqarorlik", "Simulyator yoki tarozida 3 soniyalik barqarorlikni aniqlang."], ["Nol nazorati", "Bo'sh tarozi nolga qaytmasa, logga yozing."], ["Konfiguratsiya", "Port va formatni JSON faylga chiqaring."], ["Xizmat", "Dasturni avtomatik ishga tushadigan qiling."]], "id": "s-practice"}, {"t": "quiz", "q": "RS-485 liniyasida uchta tarozi bir xil 1-manzilga ega. Nima bo'ladi?", "opts": ["Hammasi yaxshi ishlaydi", "Javoblar to'qnashadi va ma'lumot buziladi", "Faqat tezlik pasayadi"], "a": 1, "expl": "Har bir qurilmaning manzili noyob bo'lishi shart: master aniq kimdan so'rayotganini bilishi kerak.", "id": "s-q1"}, {"t": "quiz", "q": "Modbus'dan olingan og'irlik 815 923 200 kabi g'alati katta son chiqdi. Birinchi nimani tekshirasiz?", "opts": ["Tarozini qayta kalibrovka qilish", "Registrlar tartibini (so'z tartibi) almashtirib ko'rish", "Kabelni almashtirish"], "a": 1, "expl": "Ikki registr noto'g'ri tartibda qo'shilsa, son keskin katta chiqadi.", "id": "s-q2"}, {"t": "quiz", "q": "Nosozlikni qidirishni qayerdan boshlash to'g'ri?", "opts": ["Darhol koddan", "Quvvat va kabeldan, keyin port va sozlamalardan", "Serverdan"], "a": 1, "expl": "Ko'p muammo jismoniy darajada. Kodni oxirida tekshiring.", "id": "s-q3"}, {"t": "quiz", "q": "Indikator «US,GS,+0012380kg» yubordi. Buni yozish kerakmi?", "opts": ["Ha, bu brutto og'irlik", "Yo'q: US — og'irlik hali barqaror emas", "Faqat tungi smenada"], "a": 1, "expl": "US (unstable) — platforma hali tebranmoqda. Faqat ST belgili qiymatlar yoziladi.", "id": "m2-q1"}, {"t": "quiz", "q": "100 metr uzoqlikdagi 4 ta tarozini ulash uchun qaysi interfeys mos?", "opts": ["RS-232", "RS-485 yoki Ethernet", "USB"], "a": 1, "expl": "RS-232 taxminan 15 metrgacha ishonchli ishlaydi. RS-485 1200 metrgacha va bir liniyada bir nechta qurilmani qo'llaydi.", "id": "m2-q2"}, {"t": "quiz", "q": "Tortishga noyob ID (uuid) nima uchun beriladi?", "opts": ["Chiroyli ko'rinishi uchun", "Qayta yuborilganda serverda takrorlanmasligi uchun", "Tarozini tezlashtirish uchun"], "a": 1, "expl": "Tarmoq xatosida shlyuz bir voqeani ikki marta yuborishi mumkin. Server ID bo'yicha takrorni tanib, ikkinchisini tashlaydi.", "id": "m2-q3"}, {"t": "quiz", "id": "xq-m2-0", "q": "«9600 8N1» yozuvidagi N nimani bildiradi?", "opts": ["Stop bitlar soni", "Juftlik tekshiruvi yo'q (None)", "9 bit ma'lumot"], "a": 1, "expl": "8 — ma'lumot biti, N — parity yo'q, 1 — stop bit."}, {"t": "quiz", "id": "xq-m2-1", "q": "Tarozi diskretligi 20 kg. Qaysi ko'rsatkich bo'lishi mumkin emas?", "opts": ["12 440", "12 453", "12 460"], "a": 1, "expl": "Qiymatlar 20 ga karrali bo'ladi."}, {"t": "quiz", "id": "xq-m2-2", "q": "RS-485 liniyasining ikki uchiga nima qo'yiladi?", "opts": ["120 Ω rezistor", "Kondensator", "Sug'urta"], "a": 0, "expl": "Terminator rezistor signal qaytishini oldini oladi."}]}, {"id": "m3", "num": 3, "title": "IP-kameralar bilan ishlash", "goal": "Kamera oqimini RTSP orqali olish, kadr saqlash va har bir tortishga rasm biriktirishni o'rganasiz.", "stages": [0, 1], "vol": 1, "blocks": [{"t": "cards", "title": "Asosiy tushunchalar", "intro": null, "items": [["Play", "RTSP", "Video oqimini tarmoq orqali uzatish protokoli. Dasturimiz kameradan videoni shu orqali oladi."], ["Settings", "ONVIF", "Turli ishlab chiqaruvchilar kameralarini bir xil usulda topish va boshqarish standarti."], ["Database", "NVR", "Tarmoq videoregistratori: kameralar yozuvini diskka saqlaydi."], ["Lightning", "PoE", "Bitta tarmoq kabeli orqali kameraga ham internet, ham elektr beriladi."], ["Cloud", "H.264 / H.265", "Video siqish formatlari. H.265 kamroq trafik va disk joy talab qiladi."], ["Chart", "Main / Sub stream", "Asosiy oqim — yuqori sifat, qo'shimcha oqim — tahlil uchun yengil oqim."]], "id": "m3-terms"}, {"t": "table", "title": "RTSP manzillar namunalari", "intro": null, "head": ["Ishlab chiqaruvchi", "RTSP manzil"], "rows": [["Hikvision (asosiy)", "rtsp://user:pass@IP:554/Streaming/Channels/101"], ["Hikvision (sub)", "rtsp://user:pass@IP:554/Streaming/Channels/102"], ["Dahua (asosiy)", "rtsp://user:pass@IP:554/cam/realmonitor?channel=1&subtype=0"], ["Dahua (sub)", "rtsp://user:pass@IP:554/cam/realmonitor?channel=1&subtype=1"], ["Boshqa brendlar", "Kamera qo'llanmasi yoki ONVIF Device Manager dasturidan toping"]], "id": "m3-urls", "notes": "Manzil ichida login va parol bor. Shuning uchun ularni kodga yozmang, .env faylga chiqaring. Parolda @ yoki : belgisi bo'lsa, URL-kodlash kerak bo'ladi."}, {"t": "steps", "title": "Kamerani ishga tayyorlash", "intro": null, "items": [["Statik IP bering", "Kamera manzili o'zgarmasligi kerak: masalan 192.168.1.64."], ["Standart parolni almashtiring", "admin/12345 kabi parollar birinchi bo'lib buziladi."], ["Vaqtni sinxronlang", "NTP serverni yoqing — rasmdagi vaqt tarozi vaqti bilan mos bo'ladi."], ["RTSP ni yoqing", "Ba'zi modellarda sozlamalarda alohida yoqiladi."], ["VLC da tekshiring", "Media → Tarmoq oqimini ochish → RTSP manzil. Ko'rinsa, Python da ham ishlaydi."], ["Sub-stream ni sozlang", "Tahlil uchun 640×480 yoki 1280×720 yetarli."]], "id": "m3-setup"}, {"t": "cards", "title": "Raqamni tanish uchun kamerani o'rnatish", "intro": null, "items": [["Search", "Burchak", "Raqamga nisbatan taxminan 20–30° dan oshmasin. To'g'ri qaragan sari aniqroq."], ["Lightbulb", "Yoritish", "Kechasi IR yoritgich shart. Faralar raqamni «yoqib» yubormasligi uchun WDR ni yoqing."], ["Settings", "Tezlik", "Tarozida mashina to'xtaydi — bu katta ustunlik. Qisqa ekspozitsiya harakatni xiralashtirmaydi."]], "id": "m3-mount"}, {"t": "visual", "title": "Tarozi atrofidagi kameralar joylashuvi", "html": "<section id=\"m3-scene\" style=\"width:1920px; height:1080px; position:relative; box-sizing:border-box; overflow:hidden; background:#F2F4F7; color:#14213D; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:64px; font-weight:600; line-height:1.15; color:#14213D\">Tarozi atrofidagi kameralar joylashuvi<\/h2><div style=\"display:flex; flex-direction:row; gap:56px; align-items:center; flex:1\"><div style=\"width:760px; height:500px; background:#14213D; border-radius:16px; display:flex; align-items:center; justify-content:center\"><svg aria-label=\"Avtomobil tarozisi: platformadagi yuk mashinasi, ustundagi kamera va operator budkasi\" height=\"474\" viewbox=\"0 0 760 500\" width=\"720\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#1E2D4D\" height=\"70\" width=\"760\" x=\"0\" y=\"430\"><\/rect>\n<rect fill=\"#56657A\" height=\"30\" rx=\"4\" width=\"520\" x=\"60\" y=\"400\"><\/rect>\n<rect fill=\"#3A4A66\" height=\"18\" width=\"30\" x=\"80\" y=\"430\"><\/rect><rect fill=\"#3A4A66\" height=\"18\" width=\"30\" x=\"530\" y=\"430\"><\/rect>\n<rect fill=\"#3A4A66\" height=\"18\" width=\"30\" x=\"300\" y=\"430\"><\/rect>\n<rect fill=\"#3566C9\" height=\"130\" rx=\"6\" width=\"300\" x=\"100\" y=\"250\"><\/rect>\n<rect fill=\"#E8A317\" height=\"90\" rx=\"10\" width=\"120\" x=\"400\" y=\"290\"><\/rect>\n<rect fill=\"#BFCBDB\" height=\"40\" rx=\"4\" width=\"70\" x=\"430\" y=\"302\"><\/rect>\n<circle cx=\"160\" cy=\"388\" fill=\"#0F1A2E\" r=\"24\"><\/circle><circle cx=\"160\" cy=\"388\" fill=\"#9FB0C8\" r=\"10\"><\/circle>\n<circle cx=\"230\" cy=\"388\" fill=\"#0F1A2E\" r=\"24\"><\/circle><circle cx=\"230\" cy=\"388\" fill=\"#9FB0C8\" r=\"10\"><\/circle>\n<circle cx=\"470\" cy=\"388\" fill=\"#0F1A2E\" r=\"24\"><\/circle><circle cx=\"470\" cy=\"388\" fill=\"#9FB0C8\" r=\"10\"><\/circle>\n<rect fill=\"#9FB0C8\" height=\"280\" width=\"10\" x=\"640\" y=\"150\"><\/rect>\n<rect fill=\"#F2F4F7\" height=\"30\" rx=\"6\" width=\"62\" x=\"598\" y=\"138\"><\/rect>\n<circle cx=\"604\" cy=\"153\" fill=\"#0F1A2E\" r=\"9\"><\/circle>\n<path d=\"M596 160 L520 300\" fill=\"none\" stroke=\"#E8A317\" stroke-dasharray=\"8 8\" stroke-width=\"3\"><\/path>\n<rect fill=\"#F2F4F7\" height=\"100\" rx=\"6\" width=\"130\" x=\"600\" y=\"330\"><\/rect>\n<rect fill=\"#3566C9\" height=\"40\" rx=\"4\" width=\"98\" x=\"616\" y=\"350\"><\/rect>\n<path d=\"M645 168 C 700 220, 700 290, 665 330\" fill=\"none\" stroke=\"#E8A317\" stroke-dasharray=\"6 6\" stroke-width=\"3\"><\/path>\n<path d=\"M330 430 C 400 470, 560 470, 610 425\" fill=\"none\" stroke=\"#E8A317\" stroke-dasharray=\"6 6\" stroke-width=\"3\"><\/path>\n<\/svg><\/div><div style=\"flex:1; display:flex; flex-direction:column; gap:28px\"><div style=\"border-left:6px solid #E8A317; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">Old kamera<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Ustunda, kabinaga qaragan: old raqamni o'qiydi.<\/p><\/div><div style=\"border-left:6px solid #E8A317; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">Orqa kamera<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Tirkamaning raqamini va yukni ko'radi.<\/p><\/div><div style=\"border-left:6px solid #3566C9; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">Operator budkasi<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Shlyuz kompyuteri: tarozi va kameralar signallari shu yerga keladi.<\/p><\/div><\/div><\/div>\n<\/section>", "id": "m3-scene"}, {"t": "code", "title": "OpenCV: kameradan bitta kadr olish", "lang": "python", "src": "import cv2, os\n\nURL = os.getenv(\"CAM1_URL\")    # parol kodda emas, .env da\nos.makedirs(\"snapshots\", exist_ok=True)\n\ndef snapshot(event_id):\n    cap = cv2.VideoCapture(URL)\n    for _ in range(5):\n        cap.grab()            # buferdagi eski kadrlar\n    ok, frame = cap.read()\n    cap.release()\n    if not ok:\n        return None\n    path = f\"snapshots/{event_id}.jpg\"\n    cv2.imwrite(path, frame)\n    return path", "side": ["<b>VideoCapture<\/b> RTSP oqimni ochadi.", "<b>grab()<\/b> bir necha marta: bufferda qolgan eski kadrlarni tashlab, hozirgisini olamiz.", "Fayl nomi = tortish ID si. Rasm va og'irlik shu ID orqali bog'lanadi.", "Kamera javob bermasa — None qaytadi, tortish rasmsiz saqlanadi."], "caption": null, "id": "m3-snap"}, {"t": "code", "title": "Doimiy oqim: kadrlarni alohida oqimda o'qish", "lang": "python", "src": "import cv2, threading\n\nclass Camera:\n    def __init__(self, url):\n        self.cap = cv2.VideoCapture(url)\n        self.frame = None\n        threading.Thread(target=self._loop, daemon=True).start()\n\n    def _loop(self):\n        while True:\n            ok, f = self.cap.read()\n            if ok:\n                self.frame = f     # har doim eng yangi kadr\n\ncam = Camera(URL)", "side": ["Kamerani doim ochiq ushlash kerak bo'lsa (harakat, AI tahlil), o'qishni alohida <b>thread<\/b> ga beramiz.", "Asosiy dastur istalgan paytda <b>cam.frame<\/b> dan eng yangi kadrni oladi — kechikish bo'lmaydi.", "<b>daemon=True<\/b> — asosiy dastur yopilsa, oqim ham to'xtaydi."], "caption": null, "id": "m3-thread"}, {"t": "code", "title": "Harakatni aniqlash: ikki kadr farqi", "lang": "python", "src": "prev = None\nwhile True:\n    f = cam.frame\n    if f is None:\n        continue\n    g = cv2.cvtColor(f, cv2.COLOR_BGR2GRAY)\n    g = cv2.GaussianBlur(g, (21, 21), 0)\n    if prev is not None:\n        diff = cv2.absdiff(prev, g)\n        if (diff > 25).mean() > 0.02:\n            print(\"Harakat bor!\")\n    prev = g", "side": ["Rasm kulrangga o'tkaziladi va xiralashtiriladi — shovqin kamayadi.", "<b>absdiff<\/b> — oldingi va hozirgi kadr farqi.", "Piksellarning 2% dan ko'prog'i o'zgarsa — harakat bor.", "Bu usul kechasi tarozi hududiga begona kirishni aniqlashda qo'l keladi."], "caption": null, "id": "m3-motion"}, {"t": "statement", "title": "Kamerani «ko'z» sifatida emas, o'lchov asbobi sifatida tanlaymiz", "sub": "Raqamni o'qish, odamni aniqlash yoki yukni ko'rish — har biri uchun alohida o'lcham, obyektiv va yorug'lik talab qilinadi.", "accent": true, "id": "k-intro"}, {"t": "flow", "title": "IP-kamera ichida nima bo'ladi", "items": [["Lightbulb", "Obyektiv", "Yorug'likni yig'ib, sensorga tushiradi"], ["Settings", "Sensor", "Millionlab piksel yorug'likni raqamga aylantiradi"], ["Database", "Protsessor", "Rasmni tozalaydi va H.264/H.265 bilan siqadi"], ["Globe", "Tarmoq", "RTSP oqimi yoki HTTP rasm sifatida uzatadi"]], "caption": null, "id": "k-how"}, {"t": "term", "title": "Sensor va piksel", "def": "Sensor — millionlab mayda yorug'lik sezgichlaridan (piksellardan) iborat mikrosxema. Har bir piksel o'ziga tushgan yorug'lik miqdorini son sifatida beradi.", "analogy": "Mozaika: har bir tosh bitta rang. Toshlar qancha ko'p va mayda bo'lsa, rasm shuncha aniq.", "example": "2 megapiksel kamera — taxminan 1920 × 1080 piksel. Uzoqdagi raqam uchun piksellar yetmasa, AI ham o'qiy olmaydi.", "id": "k-sensor"}, {"t": "table", "title": "Ruxsat (o'lcham) va qo'llanish", "intro": null, "head": ["Nomi", "Piksellar", "Qachon mos"], "rows": [["HD (720p)", "1280 × 720, ~0,9 MP", "Tahlil uchun sub-oqim, umumiy ko'rinish"], ["Full HD (1080p)", "1920 × 1080, ~2 MP", "Raqam, darvoza, tarozi — eng ko'p ishlatiladi"], ["4 MP", "2560 × 1440", "Kengroq hudud, ko'proq tafsilot"], ["4K (8 MP)", "3840 × 2160", "Katta maydonlar; ko'p disk va tarmoq talab qiladi"]], "id": "k-res"}, {"t": "table", "title": "Obyektiv: fokus masofasi (mm)", "intro": null, "head": ["Obyektiv", "Ko'rish burchagi", "Qachon"], "rows": [["2,8 mm", "Juda keng", "Xona, yaqin masofa, umumiy ko'rinish"], ["4 mm", "Keng", "Kichik hovli, darvoza oldi"], ["6–8 mm", "O'rtacha", "5–10 metrdagi raqam"], ["12 mm va undan ortiq", "Tor", "Uzoqdagi raqam yoki detal"], ["Varifokal (2,8–12 mm)", "Sozlanadi", "O'rnatishda aniq tanlash mumkin — tarozi uchun qulay"]], "id": "k-lens", "notes": "Qoida: mm qancha katta bo'lsa, kamera shuncha «uzoqni» ko'radi, lekin maydon torayadi. Raqam uchun keng burchakli arzon kamera ko'pincha yaramaydi — raqam kichik chiqadi."}, {"t": "statement", "title": "Raqamni o'qish uchun: raqam kengligida kamida 150–200 piksel", "sub": "Kamerani o'rnatgach, bitta kadr oling va raqam necha piksel ekanini o'lchang. Yetmasa — obyektivni kattalashtiring yoki kamerani yaqinlashtiring.", "accent": false, "id": "k-ppm"}, {"t": "cards", "title": "Yorug'lik sozlamalari", "intro": null, "items":
