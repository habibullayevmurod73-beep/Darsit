 [["Lightbulb", "IR yoritgich", "Kechasi ko'zga ko'rinmas yorug'lik. Raqam plastinkasi uni yaxshi qaytaradi."], ["Settings", "WDR", "Yorug' va qorong'i joylar birga: faralar va soya. Ikkalasini ham ko'rsatadi."], ["Search", "BLC / HLC", "Orqa yorug'lik va faralarni kompensatsiya qilish."], ["Clock", "Ekspozitsiya (shutter)", "Qisqa vaqt — harakat xiralashmaydi. Harakatlanayotgan mashina uchun muhim."], ["Activity", "Kun / tun rejimi", "Kechasi qora-oq rejimga o'tadi — sezgirlik oshadi."], ["Warning", "Quyoshga qarshi", "Kamerani quyosh chiqishi yoki botishiga qaratmang."]], "id": "k-light"}, {"t": "table", "title": "Oqim sozlamalari", "intro": null, "head": ["Parametr", "Ma'nosi", "Tavsiya (tahlil uchun)"], "rows": [["Kodek", "Siqish usuli", "H.264 — eng mos; H.265 — kam trafik"], ["FPS", "Soniyadagi kadrlar", "10–15 yetarli"], ["Bitrate", "Soniyadagi hajm", "Full HD uchun 2–4 Mbit/s"], ["CBR / VBR", "Doimiy / o'zgaruvchan hajm", "VBR — disk tejaladi"], ["I-kadr oralig'i (GOP)", "To'liq kadrlar orasidagi masofa", "FPS ga teng yoki 2 barobar"]], "id": "k-stream"}, {"t": "cards", "title": "PoE: bitta kabelda tok va tarmoq", "intro": null, "items": [["Lightning", "Standartlar", "802.3af — portga 15,4 W gacha, 802.3at (PoE+) — 30 W gacha. IR va isitgichli kameralar ko'proq talab qiladi."], ["Settings", "Umumiy byudjet", "Switchning umumiy PoE quvvati barcha kameralar yig'indisidan ko'p bo'lsin."], ["Link", "Kabel uzunligi", "Ethernet kabeli 100 metrgacha. Undan uzoqda — qo'shimcha switch yoki optika."]], "id": "k-poe"}, {"t": "table", "title": "IP manzillar rejasi (namuna)", "intro": null, "head": ["Qurilma", "IP manzil", "VLAN"], "rows": [["Old kamera, tarozi 1", "192.168.10.11", "10 — qurilmalar"], ["Orqa kamera, tarozi 1", "192.168.10.12", "10 — qurilmalar"], ["Tarozi indikatori (TCP)", "192.168.10.21", "10 — qurilmalar"], ["Shlyuz kompyuteri", "192.168.10.5", "10 va 20"], ["NVR", "192.168.10.50", "10 — qurilmalar"], ["Server", "192.168.20.10", "20 — serverlar"]], "id": "k-ipplan", "notes": "Rejani oldindan tuzib, hujjatlashtiring. Kameralar raqamlarini qurilma turiga qarab bloklarga ajrating: 11–19 kameralar, 21–29 tarozilar va hokazo."}, {"t": "compare", "title": "Videoni kim yozadi", "left": ["NVR (videoregistrator)", ["24/7 arxiv, qidirish qulay", "Kamera bilan bir brend — sozlash oson", "Tahlil qilmaydi", "Xavfsizlik xizmati uchun"]], "right": ["O'z dasturimiz (Python)", ["Faqat voqea paytidagi kadr va klip", "Tortish ID si bilan bog'lanadi", "AI tahlil qo'shish mumkin", "Avtomatlashtirish uchun"]], "id": "k-nvr", "notes": "Ikkalasi birga ishlaydi: NVR arxivni yozadi, bizning dastur esa har bir tortish uchun aniq kadrni oladi. Kamera bir vaqtda bir nechta mijozga oqim bera oladi, lekin ularning soni cheklangan — pasportga qarang."}, {"t": "code", "title": "ffmpeg bilan oqimni tekshirish va kadr olish", "lang": "bash", "src": "# Oqim ma'lumotlari: kodek, o'lcham, FPS\nffprobe -rtsp_transport tcp \"rtsp://admin:Parol@192.168.10.11:554/Streaming/Channels/101\"\n\n# Bitta kadrni rasmga saqlash\nffmpeg -rtsp_transport tcp -i \"rtsp://.../101\" -frames:v 1 kadr.jpg\n\n# 5 daqiqalik bo'laklarga yozish (qayta siqmasdan)\nffmpeg -rtsp_transport tcp -i \"rtsp://.../101\" -c copy \\\n  -f segment -segment_time 300 -reset_timestamps 1 \"arxiv/%03d.mp4\"", "side": null, "caption": "ffmpeg — video bilan ishlashning eng kuchli bepul vositasi. -c copy videoni qayta siqmaydi, protsessorni deyarli yuklamaydi.", "id": "k-ffprobe"}, {"t": "code", "title": "HTTP orqali rasm olish (oqimsiz)", "lang": "python", "src": "import requests, os\nfrom requests.auth import HTTPDigestAuth\n\nURL = \"http://192.168.10.11/ISAPI/Streaming/channels/101/picture\"\nauth = HTTPDigestAuth(\"admin\", os.getenv(\"CAM_PASS\"))\n\nr = requests.get(URL, auth=auth, timeout=5)\nif r.ok and r.headers.get(\"Content-Type\", \"\").startswith(\"image\"):\n    with open(\"kadr.jpg\", \"wb\") as f:\n        f.write(r.content)", "side": null, "caption": "Ko'p kameralarda bitta rasm olish uchun HTTP manzil bor (misol — Hikvision). Bu RTSP oqimini ochishdan tez va yengil. Manzilni kamera hujjatlaridan toping.", "id": "k-http-snap"}, {"t": "term", "title": "Rasm — bu sonlar jadvali", "def": "Kompyuter uchun rasm — balandlik × kenglik × 3 o'lchamli sonlar massivi. Har bir pikselda ko'k, yashil va qizil (BGR) qiymatlari 0 dan 255 gacha.", "analogy": "Katakli daftar: har bir katakka rang raqami yozilgan. Barcha kataklarni bo'yasangiz — rasm chiqadi.", "example": "1080p kadr: 1080 × 1920 × 3 = 6 milliondan ortiq son. Kesish, kichraytirish, AI tahlil — hammasi shu sonlar ustida amal.", "id": "k-image"}, {"t": "code", "title": "OpenCV: asosiy amallar", "lang": "python", "src": "import cv2\n\nimg = cv2.imread(\"kadr.jpg\")\nprint(img.shape)                       # (1080, 1920, 3)\n\nkichik = cv2.resize(img, (960, 540))   # kichraytirish\nkulrang = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\nkesma = img[600:900, 700:1300]         # [y1:y2, x1:x2]\n\ncv2.imwrite(\"kesma.jpg\", kesma)\ncv2.imwrite(\"kichik.jpg\", kichik, [cv2.IMWRITE_JPEG_QUALITY, 85])", "side": ["<b>shape<\/b> — balandlik, kenglik, ranglar soni.", "Kesishda avval <b>y<\/b> (qator), keyin <b>x<\/b> (ustun).", "JPEG sifatini 80–90 qilib, disk joyini tejang."], "caption": null, "id": "k-cv-basics"}, {"t": "code", "title": "Rasmga vaqt va og'irlikni yozish", "lang": "python", "src": "import cv2\nfrom datetime import datetime\n\nimg = cv2.imread(\"kadr.jpg\")\nmatn = f\"{datetime.now():%d.%m.%Y %H:%M:%S}  12450 kg  01A123BC\"\n\ncv2.rectangle(img, (0, 0), (img.shape[1], 60), (0, 0, 0), -1)\ncv2.putText(img, matn, (20, 42), cv2.FONT_HERSHEY_SIMPLEX,\n            1.2, (255, 255, 255), 2, cv2.LINE_AA)\ncv2.imwrite(\"dalil.jpg\", img)", "side": null, "caption": "Rasmning o'zida vaqt, og'irlik va raqam yozilgan bo'lsa, u alohida fayl sifatida ham tortishning ishonchli dalili bo'ladi.", "id": "k-overlay"}, {"t": "cards", "title": "Qiziqish hududi (ROI)", "intro": null, "items": [["Search", "Nima", "Kadrning faqat kerakli qismi: tarozi platformasi yoki raqam tushadigan joy."], ["Lightning", "Nega", "Tahlil tezlashadi, begona harakat (daraxt, soya, odamlar) xalaqit bermaydi."], ["Settings", "Qanday", "Koordinatalarni sozlama fayliga yozing: kamera siljisa, faqat sozlama o'zgaradi."]], "id": "k-roi"}, {"t": "code", "title": "Kechikish va uzilishlarni kamaytirish", "lang": "python", "src": "import os, cv2, time\n\n# RTSP ni TCP orqali — paketlar yo'qolmaydi\nos.environ[\"OPENCV_FFMPEG_CAPTURE_OPTIONS\"] = \"rtsp_transport;tcp\"\n\ndef ochish(url):\n    while True:\n        cap = cv2.VideoCapture(url, cv2.CAP_FFMPEG)\n        if cap.isOpened():\n            cap.set(cv2.CAP_PROP_BUFFERSIZE, 1)\n            return cap\n        logging.warning(\"Kamera ochilmadi, 5 s dan keyin\")\n        time.sleep(5)", "side": ["TCP — sekinroq, lekin tarmoqda paket yo'qolsa, rasm «buzilmaydi».", "<b>BUFFERSIZE 1<\/b> — eski kadrlar to'planib qolmaydi.", "Ochilmasa — kutib, qayta urinadi. Dastur hech qachon qulab tushmaydi."], "caption": null, "id": "k-latency"}, {"t": "table", "title": "Disk hajmini hisoblash", "intro": "Formula: bitrate (Mbit/s) × 86 400 soniya ÷ 8 = MB kuniga. Bitta kamera, 24 soat uzluksiz yozuv uchun:", "head": ["Bitrate", "1 kunda", "30 kunda"], "rows": [["2 Mbit/s", "~21,6 GB", "~650 GB"], ["4 Mbit/s", "~43 GB", "~1,3 TB"], ["8 Mbit/s", "~86 GB", "~2,6 TB"]], "id": "k-disk", "notes": "Faqat voqea kadrlari (har tortishga 2 ta JPEG, har biri taxminan 300–500 KB) kuniga 500 ta tortishda ham 0,5 GB dan oshmaydi. Shuning uchun biz uzluksiz videoni NVR ga, kadrlarni o'z serverimizga saqlaymiz."}, {"t": "cards", "title": "Qonun va maxfiylik", "intro": null, "items": [["Warning", "Ogohlantirish", "Kuzatuv olib borilayotgani haqida ko'rinadigan belgi qo'ying."], ["Search", "Faqat kerakli hudud", "Kamera ish hududiga qaratilsin, xodimlarning shaxsiy joylariga emas."], ["Lock", "Kirish cheklangan", "Yozuvlarni faqat vakolatli xodimlar ko'radi."], ["Clock", "Saqlash muddati", "Qancha saqlanishini belgilang va eski yozuvlarni avtomatik o'chiring."]], "id": "k-privacy", "notes": "Aniq talablar mamlakat qonunchiligiga bog'liq. Loyiha boshida korxona yuristi bilan maslahatlashing."}, {"t": "table", "title": "Kamera muammolari va yechimlari", "intro": null, "head": ["Belgi", "Sabab", "Yechim"], "rows": [["Kadr qora yoki bo'sh", "Oqim ochilmadi", "VLC da tekshiring, URL va parolni"], ["Bir necha soniya kechikish", "Bufer, UDP", "TCP, BUFFERSIZE, sub-oqim"], ["Rasm «parchalangan»", "Paket yo'qolishi", "rtsp_transport tcp, kabelni tekshiring"], ["Kechasi raqam oppoq", "Faralar, IR ortiqcha", "WDR/HLC, ekspozitsiyani qisqartiring"], ["Vaqti-vaqti bilan uziladi", "PoE quvvati yetmaydi", "Switch byudjetini tekshiring"], ["Raqam juda kichik", "Keng obyektiv", "Varifokal yoki yaqinroq o'rnatish"]], "id": "k-diag"}, {"t": "steps", "title": "Amaliy mashqlar", "intro": null, "items": [["VLC", "Kamerangiz oqimini VLC da oching, asosiy va qo'shimcha oqimni solishtiring."], ["ffmpeg", "Bitta kadr oling va hajmini, o'lchamini yozib oling."], ["Raqam o'lchami", "Kadrda raqam necha piksel ekanini o'lchang."], ["Overlay", "Kadrga vaqt va og'irlik yozadigan funksiya yozing."], ["Qayta ulanish", "Kamera kabelini sug'urib, dastur o'zi tiklanishini tekshiring."], ["Disk", "Sizning kameralaringiz uchun 30 kunlik hajmni hisoblang."]], "id": "k-practice"}, {"t": "quiz", "q": "Raqam kadrda juda kichik chiqyapti. Eng to'g'ri yechim qaysi?", "opts": ["Rasmni kompyuterda kattalashtirish", "Kattaroq fokus masofali (mm) obyektiv yoki kamerani yaqinlashtirish", "FPS ni oshirish"], "a": 1, "expl": "Kattalashtirish yangi tafsilot qo'shmaydi. Raqamga ko'proq piksel kerak — bu optikada hal qilinadi.", "id": "k-q1"}, {"t": "quiz", "q": "4 Mbit/s oqim 1 kunda taxminan qancha disk joyini egallaydi?", "opts": ["~4 GB", "~43 GB", "~400 GB"], "a": 1, "expl": "4 × 86 400 ÷ 8 = 43 200 MB, ya'ni taxminan 43 GB.", "id": "k-q2"}, {"t": "quiz", "q": "RTSP manzil to'g'riligini eng tez qanday tekshirasiz?", "opts": ["VLC da ochib ko'rish", "Kamerani qayta yoqish", "1C da tekshirish"], "a": 0, "expl": "VLC da ochilgan manzil OpenCV da ham ochiladi. Ochilmasa — manzil, login yoki RTSP sozlamasida xato bor.", "id": "m3-q1"}, {"t": "quiz", "q": "Nega kadrni olishdan oldin bir nechta grab() qilinadi?", "opts": ["Rasm yorqinroq bo'lishi uchun", "Buferdagi eski kadrlarni tashlab, yangisini olish uchun", "Kamerani qizdirish uchun"], "a": 1, "expl": "Aks holda bir necha soniya oldingi kadr olinib, mashina hali taroziga kirmagan payt suratga tushishi mumkin.", "id": "m3-q2"}, {"t": "quiz", "id": "xq-m3-0", "q": "Python'da IP-kamera oqimini ochish uchun odatda qaysi protokol ishlatiladi?", "opts": ["RTSP", "FTP", "SMTP"], "a": 0, "expl": "RTSP — video oqimi protokoli."}, {"t": "quiz", "id": "xq-m3-1", "q": "PoE nima beradi?", "opts": ["Faqat internet", "Bitta kabelda tok va tarmoq", "Simsiz aloqa"], "a": 1, "expl": "Kameraga alohida quvvat kabeli tortish shart emas."}]}, {"id": "m4", "num": 4, "title": "Qurilmalarni webga ulash", "goal": "FastAPI da server yozasiz, ma'lumotni bazaga saqlaysiz va brauzerda real vaqtda yangilanadigan dashboard qilasiz.", "stages": [1, 2, 5], "vol": 1, "blocks": [{"t": "flow", "title": "Klient va server qanday gaplashadi", "items": [["Tool", "Shlyuz", "POST so'rov: yangi tortishni yuboradi"], ["Globe", "API server", "Tekshiradi va bazaga yozadi"], ["Database", "PostgreSQL", "Barcha tortishlarni saqlaydi"], ["Chart", "Brauzer", "GET so'rov va WebSocket orqali ko'radi"]], "caption": "Hamma gaplashuv HTTP va JSON orqali bo'ladi. JSON — dasturlar tushunadigan oddiy matn formati.", "id": "m4-cs"}, {"t": "table", "title": "REST API: asosiy amallar", "intro": null, "head": ["Metod", "Ma'nosi", "Misol"], "rows": [["GET", "Ma'lumot olish", "GET /api/weighings — barcha tortishlar"], ["POST", "Yangi yozuv yaratish", "POST /api/weighings — yangi tortish"], ["PUT / PATCH", "Yozuvni o'zgartirish", "PATCH /api/weighings/15 — tarani qo'shish"], ["DELETE", "O'chirish", "DELETE /api/weighings/15 — kamdan-kam ishlatiladi"]], "id": "m4-rest", "notes": "Javob kodlari ham muhim: 200 — hammasi yaxshi, 201 — yaratildi, 400 — noto'g'ri ma'lumot, 401 — ruxsat yo'q, 404 — topilmadi, 500 — server xatosi."}, {"t": "code", "title": "FastAPI: birinchi server", "lang": "python", "src": "from fastapi import FastAPI\nfrom pydantic import BaseModel\napp, DB = FastAPI(title=\"Zavod API\"), {}\n\nclass Weighing(BaseModel):\n    id: str\n    scale: str\n    weight: float\n    ts: float\n    plate: str | None = None\n@app.post(\"/api/weighings\")\ndef add(w: Weighing):\n    if w.id in DB:\n        return {\"status\": \"exists\"}\n    DB[w.id] = w\n    return {\"status\": \"ok\"}", "side": ["<b>BaseModel<\/b> — kelgan JSON ni avtomatik tekshiradi. Og'irlik o'rniga matn kelsa, 422 xato qaytadi.", "<b>w.id in DB<\/b> — takrorlanishdan himoya.", "Hozircha lug'atda saqlaymiz; keyingi slaydda PostgreSQL ga o'tamiz."], "caption": null, "id": "m4-fastapi"}, {"t": "code", "title": "Serverni ishga tushirish va sinash", "lang": "bash", "src": "# Serverni ishga tushirish\nuvicorn server:app --host 0.0.0.0 --port 8000 --reload\n\n# Brauzerda avtomatik hujjat va sinov sahifasi\nhttp://localhost:8000/docs\n\n# Terminaldan sinov so'rovi\ncurl -X POST http://localhost:8000/api/weighings \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"id\":\"t1\",\"scale\":\"SCALE-1\",\"weight\":12450,\"ts\":0}'", "side": null, "caption": "/docs sahifasi — FastAPI ning eng qulay xususiyati: har bir API ni tugma bosib brauzerdan sinaysiz.", "id": "m4-run"}, {"t": "table", "title": "Baza jadvali: weighings", "intro": null, "head": ["Ustun", "Turi", "Vazifasi"], "rows": [["id", "text (asosiy kalit)", "Shlyuz bergan noyob uuid"], ["scale", "text", "Qaysi tarozi: SCALE-1, SCALE-2"], ["weight", "numeric", "Og'irlik, kg"], ["ts", "timestamp", "Tortish vaqti"], ["plate", "text", "Tanilgan mashina raqami"], ["photo", "text", "Rasm fayliga yo'l"], ["sent_to_1c", "boolean", "1C ga yuborildimi"]], "id": "m4-schema"}, {"t": "code", "title": "SQLAlchemy: jadvalni Python klassi sifatida", "lang": "python", "src": "from sqlalchemy import create_engine, Column, String, Float, Boolean\nfrom sqlalchemy.orm import declarative_base, Session\n\nengine = create_engine(\"postgresql://zavod:parol@localhost/zavod\")\nBase = declarative_base()\n\nclass WeighingRow(Base):\n    __tablename__ = \"weighings\"\n    id = Column(String, primary_key=True)\n    scale = Column(String)\n    weight = Column(Float)\n    ts = Column(Float)\n    plate = Column(String)\n    sent_to_1c = Column(Boolean, default=False)\n\nBase.metadata.create_all(engine)", "side": null, "caption": null, "id": "m4-sql", "notes": "create_all jadval yo'q bo'lsa uni yaratadi. sent_to_1c ustuni 1C ishlamay turganda ham ma'lumot yo'qolmasligini ta'minlaydi."}, {"t": "flow", "title": "WebSocket: sahifani yangilamasdan yangilanish", "items": [["Activity", "Tortish keldi", "Server yangi voqeani oladi"], ["PaperPlane", "Broadcast", "Barcha ochiq brauzerlarga yuboradi"], ["Chart", "Dashboard", "Jadvalga yangi qator qo'shiladi"]], "caption": "Oddiy HTTP da brauzer so'rashi kerak. WebSocket da esa server o'zi xabar beradi — xuddi telefon qo'ng'irog'idek.", "id": "m4-ws-idea"}, {"t": "code", "title": "Server tomoni: WebSocket", "lang": "python", "src": "from fastapi import WebSocket\nclients = set()\n\n@app.websocket(\"/ws\")\nasync def ws(sock: WebSocket):\n    await sock.accept()\n    clients.add(sock)\n    try:\n        while True:\n            await sock.receive_text()\n    except Exception:\n        clients.discard(sock)\n\nasync def broadcast(data: dict):\n    for c in list(clients):\n        await c.send_json(data)", "side": ["Har bir ochiq brauzer <b>clients<\/b> to'plamiga qo'shiladi.", "Brauzer yopilsa — to'plamdan chiqariladi.", "Yangi tortish kelganda <b>broadcast()<\/b> chaqiriladi."], "caption": null, "id": "m4-ws"}, {"t": "code", "title": "Brauzer tomoni: jonli jadval", "lang": "html", "src": "\n  VaqtRaqamOg'irlik\n\n\nconst ws = new WebSocket(\"ws://\" + location.host + \"/ws\");\nws.onmessage = (e) => {\n  const d = JSON.parse(e.data);\n  const row = document.getElementById(\"t\").insertRow(1);\n  row.insertCell().textContent = new Date(d.ts * 1000).toLocaleTimeString();\n  row.insertCell().textContent = d.plate || \"—\";\n  row.insertCell().textContent = d.weight + \" kg\";\n};\n", "side": null, "caption": "Yangi tortish jadvalning eng tepasiga qo'shiladi. Rahbar sahifani ochib qo'yadi — qolganini server o'zi yangilab turadi.", "id": "m4-dash"}, {"t": "code", "title": "Telegram bot: rasm bilan xabarnoma", "lang": "python", "src": "import requests, os\nTOKEN = os.getenv(\"TG_TOKEN\")      # @BotFather dan olinadi\nCHAT = os.getenv(\"TG_CHAT\")        # guruh ID si\nAPI = f\"https://api.telegram.org/bot{TOKEN}\"\n\ndef notify(text, photo=None):\n    if photo:\n        with open(photo, \"rb\") as f:\n            requests.post(f\"{API}/sendPhoto\", files={\"photo\": f},\n                          data={\"chat_id\": CHAT, \"caption\": text})\n    else:\n        requests.post(f\"{API}/sendMessage\",\n                      data={\"chat_id\": CHAT, \"text\": text})\n\nnotify(\"01A123BC: 12 450 kg\", \"snapshots/t1.jpg\")", "side": null, "caption": null, "id": "m4-tg", "notes": "Botni guruhga qo'shing va guruh ID sini oling. Endi har bir tortish yoki shubhali holat rahbarning telefoniga rasm bilan keladi."}, {"t": "statement", "title": "Web — bu dasturlar gaplashadigan umumiy til", "sub": "Tarozi shlyuzi, 1C, dashboard va Telegram bot — hammasi HTTP orqali muloqot qiladi. HTTP va SQL ni tushunsangiz, har qanday tizimni bog'lay olasiz.", "accent": true, "id": "w-intro"}, {"t": "term", "title": "HTTP: so'rov va javob", "def": "Klient serverga so'rov (request) yuboradi, server javob (response) qaytaradi. Har bir so'rov mustaqil: server oldingisini «eslamaydi».", "analogy": "Pochta orqali xat: manzil, mavzu, ichidagi matn. Javob xati ham shunday: natija kodi va mazmuni.", "example": "Shlyuz: «POST /api/weighings, ichida tortish JSON». Server: «201 Created, {\"status\": \"ok\"}».", "id": "w-http"}, {"t": "code", "title": "HTTP so'rov aslida qanday ko'rinadi", "lang": "text", "src": "POST /api/weighings HTTP/1.1\nHost: 192.168.20.10:8000\nContent-Type: application/json\nAuthorization: Bearer abc123...\nContent-Length: 58\n\n{\"id\": \"t1\", \"scale\": \"SCALE-1\", \"weight\": 12450}", "side": ["1-qator: <b>metod<\/b>, <b>yo'l<\/b> va protokol versiyasi.", "Keyingi qatorlar — <b>sarlavhalar<\/b> (headers): qo'shimcha ma'lumot.", "Bo'sh qatordan keyin — <b>tana<\/b> (body): yuborilayotgan ma'lumot."], "caption": null, "id": "w-req"}, {"t": "code", "title": "HTTP javob", "lang": "text", "src": "HTTP/1.1 201 Created\nContent-Type: application/json\nDate: Mon, 28 Sep 2026 04:15:42 GMT\n\n{\"status\": \"ok\", \"id\": \"t1\"}", "side": ["1-qator: <b>holat kodi<\/b> va uning nomi.", "Sarlavhalar: javob turi, vaqt.", "Tana: natija. Brauzerda F12 → Network yorlig'ida har bir so'rovni shunday ko'rish mumkin."], "caption": null, "id": "w-resp"}, {"t": "table", "title": "URL qismlari", "intro": null, "head": ["Qism", "Misol", "Ma'nosi"], "rows": [["Sxema", "http://", "Protokol (https — shifrlangan)"], ["Host", "192.168.20.10", "Server manzili yoki domen nomi"], ["Port", ":8000", "Serverdagi xizmat eshigi"], ["Yo'l", "/api/weighings", "Qaysi resurs"], ["So'rov parametrlari", "?date=2026-09-28&plate=01A", "Filtr va sozlamalar"]], "id": "w-url"}, {"t": "table", "title": "Holat kodlari: to'liq ro'yxat", "intro": null, "head": ["Kod", "Nomi", "Qachon"], "rows": [["200", "OK", "Muvaffaqiyatli"], ["201", "Created", "Yangi yozuv yaratildi"], ["204", "No Content", "Bajarildi, qaytaradigan narsa yo'q"], ["400 / 422", "Bad Request / Unprocessable", "Ma'lumot noto'g'ri yoki to'liq emas"], ["401 / 403", "Unauthorized / Forbidden", "Kirish yo'q / huquq yo'q"], ["404", "Not Found", "Bunday manzil yoki yozuv yo'q"], ["500", "Internal Server Error", "Server kodida xato"], ["503", "Service Unavailable", "Server band yoki ishlamayapti"]], "id": "w-status", "notes": "Qoida: 2xx — hammasi yaxshi, 4xx — klient xatosi (so'rovni tuzating), 5xx — server xatosi (keyinroq qayta urinish mumkin)."}, {"t": "table", "title": "Muhim sarlavhalar", "intro": null, "head": ["Sarlavha", "Vazifasi"], "rows": [["Content-Type", "Tana formati: application/json, image/jpeg"], ["Authorization", "Kirish kaliti yoki login-parol"], ["Accept", "Qaysi formatda javob kutilmoqda"], ["Content-Length", "Tana hajmi baytlarda"], ["User-Agent", "Qaysi dastur so'rov yubormoqda"]], "id": "w-headers"}, {"t": "term", "title": "SQL", "def": "Ma'lumotlar bazasi bilan gaplashish tili: jadval yaratish, yozish, qidirish, o'zgartirish. Deyarli barcha bazalar (PostgreSQL, MS SQL, MySQL) uni tushunadi.", "analogy": "Kutubxonachiga iltimos: «2026-yilda chiqqan, texnikaga oid kitoblarni sanasi bo'yicha tartiblab bering».", "example": "SELECT plate, SUM(netto) FROM weighings WHERE ts >= '2026-09-28' GROUP BY plate — bugun har bir mashina qancha olib keldi.", "id": "w-sql"}, {"t": "steps", "title": "PostgreSQL ni o'rnatish va tayyorlash", "intro": null, "items": [["Yuklab oling", "postgresql.org → Download → Windows yoki Linux paketi."], ["Parol", "O'rnatishda postgres foydalanuvchisi parolini eslab qoling."], ["Grafik vosita", "pgAdmin (birga keladi) yoki DBeaver o'rnating."], ["Baza yarating", "CREATE DATABASE zavod;"], ["Alohida foydalanuvchi", "CREATE USER zavod_app WITH PASSWORD '...'; va huquqlar."], ["Ulanishni tekshiring", "pgAdmin da yangi foydalanuvchi bilan ulaning."]], "id": "w-pg-install"}, {"t": "code", "title": "Jadval yaratish", "lang": "sql", "src": "CREATE TABLE weighings (\n    id          uuid PRIMARY KEY,\n    scale       text        NOT NULL,\n    ts          timestamptz NOT NULL DEFAULT now(),\n    plate       text,\n    brutto      integer     NOT NULL CHECK (brutto >= 0),\n    tara        integer,\n    photo       text,\n    sent_to_1c  boolean     NOT NULL DEFAULT false\n);", "side": ["Har bir qator — ustun: nomi, turi, cheklovi.", "<b>PRIMARY KEY<\/b> — noyob kalit, takrorlanmaydi.", "<b>NOT NULL<\/b> — bo'sh bo'lishi mumkin emas.", "<b>DEFAULT<\/b> — berilmasa qo'yiladigan qiymat.", "<b>CHECK<\/b> — qiymat shartga mos bo'lishi shart."], "caption": null, "id": "w-create"}, {"t": "table", "title": "PostgreSQL ma'lumot turlari", "intro": null, "head": ["Tur", "Nima uchun"], "rows": [["integer / bigint", "Butun sonlar: og'irlik (kg), soni"], ["numeric(12,3)", "Aniq kasr: pul, tonna"], ["text", "Matn: raqam, izoh"], ["boolean", "Ha / yo'q"], ["timestamptz", "Sana-vaqt, vaqt zonasi bilan — doim shuni ishlating"], ["uuid", "Noyob ID"], ["jsonb", "Erkin tuzilishdagi JSON ma'lumot"]], "id": "w-types"}, {"t": "code", "title": "Yozish: INSERT", "lang": "sql", "src": "INSERT INTO weighings (id, scale, plate, brutto)\nVALUES ('5f0c2a9e-7d1b-4c1e-9a55-2b8f6f1c3d10',\n        'SCALE-1', '01A123BC', 12450);\n\n-- Takrorlanishda xato bermaslik\nINSERT INTO weighings (id, scale, brutto)\nVALUES ('5f0c2a9e-7d1b-4c1e-9a55-2b8f6f1c3d10', 'SCALE-1', 12450)\nON CONFLICT (id) DO NOTHING;", "side": null, "caption": "ON CONFLICT DO NOTHING — shu ID allaqachon bo'lsa, jim o'tkazib yuboradi. Shlyuz bir voqeani ikki marta yuborsa ham takror yozilmaydi.", "id": "w-insert"}, {"t": "code", "title": "O'qish: SELECT", "lang": "sql", "src": "-- Bugungi barcha tortishlar, yangilari yuqorida\nSELECT ts, plate, brutto, tara, brutto - tara AS netto\nFROM weighings\nWHERE ts >= current_date\nORDER BY ts DESC\nLIMIT 50;\n\n-- Raqami 01A bilan boshlanadiganlar\nSELECT * FROM weighings WHERE plate LIKE '01A%';", "side": ["<b>SELECT<\/b> — qaysi ustunlar. <b>AS<\/b> — yangi nom.", "<b>WHERE<\/b> — shart.", "<b>ORDER BY … DESC<\/b> — kamayish tartibida.", "<b>LIMIT<\/b> — nechta qator.", "<b>LIKE '01A%'<\/b> — shu bilan boshlanadigan."], "caption": null, "id": "w-select"}, {"t": "code", "title": "Guruhlash va yig'indilar", "lang": "sql", "src": "-- Har bir mashina bugun qancha olib keldi\nSELECT plate,\n       COUNT(*)            AS reys,\n       SUM(brutto - tara)  AS jami_netto\nFROM weighings\nWHERE ts >= current_date\nGROUP BY plate\nORDER BY jami_netto DESC;\n\n-- Oxirgi 7 kun, kunlar bo'yicha\nSELECT date_trunc('day', ts) AS kun, SUM(brutto - tara)\nFROM weighings\nWHERE ts >= now() - interval '7 days'\nGROUP BY kun ORDER BY kun;", "side": null, "caption": null, "id": "w-group", "notes": "GROUP BY — bir xil qiymatli qatorlarni birlashtiradi. COUNT, SUM, AVG, MIN, MAX — guruh bo'yicha hisob."}, {"t": "code", "title": "O'zgartirish va o'chirish", "lang": "sql", "src": "-- 1C ga yuborilgan deb belgilash\nUPDATE weighings\nSET sent_to_1c = true\nWHERE id = '5f0c2a9e-7d1b-4c1e-9a55-2b8f6f1c3d10';\n\n-- O'chirish (ehtiyot bo'ling!)\nDELETE FROM weighings WHERE ts -- XAVFLI: WHERE siz — butun jadval o'zgaradi\n-- UPDATE weighings SET tara = 0;", "side": null, "caption": "UPDATE va DELETE dan oldin doim o'sha shart bilan SELECT qilib, qaysi qatorlarga ta'sir qilishini ko'ring.", "id": "w-update"}, {"t": "code", "title": "Jadvallarni bog'lash: JOIN", "lang": "sql", "src": "CREATE TABLE trucks (\n    plate   text PRIMARY KEY,\n    owner   text,\n    tara    integer\n);\n\nSELECT w.ts, w.plate, t.owner, w.brutto - t.tara AS netto\nFROM weighings w\nJOIN trucks t ON t.plate = w.plate\nWHERE w.ts >= current_date;", "side": ["Mashinalar alohida jadvalda: har biri bir marta yoziladi.", "<b>JOIN … ON<\/b> — raqam bo'yicha ikki jadvalni birlashtiradi.", "<b>w<\/b> va <b>t<\/b> — jadvallarning qisqa nomlari.", "1C dagi «havola» g'oyasi ham aynan shu."], "caption": null, "id": "w-join"}, {"t": "cards", "title": "Indeks: qidiruvni tezlashtirish", "intro": null, "items": [["Book", "Nima", "Kitob oxiridagi mundarija kabi: butun kitobni varaqlamasdan kerakli sahifani topasiz."], ["Lightning", "Qachon kerak", "WHERE va ORDER BY da ko'p ishlatiladigan ustunlar: ts, plate."], ["Code", "Qanday", "CREATE INDEX ON weighings (ts); CREATE INDEX ON weighings (plate);"]], "id": "w-index", "notes": "Indeks qidirishni tezlashtiradi, lekin yozishni biroz sekinlashtiradi va joy egallaydi. Hamma ustunga emas, faqat kerakli ustunlarga qo'ying."}, {"t": "table", "title": "Cheklovlar: bazaning o'zi xatodan himoya qiladi", "intro": null, "head": ["Cheklov", "Nima qiladi"], "rows": [["PRIMARY KEY", "Noyob va bo'sh bo'lmagan kalit"], ["UNIQUE", "Takrorlanmaydigan qiymat (masalan, raqam)"], ["NOT NULL", "Bo'sh qoldirib bo'lmaydi"], ["FOREIGN KEY", "Boshqa jadvaldagi mavjud yozuvga havola"], ["CHECK", "Shart: og'irlik manfiy bo'lmasin"]], "id": "w-constraints"}, {"t": "code", "title": "Python dan bazaga xavfsiz so'rov", "lang": "python", "src": "import psycopg, os\n\nwith psycopg.connect(os.getenv(\"DB_URL\")) as conn:\n    with conn.cursor() as cur:\n        cur.execute(\n            \"INSERT INTO weighings (id, scale, brutto) VALUES (%s, %s, %s)\"\n            \" ON CONFLICT (id) DO NOTHING\",\n            (eid, \"SCALE-1\", 12450),\n        )\n        cur.execute(\"SELECT plate, brutto FROM weighings WHERE plate = %s\",\n                    (raqam,))\n        for plate, brutto in cur.fetchall():\n            print(plate, brutto)", "side": null, "caption": "Qiymatlar %s o'rniga alohida beriladi — baza ularni o'zi xavfsiz joylaydi. Hech qachon so'rov matnini f-string bilan yig'mang.", "id": "w-py-db"}, {"t": "statement", "title": "SQL injection: eng keng tarqalgan xavf", "sub": "Agar foydalanuvchi kiritgan matn so'rovga to'g'ridan-to'g'ri qo'shilsa, u so'rovning ma'nosini o'zgartirib, ma'lumotni o'g'irlashi yoki o'chirishi mumkin. Himoya — faqat parametrlangan so'rovlar.", "accent": false, "id": "w-inject"}, {"t": "table", "title": "FastAPI loyihasining tuzilishi", "intro": null, "head": ["Fayl", "Vazifasi"], "rows": [["main.py", "Ilovani yaratadi va marshrutlarni ulaydi"], ["db.py", "Bazaga ulanish"], ["models.py", "Pydantic modellari: kiruvchi va chiquvchi ma'lumot"], ["routes/weighings.py", "Tortishlar bilan bog'liq API"], ["routes/reports.py", "Hisobotlar API"], ["static/", "Dashboard: HTML, JS, CSS"], [".env", "Baza manzili, API kalitlari"]], "id": "w-api-struct"}, {"t": "code", "title": "Yo'l va so'rov parametrlari", "lang": "python", "src": "from datetime import date\nfrom fastapi import FastAPI, HTTPException\n\napp = FastAPI()\n\n@app.get(\"/api/weighings/{wid}\")\ndef bitta(wid: str):\n    row = db_get(wid)\n    if row is None:\n        raise HTTPException(404, \"Tortish topilmadi\")\n    return row\n\n@app.get(\"/api/weighings\")\ndef royxat(kun: date | None = None, raqam: str | None = None,\n           limit: int = 50):\n    return db_list(kun=kun, raqam=raqam, limit=limit)", "side": null, "caption": null, "id": "w-params", "notes": "{wid} — yo'l ichidagi parametr. kun, raqam, limit — ?kun=2026-09-28&raqam=01A kabi so'rov parametrlari. FastAPI turlarni o'zi tekshiradi."}, {"t": "code", "title": "Kiruvchi ma'lumotni tekshirish", "lang": "python", "src": "from pydantic import BaseModel, Field\nfrom uuid import UUID\n\nclass TortishKirish(BaseModel):\n    id: UUID\n    scale: str = Field(min_length=1, max_length=20)\n    weight: int = Field(ge=0, le=100_000)\n    plate: str | None = Field(None, pattern=r\"^[0-9A-Z]{6,9}$\")", "side": ["<b>ge / le<\/b> — kamida va ko'pi bilan.", "<b>pattern<\/b> — raqam formati regex bilan.", "Mos kelmasa — FastAPI 422 xato va aniq sababini qaytaradi.", "Noto'g'ri ma'lumot bazaga yetib bormaydi."], "caption": null, "id": "w-validate"}, {"t": "code", "title": "API ni kalit bilan himoyalash", "lang": "python", "src": "import os\nfrom fastapi import Depends, Header, HTTPException\n\nAPI_KEY = os.getenv(\"API_KEY\")\n\ndef kalit_tekshir(x_api_key: str = Header()):\n    if x_api_key != API_KEY:\n        raise HTTPException(401, \"Kalit noto'g'ri\")\n\n@app.post(\"/api/weighings\", dependencies=[Depends(kalit_tekshir)])\ndef qoshish(t: TortishKirish):\n    ...", "side": null, "caption": "Shlyuz har bir so'rovga X-API-Key sarlavhasini qo'shadi. Kalitsiz yoki noto'g'ri kalit bilan kelgan so'rov bazaga yetib bormaydi.", "id": "w-auth"}, {"t": "code", "title": "Dashboardni server orqali berish", "lang": "python", "src": "from fastapi.staticfiles import StaticFiles\n\napp.mount(\"/\", StaticFiles(directory=\"static\", html=True),\n          name=\"static\")\n\n# static/index.html — http://server:8000/ da ochiladi\n# static/app.js, static/style.css — shu yerdan yuklanadi", "side": ["API va sahifa bitta serverda — sozlash oson.", "<b>html=True<\/b> — / manzilida index.html ochiladi.", "Bu qatorni barcha API marshrutlaridan keyin yozing."], "caption": null, "id": "w-static"}, {"t": "code", "title": "HTML: sahifaning skeleti", "lang": "html", "src": "\n\n\n\n  Tarozi paneli\n\n\n\n  Bugungi tortishlar\n  Jami: — kg\n\n\n\n", "side": ["<b>head<\/b> — sarlavha, kodlash, uslublar.", "<b>body<\/b> — ekranda ko'rinadigan qism.", "<b>id<\/b> — JavaScript elementni topishi uchun nom.", "Skript oxirida ulanadi: sahifa elementlari tayyor bo'ladi."], "caption": null, "id": "w-html"}, {"t": "code", "title": "JavaScript: API dan olib jadvalga chiqarish", "lang": "javascript", "src": "async function yukla() {\n  const data = await (await fetch(\"/api/weighings?limit=50\")).json();\n  let jami = 0;\n  const jadval = document.getElementById(\"jadval\");\n  jadval.innerHTML = \"VaqtRaqamNetto\";\n  for (const t of data) {\n    const netto = t.brutto - (t.tara || 0); jami += netto;\n    const row = jadval.insertRow();\n    row.insertCell().textContent = new Date(t.ts).toLocaleTimeString(\"uz\");\n    row.insertCell().textContent = t.plate || \"—\";\n    row.insertCell().textContent = netto;\n  }\n  document.getElementById(\"jami\").textContent = jami;\n}\nyukla();\nsetInterval(yukla, 30000);     // har 30 soniyada yangilash", "side": null, "caption": null, "id": "w-js"}, {"t": "code", "title": "Grafik: Chart.js bilan kunlik hajm", "lang": "html", "src": "\n\n\nfetch(\"/api/reports/daily?days=7\").then(r => r.json()).then(d => {\n  new Chart(document.getElementById(\"grafik\"), {\n    type: \"bar\",\n    data: {\n      labels: d.map(x => x.kun),\n      datasets: [{ label: \"Netto, kg\", data: d.map(x => x.jami) }]\n    }\n  });\n});\n", "side": null, "caption": "Server GROUP BY so'rovi natijasini qaytaradi, brauzer uni ustunli grafikka aylantiradi.", "id": "w-chart"}, {"t": "steps", "title": "Serverni ishchi holatga o'tkazish", "intro": null, "items": [["Xizmat", "uvicorn ni systemd yoki Windows xizmati sifatida ishga tushiring."], ["nginx", "Oldiga nginx qo'ying: u HTTPS, statik fayllar va WebSocket bilan ishlaydi."], ["HTTPS", "Sertifikat o'rnating — parol va kalitlar shifrlangan holda uzatiladi."], ["Firewall", "Faqat 443 (va ichki tarmoqda kerakli) portlarni oching."], ["Zaxira", "Baza har kuni pg_dump bilan saqlanadi."], ["Monitoring", "Xizmat to'xtasa — Telegramga xabar."]], "id": "w-deploy"}, {"t": "code", "title": "nginx: API va WebSocket uchun proksi", "lang": "nginx", "src": "server {\n    listen 443 ssl;\n    server_name tarozi.korxona.uz;\n    ssl_certificate     /etc/ssl/tarozi.crt;\n    ssl_certificate_key /etc/ssl/tarozi.key;\n\n    location / {\n        proxy_pass http://127.0.0.1:8000;\n        proxy_set_header Host $host;\n        proxy_set_header Upgrade $http_upgrade;       # WebSocket\n        proxy_set_header Connection \"upgrade\";\n    }\n}", "side": null, "caption": "Tashqaridan faqat nginx ko'rinadi; FastAPI esa faqat ichki manzilda (127.0.0.1) ishlaydi.", "id": "w-nginx"}, {"t": "code", "title": "Avtomatik testlar", "lang": "python", "src": "from fastapi.testclient import TestClient\nfrom main import app\n\nclient = TestClient(app)\nH = {\"X-API-Key\": \"test\"}\n\ndef test_kalitsiz_rad_etiladi():\n    r = client.post(\"/api/weighings\", json={})\n    assert r.status_code in (401, 422)\n\ndef test_manfiy_ogirlik():\n    r = client.post(\"/api/weighings\", headers=H, json={\n        \"id\": \"5f0c2a9e-7d1b-4c1e-9a55-2b8f6f1c3d10\",\n        \"scale\": \"S1\", \"weight\": -5})\n    assert r.status_code == 422", "side": null, "caption": null, "id": "w-test", "notes": "pytest buyrug'i barcha testlarni ishga tushiradi. Har o'zgarishdan keyin testlar o'tsa — hech narsa buzilmagan."}, {"t": "steps", "title": "Amaliy mashqlar", "intro": null, "items": [["F12", "Brauzerda Network yorlig'ini ochib, istalgan saytning so'rov va javoblarini ko'ring."], ["SQL", "weighings jadvalini yarating va 10 ta qator qo'shing."], ["Hisobot", "Har bir mashina bo'yicha kunlik yig'indi so'rovini yozing."], ["API", "Sana va raqam bo'yicha filtrlaydigan GET marshrut yozing."], ["Himoya", "API kalit tekshiruvini qo'shing va kalitsiz so'rovni sinang."], ["Dashboard", "Jadval va grafikli sahifa yarating."]], "id": "w-practice"}, {"t": "quiz", "q": "Server 422 kodi qaytardi. Bu nimani bildiradi?", "opts": ["Server ishlamayapti", "Yuborilgan ma'lumot tekshiruvdan o'tmadi", "Hammasi muvaffaqiyatli"], "a": 1, "expl": "4xx — klient xatosi. 422 da FastAPI qaysi maydon nima uchun noto'g'riligini javob tanasida aytadi.", "id": "w-q1"}, {"t": "quiz", "q": "Python dan SQL so'rovga foydalanuvchi kiritgan qiymatni qanday qo'shish to'g'ri?", "opts": ["f-string bilan matnga qo'shish", "Parametr (%s) sifatida alohida berish", "Matnni katta harfga o'girib qo'shish"], "a": 1, "expl": "Parametrlangan so'rov SQL injection'dan himoya qiladi.", "id": "w-q2"}, {"t": "quiz", "q": "UPDATE weighings SET tara = 0; — nima bo'ladi?", "opts": ["Faqat oxirgi qator o'zgaradi", "Jadvaldagi BARCHA qatorlarning tarasi 0 bo'ladi", "Xato beradi"], "a": 1, "expl": "WHERE bo'lmasa, o'zgarish butun jadvalga tegadi. Doim avval SELECT bilan tekshiring.", "id": "w-q3"}, {"t": "quiz", "q": "FastAPI da API larni brauzerdan sinash sahifasi qaysi?", "opts": ["/admin", "/docs", "/test"], "a": 1, "expl": "FastAPI /docs sahifasini avtomatik yaratadi: har bir endpoint, uning parametrlari va «Try it out» tugmasi bilan.", "id": "m4-q1"}, {"t": "quiz", "q": "Dashboard sahifani yangilamasdan yangi ma'lumot olishi uchun nima ishlatiladi?", "opts": ["WebSocket", "FTP", "Excel"], "a": 0, "expl": "WebSocket doimiy ochiq aloqa: server yangi ma'lumotni o'zi yuboradi.", "id": "m4-q2"}, {"t": "quiz", "id": "xq-m4-0", "q": "DELETE FROM weighings; (WHERE siz) nima qiladi?", "opts": ["Hech narsa", "Jadvaldagi barcha qatorlarni o'chiradi", "Xato beradi"], "a": 1, "expl": "Shuning uchun avval o'sha shart bilan SELECT qilib tekshiring."}, {"t": "quiz", "id": "xq-m4-1", "q": "FastAPI'da kelgan JSON ni avtomatik tekshiradigan narsa?", "opts": ["Pydantic modeli", "CSS", "cron"], "a": 0, "expl": "Model maydon turlari va cheklovlarini tekshiradi, xatoda 422 qaytaradi."}, {"t": "quiz", "id": "xq-m4-2", "q": "WebSocket nima uchun kerak?", "opts": ["Server yangi ma'lumotni o'zi yuboradi", "Fayllarni saqlash", "Parollarni shifrlash"], "a": 0, "expl": "Sahifa so'ramasa ham yangilanadi — jonli dashboard."}]}, {"id": "m5", "num": 5, "title": "1C asoslari: dasturchi nigohi bilan", "goal": "1C konfiguratsiyasi qanday tuzilgan, metama'lumot obyektlari va 1C tilida kod yozishni o'rganasiz.", "stages": [3], "vol": 1, "blocks": [{"t": "flow", "title": "1C uch qismdan iborat", "items": [["Settings", "Platforma", "1C:Предприятие 8.3 — dvigatel, hamma joyda bir xil"], ["Code", "Konfiguratsiya", "Dastur: Бухгалтерия, УТ, ERP yoki o'zingizniki"], ["Database", "Infobaza", "Ma'lumotlar: fayl yoki SQL serverda"]], "caption": "Bir platformada turli konfiguratsiyalar ishlaydi. Biz konfiguratsiyani o'zgartiramiz, platformani emas.", "id": "m5-arch"}, {"t": "compare", "title": "Ikki ish rejimi", "left": ["Konfigurator", ["Dasturchi rejimi", "Obyektlar, formalar, kod yaratiladi", "Baza nusxasi va yangilanish shu yerdan", "Kengaytmalar shu yerda yoziladi"]], "right": ["1C:Предприятие", ["Foydalanuvchi rejimi", "Hujjatlar kiritiladi, hisobotlar olinadi", "Konfiguratorda F5 bosib ochiladi", "O'zgarishlarni shu yerda sinab ko'rasiz"]], "id": "m5-modes"}, {"t": "table", "title": "Asosiy metama'lumot obyektlari", "intro": null, "head": ["Obyekt", "Ma'nosi", "Misol"], "rows": [["Справочник", "Ma'lumotnoma — ro'yxat", "Kontragentlar, Nomenklatura, Avtomobillar"], ["Документ", "Hujjat — sodir bo'lgan voqea", "Tortish, Kirim, Sotuv"], ["Регистр накопления", "Qoldiq va aylanmalar", "Ombordagi mahsulot qoldig'i"], ["Регистр сведений", "Vaqtga bog'liq ma'lumot", "Narxlar, valyuta kurslari"], ["Перечисление", "Qat'iy variantlar ro'yxati", "Tortish turi: Kirim yoki Chiqim"], ["Отчет", "Hisobot", "Kunlik tortishlar hisoboti"], ["HTTP-сервис", "Tashqi API", "Tarozidan ma'lumot qabul qilish"]], "id": "m5-meta"}, {"t": "cards", "title": "Ma'lumotnoma, hujjat va registr farqi", "intro": null, "items": [["Book", "Справочник: «kim, nima»", "Kamdan-kam o'zgaradigan ro'yxatlar: mashinalar, haydovchilar, mahsulotlar."], ["Activity", "Документ: «nima bo'ldi»", "Sanasi va raqami bor voqea. Har bir tortish — alohida hujjat."], ["Chart", "Регистр: «qancha bor»", "Hujjat o'tkazilganda qoldiqlar yoziladigan jadval. Hisobotlar shundan olinadi."]], "id": "m5-objs", "notes": "Oddiy qoida: agar narsaning sanasi bo'lsa va u bir marta sodir bo'lsa — bu hujjat. Agar u ro'yxatda doim turadigan bo'lsa — ma'lumotnoma. Agar sizga «qancha qoldi» kerak bo'lsa — registr."}, {"t": "statement", "title": "Endi 1C ni chuqur o'rganamiz: eng kichik tugmadan butun konfiguratsiyagacha", "sub": "Keyingi slaydlarda 1C ni o'rnatishdan boshlab, Konfigurator oynasi, konfiguratsiya daraxtidagi har bir bo'lim, har bir obyekt turi, formalar, modullar, rollar va yangilashni ketma-ket ko'rib chiqamiz.", "accent": true, "id": "c-intro"}, {"t": "term", "title": "Konfiguratsiya nima", "def": "Konfiguratsiya — 1C ichidagi dasturning o'zi: qanday ro'yxatlar, hujjatlar, hisobotlar, formalar va qoidalar borligining to'liq tavsifi.", "analogy": "Platforma — bo'sh bino (devor, elektr, suv). Konfiguratsiya — bino ichidagi jihozlar: qaysi xonada ombor, qaysida kassa. Bir xil binoni do'kon ham, zavod ham qilish mumkin.", "example": "«Бухгалтерия предприятия» — bitta konfiguratsiya, «Управление торговлей» — boshqasi. Ikkisi ham bir xil platformada ishlaydi. Biz o'zimizning «Tarozi hisobi» konfiguratsiyamizni ham yarata olamiz.", "id": "c-what"}, {"t": "table", "title": "Tayyor (tipik) konfiguratsiyalar", "intro": null, "head": ["Konfiguratsiya", "Kim uchun"], "rows": [["Бухгалтерия предприятия", "Buxgalteriya hisobi va soliq hisobotlari"], ["Управление торговлей", "Savdo, ombor, xaridlar, narxlar"], ["Зарплата и управление персоналом", "Xodimlar, ish haqi, kadrlar"], ["Комплексная автоматизация", "Savdo, ishlab chiqarish va moliya birga"], ["ERP Управление предприятием", "Katta korxonalar: to'liq ishlab chiqarish rejalash"], ["Управление нашей фирмой", "Kichik biznes uchun soddaroq yechim"], ["Розница", "Do'konlar va kassalar"]], "id": "c-products", "notes": "O'zbekistonda ko'pchilik korxonalar mahalliy qonunchilikka moslashtirilgan versiyalardan foydalanadi. Qaysi konfiguratsiya va qaysi versiya o'rnatilganini 1C da Справка → О программе menyusidan ko'rasiz."}, {"t": "steps", "title": "1C ni o'rganish uchun o'rnatish", "intro": null, "items": [["Yuklab oling", "1C ning rasmiy saytidan «Учебная версия» (o'quv versiyasi) — bepul."], ["O'rnating", "setup.exe ni ishga tushiring, komponentlarni standart holatda qoldiring."], ["Ishga tushiring", "Ish stolidagi «1С:Предприятие» belgisini bosing."], ["Yangi baza", "Ro'yxat bo'sh bo'lsa, dastur o'zi yangi baza yaratishni taklif qiladi."], ["Bo'sh konfiguratsiya", "«Создание информационной базы без конфигурации» — noldan o'rganish uchun."], ["Joyini tanlang", "Masalan: C:\\1C\\Tarozi. Nomi: «Tarozi hisobi»."]], "id": "c-install", "notes": "O'quv versiyasining ba'zi cheklovlari bor, lekin o'rganish va kichik loyihalarni sinash uchun yetarli. Ishchi korxonada litsenziyali versiya ishlatiladi."}, {"t": "visual", "title": "Ishga tushirish oynasi: nima nima", "html": "<section id=\"c-launcher\" style=\"width:1920px; height:1080px; position:relative; box-sizing:border-box; overflow:hidden; background:#F2F4F7; color:#14213D; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:64px; font-weight:600; line-height:1.15; color:#14213D\">Ishga tushirish oynasi: nima nima<\/h2><div style=\"display:flex; flex-direction:row; gap:48px; flex:1\"><div style=\"width:880px; background:#FBFCFD; border:2px solid #14213D; border-radius:12px; overflow:hidden; display:flex; flex-direction:column\"><div style=\"background:#14213D; padding:14px 24px\"><p style=\"font-size:24px; color:#F2F4F7\">Запуск 1С:Предприятия<\/p><\/div><div style=\"display:flex; flex-direction:row; flex:1\"><div style=\"flex:1; padding:24px; display:flex; flex-direction:column; gap:12px\"><p style=\"font-size:24px; background:#E8A317; color:#14213D; padding:8px 14px; border-radius:6px\">Tarozi hisobi<\/p><p style=\"font-size:24px; color:#3A475C; padding:8px 14px\">Бухгалтерия (nusxa)<\/p><p style=\"font-size:24px; color:#3A475C; padding:8px 14px\">Test baza<\/p><div style=\"flex:1\"><\/div><p style=\"font-size:24px; color:#56657A; padding:8px 14px\">File=\"C:\\1C\\Tarozi\";<\/p><\/div><div style=\"width:280px; border-left:1px solid #D5DBE3; padding:24px; display:flex; flex-direction:column; gap:14px\"><p style=\"font-size:24px; color:#14213D; border:1px solid #D5DBE3; border-radius:6px; padding:8px 14px; background:#F2F4F7\">1С:Предприятие<\/p><p style=\"font-size:24px; color:#14213D; border:1px solid #D5DBE3; border-radius:6px; padding:8px 14px; background:#F2F4F7\">Конфигуратор<\/p><p style=\"font-size:24px; color:#14213D; border:1px solid #D5DBE3; border-radius:6px; padding:8px 14px; background:#F2F4F7\">Добавить…<\/p><p style=\"font-size:24px; color:#14213D; border:1px solid #D5DBE3; border-radius:6px; padding:8px 14px; background:#F2F4F7\">Изменить…<\/p><p style=\"font-size:24px; color:#14213D; border:1px solid #D5DBE3; border-radius:6px; padding:8px 14px; background:#F2F4F7\">Удалить<\/p><\/div><\/div><\/div><div style=\"flex:1; display:flex; flex-direction:column; gap:24px\"><div style=\"border-left:6px solid #E8A317; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">Bazalar ro'yxati<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Kompyuterda ro'yxatga olingan barcha infobazalar. Pastda tanlangan bazaning joyi ko'rinadi.<\/p><\/div><div style=\"border-left:6px solid #3566C9; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">1С:Предприятие<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Oddiy foydalanuvchi rejimi: hujjat kiritish, hisobot olish.<\/p><\/div><div style=\"border-left:6px solid #3566C9; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">Конфигуратор<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Dasturchi rejimi: konfiguratsiyani o'zgartirish, baza nusxasi, foydalanuvchilar.<\/p><\/div><div style=\"border-left:6px solid #E8A317; padding-left:24px\"><h3 style=\"font-size:30px; font-weight:600\">Добавить<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Yangi baza yaratish yoki mavjud bazani ro'yxatga qo'shish.<\/p><\/div><\/div><\/div>\n<\/section>", "id": "c-launcher"}, {"t": "compare", "title": "Bazaning ikki xil ishlash usuli", "left": ["Fayl rejimi", ["Butun baza bitta 1Cv8.1CD faylida", "O'rnatish oson, server kerak emas", "Bir necha foydalanuvchi uchun yetarli", "O'rganish va kichik korxona uchun"]], "right": ["Klient-server rejimi", ["1C server + SQL server (PostgreSQL yoki MS SQL)", "Ko'p foydalanuvchi, katta hajm", "Ishonchliroq va tezroq", "O'rta va katta korxonalar uchun"]], "id": "c-fileserver", "notes": "Konfiguratsiya va kod ikki rejimda bir xil ishlaydi. Shuning uchun fayl rejimida o'rganib, keyin klient-server rejimga o'tish muammo emas."}, {"t": "visual", "title": "Konfigurator oynasining tuzilishi", "html": "<section id=\"c-window\" style=\"width:1920px; height:1080px; position:relative; box-sizing:border-box; overflow:hidden; background:#F2F4F7; color:#14213D; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:64px; font-weight:600; line-height:1.15; color:#14213D\">Konfigurator oynasining tuzilishi<\/h2><div style=\"position:absolute; left:128px; top:280px; width:1664px; height:70px; background:#FBFCFD; border:2px solid #14213D; border-radius:8px; padding:18px 22px; display:flex; flex-direction:column; gap:6px\"><p style=\"font-size:24px; font-weight:700; color:#14213D\">1. Menyu va asboblar paneli<\/p><\/div><div style=\"position:absolute; left:128px; top:366px; width:480px; height:420px; background:#FBFCFD; border:2px solid #E8A317; border-radius:8px; padding:18px 22px; display:flex; flex-direction:column; gap:6px\"><p style=\"font-size:24px; font-weight:700; color:#14213D\">2. Konfiguratsiya daraxti<\/p><p style=\"font-size:24px; line-height:1.35; color:#3A475C\">Barcha obyektlar ro'yxati: ma'lumotnomalar, hujjatlar, registrlar…<\/p><\/div><div style=\"position:absolute; left:624px; top:366px; width:720px; height:300px; background:#FBFCFD; border:2px solid #3566C9; border-radius:8px; padding:18px 22px; display:flex; flex-direction:column; gap:6px\"><p style=\"font-size:24px; font-weight:700; color:#14213D\">3. Ish maydoni<\/p><p style=\"font-size:24px; line-height:1.35; color:#3A475C\">Modul (kod) muharriri, forma muharriri yoki obyekt tahrirlash oynasi shu yerda ochiladi.<\/p><\/div><div style=\"position:absolute; left:1360px; top:366px; width:432px; height:420px; background:#FBFCFD; border:2px solid #E8A317; border-radius:8px; padding:18px 22px; display:flex; flex-direction:column; gap:6px\"><p style=\"font-size:24px; font-weight:700; color:#14213D\">4. Xususiyatlar palitrasi<\/p><p style=\"font-size:24px; line-height:1.35; color:#3A475C\">Tanlangan obyektning nomi, sinonimi, turi va boshqa sozlamalari.<\/p><\/div><div style=\"position:absolute; left:624px; top:682px; width:720px; height:104px; background:#FBFCFD; border:2px solid #3566C9; border-radius:8px; padding:18px 22px; display:flex; flex-direction:column; gap:6px\"><p style=\"font-size:24px; font-weight:700; color:#14213D\">5. Xabarlar oynasi<\/p><p style=\"font-size:24px; line-height:1.35; color:#3A475C\">Xatolar va tekshiruv natijalari.<\/p><\/div>\n<\/section>", "id": "c-window", "notes": "Konfiguratsiya daraxti ko'rinmasa: Конфигурация → Открыть конфигурацию. Xususiyatlar palitrasi: obyekt ustida o'ng tugma → Свойства yoki Alt+Enter."}, {"t": "compare", "title": "Muhim: bitta bazada ikkita konfiguratsiya bor", "left": ["Asosiy konfiguratsiya", ["Siz Konfiguratorda tahrirlayotgan nusxa", "O'zgarishlar hali foydalanuvchilarga ko'rinmaydi", "Сохранить (Ctrl+S) — faqat shu yerga saqlaydi", "Xato qilsangiz, foydalanuvchilarga ta'sir qilmaydi"]], "right": ["Baza konfiguratsiyasi", ["Foydalanuvchilar ishlayotgan haqiqiy versiya", "F7 — «Обновить конфигурацию базы данных»", "Shu paytda o'zgarishlar kuchga kiradi", "Jadvallar tuzilishi ham o'zgaradi"]], "id": "c-twoconf", "notes": "Yangi boshlovchilar eng ko'p shu yerda adashadi: kodni o'zgartirib, saqlab, lekin F7 bosmasdan foydalanuvchi rejimida natijani kutishadi. Qoida: o'zgartirdingizmi — F7, keyin F5 bilan sinab ko'ring."}, {"t": "table", "title": "Konfiguratsiya daraxti: asosiy bo'limlar (1)", "intro": null, "head": ["Bo'lim", "Nima saqlanadi", "Misol"], "rows": [["Общие", "Umumiy sozlamalar va vositalar", "Rollar, umumiy modullar"], ["Константы", "Bitta qiymatli sozlamalar", "Korxona nomi, asosiy valyuta"], ["Справочники", "Ro'yxatlar", "Mashinalar, mahsulotlar"], ["Документы", "Sodir bo'lgan voqealar", "Tortish, kirim, sotuv"], ["Журналы документов", "Bir nechta hujjat turini bitta ro'yxatda ko'rish", "Barcha ombor hujjatlari"], ["Перечисления", "O'zgarmas variantlar", "Kirim / Chiqim"], ["Отчеты", "Hisobotlar", "Kunlik tortishlar"], ["Обработки", "Xizmat vositalari", "Ma'lumot yuklash"]], "id": "c-tree1"}, {"t": "table", "title": "Konfiguratsiya daraxti: asosiy bo'limlar (2)", "intro": null, "head": ["Bo'lim", "Nima saqlanadi"], "rows": [["Планы видов характеристик", "Qo'shimcha xususiyatlar turlari (rang, o'lcham…)"], ["Планы счетов", "Buxgalteriya schyotlari rejasi"], ["Планы видов расчета", "Ish haqi hisoblash turlari"], ["Регистры сведений", "Vaqtga bog'liq ma'lumotlar: narxlar, kurslar"], ["Регистры накопления", "Qoldiq va aylanmalar: ombor, pul"], ["Регистры бухгалтерии", "Buxgalteriya provodkalari"], ["Регистры расчета", "Ish haqi hisob-kitoblari"], ["Бизнес-процессы, Задачи", "Kelishuv jarayonlari va topshiriqlar"], ["Внешние источники данных", "Boshqa bazalarga to'g'ridan-to'g'ri ulanish"]], "id": "c-tree2"}, {"t": "table", "title": "«Общие» bo'limi ichida nimalar bor (1)", "intro": null, "head": ["Element", "Vazifasi"], "rows": [["Подсистемы", "Dastur bo'limlari: «Ombor», «Tarozi», «Hisobotlar» — menyu tuzilishi"], ["Общие модули", "Hamma joydan chaqiriladigan umumiy kod"], ["Параметры сеанса", "Foydalanuvchi ishlayotgan paytdagi qiymatlar: joriy foydalanuvchi"], ["Роли", "Huquqlar to'plami: kim nimani ko'ra va o'zgartira oladi"], ["Общие реквизиты", "Ko'p obyektga birdan qo'shiladigan maydon: masalan «Tashkilot»"], ["Планы обмена", "Filiallar va bazalar orasida ma'lumot almashuvi"], ["Подписки на события", "Ko'p obyektning bir hodisasiga bitta kod ulash"], ["Регламентные задания", "Jadval bo'yicha avtomatik ishlaydigan vazifalar"]], "id": "c-common1"}, {"t": "table", "title": "«Общие» bo'limi ichida nimalar bor (2)", "intro": null, "head": ["Element", "Vazifasi"], "rows": [["Функциональные опции", "Funksiyani yoqish yoki o'chirish kaliti (masalan, «Valyuta hisobi»)"], ["Определяемые типы", "Bir joyda belgilanadigan va ko'p joyda ishlatiladigan tur"], ["Общие формы", "Biror obyektga bog'lanmagan oynalar"], ["Общие команды", "Menyu va panellardagi umumiy tugmalar"], ["Общие макеты, картинки", "Chop etish shablonlari va belgilar"], ["HTTP-сервисы, Web-сервисы", "Tashqi dasturlar uchun API (6-modulda)"], ["XDTO-пакеты, WS-ссылки", "XML almashuv sxemalari va tashqi SOAP servislar"], ["Стили, Языки", "Ko'rinish va interfeys tillari"]], "id": "c-common2"}, {"t": "cards", "title": "Umumiy modul bayroqlari: kod qayerda ishlaydi", "intro": null, "items": [["Globe", "Сервер", "Kod 1C serverida ishlaydi. So'rovlar va bazaga yozish uchun."], ["Users", "Клиент", "Foydalanuvchi kompyuterida: oynalar, savollar, xabarlar."], ["Link", "Вызов сервера", "Klientdan serverdagi funksiyani chaqirishga ruxsat beradi."], ["Lock", "Привилегированный", "Foydalanuvchi huquqlarini tekshirmasdan bajariladi. Ehtiyot bo'ling."], ["Star", "Глобальный", "Funksiyalarni modul nomisiz chaqirish mumkin. Kam ishlating."], ["Clock", "Повторное использование", "Natijani eslab qoladi: bir xil so'rov qayta hisoblanmaydi."]], "id": "c-modules-common", "notes": "Odatiy tuzilma: зав_ИнтеграцияСервер (Сервер) — tarmoq va baza bilan ish; зав_ИнтеграцияВызовСервера (Сервер + Вызов сервера) — formalardan chaqirish uchun; зав_ИнтеграцияКлиент (Клиент) — oynalar va xabarlar."}, {"t": "visual", "title": "Har bir obyekt ichida nima bor", "html": "<section id=\"c-anatomy\" style=\"width:1920px; height:1080px; position:relative; box-sizing:border-box; overflow:hidden; background:#F2F4F7; color:#14213D; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:64px; font-weight:600; line-height:1.15; color:#14213D\">Har bir obyekt ichida nima bor<\/h2><div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:24px; flex:1\"><div style=\"background:#FBFCFD; border:1px solid #D5DBE3; border-left:8px solid #E8A317; border-radius:12px; padding:28px; display:flex; flex-direction:column; gap:10px\"><h3 style=\"font-size:30px; font-weight:600; color:#14213D\">Реквизиты<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Maydonlar: har bir yozuvda bitta qiymat. Masalan: GosNomer, VesBrutto.<\/p><\/div><div style=\"background:#FBFCFD; border:1px solid #D5DBE3; border-left:8px solid #E8A317; border-radius:12px; padding:28px; display:flex; flex-direction:column; gap:10px\"><h3 style=\"font-size:30px; font-weight:600; color:#14213D\">Табличные части<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Obyekt ichidagi jadval: bir hujjatda ko'p qator mahsulot.<\/p><\/div><div style=\"background:#FBFCFD; border:1px solid #D5DBE3; border-left:8px solid #3566C9; border-radius:12px; padding:28px; display:flex; flex-direction:column; gap:10px\"><h3 style=\"font-size:30px; font-weight:600; color:#14213D\">Формы<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Foydalanuvchi ko'radigan oynalar: element formasi, ro'yxat formasi.<\/p><\/div><div style=\"background:#FBFCFD; border:1px solid #D5DBE3; border-left:8px solid #3566C9; border-radius:12px; padding:28px; display:flex; flex-direction:column; gap:10px\"><h3 style=\"font-size:30px; font-weight:600; color:#14213D\">Команды<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Obyektga tegishli tugmalar: «Tarozidan olish», «Chop etish».<\/p><\/div><div style=\"background:#FBFCFD; border:1px solid #D5DBE3; border-left:8px solid #E8A317; border-radius:12px; padding:28px; display:flex; flex-direction:column; gap:10px\"><h3 style=\"font-size:30px; font-weight:600; color:#14213D\">Макеты<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Chop etish shablonlari: nakladnoy, dalolatnoma.<\/p><\/div><div style=\"background:#FBFCFD; border:1px solid #D5DBE3; border-left:8px solid #3566C9; border-radius:12px; padding:28px; display:flex; flex-direction:column; gap:10px\"><h3 style=\"font-size:30px; font-weight:600; color:#14213D\">Модули<\/h3><p style=\"font-size:24px; line-height:1.4; color:#3A475C\">Kod: obyekt moduli (yozish, o'tkazish) va menejer moduli.<\/p><\/div><\/div><p style=\"font-size:30px; line-height:1.4; color:#3A475C; \">Ma'lumotnoma, hujjat, registr — hammasi shu «g'ishtlardan» yig'iladi. Bir obyektni o'rgansangiz, qolganlari ham tanish bo'ladi.<\/p>\n<\/section>", "id": "c-anatomy", "notes": "Obyektni ikki marta bosganingizda ochiladigan oynaning chap tomonida xuddi shu bo'limlar yorliq sifatida turadi: Основные, Подсистемы, Функциональные опции, Данные, Нумерация, Формы, Команды, Макеты, Прочее."}, {"t": "table", "title": "1C dagi ma'lumot turlari", "intro": null, "head": ["Tur", "Nima saqlaydi", "Sozlamasi"], "rows": [["Строка", "Matn", "Uzunligi: masalan 15 belgi"], ["Число", "Son", "Uzunlik va kasr: 10,3 — 3 kasr xonasi"], ["Дата", "Sana va/yoki vaqt", "Faqat sana, faqat vaqt yoki ikkalasi"], ["Булево", "Ha / yo'q", "—"], ["СправочникСсылка.X", "Ma'lumotnomadagi yozuvga havola", "Masalan: Avtomobillar"], ["ДокументСсылка.X", "Hujjatga havola", "Masalan: Tortish"], ["ПеречислениеСсылка.X", "Variantlardan biri", "Masalan: Kirim yoki Chiqim"], ["Составной тип", "Bir nechta turdan biri", "Kontragent yoki Xodim"]], "id": "c-types", "notes": "Havola (ссылка) turi 1C ning eng kuchli tomoni: hujjatda mashina raqamini matn bilan yozmaysiz, balki «Avtomobillar» ma'lumotnomasidagi yozuvni tanlaysiz. Shunda nomi o'zgarsa, barcha hujjatlarda avtomatik yangilanadi."}, {"t": "term", "title": "Справочник (ma'lumotnoma)", "def": "Kamdan-kam o'zgaradigan narsalar ro'yxati. Har bir yozuvning kodi va nomi bor, boshqa obyektlar unga havola qiladi.", "analogy": "Telefon kitobchasi: har bir odam bir marta yoziladi, keyin qo'ng'iroq qilganda faqat tanlaysiz — raqamni qayta yozmaysiz.", "example": "Avtomobillar, Haydovchilar, Kontragentlar, Nomenklatura, Omborlar, Tarozilar — tarozi tizimidagi asosiy ma'lumotnomalar.", "id": "c-cat"}, {"t": "table", "title": "Ma'lumotnoma xususiyatlari", "intro": null, "head": ["Xususiyat", "Ma'nosi", "Tavsiya"], "rows": [["Длина кода", "Kod necha belgi", "9 yoki 11"], ["Тип кода", "Kod son yoki matn", "Строка — prefiks qo'shish uchun"], ["Длина наименования", "Nom necha belgi", "100–150"], ["Автонумерация", "Kod avtomatik beriladi", "Yoqilgan"], ["Иерархический", "Guruhlarga bo'lish mumkinmi", "Nomenklatura uchun ha"], ["Владельцы", "Qaysi ma'lumotnomaga bo'ysunadi", "Shartnoma → Kontragent"], ["Основное представление", "Ro'yxatda kod yoki nom ko'rinadi", "В виде наименования"]], "id": "c-cat-props"}, {"t": "cards", "title": "Ma'lumotnomaning standart maydonlari", "intro": null, "items": [["Key", "Ссылка", "Yozuvning noyob kaliti. Hech qachon o'zgarmaydi."], ["Book", "Код va Наименование", "Qisqa kod va to'liq nom: 000000001, «Kamaz 01A123BC»."], ["Warning", "ПометкаУдаления", "O'chirish belgisi. Yozuv darhol o'chmaydi, faqat belgilanadi."], ["Home", "Родитель", "Qaysi guruhda turibdi (ierarxik ma'lumotnomada)."], ["Link", "Владелец", "Egasi: masalan, shartnomaning kontragenti."], ["Star", "Предопределенный", "Konfiguratsiyada oldindan yaratilgan, o'chirib bo'lmaydigan yozuv."]], "id": "c-cat-std", "notes": "Bu maydonlarni o'zingiz yaratmaysiz — platforma har bir ma'lumotnomaga avtomatik qo'shadi. Ular Данные yorlig'idagi «Стандартные реквизиты» tugmasi ostida ko'rinadi."}, {"t": "compare", "title": "Ierarxiyaning ikki turi", "left": ["Guruhlar va elementlar", ["Papka va fayl kabi", "«Yuk mashinalari» — guruh", "«Kamaz 01A123BC» — element", "Guruhning o'z maydonlari kamroq"]], "right": ["Elementlar ierarxiyasi", ["Har bir element boshqasining «otasi» bo'la oladi", "«Bosh ombor» → «1-sex ombori»", "Hamma yozuv teng huquqli", "Tashkiliy tuzilma uchun qulay"]], "id": "c-cat-hier"}, {"t": "steps", "title": "Amaliyot: «Автомобили» ma'lumotnomasini yaratish", "intro": null, "items": [["Qo'shing", "Справочники → o'ng tugma → Добавить. Имя: Автомобили, Синоним: Avtomobillar."], ["Kod va nom", "Данные: Длина кода 9, Длина наименования 50."], ["Rekvizit: ГосНомер", "Строка, 15 belgi. Проверка заполнения: Выдавать ошибку."], ["Rekvizit: Тара", "Число 10,0 — bo'sh mashina og'irligi."], ["Rekvizit: Владелец", "СправочникСсылка.Контрагенты — mashina egasi."], ["Formalar", "Формы → yangi element va ro'yxat formalari (konstruktor)."], ["Menyuga qo'shing", "Подсистемы yorlig'ida «Tarozi» bo'limini belgilang."], ["Yangilang va sinang", "F7, keyin F5: 2–3 ta mashina kiriting."]], "id": "c-cat-build"}, {"t": "term", "title": "Документ (hujjat)", "def": "Aniq sana va vaqtda sodir bo'lgan xo'jalik voqeasi. Raqami, sanasi bor va «o'tkazilganda» qoldiqlarni o'zgartiradi.", "analogy": "Do'kondagi chek: qachon, nima, qancha sotilgani yozilgan. Chek berilgandan keyin do'kon qoldig'i kamayadi.", "example": "Tortish, Xomashyo kirimi, Mahsulot jo'natish, Ombordan omborga ko'chirish — har biri alohida hujjat turi.", "id": "c-doc"}, {"t": "table", "title": "Hujjat xususiyatlari", "intro": null, "head": ["Xususiyat", "Ma'nosi"], "rows": [["Длина и тип номера", "Raqam necha belgi, son yoki matn"], ["Периодичность номера", "Raqamlash qachon 1 dan boshlanadi: yil, oy, kun yoki hech qachon"], ["Автонумерация", "Raqam avtomatik beriladi"], ["Проведение", "Hujjat o'tkazilishi mumkinmi (Разрешить / Запретить)"], ["Движения", "O'tkazilganda qaysi registrlarga yozadi"], ["Оперативное проведение", "Hozirgi vaqtda o'tkazishda qoldiqni darhol tekshirish"], ["Удаление движений", "O'tkazish bekor qilinganda yozuvlar o'chadimi"]], "id": "c-doc-props"}, {"t": "compare", "title": "Yozish (Записать) va o'tkazish (Провести)", "left": ["Записать", ["Hujjat bazaga saqlanadi", "Qoldiqlar o'zgarmaydi", "Qoralama kabi", "Belgisi: oddiy hujjat belgisi"]], "right": ["Провести", ["Saqlanadi va registrlarga yoziladi", "Ombor qoldig'i, pul o'zgaradi", "Hisobotlarda aks etadi", "Belgisi: yashil belgili hujjat"]], "id": "c-doc-post", "notes": "O'tkazilgan hujjatni o'zgartirsangiz, 1C uni qayta o'tkazadi: eski yozuvlarni o'chirib, yangilarini yozadi. «Отмена проведения» hujjatni qoralama holatiga qaytaradi."}, {"t": "cards", "title": "Табличная часть: hujjat ichidagi jadval", "intro": null, "items": [["Book", "Nima uchun", "Bitta kirim hujjatida o'nlab mahsulot bo'lishi mumkin. Har biri — jadvalning bitta qatori."], ["Settings", "Ustunlar", "Nomenklatura, Miqdor, Narx, Summa. Har biri o'z turiga ega."], ["Wrench", "Hisoblash", "Miqdor yoki Narx o'zgarganda Summani formadagi kod hisoblaydi."]], "id": "c-tabpart"}, {"t": "code", "title": "Hujjatni o'tkazish: registrga yozish", "lang": "1C", "src": "Процедура ОбработкаПроведения(Отказ, РежимПроведения)\n    Движения.ОстаткиТоваров.Записывать = Истина;\n    Для Каждого Стр Из Товары Цикл\n        Дв = Движения.ОстаткиТоваров.Добавить();\n        Дв.ВидДвижения  = ВидДвиженияНакопления.Приход;\n        Дв.Период       = Дата;\n        Дв.Склад        = Склад;\n        Дв.Номенклатура = Стр.Номенклатура;\n        Дв.Количество   = Стр.Количество;\n    КонецЦикла;\nКонецПроцедуры", "side": ["<b>ОбработкаПроведения<\/b> — «Провести» bosilganda ishlaydi.", "<b>Движения<\/b> — hujjat registrga yozadigan qatorlar.", "Jadvalning har bir qatori uchun registrga bitta kirim (Приход) yozuvi.", "Chiqim hujjatida — Расход."], "caption": null, "id": "c-post-code"}, {"t": "term", "title": "Регистр накопления", "def": "Kirim va chiqimlarni yig'ib boradigan jadval. Istalgan sanaga «qancha bor» va «qancha aylandi» degan savolga bir zumda javob beradi.", "analogy": "Hamyon: pul tushganda plyus, sarflaganda minus. Istalgan kuni hamyonni ochib qoldiqni ko'rish mumkin.", "example": "«Ombordagi qoldiq» registri: kirim hujjati plyus, jo'natish minus yozadi. Hisobot «bugun 1-omborda qancha bug'doy bor» ni ko'rsatadi.", "id": "c-reg"}, {"t": "cards", "title": "Registr tuzilishi: uch xil ustun", "intro": null, "items": [["Search", "Измерения (o'lchovlar)", "Nima bo'yicha hisoblaymiz: Ombor, Nomenklatura. «Qayerda va nima»."], ["Chart", "Ресурсы (resurslar)", "Nimani hisoblaymiz: Miqdor, Summa. Faqat sonlar, qo'shiladi va ayiriladi."], ["Book", "Реквизиты", "Qo'shimcha ma'lumot: izoh. Qoldiq hisobiga ta'sir qilmaydi."]], "id": "c-reg-parts", "notes": "Qo'shimcha ravishda har bir yozuvda avtomatik maydonlar bor: Период (sana), Регистратор (qaysi hujjat yozgani), ВидДвижения (Приход yoki Расход)."}, {"t": "compare", "title": "Registr turlari: Остатки va Обороты", "left": ["Остатки (qoldiqlar)", ["«Qancha qoldi?» savoliga javob", "Kirim va chiqim bor", "Ombor, qarzlar, kassa", "Eng ko'p ishlatiladigan tur"]], "right": ["Обороты (aylanmalar)", ["«Qancha bo'ldi?» savoliga javob", "Faqat yig'indi, qoldiq yo'q", "Sotuvlar, tortishlar hajmi", "Tahlil hisobotlari uchun"]], "id": "c-reg-kinds"}, {"t": "code", "title": "Registrdan qoldiqni o'qish", "lang": "1C", "src": "Запрос = Новый Запрос(\n\"ВЫБРАТЬ\n|    Ост.Номенклатура,\n|    Ост.КоличествоОстаток КАК Количество\n|ИЗ\n|    РегистрНакопления.ОстаткиТоваров.Остатки(\n|        &НаДату, Склад = &Склад) КАК Ост\");\nЗапрос.УстановитьПараметр(\"НаДату\", ТекущаяДатаСеанса());\nЗапрос.УстановитьПараметр(\"Склад\", Склад);\nВыборка = Запрос.Выполнить().Выбрать();", "side": ["<b>.Остатки(…)<\/b> — registrning virtual jadvali: tayyor qoldiqlar.", "Birinchi parametr — qaysi sanaga.", "Ikkinchisi — shart: faqat bitta ombor.", "<b>КоличествоОстаток<\/b> — resurs nomi + «Остаток»."], "caption": null, "id": "c-reg-query"}, {"t": "term", "title": "Регистр сведений", "def": "Vaqt o'tishi bilan o'zgaradigan ma'lumotlar jurnali. Kirim-chiqim emas, balki «shu sanadan boshlab qiymat shunday» degan yozuvlar.", "analogy": "Narxlar taxtasi: «1-sentyabrdan non 5000 so'm, 15-sentyabrdan 5500 so'm». Kerakli sanadagi narxni topasiz.", "example": "Mahsulot narxlari, valyuta kurslari, mashinaning oxirgi tortilgan tarasi, xodimning lavozimi.", "id": "c-infreg"}, {"t": "table", "title": "Регистр сведений sozlamalari", "intro": null, "head": ["Sozlama", "Variantlar", "Ma'nosi"], "rows": [["Периодичность", "Непериодический", "Sana yo'q: oddiy sozlama jadvali"], ["", "В пределах дня / месяца…", "Tarixi saqlanadi: har kunga bitta qiymat"], ["Режим записи", "Независимый", "Foydalanuvchi yoki kod to'g'ridan-to'g'ri yozadi"], ["", "Подчинение регистратору", "Faqat hujjat o'tkazilganda yoziladi"], ["Virtual jadval", "СрезПоследних", "Berilgan sanadagi eng oxirgi qiymat"], ["Virtual jadval", "СрезПервых", "Berilgan sanadan keyingi birinchi qiymat"]], "id": "c-infreg-props"}, {"t": "cards", "title": "Kichik, lekin foydali obyektlar", "intro": null, "items": [["Settings", "Константы", "Butun bazada bitta qiymat: korxona nomi, tarozi server manzili, Telegram tokeni."], ["Check", "Перечисления", "Qat'iy variantlar: Tortish turi (Kirim, Chiqim), Holat (Yangi, Tasdiqlangan)."], ["Book", "Журналы документов", "Turli hujjatlarni bitta ro'yxatda ko'rish: «Barcha ombor hujjatlari»."]], "id": "c-small-objs", "notes": "Konstantani kodda o'qish: Константы.АдресСервераВесов.Получить(). Yozish: Константы.АдресСервераВесов.Установить(\"http://...\")."}, {"t": "cards", "title": "Murakkab obyektlar: qachon kerak bo'ladi", "intro": null, "items": [["Chart", "Планы счетов va Регистры бухгалтерии", "Buxgalteriya: debet-kredit provodkalar. Tipik Бухгалтерия da tayyor."], ["Users", "Планы видов расчета va Регистры расчета", "Ish haqi: oklad, premiya, ushlanmalar."], ["Tool", "Планы видов характеристик", "Foydalanuvchi o'zi qo'shadigan xususiyatlar: rang, o'lcham, sort."], ["Activity", "Бизнес-процессы va Задачи", "Kelishuv yo'li: hujjat → bo'lim boshlig'i → direktor."], ["Link", "Планы обмена", "Filial va markaz bazalari o'rtasida ma'lumot almashuvi."], ["Database", "Внешние источники данных", "Boshqa SQL bazadan to'g'ridan-to'g'ri o'qish."]], "id": "c-adv-objs"}, {"t": "term", "title": "Отчет va СКД", "def": "Hisobot — bazadagi ma'lumotni jadval yoki diagramma ko'rinishida chiqaradi. СКД (Система компоновки данных) — hisobotni kod yozmasdan yig'ish vositasi.", "analogy": "Konstruktor o'yinchoq: detallarni (so'rov, guruhlash, filtr) tanlab joylaysiz — tayyor hisobot chiqadi.", "example": "«Kunlik tortishlar» hisoboti: sana, mashina, kontragent bo'yicha guruhlangan, jami og'irlik bilan. Foydalanuvchi filtrni o'zi o'zgartira oladi.", "id": "c-report"}, {"t": "steps", "title": "СКД hisobotini yaratish", "intro": null, "items": [["Hisobot qo'shing", "Отчеты → Добавить → «Открыть схему компоновки данных»."], ["Ma'lumotlar to'plami", "Набор данных — запрос: konstruktor bilan so'rov yozing."], ["Resurslar", "Ресурсы yorlig'i: Вес — Сумма (jami)."], ["Parametrlar", "Период: boshlanish va tugash sanasi."], ["Sozlamalar", "Настройки: «Группировка» — Kontragent, keyin Mashina."], ["Sinab ko'ring", "F7, F5, hisobotni ochib «Сформировать»."]], "id": "c-report-build"}, {"t": "cards", "title": "Boshqariladigan forma muharriri: 3 ta asosiy yorliq", "intro": null, "items": [["Settings", "Элементы", "Oynada ko'rinadigan narsalar: maydonlar, jadvallar, guruhlar, tugmalar. Daraxt ko'rinishida joylashadi."], ["Database", "Реквизиты", "Forma ma'lumotlari: asosiysi «Объект» — ochilgan hujjat yoki ma'lumotnoma yozuvi."], ["Play", "Команды", "Forma buyruqlari: har biri bitta protsedura bilan bog'lanadi."]], "id": "c-forms", "notes": "Forma muharririning yuqori chap qismi — elementlar daraxti, yuqori o'ng qismi — rekvizitlar va buyruqlar, pastda — formaning jonli ko'rinishi va modul yorlig'i."}, {"t": "table", "title": "Forma elementlari", "intro": null, "head": ["Element", "Nima uchun"], "rows": [["Поле ввода", "Matn, son, sana kiritish yoki ma'lumotnomadan tanlash"], ["Поле флажка", "Ha / yo'q belgisi"], ["Таблица", "Jadval qism yoki ro'yxat"], ["Группа", "Elementlarni gorizontal, vertikal yoki sahifalarga guruhlash"], ["Кнопка", "Buyruqni ishga tushiradi"], ["Декорация", "Yozuv yoki rasm: tushuntirish uchun"], ["Поле картинки", "Rasm ko'rsatish: masalan, tortish surati"]], "id": "c-form-elems"}, {"t": "table", "title": "Eng ko'p ishlatiladigan hodisalar", "intro": null, "head": ["Hodisa", "Qayerda", "Qachon ishlaydi"], "rows": [["ПриСозданииНаСервере", "Forma", "Forma ochilishidan oldin, serverda"], ["ПриОткрытии", "Forma", "Oyna ekranda paydo bo'lganda"], ["ПриИзменении", "Forma elementi", "Foydalanuvchi maydonni o'zgartirganda"], ["ОбработкаЗаполнения", "Obyekt moduli", "Yangi obyekt to'ldirilganda"], ["ОбработкаПроверкиЗаполнения", "Obyekt moduli", "Yozishdan oldin majburiy maydonlar tekshiruvi"], ["ПередЗаписью", "Obyekt moduli", "Bazaga yozishdan oldin"], ["ПриЗаписи", "Obyekt moduli", "Yozilgandan keyin, tranzaksiya ichida"], ["ОбработкаПроведения", "Hujjat moduli", "O'tkazish paytida"]], "id": "c-events"}, {"t": "code", "title": "Formada: miqdor o'zgarsa, summani qayta hisoblash", "lang": "1C", "src": "&НаКлиенте\nПроцедура ТоварыКоличествоПриИзменении(Элемент)\n    Стр = Элементы.Товары.ТекущиеДанные;\n    Стр.Сумма = Стр.Количество * Стр.Цена;\nКонецПроцедуры\n\n&НаКлиенте\nПроцедура ТоварыЦенаПриИзменении(Элемент)\n    Стр = Элементы.Товары.ТекущиеДанные;\n    Стр.Сумма = Стр.Количество * Стр.Цена;\nКонецПроцедуры", "side": ["Protsedura nomi = element nomi + hodisa nomi.", "Element xususiyatlarida «ПриИзменении» qatoridagi lupani bossangiz, 1C bo'sh protsedurani o'zi yaratadi.", "<b>ТекущиеДанные<\/b> — jadvalda tanlangan qator."], "caption": null, "id": "c-onchange"}, {"t": "table", "title": "1C dagi modul turlari", "intro": null, "head": ["Modul", "Qayerda", "Nima yoziladi"], "rows": [["Модуль сеанса", "Konfiguratsiya ildizi", "Foydalanuvchi kirganda: parametrlarni o'rnatish"], ["Модуль управляемого приложения", "Konfiguratsiya ildizi", "Dastur ochilganda va yopilganda (klient)"], ["Общий модуль", "Общие → Общие модули", "Qayta ishlatiladigan funksiyalar"], ["Модуль объекта", "Har bir obyekt", "Yozish, tekshirish, o'tkazish"], ["Модуль менеджера", "Har bir obyekt", "Obyekt turi uchun umumiy funksiyalar"], ["Модуль формы", "Har bir forma", "Oyna hodisalari va tugmalar"], ["Модуль команды", "Umumiy buyruqlar", "Buyruq bosilganda"]], "id": "c-modules"}, {"t": "cards", "title": "Rollar: kim nimani qila oladi", "intro": null, "items": [["Lock", "Rol nima", "Huquqlar to'plami. Masalan, «Tarozi operatori»: tortishni ko'radi va yaratadi, lekin o'chira olmaydi."], ["Check", "Asosiy huquqlar", "Чтение, Добавление, Изменение, Удаление, Проведение, Просмотр, Редактирование."], ["Users", "Foydalanuvchiga berish", "Администрирование → Пользователи → foydalanuvchi → «Прочие» yorlig'ida rollarni belgilang."], ["Verified", "Asosiy qoida", "Har kimga faqat ishi uchun kerakli minimal huquq. To'liq huquq — faqat administratorga."]], "id": "c-roles", "notes": "Qatorlar darajasidagi cheklov (RLS) — masalan, operator faqat o'z tarozisining tortishlarini ko'rishi — ham rollarda sozlanadi. Bu ilg'or mavzu, kursning keyingi qismida alohida ko'rib chiqamiz."}, {"t": "cards", "title": "Подсистемы: dastur menyusini qurish", "intro": null, "items": [["Home", "Bo'limlar", "Har bir kichik tizim yuqori panelda bo'lim bo'lib chiqadi: Tarozi, Ombor, Hisobotlar."], ["Settings", "Tarkib", "Obyektning «Подсистемы» yorlig'ida qaysi bo'limga kirishini belgilaysiz."], ["Star", "Buyruq interfeysi", "Bo'lim ichida nima va qaysi tartibda ko'rinishi: kichik tizim ustida o'ng tugma → Открыть командный интерфейс."]], "id": "c-subsys"}, {"t": "table", "title": "Xatoni topish: otladchik tugmalari", "intro": null, "head": ["Tugma", "Nima qiladi"], "rows": [["F9", "To'xtash nuqtasi (точка останова) qo'yish yoki olib tashlash"], ["F5 (Konfiguratorda)", "Otladka rejimida ishga tushirish"], ["F11", "Keyingi qatorga, funksiya ichiga kirib"], ["F10", "Keyingi qatorga, funksiyani bir qadamda o'tib"], ["Shift+F9", "Ifodani hisoblash: o'zgaruvchi qiymatini ko'rish"], ["Табло", "Tanlangan o'zgaruvchilarni doimiy kuzatish oynasi"]], "id": "c-debug", "notes": "Otladka tartibi: shubhali qatorga F9 bilan to'xtash nuqtasi qo'ying, F5 bilan ishga tushiring, hujjatni saqlang — dastur shu qatorda to'xtaydi. Endi Shift+F9 bilan o'zgaruvchilar qiymatini ko'rib, F10 bilan qadam-baqadam yuring."}, {"t": "table", "title": "1C fayllari: qaysi biri nima", "intro": null, "head": ["Fayl", "Nima", "Qachon kerak"], "rows": [[".1CD", "Fayl rejimidagi butun baza", "Nusxa ko'chirmang — .dt dan foydalaning"], [".dt", "Baza to'liq nusxasi", "Zaxira va ko'chirish"], [".cf", "Faqat konfiguratsiya", "Konfiguratsiyani boshqa bazaga o'tkazish"], [".cfu", "Yangilanish fayli", "Tipik konfiguratsiyani yangilash"], [".cfe", "Kengaytma", "Kengaytmani o'rnatish"], [".epf", "Tashqi obrabotka", "Konfiguratsiyani o'zgartirmasdan vosita"], [".erf", "Tashqi hisobot", "Konfiguratsiyani o'zgartirmasdan hisobot"]], "id": "c-files"}, {"t": "steps", "title": "Tipik konfiguratsiyani to'g'ri yangilash tartibi", "intro": null, "items": [["Nusxa oling", "Администрирование → Выгрузить информационную базу (.dt)."], ["Joriy versiyani aniqlang", "Справка → О программе."], ["Yangilanishni oling", "Rasmiy yangilanish fayli (.cfu) yoki avtomatik yangilash."], ["Qo'llang", "Конфигурация → Поддержка → Обновить конфигурацию."], ["Bazani yangilang", "F7 va ekrandagi o'zgarishlar ro'yxatini qabul qiling."], ["Tekshiring", "Asosiy hujjatlar va kengaytmalar ishlashini sinab ko'ring."]], "id": "c-update"}, {"t": "cards", "title": "Qo'llab-quvvatlash (поддержка) holatlari", "intro": null, "items": [["Lock", "Не редактируется", "Qulf belgisi. Obyekt o'zgartirilmaydi — yangilash eng oson. Tavsiya etiladi."], ["Wrench", "Редактируется с сохранением поддержки", "O'zgartirish mumkin, yangilashda birlashtirish kerak bo'ladi."], ["Warning", "Снят с поддержки", "Obyekt butunlay sizniki. Yangilanishlar unga kelmaydi."]], "id": "c-support", "notes": "Shuning uchun 7-modulda kengaytmalarni o'rganamiz: ular tipik obyektlarni qulf ostida qoldirib, o'zgarishlarni alohida qatlamda saqlaydi."}, {"t": "statement", "title": "Amaliyot: noldan «Tarozi hisobi» konfiguratsiyasi", "sub": "O'rganganlarimizni bitta kichik, lekin to'liq ishlaydigan konfiguratsiyaga yig'amiz: 3 ma'lumotnoma, 1 hujjat, 1 registr, 1 hisobot va 2 rol.", "accent": false, "id": "c-mini"}, {"t": "table", "title": "Loyiha tarkibi", "intro": null, "head": ["Obyekt", "Nomi", "Asosiy maydonlar"], "rows": [["Подсистема", "Весовая", "Barcha obyektlar shu bo'limda"], ["Справочник", "Контрагенты", "Наименование, ИНН, Телефон"], ["Справочник", "Автомобили", "ГосНомер, Тара, Владелец"], ["Справочник", "Номенклатура", "Наименование, ЕдиницаИзмерения"], ["Перечисление", "ВидыВзвешивания", "Приход, Расход"], ["Документ", "Взвешивание", "Автомобиль, Номенклатура, Вид, Брутто, Тара, Нетто"], ["Регистр накопления", "ОстаткиСырья", "Номенклатура; Вес"], ["Отчет", "ВзвешиванияЗаПериод", "СКД: guruhlash va jami"]], "id": "c-mini-plan"}, {"t": "code", "title": "Hujjat: mashina tanlanganda tarani avtomatik olish", "lang": "1C", "src": "&НаКлиенте\nПроцедура АвтомобильПриИзменении(Элемент)\n    Объект.Тара = ТараАвтомобиля(Объект.Автомобиль);\n    Объект.Нетто = Объект.Брутто - Объект.Тара;\nКонецПроцедуры\n\n&НаСервереБезКонтекста\nФункция ТараАвтомобиля(Авто)\n    Возврат Авто.Тара;\nКонецФункции", "side": ["Operator mashinani tanlaydi — tarasi ma'lumotnomadan o'zi tushadi.", "Havola orqali maydonga murojaat (<b>Авто.Тара<\/b>) faqat serverda.", "Netto darhol qayta hisoblanadi."], "caption": null, "id": "c-mini-fill"}, {"t": "code", "title": "Hujjat: o'tkazishda xomashyo qoldig'iga yozish", "lang": "1C", "src": "Процедура ОбработкаПроведения(Отказ, РежимПроведения)\n    Движения.ОстаткиСырья.Записывать = Истина;\n    Дв = Движения.ОстаткиСырья.Добавить();\n    Дв.Период = Дата;\n    Дв.Номенклатура = Номенклатура;\n    Дв.Вес = Нетто;\n    Если Вид = Перечисления.ВидыВзвешивания.Приход Тогда\n        Дв.ВидДвижения = ВидДвиженияНакопления.Приход;\n    Иначе\n        Дв.ВидДвижения = ВидДвиженияНакопления.Расход;\n    КонецЕсли;\nКонецПроцедуры", "side": ["Kirim tortishi qoldiqni oshiradi, chiqim — kamaytiradi.", "Hisobot va qoldiq so'rovlari shu registrdan olinadi.", "Keyingi qadam: 6-moduldagi HTTP-servis shu hujjatni avtomatik yaratadi."], "caption": null, "id": "c-mini-post"}, {"t": "steps", "title": "Rollar va foydalanuvchilar", "intro": null, "items": [["Rol: Оператор", "Tortish: o'qish, qo'shish, o'zgartirish, o'tkazish. Ma'lumotnomalar: faqat o'qish."], ["Rol: Руководитель", "Hamma narsani o'qish va hisobotlar. O'zgartirish yo'q."], ["Foydalanuvchilar", "Администрирование → Пользователи: operator va rahbar yarating."], ["Sinov", "Har biri bilan kirib, huquqlar to'g'ri ishlashini tekshiring."]], "id": "c-mini-roles"}, {"t": "quiz", "q": "Konfiguratorda kodni o'zgartirib saqladingiz, lekin foydalanuvchi rejimida hech narsa o'zgarmadi. Sabab?", "opts": ["Kompyuterni qayta yoqish kerak", "Baza konfiguratsiyasi yangilanmagan — F7 bosish kerak", "Kod noto'g'ri tilda yozilgan"], "a": 1, "expl": "Сохранить faqat asosiy konfiguratsiyani saqlaydi. F7 «Обновить конфигурацию базы данных» o'zgarishlarni foydalanuvchilarga yetkazadi.", "id": "c-q1"}, {"t": "quiz", "q": "Mahsulot narxlari tarixini (qaysi sanadan qancha) saqlash uchun qaysi obyekt mos?", "opts": ["Регистр сведений (periodik)", "Перечисление", "Константа"], "a": 0, "expl": "Periodik регистр сведений har bir sana uchun qiymat saqlaydi, СрезПоследних esa kerakli sanadagi narxni beradi.", "id": "c-q2"}, {"t": "quiz", "q": "Hujjatni «Записать» va «Провести» farqi nima?", "opts": ["Farqi yo'q", "Провести registrlarga ham yozadi va qoldiqlarni o'zgartiradi", "Записать hujjatni o'chiradi"], "a": 1, "expl": "Yozilgan hujjat — qoralama. O'tkazilgan hujjat hisobga ta'sir qiladi va hisobotlarda aks etadi.", "id": "c-q3"}, {"t": "quiz", "q": "Registrda «Ombor» va «Nomenklatura» qanday ustunlar bo'ladi?", "opts": ["Ресурсы", "Измерения", "Реквизиты"], "a": 1, "expl": "O'lchovlar — «nima bo'yicha» hisoblash. Resurslar esa hisoblanadigan sonlar: miqdor, og'irlik.", "id": "c-q4"}, {"t": "table", "title": "1C tili lug'ati: boshqaruv", "intro": null, "head": ["1C kalit so'zi", "Ma'nosi"], "rows": [["Если … Тогда … КонецЕсли", "agar … u holda … tamom"], ["ИначеЕсли / Иначе", "aks holda agar / aks holda"], ["Для Каждого Элем Из Список Цикл", "ro'yxatning har bir elementi uchun"], ["Для Н = 1 По 10 Цикл", "1 dan 10 gacha takrorla"], ["Пока Условие Цикл … Ко
